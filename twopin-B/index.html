<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LinguaBook</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 防止下拉螢幕重整與回彈效果 */
  html, body {
    overscroll-behavior-y: none;
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* 隱藏全站上下左右滑桿 / 卷軸 */
  ::-webkit-scrollbar {
    display: none;
  }
  * {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }

  body {
    overflow-y: auto !important;
    overflow-x: hidden !important;
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
  }
  .hw-accelerated {
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }
  section {
    touch-action: pan-y;
  }
  .no-select {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  input, textarea {
    -webkit-user-select: text;
    user-select: text;
  }
  .auto-textarea {
    resize: none;
    overflow-y: hidden;
    line-height: 1.5rem;
    min-height: calc(1.5rem + 1.5rem);
  }
</style>
</head>
<body class="bg-slate-950 text-slate-100 w-screen min-h-screen flex flex-col overflow-x-hidden overflow-y-auto m-0 p-0">
<!-- 頂部導覽列：歌曲名稱輸入框 -->
<header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center shadow-md w-full shrink-0">
<div class="flex items-center w-full bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl">
<input type="text" id="songTitleInput" value="" class="bg-transparent text-base md:text-lg text-slate-200 font-bold outline-none focus:text-emerald-400 w-full text-center placeholder-slate-600" placeholder="🍁請輸入歌曲名稱"></div>
</header>

<!-- 主要內容導覽 (佔滿全螢幕延展空間) -->
<main class="flex-1 w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 h-full">
<!-- 左側：影音播放與設定 (佔 2 欄) -->
<section class="lg:col-span-2 flex flex-col gap-4">
<!-- 媒體播放器容器 -->
<div id="mediaContainer" class="bg-black rounded-2xl overflow-hidden aspect-[9/18] max-h-[800px] mx-auto w-full max-w-[420px] relative flex items-center justify-center border border-slate-800 shadow-2xl select-none hw-accelerated">
<audio id="audioPlayer" class="hidden" playsinline></audio>
<div id="imageLayer" class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing hidden z-0">
<img id="imageElement" class="max-w-full max-h-full object-contain pointer-events-none select-none" alt="背景圖片">
</div>
<!-- 修改處：將 object-cover 改為 object-contain，並確保最大寬高限制，使影片等比例完整呈現 -->
<div id="videoLayer" class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing hidden z-1">
<video id="videoPlayer" class="max-w-full max-h-full object-contain pointer-events-none select-none" playsinline></video>
</div>

<!-- 字幕層 (無邊框乾淨顯示) -->
<div id="draggableSubtitle" 
class="absolute bottom-2 left-2 right-2 bg-transparent px-3 py-3 rounded-xl text-center z-50 flex flex-col group no-select hidden cursor-pointer pointer-events-auto overflow-hidden hw-accelerated"
style="height: 210px;">
<!-- 滾動歌詞內部容器 (確保內部對齊與固定區塊) -->
<div id="scrollLyricsContainer" class="w-full h-full flex flex-col items-center justify-center gap-3 overflow-y-auto transition-all duration-300 py-6" style="scroll-behavior: smooth;">
  <div id="mainPrimaryLyric" class="font-bold text-emerald-300 tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] pointer-events-none transition-all duration-75" style="font-size: 18px;"></div>
  <div id="mainTranslationLyric" class="text-slate-300 drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] pointer-events-none transition-all duration-75" style="font-size: 15px;"></div>
</div>
</div>
</div>

<!-- 音樂與媒體控制面板 -->
<div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex flex-col gap-4 shadow-lg">
<div class="flex flex-col gap-1.5">
<div id="progressBarContainer" class="w-full h-3 bg-slate-800 rounded-full cursor-pointer relative overflow-hidden group py-1">
<div class="w-full h-full bg-slate-800 rounded-full relative pointer-events-none">
<div id="progressBar" class="h-full bg-slate-800 w-0 transition-all duration-75 relative rounded-full">
<div id="progressHandle" class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white rounded-full shadow"></div>
</div>
</div>
</div>
<div class="flex justify-between text-xs text-slate-400 font-mono">
<span id="currentTimeDisplay">00:00:00</span>
<span id="durationDisplay">00:00:00</span>
</div>
</div>
<div class="flex items-center justify-around pt-1">
<button onclick="app.toggleLoop()" id="loopBtn" class="text-slate-400 hover:text-slate-200 transition text-sm flex items-center gap-1">
<svg id="loopIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
</button>
<button onclick="app.prevLine()" class="text-slate-300 hover:text-white transition p-2">
<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
</button>
<button onclick="app.togglePlay()" id="playPauseBtn" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full flex items-center justify-center text-slate-100 shadow-lg transition active:scale-95">
<svg id="playIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
<svg id="pauseIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
</button>
<button onclick="app.nextLine()" class="text-slate-300 hover:text-white transition p-2">
<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
</button>
<button onclick="app.cycleRate()" id="rateBtn" class="text-slate-400 hover:text-slate-200 transition text-xs font-mono font-bold bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-lg">
1.0x
</button>
</div>
</div>

<!-- 功能按鈕網格區 (5欄排版：鎖定按鈕位於圖片按鈕下方) -->
<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 grid grid-cols-5 gap-2 shadow-lg">
<!-- 第 1 列 -->
<label id="btnImageContainer" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-slate-200 text-xs font-medium select-none h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🖼️</span>
<span class="text-[10px] leading-tight">圖片</span>
<input type="file" accept="image/*" class="hidden" onchange="app.loadImage(event)">
</label>
<label id="btnAudioContainer" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-slate-200 text-xs font-medium select-none h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🎵</span>
<span class="text-[10px] leading-tight">音樂</span>
<input type="file" accept="audio/*" class="hidden" onchange="app.loadAudio(event)">
</label>
<label id="btnVideoContainer" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-slate-200 text-xs font-medium select-none h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🎬</span>
<span class="text-[10px] leading-tight">影片</span>
<input type="file" accept="video/*" class="hidden" onchange="app.loadVideo(event)">
</label>
<button onclick="app.clearMediaFile()" id="clearMediaBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center text-xs font-medium h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🗑️</span>
<span class="text-[10px] leading-tight">清除</span>
</button>
<button onclick="app.toggleRecording()" id="recordBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center text-xs font-medium h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🔴</span>
<span id="recordText" class="text-[10px] leading-tight">錄音</span>
</button>

<!-- 第 2 列：鎖定按鈕緊接在圖片下方 -->
<button id="mediaLockBtn" onclick="app.toggleMediaLock(event)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center text-xs font-medium h-14 whitespace-nowrap" title="鎖定/解鎖畫面移動縮放">
<span id="mediaLockIcon" class="text-sm leading-none mb-0.5">🔓</span>
<span class="text-[10px] leading-tight">圖片</span>
</button>
<label class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center font-medium text-xs text-slate-200 relative overflow-hidden select-none h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🎨</span>
<span class="text-[10px] leading-tight">原文</span>
<input type="color" id="primaryColorPicker" value="#6ee7b7" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="app.changePrimaryColor(this.value)">
</label>
<label class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center font-medium text-xs text-slate-200 relative overflow-hidden select-none h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🎨</span>
<span class="text-[10px] leading-tight">翻譯</span>
<input type="color" id="translationColorPicker" value="#cbd5e1" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="app.changeTranslationColor(this.value)">
</label>
<button onclick="app.toggleColorMode()" id="colorModeToggleBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center font-medium text-xs h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🌈</span>
<span class="text-[10px] leading-tight">彩色</span>
</button>
<button onclick="app.toggleDisplayMode()" id="displayModeToggleBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center font-medium text-xs h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🎯</span>
<span id="displayModeToggleText" class="text-[10px] leading-tight">單句</span>
</button>

<!-- 第 3 列 -->
<button onclick="app.toggleTTS()" id="ttsToggleBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center font-medium text-xs h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">🗣️</span>
<span class="text-[10px] leading-tight">朗讀</span>
</button>
<label class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-xs text-slate-200 font-medium select-none h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">📃</span>
<span class="text-[10px] leading-tight">歌詞</span>
<input type="file" accept=".lrc,.txt" class="hidden" onchange="app.importLrc(event)">
</label>
<button onclick="app.exportLrc()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 font-medium transition flex flex-col items-center justify-center h-14 p-1.5 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">💾</span>
<span class="text-[10px] leading-tight">存檔</span>
</button>
<button onclick="app.adjustFontSize(-0.1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center font-bold text-base h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">➖</span>
<span class="text-[10px] leading-tight">縮小</span>
</button>
<button onclick="app.adjustFontSize(0.1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-1.5 rounded-xl transition flex flex-col items-center justify-center font-bold text-base h-14 whitespace-nowrap">
<span class="text-sm leading-none mb-0.5">➕</span>
<span class="text-[10px] leading-tight">放大</span>
</button>
</div>
</section>

<!-- 右側：雙語歌詞編輯區 -->
<section class="bg-slate-900 rounded-2xl border border-slate-800 p-4 flex flex-col h-full shadow-2xl">
<div class="flex border-b border-slate-800 pb-3 mb-3 justify-between items-center shrink-0">
<div class="flex items-center gap-2">
<h2 class="font-bold text-slate-200 text-sm"></h2>
</div>
<div class="flex items-center gap-2">
<button id="subtitleLockBtn" onclick="app.toggleSubtitleLock(event)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-2.5 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1" title="鎖定/解鎖字幕移動">
<span id="subtitleLockIcon">🔓</span>字幕
</button>
<button onclick="app.resetIntervals()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-2.5 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1">
<span>⌚</span>均分
</button>
<div class="flex bg-slate-950 border border-slate-800 rounded-lg p-0.5">
<button onclick="app.switchMode('text')" id="modeTextBtn" class="px-3 py-1 text-xs rounded-md font-medium transition text-slate-400 hover:text-white">📖整篇模式</button>
<button onclick="app.switchMode('structure')" id="modeStructBtn" class="px-3 py-1 text-xs rounded-md font-medium transition bg-emerald-600 text-white">📋分行模式</button>
</div>
</div>
</div>
<!-- 模式 1：整篇模式 -->
<div id="textModeContainer" class="hidden flex flex-col gap-3">
<div class="flex flex-col gap-1.5">
<label class="text-xs text-slate-400 font-medium flex justify-between">
<span>主要歌詞 (原文)</span>
</label>
<div class="relative flex flex-col">
<textarea id="primaryInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 pr-9 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 auto-textarea" oninput="app.autoResizeTextarea(this); app.markUserEdited();" placeholder="請輸入原文歌詞..."></textarea>
<button onclick="app.clearTextArea('primaryInput')" title="清除主歌詞" class="absolute right-2.5 bottom-3 w-5 h-5 bg-slate-800 hover:bg-red-500/80 text-slate-400 hover:text-white rounded-full flex items-center justify-center text-[10px] font-bold transition">✕</button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs text-slate-400 font-medium flex justify-between">
<span>第二歌詞 (翻譯)</span>
</label>
<div class="relative flex flex-col">
<textarea id="translationInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 pr-9 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 auto-textarea" oninput="app.autoResizeTextarea(this); app.markUserEdited();" placeholder="請輸入第二語言/翻譯歌詞..."></textarea>
<button onclick="app.clearTextArea('translationInput')" title="清除翻譯歌詞" class="absolute right-2.5 bottom-3 w-5 h-5 bg-slate-800 hover:bg-red-500/80 text-slate-400 hover:text-white rounded-full flex items-center justify-center text-[10px] font-bold transition">✕</button>
</div>
</div>
</div>
<!-- 模式 2：分行模式 (預設開啟) -->
<div id="structureModeContainer" class="flex flex-col gap-3 flex-1 overflow-y-auto">
<div class="flex justify-between items-center text-xs text-slate-400 px-1 shrink-0">
<span>原文與翻譯</span>
<button onclick="app.addLyricRow()" class="text-emerald-400 hover:underline">+ 新增一行</button>
</div>
<div id="structuredList" class="flex flex-col gap-3"></div>
</div>
</section>
</main>

<!-- 編輯單行彈出視窗 (Modal) -->
<div id="quickEditModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 flex flex-col gap-4 shadow-2xl relative">
<div class="flex justify-between items-center border-b border-slate-800 pb-3">
<h3 class="font-bold text-slate-200 text-sm">編輯目前歌詞</h3>
<div class="flex items-center gap-2">
<button onclick="app.saveQuickEdit()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-medium transition">儲存變更</button>
<button onclick="app.closeQuickEdit()" class="text-slate-400 hover:text-white text-sm font-bold p-1">✕</button>
</div>
</div>
<div class="flex flex-col gap-3">
<div class="flex flex-col gap-1">
<label class="text-xs text-slate-400 font-mono">時間軸 (6位數精準格式，例: 00:03:00)</label>
<input type="text" id="quickEditTime" inputmode="numeric" placeholder="00:00:00" oninput="app.autoFormatTimeInput(this)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono outline-none focus:border-emerald-500 placeholder:text-slate-600">
</div>
<div class="flex flex-col gap-1">
<label class="text-xs text-slate-400">主要歌詞 (原文)</label>
<textarea id="quickEditPrimary" rows="2" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 outline-none focus:border-emerald-500 resize-none"></textarea>
</div>
<div class="flex flex-col gap-1">
<label class="text-xs text-slate-400">第二歌詞 (翻譯)</label>
<textarea id="quickEditTranslation" rows="2" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-400 outline-none focus:border-emerald-500 resize-none"></textarea>
</div>
</div>
</div>
</div>

<!-- 核心應用程式邏輯 -->
<script>
class LinguaBookApp {
constructor() {
this.audioElement = document.getElementById('audioPlayer');
this.videoElement = document.getElementById('videoPlayer');
this.imageElement = document.getElementById('imageElement');
this.imageLayer = document.getElementById('imageLayer');
this.videoLayer = document.getElementById('videoLayer');
this.currentTimeDisplay = document.getElementById('currentTimeDisplay');
this.durationDisplay = document.getElementById('durationDisplay');
this.progressBar = document.getElementById('progressBar');
this.progressHandle = document.getElementById('progressHandle');
this.progressBarContainer = document.getElementById('progressBarContainer');
this.mainPrimaryLyric = document.getElementById('mainPrimaryLyric');
this.mainTranslationLyric = document.getElementById('mainTranslationLyric');
this.draggableSubtitle = document.getElementById('draggableSubtitle');
this.songTitleInput = document.getElementById('songTitleInput');

this.activeMedia = this.audioElement;
this.lyricsData = [];
this.currentIndex = -1;
this.rates = [0.5, 0.75, 1.0, 1.25, 1.5];
this.rateIndex = 2;
this.currentMode = 'structure';
this.displayMode = 'single'; 
this.colorMode = false;

this.ttsEnabled = false;
this.syntheticDuration = 0;
this.isSyntheticPlaying = false;
this.syntheticCurrentTime = 0;
this.syntheticAnimFrame = null;
this.lastSpokenIndex = -1;
this.currentUtterances = [];

this.mediaRecorder = null;
this.audioChunks = [];
this.isRecording = false;

this.availableVoices = [];
if ('speechSynthesis' in window) {
window.speechSynthesis.onvoiceschanged = () => {
this.availableVoices = window.speechSynthesis.getVoices();
};
this.availableVoices = window.speechSynthesis.getVoices();
}

this.primary0Size = 18;
this.trans0Size = 15;
this.scaleMultiplier = 1.0;

this.primaryColor = '#6ee7b7';
this.translationColor = '#cbd5e1';

this.isSyncing = false; 
this.hasUserEdited = false;

this.isMediaLocked = false;
this.isSubtitleLocked = false;

this.updateInputsFromData();
this.initHighSpeedSubtitleControl();
this.initInteractiveLayer(this.imageLayer);
this.initInteractiveLayer(this.videoLayer);
this.initProgressBarDrag();

this.renderStructureUI();

[this.audioElement, this.videoElement].forEach(media => {
media.addEventListener('timeupdate', () => {
if (this.activeMedia === media) this.handleTimeUpdate();
});
media.addEventListener('ended', () => {
if (this.activeMedia === media) {
if (media.loop) {
media.currentTime = 0;
media.play();
} else {
media.currentTime = 0;
media.pause();
this.updatePlayState(false);
this.currentIndex = -1;
this.updateMainDisplay();
}
}
});
media.addEventListener('loadedmetadata', () => {
if (this.activeMedia === media && media.duration) {
this.durationDisplay.textContent = this.formatDetailedTime(media.duration);
}
});
});

document.getElementById('primaryInput').addEventListener('input', () => {
this.syncFromInputsSilent();
});
document.getElementById('translationInput').addEventListener('input', () => {
this.syncFromInputsSilent();
});

document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});
document.addEventListener('gesturechange', function (e) {
  e.preventDefault();
});
document.addEventListener('gestureend', function (e) {
  e.preventDefault();
});

window.addEventListener('scroll', function () {
  if (window.scrollX !== 0) {
    window.scrollTo(0, window.scrollY);
  }
});

window.addEventListener('touchmove', function (e) {
  if (window.scrollY === 0 && e.touches[0].clientY > 0) {
    const target = e.target.closest('#structureModeContainer, #scrollLyricsContainer, textarea');
    if (!target) {}
  }
}, { passive: false });
}

toggleMediaLock(e) {

formatColoredText(text, defaultColor) {
if (!this.colorMode || !text) {
return `<span style="color: ${defaultColor};">${text || ''}</span>`;
}

let result = '';
for (let i = 0; i < text.length; i++) {
const char = text[i];
const lower = char.toLowerCase();
let color = '#ffffff';

if (lower === 'a') {
color = '#ef4444';
} else if (lower === 'e') {
color = '#22c55e';
} else if (lower === 'i') {
color = '#3b82f6';
} else if (lower === 'o') {
color = '#f97316';
} else if (lower === 'u') {
color = '#a855f7';
} else if (!/[a-z]/.test(lower)) {
color = '#94a3b8';
}

result += `<span style="color: ${color};">${char}</span>`;
}
return result;
}

syncFromInputsSilent() {

for (let i = 0; i < maxLen; i++) {
const primary = primaryLines[i] !== undefined ? primaryLines[i].trim() : '';
const translation = transLines[i] !== undefined ? transLines[i].trim() : '';

if (primary === '' && translation === '') {
continue;
}

let existingTime = 0;
let existingEndTime = 1.0;
if (this.lyricsData[i]) {
existingTime = this.lyricsData[i].time !== undefined ? this.lyricsData[i].time : 0;
existingEndTime = this.lyricsData[i].endTime !== undefined ? this.lyricsData[i].endTime : (existingTime + 1.0);

newItems.push({ time: existingTime, primary, translation, endTime: existingEndTime });

}
this.updateMainDisplay();

speakSequence(currentItem, onComplete) {
if (!this.ttsEnabled || !currentItem || !('speechSynthesis' in window)) {
if (onComplete) onComplete();
return;
}
if (this.availableVoices.length === 0) {
this.availableVoices = window.speechSynthesis.getVoices();
}
const rate = this.activeMedia.playbackRate || 1.0;

const speakPart = (text, voiceIndex, nextCallback) => {
if (!text) {
if (nextCallback) nextCallback();
return;
}
const utterance = new SpeechSynthesisUtterance(text);
utterance.rate = rate;
const detectedLang = this.detectLanguage(text);
utterance.lang = detectedLang;

if (this.availableVoices.length > 0) {
const matchedVoices = this.availableVoices.filter(v =>
v.lang.toLowerCase() === detectedLang.toLowerCase() ||
v.lang.toLowerCase().startsWith(detectedLang.substring(0, 2).toLowerCase())
);
utterance.voice = matchedVoices.length > 0 ? (voiceIndex === 1 && matchedVoices.length > 1 ? matchedVoices[1] : matchedVoices[0]) : this.availableVoices[0];
}

this.currentUtterances.push(utterance);

utterance.onend = () => {
const idx = this.currentUtterances.indexOf(utterance);
if (idx !== -1) this.currentUtterances.splice(idx, 1);
if (nextCallback) nextCallback();
};
utterance.onerror = () => {
const idx = this.currentUtterances.indexOf(utterance);
if (idx !== -1) this.currentUtterances.splice(idx, 1);
if (nextCallback) nextCallback();
};

window.speechSynthesis.speak(utterance);
};

speakPart(currentItem.primary, 0, () => {
setTimeout(() => {
speakPart(currentItem.translation, 1, () => {
setTimeout(() => {
if (onComplete) onComplete();
}, 500);
});
}, 200);
});
}

detectLanguage(text) {
if (!text) return 'zh-TW';
if (/[\u3040-\u309F\u30A0-\u30FF]/.test(text)) return 'ja-JP';
if (/[\uAC00-\uD7AF\u1100-\u11FF]/.test(text)) return 'ko-KR';
if (/^[a-zA-Z\s.,!?'"()0-9-]+$/.test(text)) return 'en-US';
return 'zh-TW';
}

initInteractiveLayer(layerElement) {
let scale = 1, posX = 0, posY = 0, isDragging = false, startX = 0, startY = 0;
let initialDistance = 0;
let initialScale = 1;

const getDistance = (touches) => {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
};

layerElement.addEventListener('touchstart', (e) => {
  if (this.isMediaLocked) return;
  if (e.touches.length === 2) {
    isDragging = false;
    initialDistance = getDistance(e.touches);
    initialScale = scale;
    e.stopPropagation();
  } else if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - posX;
    startY = e.touches[0].clientY - posY;
  }
}, { passive: true });

layerElement.addEventListener('touchmove', (e) => {
  if (this.isMediaLocked) return;
  if (e.touches.length === 2) {
    if (initialDistance === 0) {
      initialDistance = getDistance(e.touches);
      initialScale = scale;
    }
    const currentDistance = getDistance(e.touches);
    const zoomFactor = currentDistance / initialDistance;
    scale = Math.max(0.5, Math.min(3.0, initialScale * zoomFactor));
    layerElement.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    e.stopPropagation();
  } else if (e.touches.length === 1 && isDragging) {
    posX = e.touches[0].clientX - startX;
    posY = e.touches[0].clientY - startY;
    layerElement.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  }
}, { passive: true });

layerElement.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) {
    initialDistance = 0;
  }
  if (e.touches.length === 1 && !isDragging) {
    isDragging = true;
    startX = e.touches[0].clientX - posX;
    startY = e.touches[0].clientY - posY;
  }
  if (e.touches.length === 0) {
    isDragging = false;
  }
});

layerElement.addEventListener('mousedown', (e) => {
if (this.isMediaLocked) return;
isDragging = true;
startX = e.clientX - posX;
startY = e.clientY - posY;
e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
if (!isDragging || this.isMediaLocked) return;
posX = e.clientX - startX;
posY = e.clientY - startY;
layerElement.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
});
window.addEventListener('mouseup', () => { isDragging = false; });
layerElement.addEventListener('wheel', (e) => {
if (this.isMediaLocked) return;
e.preventDefault();
scale = e.deltaY < 0 ? Math.min(3.0, scale + 0.1) : Math.max(0.5, scale - 0.1);
layerElement.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
e.stopPropagation();
}, { passive: false });
}

initHighSpeedSubtitleControl() {
const subtitle = document.getElementById('draggableSubtitle');
const container = document.getElementById('mediaContainer');

let isDragging = false;
let startX = 0, startY = 0;
let initialLeft = 0, initialTop = 0;
let longPressTimer = null;
let hasMoved = false;

const onPointerDown = (e) => {
if (e.target.closest('#subtitleLockBtn')) {
return;
}
if (e.touches && e.touches.length >= 2) {
return;
}

hasMoved = false;
isDragging = !this.isSubtitleLocked;

const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
startX = clientX;
startY = clientY;

const rect = subtitle.getBoundingClientRect();
const parentRect = container.getBoundingClientRect();
initialLeft = rect.left - parentRect.left;
initialTop = rect.top - parentRect.top;

longPressTimer = setTimeout(() => {
if (!hasMoved) this.openQuickEdit();
}, 600);
};

const onPointerMove = (e) => {
if (e.touches && e.touches.length >= 2) {
return;
}

const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;

const dx = clientX - startX;
const dy = clientY - startY;

if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
hasMoved = true;
if (longPressTimer) clearTimeout(longPressTimer);
}

if (!isDragging || this.isSubtitleLocked) return;

let newLeft = initialLeft + dx;
let newTop = initialTop + dy;

const parentRect = container.getBoundingClientRect();
const subRect = subtitle.getBoundingClientRect();

newLeft = Math.max(0, Math.min(newLeft, parentRect.width - subRect.width));
newTop = Math.max(0, Math.min(newTop, parentRect.height - 30));

subtitle.style.bottom = 'auto';
subtitle.style.left = newLeft + 'px';
subtitle.style.top = newTop + 'px';
};

const onPointerUp = () => {
isDragging = false;
if (longPressTimer) clearTimeout(longPressTimer);
};

subtitle.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
subtitle.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

subtitle.addEventListener('contextmenu', (e) => {
e.preventDefault();
this.openQuickEdit();
});
}

openQuickEdit() {
if (this.currentIndex < 0 || !this.lyricsData[this.currentIndex]) {
alert("目前沒有選中的歌詞可供編輯！");
return;
}

document.getElementById('quickEditTime').value = this.formatDetailedTime(item.time || 0);
document.getElementById('quickEditPrimary').value = item.primary || '';
document.getElementById('quickEditTranslation').value = item.translation || '';

}

closeQuickEdit() {
document.getElementById('quickEditModal').classList.add('hidden');

saveQuickEdit() {
if (this.currentIndex < 0 || !this.lyricsData[this.currentIndex]) return;

const timeStr = document.getElementById('quickEditTime').value;
const parts = timeStr.replace(/[^\d:]/g, ':').split(':');
let newTime = 0;
if (parts.length >= 3) {
const mins = parseFloat(parts[0]) || 0;
const secs = parseFloat(parts[1]) || 0;
const millis = parseFloat((parts[2] + '00').substring(0, 3)) || 0;
newTime = mins * 60 + secs + millis / 1000;
} else if (parts.length === 2) {
const mins = parseFloat(parts[0]) || 0;
const secs = parseFloat(parts[1]) || 0;
newTime = mins * 60 + secs;
}

const targetIndex = this.currentIndex;
this.lyricsData[targetIndex].time = Number(newTime.toFixed(3));
this.lyricsData[targetIndex].primary = document.getElementById('quickEditPrimary').value.trim();
this.lyricsData[targetIndex].translation = document.getElementById('quickEditTranslation').value.trim();

const remainingCount = this.lyricsData.length - 1 - targetIndex;
if (remainingCount > 0) {
let totalDuration = 30.0;
if (this.activeMedia && this.activeMedia.src && this.activeMedia.duration && !isNaN(this.activeMedia.duration)) {
totalDuration = this.activeMedia.duration;
} else {
totalDuration = Math.max(newTime + (remainingCount + 1) * 3.0, this.lyricsData.length * 3.0);
}

const remainingTimeSpan = totalDuration - newTime;
const interval = remainingTimeSpan / (remainingCount + 1);

let rollingTime = newTime;
for (let i = targetIndex + 1; i < this.lyricsData.length; i++) {
rollingTime += interval;
this.lyricsData[i].time = Number(rollingTime.toFixed(3));
this.lyricsData[i].endTime = Number((rollingTime + interval).toFixed(3));
}
}

this.hasUserEdited = true;
this.updateInputsFromData();
if (this.currentMode === 'structure') this.renderStructureUI();
this.updateMainDisplay();
this.closeQuickEdit();
}

initProgressBarDrag() {
let isDraggingBar = false;

const updateSeekFromEvent = (e) => {
if (e.touches && e.touches.length >= 2) return;
const rect = this.progressBarContainer.getBoundingClientRect();
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
let percentage = (clientX - rect.left) / rect.width;
percentage = Math.max(0, Math.min(1, percentage));

if (!this.activeMedia.src) {
this.syntheticCurrentTime = percentage * (this.syntheticDuration || 0);
this.lastSpokenIndex = this.currentIndex;
this.handleSyntheticTimeUpdate();
} else if (this.activeMedia.duration) {
this.activeMedia.currentTime = percentage * this.activeMedia.duration;
this.lastSpokenIndex = this.currentIndex;
}
};

this.progressBarContainer.addEventListener('mousedown', (e) => {
isDraggingBar = true;
updateSeekFromEvent(e);
e.preventDefault();
});
window.addEventListener('mousemove', (e) => { if (isDraggingBar) updateSeekFromEvent(e); });
window.addEventListener('mouseup', () => { isDraggingBar = false; });
this.progressBarContainer.addEventListener('touchstart', (e) => {
if (e.touches && e.touches.length >= 2) return;
isDraggingBar = true;
updateSeekFromEvent(e);
}, { passive: true });
window.addEventListener('touchmove', (e) => {
if (e.touches && e.touches.length >= 2) { isDraggingBar = false; return; }
if (isDraggingBar) updateSeekFromEvent(e);
}, { passive: true });
window.addEventListener('touchend', () => { isDraggingBar = false; });
}

if (!file) return;
this.videoElement.pause();
this.videoLayer.classList.add('hidden');
this.imageElement.src = URL.createObjectURL(file);
this.imageLayer.classList.remove('hidden');
this.draggableSubtitle.classList.remove('hidden');

document.getElementById('btnImageContainer').className = "bg-emerald-950/60 border border-emerald-500/60 text-emerald-300 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-xs font-medium select-none shadow-sm h-14 whitespace-nowrap";
event.target.value = '';
}

loadAudio(event) {
const file = event.target.files[0];
if (!file) return;
const name = file.name;
const idx = name.lastIndexOf('.');
this.songTitleInput.value = idx !== -1 ? name.substring(0, idx) : name;
this.videoElement.pause();
this.audioElement.src = URL.createObjectURL(file);
this.audioElement.load();
this.activeMedia = this.audioElement;
this.audioElement.pause();
this.updatePlayState(false);
this.draggableSubtitle.classList.remove('hidden');
this.updateDurationDisplay();

document.getElementById('btnAudioContainer').className = "bg-emerald-950/60 border border-emerald-500/60 text-emerald-300 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-xs font-medium select-none shadow-sm h-14 whitespace-nowrap";
event.target.value = '';
}

loadVideo(event) {
const file = event.target.files[0];
if (!file) return;
const name = file.name;
const idx = name.lastIndexOf('.');
this.songTitleInput.value = idx !== -1 ? name.substring(0, idx) : name;
this.audioElement.pause();
this.imageElement.src = '';
this.imageLayer.classList.add('hidden');
this.videoElement.src = URL.createObjectURL(file);
this.videoElement.load();
this.activeMedia = this.videoElement;
this.videoLayer.classList.remove('hidden');
this.draggableSubtitle.classList.remove('hidden');
this.videoElement.pause();
this.updatePlayState(false);
this.updateDurationDisplay();

document.getElementById('btnVideoContainer').className = "bg-emerald-950/60 border border-emerald-500/60 text-emerald-300 p-1.5 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-xs font-medium select-none shadow-sm h-14 whitespace-nowrap";
event.target.value = '';
}

togglePlay() {
if (!this.activeMedia.src) {
if (this.isSyntheticPlaying) {
this.pauseSyntheticPlayback();
} else {
this.startSyntheticPlayback();
}
return;
}
if (this.activeMedia.paused) {
this.activeMedia.play();
this.updatePlayState(true);
} else {
this.activeMedia.pause();
this.updatePlayState(false);
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
}
this.currentUtterances = [];
}
}

startSyntheticPlayback() {
if (this.lyricsData.length === 0) return;
this.isSyntheticPlaying = true;
this.updatePlayState(true);

if (this.syntheticCurrentTime >= (this.syntheticDuration || 10)) {
this.syntheticCurrentTime = 0;
this.lastSpokenIndex = -1;
}

const startTimeStamp = performance.now() - (this.syntheticCurrentTime * 1000);

const step = () => {
if (!this.isSyntheticPlaying) return;
const elapsed = (performance.now() - startTimeStamp) / 1000;
const maxDur = this.syntheticDuration || (this.lyricsData.length * 2.0);

if (elapsed >= maxDur) {
if (this.audioElement.loop) {
this.syntheticCurrentTime = 0;
this.startSyntheticPlayback();
return;
} else {
this.syntheticCurrentTime = 0;
this.pauseSyntheticPlayback();
this.currentIndex = -1;
this.updateMainDisplay();
this.handleSyntheticTimeUpdate();
return;
}
}

this.syntheticCurrentTime = elapsed;
this.handleSyntheticTimeUpdate();
this.syntheticAnimFrame = requestAnimationFrame(step);
};
this.syntheticAnimFrame = requestAnimationFrame(step);
}

pauseSyntheticPlayback() {
this.isSyntheticPlaying = false;
if (this.syntheticAnimFrame) cancelAnimationFrame(this.syntheticAnimFrame);
this.updatePlayState(false);
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
}
this.currentUtterances = [];
}

handleSyntheticTimeUpdate() {
const currentTime = this.syntheticCurrentTime;
const duration = this.syntheticDuration || 1;
this.currentTimeDisplay.textContent = this.formatDetailedTime(currentTime);
this.progressBar.style.width = `${(currentTime / duration) * 100}%`;

let activeIdx = -1;
for (let i = 0; i < this.lyricsData.length; i++) {
if (this.lyricsData[i].time !== undefined && currentTime >= this.lyricsData[i].time) activeIdx = i;
}

if (activeIdx !== this.currentIndex) {
this.currentIndex = activeIdx;
this.updateMainDisplay();
}

if (activeIdx !== -1 && activeIdx !== this.lastSpokenIndex && this.ttsEnabled && this.isSyntheticPlaying) {
this.lastSpokenIndex = activeIdx;
this.speakSequence(this.lyricsData[activeIdx], null);
}
}

updatePlayState(isPlaying) {
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
if (isPlaying) {
playIcon.classList.add('hidden');
pauseIcon.classList.remove('hidden');
} else {
playIcon.classList.remove('hidden');
pauseIcon.classList.add('hidden');
}
}

prevLine() {
if (this.currentIndex > 0) {
this.currentIndex--;
this.lastSpokenIndex = this.currentIndex;
const targetTime = this.lyricsData[this.currentIndex].time || 0;
if (!this.activeMedia.src) {
this.syntheticCurrentTime = targetTime;
this.handleSyntheticTimeUpdate();
} else {
this.activeMedia.currentTime = targetTime;
}
this.updateMainDisplay();
if (this.ttsEnabled) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
}
this.currentUtterances = [];
this.speakSequence(this.lyricsData[this.currentIndex], null);
}
}
}

nextLine() {
if (this.currentIndex < this.lyricsData.length - 1) {
this.currentIndex++;
this.lastSpokenIndex = this.currentIndex;
const targetTime = this.lyricsData[this.currentIndex].time || 0;
if (!this.activeMedia.src) {
this.syntheticCurrentTime = targetTime;
this.handleSyntheticTimeUpdate();
} else {
this.activeMedia.currentTime = targetTime;
}
this.updateMainDisplay();
if (this.ttsEnabled) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
}
this.currentUtterances = [];
this.speakSequence(this.lyricsData[this.currentIndex], null);
}
}
}

toggleLoop() {
const isLooping = !this.audioElement.loop;
this.audioElement.loop = isLooping;
this.videoElement.loop = isLooping;

const loopBtn = document.getElementById('loopBtn');
const loopIcon = document.getElementById('loopIcon');
const progressBar = document.getElementById('progressBar');

if (isLooping) {
loopBtn.classList.remove('text-slate-400');
loopBtn.classList.add('text-emerald-300');
loopIcon.style.color = '#6ee7b7';
progressBar.style.backgroundColor = '#6ee7b7';
} else {
loopBtn.classList.remove('text-emerald-300');
loopBtn.classList.add('text-slate-400');
loopIcon.style.color = '';
progressBar.style.backgroundColor = '';
}
}

cycleRate() {
this.rateIndex = (this.rateIndex + 1) % this.rates.length;
const rate = this.rates[this.rateIndex];
this.audioElement.playbackRate = rate;
this.videoElement.playbackRate = rate;
document.getElementById('rateBtn').textContent = `${rate}x`;
}

updateInputsFromData() {
if (this.isSyncing) return;
this.isSyncing = true;
const primaryEl = document.getElementById('primaryInput');
const transEl = document.getElementById('translationInput');

primaryEl.value = this.lyricsData.map(i => i.primary).join('\n');
transEl.value = this.lyricsData.map(i => i.translation).join('\n');

this.autoResizeTextarea(primaryEl);
this.autoResizeTextarea(transEl);

this.updateDurationDisplay();
this.isSyncing = false;
}

formatDetailedTime(totalSecs) {
const secsVal = Math.max(0, totalSecs);
const mins = String(Math.floor(secsVal / 60)).padStart(2, '0');
const secs = String(Math.floor(secsVal % 60)).padStart(2, '0');
const millis = String(Math.floor((secsVal % 1) * 100)).padStart(2, '0');
return `${mins}:${secs}:${millis}`;
}

renderStructureUI() {
const container = document.getElementById('structuredList');
container.innerHTML = this.lyricsData.map((item, index) => {
const timeVal = item.time !== undefined ? item.time : 0;
const timeFormatted = this.formatDetailedTime(timeVal);

return `<div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="text-[11px] text-emerald-300 font-mono">時間:</span>
<input type="text" inputmode="numeric" placeholder="00:00:00" value="${timeFormatted}" oninput="app.autoFormatTimeInput(this)" onchange="app.updateStructuredTime(${index}, this.value)" class="text-emerald-300 border border-slate-800 px-2 py-0.5 rounded text-[11px] font-mono bg-slate-900 w-32 outline-none focus:border-emerald-500 text-center placeholder:text-slate-600">
</div>
<div class="flex items-center gap-2">
<button onclick="app.insertLyricRow(${index})" class="text-emerald-400 hover:text-emerald-300 text-xs">+ 插入</button>
<button onclick="app.deleteLyricRow(${index})" class="text-slate-500 hover:text-red-400 text-xs">刪除</button>
</div>
</div>
<input type="text" value="${item.primary}" oninput="app.updateStructuredData(${index}, 'primary', this.value)" placeholder="原文歌詞" class="bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-emerald-500">
<input type="text" value="${item.translation}" oninput="app.updateStructuredData(${index}, 'translation', this.value)" placeholder="第二語言/翻譯歌詞" class="bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-400 outline-none focus:border-emerald-500">
</div>`;
}).join('');
}

updateStructuredTime(index, timeStr) {
const parts = timeStr.replace(/[^\d:]/g, ':').split(':');
let newTime = 0;
if (parts.length >= 3) {
const mins = parseFloat(parts[0]) || 0;
const secs = parseFloat(parts[1]) || 0;
const millis = parseFloat((parts[2] + '00').substring(0, 3)) || 0;
newTime = mins * 60 + secs + millis / 1000;
} else if (parts.length === 2) {
const mins = parseFloat(parts[0]) || 0;
const secs = parseFloat(parts[1]) || 0;
newTime = mins * 60 + secs;
}
this.lyricsData[index].time = Number(newTime.toFixed(3));
this.hasUserEdited = true;
this.updateDurationDisplay();
this.updateMainDisplay();
}

updateStructuredData(index, field, value) {
this.lyricsData[index][field] = value.trim();
this.hasUserEdited = true;
this.updateInputsFromData();
this.updateMainDisplay();
}

addLyricRow() {
this.lyricsData.push({ time: 0, primary: '', translation: '', endTime: 1.0 });
this.updateInputsFromData();
if (this.currentMode === 'structure') this.renderStructureUI();
this.updateMainDisplay();
}

insertLyricRow(index) {
this.lyricsData.splice(index + 1, 0, { time: 0, primary: '', translation: '', endTime: 1.0 });
this.updateInputsFromData();
if (this.currentMode === 'structure') this.renderStructureUI();
this.updateMainDisplay();
}

deleteLyricRow(index) {
this.lyricsData.splice(index, 1);
this.updateInputsFromData();
if (this.currentMode === 'structure') this.renderStructureUI();
this.updateMainDisplay();
}

updateMainDisplay() {
const hasContent = this.lyricsData.length > 0 && (this.lyricsData.some(i => i.primary.trim() !== '' || i.translation.trim() !== ''));
if (hasContent) this.draggableSubtitle.classList.remove('hidden');
else this.draggableSubtitle.classList.add('hidden');

const scrollContainer = document.getElementById('scrollLyricsContainer');
if (!scrollContainer) return;

let htmlContent = '';
const primarySize = Math.round(this.primary0Size * this.scaleMultiplier);
const transSize = Math.round(this.trans0Size * this.scaleMultiplier);

if (this.displayMode === 'single' || this.displayMode === 'double') {
  if (this.currentIndex >= 0 && this.lyricsData[this.currentIndex]) {
    const item = this.lyricsData[this.currentIndex];
    const primaryFormatted = this.formatColoredText(item.primary || '', this.primaryColor);
    const transFormatted = this.formatColoredText(item.translation || '', this.translationColor);
    
    let nextHtml = '';
    if (this.displayMode === 'double') {
      const nextItem = this.lyricsData[this.currentIndex + 1];
      if (nextItem) {
        const nextPrimaryFormatted = this.formatColoredText(nextItem.primary || '', this.primaryColor);
        const nextTransFormatted = this.formatColoredText(nextItem.translation || '', this.translationColor);
        nextHtml = `
        <div class="flex flex-col gap-0.5 opacity-40 mt-2">
          <div class="font-bold tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${Math.round(primarySize * 0.85)}px;">${nextPrimaryFormatted}</div>
          <div class="drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${Math.round(transSize * 0.85)}px;">${nextTransFormatted}</div>
        </div>`;
      }
    }

    htmlContent = `
    <div class="flex flex-col gap-1 transition-all duration-200">
      <div class="font-bold tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${primarySize}px;">${primaryFormatted}</div>
      <div class="drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${transSize}px;">${transFormatted}</div>
      ${nextHtml}
    </div>`;
  } else {
    const primaryFormatted = this.formatColoredText('準備開始', this.primaryColor);
    const transFormatted = this.formatColoredText('請播放音樂或點擊歌詞', this.translationColor);
    
    let nextHtml = '';
    if (this.displayMode === 'double' && this.lyricsData[0]) {
      const nextPrimaryFormatted = this.formatColoredText(this.lyricsData[0].primary || '', this.primaryColor);
      const nextTransFormatted = this.formatColoredText(this.lyricsData[0].translation || '', this.translationColor);
      nextHtml = `
      <div class="flex flex-col gap-0.5 opacity-40 mt-2">
        <div class="font-bold tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${Math.round(primarySize * 0.85)}px;">${nextPrimaryFormatted}</div>
        <div class="drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${Math.round(transSize * 0.85)}px;">${nextTransFormatted}</div>
      </div>`;
    }

    htmlContent = `
    <div class="flex flex-col gap-1 opacity-40">
      <div class="font-bold tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${primarySize}px;">${primaryFormatted}</div>
      <div class="drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${transSize}px;">${transFormatted}</div>
      ${nextHtml}
    </div>`;
  }
} else {
  for (let i = 0; i < this.lyricsData.length; i++) {
    const item = this.lyricsData[i];
    const isCurrent = (i === this.currentIndex);

    const currentStyle = isCurrent 
      ? 'border border-emerald-400/80 bg-emerald-950/50 rounded-xl px-3 py-2 shadow-lg scale-105' 
      : 'opacity-40 px-3 py-1 scale-100';

    const primaryFormatted = this.formatColoredText(item.primary || '', this.primaryColor);
    const transFormatted = this.formatColoredText(item.translation || '', this.translationColor);

    htmlContent += `
    <div id="lyric-line-${i}" class="flex flex-col gap-1 transition-all duration-300 w-full text-center ${currentStyle}">
      <div class="font-bold tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${primarySize}px;">${primaryFormatted}</div>
      <div class="drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] pointer-events-none" style="font-size: ${transSize}px;">${transFormatted}</div>
    </div>`;
  }
}

scrollContainer.innerHTML = htmlContent;

if (this.displayMode === 'scroll' && this.currentIndex >= 0) {
  const currentLineEl = document.getElementById(`lyric-line-${this.currentIndex}`);
  if (currentLineEl) {
    scrollContainer.scrollTo({
      top: currentLineEl.offsetTop - scrollContainer.offsetTop - (scrollContainer.clientHeight / 2) + (currentLineEl.clientHeight / 2),
      behavior: 'smooth'
    });
  }
}
}

handleTimeUpdate() {
const currentTime = this.activeMedia.currentTime;
const duration = this.activeMedia.duration || 1;
this.currentTimeDisplay.textContent = this.formatDetailedTime(currentTime);
this.progressBar.style.width = `${(currentTime / duration) * 100}%`;

let activeIdx = -1;
for (let i = 0; i < this.lyricsData.length; i++) {
if (this.lyricsData[i].time !== undefined && currentTime >= this.lyricsData[i].time) activeIdx = i;
}

if (activeIdx !== this.currentIndex) {
this.currentIndex = activeIdx;
this.updateMainDisplay();
}

if (activeIdx !== -1 && activeIdx !== this.lastSpokenIndex && this.ttsEnabled && !this.activeMedia.paused) {
this.lastSpokenIndex = activeIdx;
this.speakSequence(this.lyricsData[activeIdx], () => {
if (this.ttsEnabled && activeIdx === this.lyricsData.length - 1 && this.audioElement.loop) {
this.activeMedia.currentTime = 0;
this.activeMedia.play();
this.currentIndex = -1;
this.lastSpokenIndex = -1;
}
});
}
}

exportLrc() {
if (this.lyricsData.length === 0) {
alert("目前沒有任何歌詞可供匯出！");
return;
}
const title = this.getSongTitle();
const safeName = title.replace(/[\\/:*?"<>|]/g, '_');
let lrcContent = `[ti:${title}]\n[by:LinguaBook]\n`;
for (let item of this.lyricsData) {
const totalSecs = Math.max(0, item.time || 0);
const totalCentis = Math.round(totalSecs * 100);
const minsVal = Math.floor(totalCentis / 6000);
const secsVal = Math.floor((totalCentis % 6000) / 100);
const centisVal = totalCentis % 100;

const mins = String(minsVal).padStart(2, '0');
const secs = String(secsVal).padStart(2, '0');
const centis = String(centisVal).padStart(2, '0');
let lineText = item.primary;
if (item.translation) lineText += ` / ${item.translation}`;
lrcContent += `[${mins}:${secs}.${centis}]${lineText}\n`;
}
const blob = new Blob([lrcContent], { type: 'text/plain;charset=utf-8' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `${safeName}.lrc`;
a.click();
URL.revokeObjectURL(url);
}

importLrc(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => this.parseLrcContent(e.target.result);
reader.readAsText(file, 'utf-8');
event.target.value = '';
}

parseLrcContent(text) {
const lines = text.split(/\r?\n/);
let parsedItems = [];

for (let line of lines) {
const timeReg = /\[(\d{1,4}):(\d{2})(?:[:\.](\d{1,3}))?\]/g;
const matches = [...line.matchAll(timeReg)];
if (matches.length > 0) {
const lastMatch = matches[matches.length - 1];
const textContent = line.substring(lastMatch.index + lastMatch[0].length).trim();
const mins = parseInt(lastMatch[1], 10) || 0;
const secs = parseInt(lastMatch[2], 10) || 0;
const millisStr = lastMatch[3] ? lastMatch[3].padEnd(3, '0') : '000';
const timeInSec = mins * 60 + secs + parseInt(millisStr, 10) / 1000;

if (parsedItems.length > 0 && Math.abs(parsedItems[parsedItems.length - 1].time - timeInSec) < 0.001) {
parsedItems[parsedItems.length - 1].translation = textContent;
} else {
parsedItems.push({
time: timeInSec,
primary: textContent,
translation: '',
endTime: timeInSec + 1.0
});
}
}
}

if (parsedItems.length > 0) {
this.lyricsData = parsedItems;
this.hasUserEdited = true;
this.updateInputsFromData();
if (this.currentMode === 'structure') this.renderStructureUI();
this.updateMainDisplay();
alert("歌詞匯入成功！");
} else {
alert("無法解析該檔案格式。");
}
}
}

const app = new LinguaBookApp();

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll('.auto-textarea').forEach(el => app.autoResizeTextarea(el));
});
</script>
</body>
