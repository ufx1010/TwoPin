<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中英文打字練習</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 8px;
            color: #e0e0e0;
            touch-action: manipulation;
        }
        .container {
            background: #1e1e1e;
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
            border: 1px solid #2d2d2d;
        }
        h1 {
            margin: 0 0 8px 0;
            color: #ffffff;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 600;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #333333;
            margin-bottom: 10px;
            font-size: clamp(14px, 3.5vw, 17px);
            gap: 6px;
            flex-wrap: wrap;
        }
        .status-bar .progress-text { color: #3b82f6; font-weight: bold; }
        .status-bar .score-text { color: #2ecc71; font-weight: bold; }
        .status-bar .timer-text { color: #f39c12; font-weight: bold; }
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
            background: #252525;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #333333;
        }
        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .grid-item button,
        .grid-item select {
            width: 100%;
            min-height: 44px;
            padding: 6px 4px;
            border-radius: 8px;
            border: 1px solid #444444;
            font-size: clamp(12px, 3vw, 15px);
            font-weight: 600;
            color: #ffffff;
            background-color: #2a2a2a;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            touch-action: manipulation;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }
        .grid-item button:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        .grid-item select {
            background-color: #2a2a2a;
            text-align-last: center;
        }
        .grid-item select option { background: #1e1e1e; }
        button.primary-blue { background-color: #3b82f6; border-color: #3b82f6; }
        button.secondary-gray { background-color: #6c757d; border-color: #6c757d; }
        button.danger { background-color: #dc3545; border-color: #dc3545; }
        button.success-green { background-color: #2ecc71; border-color: #2ecc71; }
        .comparison-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 6px 0 8px 0;
            text-align: left;
        }
        .compare-row {
            background: #252525;
            border: 1px solid #333333;
            padding: clamp(12px, 3vw, 20px);
            border-radius: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .compare-en {
            font-size: clamp(20px, 5.5vw, 32px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.8;
            text-align: center;
            width: 100%;
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .line-block { display: block; width: 100%; }
        .correct-char { color: #2ecc71 !important; }
        .incorrect-char {
            color: #e74c3c !important;
            background-color: rgba(231, 76, 60, 0.25);
            border-radius: 2px;
            text-decoration: underline;
            text-decoration-color: #e74c3c;
        }
        .normal-char { color: #888888; }
        .fake-display-box {
            position: relative;
            width: 100%;
            min-height: 56px;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 6px 0 8px 0;
            overflow: hidden;
            cursor: text;
            touch-action: manipulation;
        }
        #hiddenInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            border: none;
            background: transparent;
            font-size: 20px;
            z-index: 2;
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation;
        }
        .status-text-layer {
            font-size: clamp(18px, 5vw, 28px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #888888;
            z-index: 1;
            pointer-events: none;
            padding: 8px 12px;
            word-break: break-word;
            text-align: center;
            line-height: 1.6;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #info-panel {
            margin: 4px 0 6px 0;
            font-size: clamp(14px, 3.5vw, 17px);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .info-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .info-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: #252525;
            border: 1px solid #333333;
            padding: clamp(8px, 2vw, 14px) clamp(10px, 2.5vw, 16px);
            border-radius: 8px;
            text-align: center;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            min-height: 40px;
            cursor: default;
        }
        #translation-display {
            font-size: clamp(16px, 4vw, 22px);
            font-weight: bold;
            color: #3b82f6;
            display: block;
            width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            text-align: center;
        }
        #note-display {
            font-size: clamp(14px, 3vw, 17px);
            color: #aaaaaa;
            display: block;
            width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            text-align: center;
        }
        #phonics-display {
            font-size: clamp(14px, 3vw, 17px);
            color: #f39c12;
            display: block;
            width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            text-align: center;
        }
        .bottom-toolbar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 6px;
        }
        .bottom-toolbar .grid-item button {
            min-height: 44px;
            font-size: clamp(11px, 2.8vw, 14px);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 14px;
            width: 100%;
            max-width: 500px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #333333;
            color: #ffffff;
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: clamp(17px, 4vw, 21px);
            color: #ffffff;
        }
        .batch-textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: clamp(14px, 3.5vw, 17px);
            border: 1px solid #444444;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #ffffff;
            resize: vertical;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        .batch-tip {
            font-size: clamp(12px, 2.8vw, 14px);
            color: #aaaaaa;
            margin-top: 6px;
            line-height: 1.6;
            background: #252525;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid #6c757d;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid #333333;
            padding-top: 10px;
            margin-top: 10px;
        }
        .modal-buttons-right {
            display: flex;
            gap: 8px;
        }
        .modal-buttons button {
            min-height: 44px;
            padding: 6px 16px;
            font-size: clamp(13px, 3vw, 15px);
            border-radius: 8px;
            border: none;
            font-weight: 600;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .modal-buttons button:active { transform: scale(0.95); }
        #importFile { display: none; }
        .complete-message {
            color: #2ecc71;
            font-weight: bold;
            font-size: clamp(20px, 5vw, 28px);
            text-align: center;
            padding: 10px;
        }
        .stats-card {
            background: #252525;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            text-align: left;
            font-size: clamp(14px, 3.5vw, 16px);
        }
        .stats-card h4 {
            margin: 0 0 10px 0;
            color: #3b82f6;
            text-align: center;
            font-size: clamp(16px, 4vw, 19px);
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .stats-label { color: #aaaaaa; }
        .stats-value { font-weight: bold; color: #ffffff; }
    </style>
</head>
<body>
<div class="container" id="main-container">
    <h1>⌨️ 中英文打字練習</h1>

    <div class="status-bar">
        <span class="progress-text">📖 <span id="progress">1 / 42</span></span>
        <span class="score-text">⭐ <span id="score">0</span></span>
        <span class="timer-text">⏱️ <span id="timerDisplay">00:00</span></span>
    </div>

    <div class="grid-menu">
        <div class="grid-item"><button type="button" class="secondary-gray" onclick="openModal()">✏️ 修改</button></div>
        <div class="grid-item"><button type="button" class="secondary-gray" onclick="exportArticle()">📤 匯出</button></div>
        <div class="grid-item">
            <button type="button" class="secondary-gray" onclick="triggerImport()">📥 匯入</button>
            <input type="file" id="importFile" accept=".txt,.json" onchange="importArticle(event)">
        </div>
        <div class="grid-item"><button type="button" class="secondary-gray" onclick="restartPractice()">🔄 重來</button></div>
        <div class="grid-item"><button type="button" id="muteBtn" class="secondary-gray" onclick="toggleMute()">🔊 開啟</button></div>
        <div class="grid-item"><button type="button" id="modeBtn" class="primary-blue" onclick="toggleMode()">🔤 英打</button></div>
        <div class="grid-item"><button type="button" id="audioModeBtn" class="primary-blue" onclick="toggleAudioMode()">🔊 單字</button></div>
        <div class="grid-item">
            <select id="speedSelect" onchange="updateSpeed()">
                <option value="0.3">0.3x</option>
                <option value="0.5">0.5x</option>
                <option value="0.8">0.8x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.3">1.3x</option>
                <option value="1.6">1.6x</option>
                <option value="2.0">2.0x</option>
                <option value="2.5">2.5x</option>
                <option value="3.0">3.0x</option>
            </select>
        </div>
    </div>

    <div id="comparison-display" class="comparison-container"></div>

    <div class="fake-display-box" onclick="focusHiddenInput()">
        <input type="search" id="hiddenInput" name="typing_practice_field" 
               autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false"
               inputmode="text" enterkeyhint="done">
        <div class="status-text-layer" id="statusDisplay"></div>
    </div>

    <div id="info-panel">
        <div class="info-row">
            <div class="info-group" id="group-trans">
                <span id="translation-display"></span>
            </div>
            <div class="info-group">
                <span id="note-display"></span>
            </div>
            <div class="info-group">
                <span id="phonics-display"></span>
            </div>
        </div>
    </div>

    <div class="bottom-toolbar">
        <div class="grid-item"><button type="button" class="success-green" onclick="shuffleLines()">🔀 隨機</button></div>
        <div class="grid-item"><button type="button" class="primary-blue" onclick="jumpToLine()">🎯 跳轉</button></div>
        <div class="grid-item"><button type="button" class="secondary-gray" onclick="toggleInfoPanel()">📋 資訊</button></div>
        <div class="grid-item"><button type="button" class="secondary-gray" onclick="toggleFullScreen()">⛶ 全螢幕</button></div>
    </div>
</div>

<div id="articleModal" class="modal-overlay">
    <div class="modal-content">
        <h3>✏️ 編輯句庫</h3>
        <div style="font-size: clamp(12px, 2.8vw, 14px); color: #aaaaaa; margin-bottom: 6px;">格式：原文｜翻譯｜註解｜註解</div>
        <textarea id="batchTextarea" class="batch-textarea"></textarea>
        <div class="batch-tip"><b>📌 說明：</b>每行一組，以「｜」或「|」隔開，可留空白。</div>
        <div class="modal-buttons">
            <button type="button" class="danger" onclick="clearModalText()">🗑️ 刪除全部</button>
            <div class="modal-buttons-right">
                <button type="button" class="secondary-gray" onclick="closeModal()">取消</button>
                <button type="button" class="secondary-gray" onclick="confirmCustomArticle()">✅ 套用</button>
            </div>
        </div>
    </div>
</div>
<script>
    let linesList = [];
    let currentLineIndex = 0;
    let score = 0;
    let practiceMode = 'en';
    let audioMode = 'word';
    let lastSpokenKey = "";
    let loopTimeout = null;
    let isMuted = false;
    let currentSpeed = 1.0;
    let audioCtx = null;
    let isInputLocked = false;
    let currentTypedText = "";
    let timerSeconds = 0;
    let timerInterval = null;
    let isTimerRunning = false;
    let errorCount = 0;
    let totalCorrectChars = 0;
    const STORAGE_KEY = 'typing_practice_data_v2';

    let rawArticleText = 
"Short Vowel|短元音\n" +
"Let’s learn words, me and you|讓我們來學習單字吧，我和你\n" +
"Short vowel words, sing along|短元音單字，跟著唱\n" +
"Phonics makes us strong|自然拼讀法使我們變得堅強\n" +
"cat, a little cat|貓，一隻小貓\n" +
"bat, a flying bat|蝙蝠，會飛的蝙蝠\n" +
"hat, a funny hat|帽子，有趣的帽子\n" +
"bag, a little bag|包，小包\n" +
"map, a simple map|地圖，簡單的地圖\n" +
"fan, a little fan|扇子，小扇子\n" +
"pan, a cooking pan|平底鍋，平底鍋\n" +
"can, a little can|可以，一點點可以\n" +
"hen, a little hen|母雞，一隻小母雞\n" +
"pen, a writing pen|鋼筆，書寫筆\n" +
"bed, a cozy bed|床，一張舒服的床\n" +
"bell, a ringing bell|鐘聲，敲響的鐘聲\n" +
"net, a little net|網，一點網\n" +
"tent, a camping tent|帳篷，露營帳篷\n" +
"jet, a flying jet|噴射機，飛行的噴射機\n" +
"pig, a little pig|豬，一隻小豬\n" +
"wig, a funny wig|假髮，有趣的假髮\n" +
"pin, a tiny pin|針，一根小針\n" +
"fish, a little fish|魚，一點點魚\n" +
"ship, a sailing ship|船，一艘帆船\n" +
"ring, a shiny ring|戒指，閃亮的戒指\n" +
"dog, a little dog|狗，一隻小狗\n" +
"fox, a clever fox|狐狸，聰明的狐狸\n" +
"box, a little box|盒子，小盒子\n" +
"sock, a cozy sock|襪子，舒適的襪子\n" +
"frog, a jumping frog|青蛙，跳躍的青蛙\n" +
"log, a wooden log|圓木，木頭圓木\n" +
"bug, a little bug|bug，一個小bug\n" +
"mug, a little mug|杯子，小杯子\n" +
"cup, a little cup|杯子，一個小杯子\n" +
"sun, a shining sun|太陽，燦爛的太陽\n" +
"bus, a big bus|巴士，大巴士\n" +
"drum, a loud drum|鼓，響亮的鼓\n" +
"Short vowel words, we know them too|短元音單字，我們也認識\n" +
"Cat, hen, pig, dog, bug|貓、母雞、豬、狗、蟲\n" +
"Five short vowels give a hug|五個短元音表示擁抱\n" +
"Read the words and sing them too|讀歌詞並唱出來\n" +
"Phonics friends, come and play|Phonics的朋友們，快來玩吧\n" +
"Learn English every day |每天學習英語" ;

    const comparisonDisplay = document.getElementById('comparison-display');
    const translationDisplay = document.getElementById('translation-display');
    const noteDisplay = document.getElementById('note-display');
    const phonicsDisplay = document.getElementById('phonics-display');
    const hiddenInput = document.getElementById('hiddenInput');
    const statusDisplay = document.getElementById('statusDisplay');
    const progressDisplay = document.getElementById('progress');
    const scoreDisplay = document.getElementById('score');
    const timerDisplay = document.getElementById('timerDisplay');

    function getCurrentSentenceObj() {
        return linesList[currentLineIndex] || null;
    }

    function getTargetText() {
        const obj = getCurrentSentenceObj();
        if (!obj) return '';
        return (practiceMode === 'en') ? obj.en : obj.zh;
    }

    function getCleanChars(text) {
        return text.replace(/[^a-zA-Z0-9\u4e00-\u9fff\s]/g, '');
    }

    function renderComparisonView() {
        if (currentLineIndex >= linesList.length) {
            stopTimer();
            const minutes = timerSeconds > 0 ? (timerSeconds / 60) : (1 / 60);
            const wpm = Math.round(totalCorrectChars / minutes);
            
            comparisonDisplay.innerHTML = `
                <div class="compare-row" style="flex-direction: column; align-items: stretch;">
                    <div class="compare-en complete-message">🎉 太棒了！練習已全部完成！</div>
                    <div class="stats-card">
                        <h4>📊 練習結算報告</h4>
                        <div class="stats-row"><span class="stats-label">總花費時間：</span><span class="stats-value">${timerSeconds} 秒</span></div>
                        <div class="stats-row"><span class="stats-label">平均字速：</span><span class="stats-value">${wpm} 字/分鐘</span></div>
                        <div class="stats-row"><span class="stats-label">按錯總次數：</span><span class="stats-value" style="color: #e74c3c;">${errorCount} 次</span></div>
                        <div class="stats-row"><span class="stats-label">總正確字數：</span><span class="stats-value" style="color: #2ecc71;">${totalCorrectChars} 字</span></div>
                    </div>
                </div>`;
            translationDisplay.textContent = "(完成)";
            noteDisplay.textContent = "";
            phonicsDisplay.textContent = "";
            return;
        }
        const targetText = getTargetText();
        const cleanTarget = getCleanChars(targetText);
        const cleanTyped = getCleanChars(currentTypedText);
        let lineHtml = '';
        let typedIdx = 0;
        for (let i = 0; i < targetText.length; i++) {
            const char = targetText[i];
            const isPunct = !/[a-zA-Z0-9\u4e00-\u9fff\s]/.test(char);
            if (isPunct) {
                lineHtml += `<span style="color:#666666;">${char}</span>`;
                continue;
            }
            if (typedIdx < cleanTyped.length) {
                const typedChar = cleanTyped[typedIdx];
                const isMatch = (practiceMode === 'en') ? (typedChar.toLowerCase() === char.toLowerCase()) : (typedChar === char);
                if (isMatch) {
                    lineHtml += `<span class="correct-char">${char}</span>`;
                } else {
                    lineHtml += `<span class="incorrect-char">${char}</span>`;
                }
                typedIdx++;
            } else {
                lineHtml += `<span style="color:#888888;">${char}</span>`;
            }
        }
        comparisonDisplay.innerHTML = `<div class="compare-row"><div class="compare-en"><div class="line-block">${lineHtml}</div></div></div>`;
    }

    function updateInfoPanel() {
        const sentenceObj = getCurrentSentenceObj();
        if (!sentenceObj) {
            translationDisplay.textContent = "";
            noteDisplay.textContent = "";
            phonicsDisplay.textContent = "";
            return;
        }
        translationDisplay.textContent = (practiceMode === 'en') ? sentenceObj.zh : sentenceObj.en;
        noteDisplay.textContent = sentenceObj.note || "";
        phonicsDisplay.textContent = sentenceObj.phonics || "";
        statusDisplay.textContent = currentTypedText || "";
        hiddenInput.value = currentTypedText;
    }

    function focusHiddenInput() {
        hiddenInput.focus();
        setTimeout(() => hiddenInput.focus(), 100);
    }
</script>
<script>
    function speakText(text, lang, callback) {
        if (isMuted || !('speechSynthesis' in window)) {
            if (callback) callback();
            return;
        }
        window.speechSynthesis.cancel();
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = currentSpeed;
            if (callback) {
                utterance.onend = () => callback();
                utterance.onerror = () => callback();
            }
            window.speechSynthesis.speak(utterance);
        }, 30);
    }

    function startLoopSound(text, lang, uniqueKey, interval = 1500) {
        if (isMuted || !('speechSynthesis' in window)) return;
        if (lastSpokenKey === uniqueKey && loopTimeout) return;
        stopLoopSound();
        lastSpokenKey = uniqueKey;
        const scheduleNext = () => {
            if (isMuted || lastSpokenKey !== uniqueKey) return;
            loopTimeout = setTimeout(() => {
                if (isMuted || lastSpokenKey !== uniqueKey) return;
                speakText(text, lang, () => scheduleNext());
            }, interval);
        };
        speakText(text, lang, () => scheduleNext());
    }

    function stopLoopSound() {
        if (loopTimeout) {
            clearTimeout(loopTimeout);
            loopTimeout = null;
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        lastSpokenKey = "";
    }

    function playErrorSound() {
        if (isMuted) return;
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        } catch(e) {}
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`無法切換全螢幕: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    function startTimer() {
        if (isTimerRunning) return;
        isTimerRunning = true;
        timerInterval = setInterval(() => {
            timerSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function stopTimer() {
        isTimerRunning = false;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function resetTimer() {
        stopTimer();
        timerSeconds = 0;
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        timerDisplay.textContent = `${mins}:${secs}`;
    }

    function saveProgress() {
        try {
            const data = {
                linesList: linesList,
                currentLineIndex: currentLineIndex,
                score: score,
                practiceMode: practiceMode,
                audioMode: audioMode,
                currentTypedText: currentTypedText,
                timerSeconds: timerSeconds,
                isTimerRunning: isTimerRunning,
                rawArticleText: rawArticleText,
                errorCount: errorCount,
                totalCorrectChars: totalCorrectChars
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch(e) {}
    }

    function loadProgress() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            const data = JSON.parse(saved);
            if (!data.linesList || data.linesList.length === 0) return false;
            linesList = data.linesList;
            currentLineIndex = data.currentLineIndex || 0;
            score = data.score || 0;
            practiceMode = data.practiceMode || 'en';
            audioMode = data.audioMode || 'word';
            currentTypedText = data.currentTypedText || '';
            timerSeconds = data.timerSeconds || 0;
            isTimerRunning = data.isTimerRunning || false;
            errorCount = data.errorCount || 0;
            totalCorrectChars = data.totalCorrectChars || 0;
            if (data.rawArticleText) {
                rawArticleText = data.rawArticleText;
            }
            const modeBtn = document.getElementById('modeBtn');
            if (practiceMode === 'en') {
                modeBtn.textContent = '🔤 英打';
                modeBtn.className = 'primary-blue';
            } else {
                modeBtn.textContent = '🀄 中打';
                modeBtn.className = 'secondary-gray';
            }
            const audioModeBtn = document.getElementById('audioModeBtn');
            if (audioMode === 'word') {
                audioModeBtn.textContent = '🔊 單字';
                audioModeBtn.className = 'primary-blue';
            } else {
                audioModeBtn.textContent = '🔊 整句';
                audioModeBtn.className = 'secondary-gray';
            }
            updateTimerDisplay();
            if (isTimerRunning) {
                startTimer();
            }
            return true;
        } catch(e) {
            return false;
        }
    }

    function loadDataFromCustomFormat(text) {
        stopLoopSound();
        rawArticleText = text;
        const lines = text.split(/\r?\n/);
        const parsed = [];
        for (const line of lines) {
            if (!line.trim()) continue;
            const parts = line.split(/[|｜]/);
            if (parts.length >= 2) {
                const en = parts[0].trim();
                const zh = parts[1].trim();
                const note = parts[2] ? parts[2].trim() : "";
                const phonics = parts[3] ? parts[3].trim() : "";
                if (en && zh) {
                    parsed.push({ en, zh, note, phonics });
                }
            }
        }
        if (parsed.length === 0) {
            throw new Error("無效格式");
        }
        linesList = parsed;
        currentLineIndex = 0;
        score = 0;
        currentTypedText = "";
        errorCount = 0;
        totalCorrectChars = 0;
        hiddenInput.value = "";
        statusDisplay.textContent = "👆 點擊開始打字";
        isInputLocked = false;
        lastSpokenKey = "";
        stopLoopSound();
        resetTimer();
        scoreDisplay.textContent = score;
        progressDisplay.textContent = `1 / ${linesList.length}`;
        renderComparisonView();
        updateInfoPanel();
        saveProgress();
    }

    function loadDefaultArticle() {
        try {
            loadDataFromCustomFormat(rawArticleText);
        } catch(e) {}
    }
</script>
<script>
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            e.preventDefault();
            const sentenceObj = getCurrentSentenceObj();
            if (!sentenceObj) return;
            const targetText = getTargetText();
            const rawWords = targetText.split(/\s+/);
            const words = rawWords.map(w => getCleanChars(w)).filter(w => w.length > 0);
            if (words.length === 0) return;

            let accumulatedLength = 0;
            let currentWordIndex = 0;
            
            for (let i = 0; i < words.length; i++) {
                const cleanW = words[i];
                const wordStart = accumulatedLength;
                const wordEnd = accumulatedLength + cleanW.length;
                if (currentTypedText.length >= wordStart && currentTypedText.length <= wordEnd) {
                    currentWordIndex = i;
                    break;
                }
                accumulatedLength += cleanW.length + 1;
            }

            let nextIndex = currentWordIndex + 1;
            if (nextIndex >= words.length) {
                nextIndex = 0;
            }

            let newTypedLength = 0;
            for (let i = 0; i < nextIndex; i++) {
                newTypedLength += words[i].length + 1;
            }
            
            const fullClean = getCleanChars(targetText);
            if (newTypedLength > fullClean.length) {
                newTypedLength = fullClean.length;
            }

            let matchedCount = 0;
            let actualStrIndex = 0;
            for (let i = 0; i < targetText.length; i++) {
                if (/[a-zA-Z0-9\u4e00-\u9fff]/.test(targetText[i])) {
                    matchedCount++;
                    if (matchedCount > newTypedLength) {
                        break;
                    }
                }
                actualStrIndex = i + 1;
            }

            currentTypedText = targetText.slice(0, actualStrIndex);
            hiddenInput.value = currentTypedText;

            renderComparisonView();
            updateInfoPanel();
            saveProgress();

            if (words[nextIndex]) {
                const speakLang = (practiceMode === 'en') ? 'en-US' : 'zh-TW';
                speakText(words[nextIndex], speakLang);
            }
        }
    });

    hiddenInput.addEventListener('input', function(e) {
        if (currentLineIndex >= linesList.length || isInputLocked) return;
        const targetText = getTargetText();
        const cleanTarget = getCleanChars(targetText);
        let fullVal = hiddenInput.value;

        if (fullVal.length > cleanTarget.length) {
            fullVal = fullVal.slice(0, cleanTarget.length);
            hiddenInput.value = fullVal;
            return;
        }

        const typedSoFar = fullVal;
        const expectedSoFar = cleanTarget.slice(0, typedSoFar.length);

        let isMatchSoFar = true;
        for (let i = 0; i < typedSoFar.length; i++) {
            const tChar = typedSoFar[i];
            const eChar = expectedSoFar[i];
            if (practiceMode === 'en') {
                if (tChar.toLowerCase() !== eChar.toLowerCase()) {
                    isMatchSoFar = false;
                    break;
                }
            } else {
                if (tChar !== eChar) {
                    isMatchSoFar = false;
                    break;
                }
            }
        }

        if (!isMatchSoFar) {
            errorCount++;
            playErrorSound();
            hiddenInput.value = currentTypedText;
            return;
        }

        // 計算新增了幾個正確字元並累加總正確字數
        if (typedSoFar.length > currentTypedText.length) {
            totalCorrectChars += (typedSoFar.length - currentTypedText.length);
        }

        let isComplete = (typedSoFar.length === cleanTarget.length);
        if (isComplete) {
            score++;
            scoreDisplay.textContent = score;
            currentTypedText = typedSoFar;
            renderComparisonView();
            updateInfoPanel();

            if (practiceMode === 'zh') {
                isInputLocked = true;
                stopLoopSound();
                speakText(targetText, 'zh-TW', () => {
                    isInputLocked = false;
                    advanceToNextLine();
                });
            } else {
                stopLoopSound();
                advanceToNextLine();
            }
            return;
        }

        currentTypedText = typedSoFar;
        handleAudioFeedback(typedSoFar, targetText, cleanTarget);
        renderComparisonView();
        updateInfoPanel();
        saveProgress();
        if (!isTimerRunning && typedSoFar.length === 1) {
            startTimer();
        }
    });

    function advanceToNextLine() {
        currentLineIndex++;
        currentTypedText = "";
        hiddenInput.value = "";
        isInputLocked = false;
        lastSpokenKey = "";
        if (currentLineIndex >= linesList.length) {
            renderComparisonView();
            updateInfoPanel();
            progressDisplay.textContent = `${linesList.length} / ${linesList.length}`;
            stopTimer();
            saveProgress();
            return;
        }
        progressDisplay.textContent = `${currentLineIndex + 1} / ${linesList.length}`;
        renderComparisonView();
        updateInfoPanel();
        saveProgress();
    }

    function handleAudioFeedback(typedSoFar, targetText, cleanTarget) {
        if (isMuted) return;
        const speakLang = (practiceMode === 'en') ? 'en-US' : 'zh-TW';
        
        if (audioMode === 'sentence') {
            if (typedSoFar.length === 1) {
                const sentenceKey = `sentence-${currentLineIndex}-${targetText}`;
                startLoopSound(targetText, speakLang, sentenceKey, 1500);
            } else if (typedSoFar.length === cleanTarget.length) {
                stopLoopSound();
            }
        } else {
            if (practiceMode === 'zh') {
                stopLoopSound();
                if (typedSoFar.length > 0) {
                    speakText(typedSoFar, speakLang);
                }
            } else {
                const words = targetText.split(/\s+/);
                let accumulatedLength = 0;
                let activeWord = null;
                let wordIndex = 0;
                for (let w of words) {
                    const cleanW = getCleanChars(w);
                    const wordStart = accumulatedLength;
                    const wordEnd = accumulatedLength + cleanW.length;
                    
                    if (cleanW.length === 1) {
                        if (typedSoFar.length >= wordStart && typedSoFar.length <= wordEnd) {
                            if (cleanW) {
                                activeWord = { word: cleanW, start: wordStart, end: wordEnd, index: wordIndex };
                            }
                            break;
                        }
                    } else {
                        if (typedSoFar.length > wordStart && typedSoFar.length <= wordEnd) {
                            if (cleanW) {
                                activeWord = { word: cleanW, start: wordStart, end: wordEnd, index: wordIndex };
                            }
                            break;
                        }
                    }
                    accumulatedLength += cleanW.length + 1;
                    wordIndex++;
                }
                if (activeWord) {
                    const typedInWord = typedSoFar.slice(activeWord.start);
                    const isWordComplete = (typedInWord.toLowerCase() === activeWord.word.toLowerCase());
                    if (isWordComplete) {
                        stopLoopSound();
                    } else {
                        const wordKey = `word-${currentLineIndex}-${activeWord.index}-${activeWord.word}`;
                        startLoopSound(activeWord.word, speakLang, wordKey, 1500);
                    }
                } else {
                    stopLoopSound();
                }
            }
        }
    }

    function openModal() {
        document.getElementById('batchTextarea').value = rawArticleText;
        document.getElementById('articleModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('articleModal').style.display = 'none';
    }

    function clearModalText() {
        if (confirm('確定清空所有內容嗎？')) {
            document.getElementById('batchTextarea').value = '';
        }
    }

    function confirmCustomArticle() {
        const text = document.getElementById('batchTextarea').value;
        if (!text.trim()) {
            alert('請輸入有效內容！');
            return;
        }
        closeModal();
        try {
            loadDataFromCustomFormat(text);
            alert('✅ 套用成功！');
        } catch(e) {
            alert('❌ 格式錯誤，請檢查！');
        }
    }

    function exportArticle() {
        let fileName = prompt("請輸入檔案名稱：", "打字練習");
        if (fileName === null) return;
        fileName = fileName.trim() || "打字練習";
        if (!fileName.endsWith('.txt') && !fileName.endsWith('.json')) {
            fileName += '.txt';
        }
        const parts = linesList.map(item => `${item.en}|${item.zh}|${item.note}|${item.phonics}`);
        const content = parts.join('\n');
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function triggerImport() {
        document.getElementById('importFile').click();
    }

    function importArticle(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            if (!content.trim()) {
                alert('檔案內容為空！');
                event.target.value = '';
                return;
            }
            try {
                loadDataFromCustomFormat(content);
                alert('✅ 匯入成功！');
            } catch(err) {
                alert('❌ 格式錯誤！');
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function restartPractice() {
        if (confirm('確定要重來嗎？')) {
            stopLoopSound();
            loadDataFromCustomFormat(rawArticleText);
            resetTimer();
        }
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = document.getElementById('muteBtn');
        if (isMuted) {
            btn.textContent = '🔇 靜音';
            btn.className = 'secondary-gray';
            stopLoopSound();
        } else {
            btn.textContent = '🔊 開啟';
            btn.className = 'secondary-gray';
        }
    }

    function toggleMode() {
        stopLoopSound();
        practiceMode = (practiceMode === 'en') ? 'zh' : 'en';
        const btn = document.getElementById('modeBtn');
        if (practiceMode === 'en') {
            btn.textContent = '🔤 英打';
            btn.className = 'primary-blue';
        } else {
            btn.textContent = '🀄 中打';
            btn.className = 'secondary-gray';
        }
        currentTypedText = "";
        hiddenInput.value = "";
        isInputLocked = false;
        lastSpokenKey = "";
        renderComparisonView();
        updateInfoPanel();
        saveProgress();
    }

    function toggleAudioMode() {
        stopLoopSound();
        audioMode = (audioMode === 'word') ? 'sentence' : 'word';
        const btn = document.getElementById('audioModeBtn');
        if (audioMode === 'word') {
            btn.textContent = '🔊 單字';
            btn.className = 'primary-blue';
        } else {
            btn.textContent = '🔊 整句';
            btn.className = 'secondary-gray';
        }
        lastSpokenKey = "";
    }

    function updateSpeed() {
        const select = document.getElementById('speedSelect');
        currentSpeed = parseFloat(select.value);
    }

    function shuffleLines() {
        if (linesList.length === 0) return;
        stopLoopSound();
        for (let i = linesList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [linesList[i], linesList[j]] = [linesList[j], linesList[i]];
        }
        currentLineIndex = 0;
        score = 0;
        currentTypedText = "";
        errorCount = 0;
        totalCorrectChars = 0;
        hiddenInput.value = "";
        isInputLocked = false;
        lastSpokenKey = "";
        resetTimer();
        scoreDisplay.textContent = score;
        progressDisplay.textContent = `1 / ${linesList.length}`;
        renderComparisonView();
        updateInfoPanel();
        saveProgress();
    }

    function jumpToLine() {
        const total = linesList.length;
        if (total === 0) return;
        const input = prompt(`請輸入要跳轉的句子編號（1 ~ ${total}）：`, `${currentLineIndex + 1}`);
        if (input === null) return;
        const num = parseInt(input);
        if (isNaN(num) || num < 1 || num > total) {
            alert(`請輸入 1 ~ ${total} 之間的數字！`);
            return;
        }
        stopLoopSound();
        currentLineIndex = num - 1;
        currentTypedText = "";
        hiddenInput.value = "";
        isInputLocked = false;
        lastSpokenKey = "";
        progressDisplay.textContent = `${currentLineIndex + 1} / ${linesList.length}`;
        renderComparisonView();
        updateInfoPanel();
        saveProgress();
    }

    let infoPanelVisible = true;
    function toggleInfoPanel() {
        infoPanelVisible = !infoPanelVisible;
        const panel = document.getElementById('info-panel');
        panel.style.display = infoPanelVisible ? 'flex' : 'none';
    }

    window.onload = function() {
        const hasSaved = loadProgress();
        if (hasSaved && linesList.length > 0) {
            scoreDisplay.textContent = score;
            progressDisplay.textContent = `${Math.min(currentLineIndex + 1, linesList.length)} / ${linesList.length}`;
            renderComparisonView();
            updateInfoPanel();
        } else {
            loadDefaultArticle();
        }
        setTimeout(focusHiddenInput, 500);
    };

    document.addEventListener('dblclick', function(e) {
        e.preventDefault();
    }, { passive: false });
</script>
