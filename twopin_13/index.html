<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noodp">
    <meta name="googlebot" content="noindex, nofollow, nosnippet, noimageindex">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>詩境 Pro v10.1 - 模組化細部面板</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=ZCOOL+KuaiLe&family=Long+Cang&family=ZCOOL+QingKe+HuangYou&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;700&family=Cinzel:wght@400;700&family=Dancing+Script:wght@400;700&family=Parisienne&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ui-bg: #0a0a0c;
            --ui-panel: #111114;
            --ui-accent: #a162e8;
            --ui-accent-glow: rgba(161, 98, 232, 0.4);
            --ui-btn: rgba(255, 255, 255, 0.05);
            --radius-ui: 12px;
            --panel-height: 55vh; 
            --trans: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            --ui-active-border: #ff3333;
        }

        html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; height: 100vh; width: 100vw; overscroll-behavior: none; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

        .main-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        
        select:focus, input:focus, textarea:focus, .sub-btn:active, .tab.active, .step-btn:active, .sub-btn.active-on {
            border: 2px solid var(--ui-active-border) !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.7) !important;
            outline: none;
            background: rgba(255, 51, 51, 0.15) !important;
            color: #fff !important;
        }

        .preview-section {
            flex: 1; background: radial-gradient(circle at center, #1a1a1f 0%, #000 100%); 
            display: flex; align-items: center; justify-content: center;
            position: relative; padding: 0; transition: var(--trans);
            overflow: hidden;
        }

        .preview-canvas-viewport {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #captureArea {
            position: absolute; background: #000; 
            overflow: hidden; 
            flex-shrink: 0;
            width: 450px; height: 450px; transition: width 0.4s, height 0.4s, box-shadow 0.3s;
            border-radius: 0;
            border: none !important;
            box-shadow: 0 20px 80px rgba(0,0,0,0.9);
            transform-origin: center center;
        }

        #captureArea.ratio-highlight {
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.9), 0 20px 80px rgba(0,0,0,0.9);
        }

        .layer { 
            position: absolute; inset: 0; 
            pointer-events: none; 
            transform-origin: center center; 
            will-change: transform, opacity; 
        }

        .layer-base, .layer-blur-overlay {
            position: absolute; inset: 0;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            will-change: filter, -webkit-mask-image;
        }

        .layer-blur-overlay { opacity: 0; }

        #layer-bottom { z-index: 10; opacity: 1; }
        #layer-mask { z-index: 20; opacity: 1; } 
        #layer-top { z-index: 30; opacity: 1; }
        #layer-text { z-index: 40; pointer-events: auto; width: 100%; height: 100%; }

        #interactionShield { 
            position: absolute; inset: 0; z-index: 100; 
            pointer-events: none; 
            background: transparent; 
        }
        #interactionShield.active { pointer-events: auto; }

        .draggable-zone { position: absolute; padding: 10px; color: white; cursor: move; z-index: 50; display: none; align-items: center; justify-content: flex-start; transform-origin: top left; border: 2px solid transparent; }
        .edit-mode .draggable-zone.active-target { border: 2px solid var(--ui-accent); background: rgba(161, 98, 232, 0.1); border-radius: 4px; }
        .edit-mode .draggable-zone:not(.active-target) { border: 1px dashed rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.02); border-radius: 4px; }
        .hide-boxes .draggable-zone { border: none !important; background: transparent !important; }

        .text-content { white-space: pre-wrap; word-break: break-all; display: block; line-height: 1.5; pointer-events: none; max-width: 350px; text-align: left; font-family: 'Noto Sans TC', sans-serif; }
        .v-mode { writing-mode: vertical-rl; text-orientation: mixed; max-width: none; max-height: 350px; }

        #permanentToggle { 
            position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; 
            background: var(--ui-accent); border-radius: 50%; border: none; color: #fff; 
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            z-index: 9999; transition: var(--trans);
        }

        .editor-section { width: 100%; height: var(--panel-height); background: var(--ui-panel); display: flex; flex-direction: column; border-top: 1px solid #1f1f23; z-index: 5000; transition: var(--trans); }
        body.collapsed .editor-section { height: 0; opacity: 0; transform: translateY(100%); }

        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; background: #08080a; margin-bottom: 10px; }
        .tab { text-align: center; padding: 12px 2px; font-size: 11px; border-radius: var(--radius-ui); color: #555; background: var(--ui-btn); cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .tab.active { background: var(--ui-accent); color: #fff; font-weight: bold; }

        .control-scroll-area { flex: 1; overflow-y: auto; padding: 0 20px 80px 20px; }
        .control-content { display: none; flex-direction: column; gap: 20px; }
        .control-content.active { display: flex; animation: slideUp 0.3s; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-row { grid-column: span 2; }
        label { font-size: 10px; color: #666; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        select, input, textarea, .sub-btn { background: var(--ui-btn); color: white; border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: var(--radius-ui); font-size: 13px; width: 100%; transition: 0.3s; cursor: pointer; }
        input, textarea { -webkit-user-select: text; user-select: text; }

        details.accordion-group { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-ui); padding: 12px; grid-column: span 2; }
        details.accordion-group summary { font-size: 11px; color: var(--ui-accent); font-weight: bold; cursor: pointer; user-select: none; outline: none; letter-spacing: 1px; }
        .accordion-content { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }

        .slider-group { background: rgba(255,255,255,0.02); padding: 10px; border-radius: var(--radius-ui); border: 1px solid rgba(255,255,255,0.05); }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 10px; color: #888; }
        .slider-val { color: var(--ui-accent); font-weight: bold; }
        .slider-ui-row { display: flex; align-items: center; gap: 6px; }
        .step-btn { width: 26px; height: 26px; flex-shrink: 0; background: var(--ui-btn); border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        input[type="range"] { flex: 1; -webkit-appearance: none; height: 2px; background: #333; cursor: pointer; accent-color: var(--ui-accent); }
        
        .slider-scale-hints { display: flex; justify-content: space-between; font-size: 9px; color: #555; margin-top: 4px; padding: 0 2px; }

        .active-selector { background: rgba(161, 98, 232, 0.05); padding: 15px; border-radius: var(--radius-ui); border: 1px solid var(--ui-accent); }
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="loading">🏮 處理無視覺引擎中...</div>

    <button id="permanentToggle" onclick="toggleMainPanel()">
        <svg id="toggleIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
        </svg>
    </button>

    <div class="main-container">
        <div class="preview-section" id="pvSection">
            <div class="preview-canvas-viewport" id="pvViewport">
                <div id="captureArea" class="edit-mode" style="width: 450px; height: 450px;">
                    <div id="layer-bottom" class="layer">
                        <div class="layer-base"></div>
                        <div class="layer-blur-overlay"></div>
                    </div>
                    <div id="layer-mask" class="layer">
                        <div class="layer-base"></div>
                        <div class="layer-blur-overlay"></div>
                    </div>
                    <div id="layer-top" class="layer">
                        <div class="layer-base"></div>
                        <div class="layer-blur-overlay"></div>
                    </div>
                    
                    <div id="layer-text" class="layer">
                        <div id="blk-title" class="draggable-zone"><div class="text-content">詩境</div></div>
                        <div id="blk-subtitle" class="draggable-zone"><div class="text-content"></div></div>
                        <div id="blk-content" class="draggable-zone"><div class="text-content"></div></div>
                        <div id="blk-n1" class="draggable-zone"><div class="text-content"></div></div>
                        <div id="blk-n2" class="draggable-zone"><div class="text-content"></div></div>
                        <div id="blk-meta" class="draggable-zone"><div class="text-content">江波</div></div>
                        <div id="blk-date" class="draggable-zone"><div class="text-content"></div></div>
                    </div>
                    <div id="interactionShield"></div>
                </div>
            </div>
        </div>

        <div class="editor-section">
            <div class="control-scroll-area">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab(0)">內容</div>
                    <div class="tab" onclick="switchTab(1)">細節</div>
                    <div class="tab" onclick="switchTab(2)">圖層</div>
                    <div class="tab" onclick="switchTab(3)">存檔</div>
                </div>

                <!-- 面板 0: 內容 -->
                <div class="control-content active" id="panel-0">
                    <div class="settings-grid">
                        <div class="full-row"><label>主標題</label><input type="text" id="inp-title" value="詩境" oninput="sync('title')"></div>
                        <div class="full-row"><label>副標題</label><input type="text" id="inp-subtitle" oninput="sync('subtitle')"></div>
                        <div class="full-row"><label>正文內容</label><textarea id="inp-content" rows="4" oninput="sync('content')"></textarea></div>
                        <div><label>備註一</label><input type="text" id="inp-n1" oninput="sync('n1')"></div>
                        <div><label>備註二</label><input type="text" id="inp-n2" oninput="sync('n2')"></div>
                        <div><label>作者</label><input type="text" id="inp-meta" value="江波" oninput="sync('meta')"></div>
                        <div><label>日期</label><input type="text" id="inp-date" oninput="sync('date')"></div>
                    </div>
                </div>

                <!-- 面板 1: 細節 (已收納字型與各項微調) -->
                <div class="control-content" id="panel-1">
                    <div class="active-selector">
                        <label>📍 調整對象</label>
                        <select id="targetSelect" onchange="focusTarget(this.value)">
                            <option value="blk-title">主標題</option>
                            <option value="blk-subtitle">副標題</option>
                            <option value="blk-content">本文內容</option>
                            <option value="blk-n1">備註一</option>
                            <option value="blk-n2">備註二</option>
                            <option value="blk-meta">作者</option>
                            <option value="blk-date">日期</option>
                        </select>
                    </div>

                    <div class="settings-grid">
                        <!-- 大項 1: 文字微調與字型選擇 -->
                        <details class="accordion-group open" open>
                            <summary>✒️ 文字微調（字型、大小、對齊、排版）</summary>
                            <div class="accordion-content">
                                <div class="full-row">
                                    <label>選擇字型（中英文字體）</label>
                                    <select id="fontFamilySelect" onchange="applyStyle('fontFamily', this.value)">
                                        <optgroup label="中文常規與經典">
                                            <option value="'Noto Sans TC', sans-serif">思源黑體 </option>
                                            <option value="'Noto Serif TC', serif">思源宋體</option>
                                        <optgroup label="中文書法與藝術">
                                            <option value="'Ma Shan Zheng', cursive">馬善政毛筆楷書 </option>
                                            <option value="'ZCOOL XiaoWei', serif">站酷小薇體</option>
                                            <option value="'Liu Jian Mao Cao', cursive">劉建毛草書</option>
                                            <option value="'Zhi Mang Xing', cursive">志芒星草書 </option>
                                            <option value="'Long Cang', cursive">龍藏體 </option>
                                        <optgroup label="中文可愛與特殊">
                                            <option value="'ZCOOL KuaiLe', cursive">站酷快樂體 </option>
                                            <option value="'ZCOOL QingKe+HuangYou', cursive">站酷慶科黃油體</option>
                                        <optgroup label="英文經典與襯線">
                                            <option value="'Playfair Display', serif">展覽</option>
                                            <option value="'Cinzel', serif">古典</option>
                                            <option value="'Lora', serif">優雅</option>
                                            <option value="'Dancing Script', cursive">舞蹈</option>
                                            <option value="'Parisienne', cursive">巴黎風</option>
                                        </optgroup>
                                    </select>
                                </div>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px;">
                                    <button class="sub-btn" onclick="triggerActiveBtn(this); setWritingMode('vertical-rl')">↕️直排模式</button>
                                    <button class="sub-btn" onclick="triggerActiveBtn(this); setWritingMode('horizontal-tb')">↔️橫排模式</button>
                                </div>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px;">
                                    <div><label>顏色</label><input type="color" oninput="applyStyle('color', this.value)" style="height:42px; padding:4px;"></div>
                                    <div><label>對齊</label>
                                        <select onchange="applyStyle('textAlign', this.value)">
                                            <option value="left">靠左</option>
                                            <option value="center">置中</option>
                                            <option value="right">靠右</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="slider-group" style="margin-top:8px;">
                                    <div class="slider-header">旋轉 <span class="slider-val" id="v-rot">0</span>°</div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepSlider('rotInp', -1)">-</div>
                                        <input type="range" id="rotInp" min="-180" max="180" value="0" oninput="applyRotate(this.value); document.getElementById('v-rot').innerText=this.value">
                                        <div class="step-btn" onclick="stepSlider('rotInp', 1)">+</div>
                                    </div>
                                </div>
                                <div class="slider-group">
                                    <div class="slider-header">大小 <span class="slider-val" id="v-size">32</span>px</div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepSlider('sizeInp', -2)">-</div>
                                        <input type="range" id="sizeInp" min="8" max="250" value="32" oninput="applyStyle('fontSize', this.value+'px'); document.getElementById('v-size').innerText=this.value">
                                        <div class="step-btn" onclick="stepSlider('sizeInp', 2)">+</div>
                                    </div>
                                </div>
                                <div class="slider-group">
                                    <div class="slider-header">行高 <span class="slider-val" id="v-lh">1.5</span></div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepSlider('lhInp', -0.1)">-</div>
                                        <input type="range" id="lhInp" min="0.8" max="4" step="0.1" value="1.5" oninput="applyStyle('lineHeight', this.value); document.getElementById('v-lh').innerText=this.value">
                                        <div class="step-btn" onclick="stepSlider('lhInp', 0.1)">+</div>
                                    </div>
                                </div>
                                <div class="slider-group">
                                    <div class="slider-header">字距 <span class="slider-val" id="v-ls">0</span>px</div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepSlider('lsInp', -1)">-</div>
                                        <input type="range" id="lsInp" min="-5" max="50" value="0" oninput="applyStyle('letterSpacing', this.value+'px'); document.getElementById('v-ls').innerText=this.value">
                                        <div class="step-btn" onclick="stepSlider('lsInp', 1)">+</div>
                                    </div>
                                </div>
                                <div class="slider-group">
                                    <div class="slider-header">文字明暗度（不透明度） <span class="slider-val" id="v-opacity">1.0</span></div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepSlider('opacityInp', -0.05)">-</div>
                                        <input type="range" id="opacityInp" min="0.1" max="1" step="0.05" value="1" oninput="applyStyle('opacity', this.value); document.getElementById('v-opacity').innerText=this.value">
                                        <div class="step-btn" onclick="stepSlider('opacityInp', 0.05)">+</div>
                                    </div>
                                </div>
                            </div>
                        </details>
                    </div>
                </div>

                <!-- 面板 2: 圖層 -->
                <div class="control-content" id="panel-2">
                    <div class="tabs" style="grid-template-columns: repeat(3, 1fr); padding:0; background:transparent;">
                        <div class="tab active" id="lTab-bottom" onclick="setActiveLayer('bottom')">底圖</div>
                        <div class="tab" id="lTab-mask" onclick="setActiveLayer('mask')">遮罩</div>
                        <div class="tab" id="lTab-top" onclick="setActiveLayer('top')">上層</div>
                    </div>

                    <div class="settings-grid">
                        <!-- 大項 2: 圖層特效 -->
                        <details class="accordion-group open" open>
                            <summary>🎨 圖層特效（漸層、透明、模糊）</summary>
                            <div class="accordion-content">
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                                    <div>
                                        <label>不透明</label>
                                        <div class="slider-ui-row" style="background:var(--ui-btn); padding:8px; border-radius:var(--radius-ui);">
                                            <input type="range" id="layerOpacSlider" min="0" max="1" step="0.01" value="1" oninput="updateLayerAttr('o', this.value)">
                                            <span class="slider-val" id="val-lOpac" style="font-size:11px; min-width:28px; text-align:right;">1</span>
                                        </div>
                                    </div>
                                    <div>
                                        <label>模糊 (px)</label>
                                        <div class="slider-ui-row" style="background:var(--ui-btn); padding:8px; border-radius:var(--radius-ui);">
                                            <input type="range" id="layerBlurSlider" min="-60" max="60" value="0" oninput="updateLayerAttr('b', this.value)">
                                            <span class="slider-val" id="val-lBlur" style="font-size:11px; min-width:28px; text-align:right;">0</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="slider-group" style="margin-top:8px;">
                                    <div class="slider-header">漸層角度 <span class="slider-val" id="v-gradAngle">0</span>°</div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepSlider('gradAngleInp', -15)">-</div>
                                        <input type="range" id="gradAngleInp" min="0" max="360" value="0" oninput="updateGradientFromControls()">
                                        <div class="step-btn" onclick="stepSlider('gradAngleInp', 15)">+</div>
                                    </div>
                                </div>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px;">
                                    <div>
                                        <label>起始顏色</label>
                                        <input type="color" id="gradColor1" value="#1abc9c" oninput="updateGradientFromControls()" style="height:42px; padding:4px;">
                                    </div>
                                    <div>
                                        <label>結束顏色</label>
                                        <input type="color" id="gradColor2" value="#2ecc71" oninput="updateGradientFromControls()" style="height:42px; padding:4px;">
                                    </div>
                                </div>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px;">
                                    <button class="sub-btn" onclick="triggerActiveBtn(this); document.getElementById('bgInput').click()">📸 上傳圖片</button>
                                    <button class="sub-btn" onclick="triggerActiveBtn(this); randomGradient()">🎲 隨機漸層</button>
                                </div>
                            </div>
                        </details>
                    </div>

                    <div class="settings-grid">
                        <!-- 大項 3: 畫布設定 -->
                        <details class="accordion-group">
                            <summary>📐 畫布與視窗設定（比例、平移）</summary>
                            <div class="accordion-content">
                                <label>畫布比例</label>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;" id="ratioGroup">
                                    <button class="sub-btn ratio-btn active-on" onclick="setCanvasRatio(450, 450, this)">1:1 方形</button>
                                    <button class="sub-btn ratio-btn" onclick="setCanvasRatio(640, 360, this)">16:9 橫式</button>
                                    <button class="sub-btn ratio-btn" onclick="setCanvasRatio(450, 600, this)">3:4 復古</button>
                                    <button class="sub-btn ratio-btn" onclick="setCanvasRatio(360, 640, this)">9:16 直式</button>
                                </div>
                                <div class="slider-group" style="margin-top:8px;">
                                    <div class="slider-header">水平移動 (X) <span class="slider-val" id="v-panX">0</span>px</div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepPan('panXInp', -20)">-</div>
                                        <input type="range" id="panXInp" min="-500" max="500" value="0" oninput="updatePan()">
                                        <div class="step-btn" onclick="stepPan('panXInp', 20)">+</div>
                                    </div>
                                    <div class="slider-scale-hints"><span>◀ 左移 (-500)</span><span>歸零 (0)</span><span>右移 (+500) ▶</span></div>
                                </div>
                                <div class="slider-group">
                                    <div class="slider-header">垂直移動 (Y) <span class="slider-val" id="v-panY">0</span>px</div>
                                    <div class="slider-ui-row">
                                        <div class="step-btn" onclick="stepPan('panYInp', -20)">-</div>
                                        <input type="range" id="panYInp" min="-500" max="500" value="0" oninput="updatePan()">
                                        <div class="step-btn" onclick="stepPan('panYInp', 20)">+</div>
                                    </div>
                                    <div class="slider-scale-hints"><span>▲ 上移 (-500)</span><span>歸零 (0)</span><span>下移 (+500) ▼</span></div>
                                </div>
                                <button class="sub-btn" onclick="resetPan()">🎯 視窗置中歸零</button>
                            </div>
                        </details>
                    </div>

                    <div class="settings-grid">
                        <details class="accordion-group">
                            <summary>⚙️ 更多進階調整</summary>
                            <div class="accordion-content">
                                <button class="sub-btn" style="background:#2d1414;" onclick="triggerActiveBtn(this); clearLayer()">🗑️ 清空此層</button>
                            </div>
                        </details>
                    </div>

                    <input type="file" id="bgInput" hidden onchange="handleUpload(this)">
                </div>

                <!-- 面板 3: 存檔 -->
                <div class="control-content" id="panel-3">
                    <button class="sub-btn full-row" style="background:var(--ui-accent); height:60px; font-weight:bold;" onclick="triggerActiveBtn(this); exportImage(3)">🖼️ 導出高清 WebP 作品</button>
                    <div class="settings-grid" style="margin-top:20px;">
                        <button class="sub-btn" onclick="triggerActiveBtn(this); undo()">↩️ 退回一步</button>
                        <button class="sub-btn" onclick="triggerActiveBtn(this); newStart()" style="background:#422;">✨ 全新開始</button>
                        <button class="sub-btn" onclick="triggerActiveBtn(this); saveToLocal()">💾 儲存草稿</button>
                        <button class="sub-btn" onclick="triggerActiveBtn(this); loadFromLocal()">📂 載入草稿</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const area = document.getElementById('captureArea');
        const shield = document.getElementById('interactionShield');
        const pvSection = document.getElementById('pvSection');
        const pvViewport = document.getElementById('pvViewport');
        
        let panX = 0;
        let panY = 0;

        const layerData = {
            bottom: { el: document.getElementById('layer-bottom'), base: document.querySelector('#layer-bottom .layer-base'), overlay: document.querySelector('#layer-bottom .layer-blur-overlay'), x: 0, y: 0, s: 1, o: 1, b: 0, angle: 0, c1: '#1abc9c', c2: '#2ecc71' },
            mask: { el: document.getElementById('layer-mask'), base: document.querySelector('#layer-mask .layer-base'), overlay: document.querySelector('#layer-mask .layer-blur-overlay'), x: 0, y: 0, s: 1, o: 1, b: 0, angle: 0, c1: '#1abc9c', c2: '#2ecc71' },
            top: { el: document.getElementById('layer-top'), base: document.querySelector('#layer-top .layer-base'), overlay: document.querySelector('#layer-top .layer-blur-overlay'), x: 0, y: 0, s: 1, o: 1, b: 0, angle: 0, c1: '#1abc9c', c2: '#2ecc71' }
        };
        
        let activeLayerKey = 'bottom', activeEditId = 'blk-title', historyStack = [];
        let highlightTimer = null;

        window.onload = () => {
            const today = new Date();
            const dateStr = today.getFullYear() + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + String(today.getDate()).padStart(2, '0');
            document.getElementById('inp-date').value = dateStr;
            initDraggables(); initLayerInteraction(); layoutGrid(); focusTarget('blk-title'); 
            ['title','subtitle','content','n1','n2','meta','date'].forEach(k => sync(k, false));
            
            setCanvasRatio(450, 450, null);
            randomGradient(); 
            saveHistory();
        };

        function triggerActiveBtn(btn) {
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active-on'));
            if(btn) btn.classList.add('active-on');
        }

        function stepSlider(id, step) {
            const el = document.getElementById(id);
            el.value = (parseFloat(el.value) + step);
            el.dispatchEvent(new Event('input'));
        }

        function stepPan(id, step) {
            const el = document.getElementById(id);
            el.value = (parseFloat(el.value) + step);
            updatePan();
        }

        function updatePan() {
            panX = parseFloat(document.getElementById('panXInp').value);
            panY = parseFloat(document.getElementById('panYInp').value);
            
            document.getElementById('v-panX').innerText = panX;
            document.getElementById('v-panY').innerText = panY;
            
            pvViewport.style.transform = `translate(${panX}px, ${panY}px)`;
        }

        function resetPan() {
            document.getElementById('panXInp').value = 0;
            document.getElementById('panYInp').value = 0;
            updatePan();
        }

        function setCanvasRatio(width, height, btn) {
            if (btn) {
                document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active-on'));
                btn.classList.add('active-on');
            }
            area.style.width = width + 'px';
            area.style.height = height + 'px';
            
            resetPan();

            area.classList.add('ratio-highlight');
            clearTimeout(highlightTimer);
            highlightTimer = setTimeout(() => {
                area.classList.remove('ratio-highlight');
            }, 800);

            saveHistory();
        }

        function updateLayerAttr(type, val) {
            const l = layerData[activeLayerKey]; 
            l[type] = parseFloat(val);
            
            if(type === 'o') {
                l.el.style.opacity = l.o;
                document.getElementById('val-lOpac').innerText = val;
            }
            
            if(type === 'b') {
                const blurVal = parseFloat(val);
                document.getElementById('val-lBlur').innerText = blurVal;
                const absV = Math.abs(blurVal);
                
                if(blurVal === 0) {
                    l.overlay.style.opacity = 0;
                    l.overlay.style.filter = 'none';
                } else {
                    l.overlay.style.opacity = 1;
                    l.overlay.style.filter = `blur(${absV}px)`;
                    
                    if(blurVal > 0) {
                        l.overlay.style.webkitMaskImage = `
                            linear-gradient(to right, black, transparent 25%, transparent 75%, black),
                            linear-gradient(to bottom, black, transparent 25%, transparent 75%, black)
                        `;
                        l.overlay.style.webkitMaskComposite = 'source-over';
                    } else {
                        l.overlay.style.webkitMaskImage = `
                            linear-gradient(to right, transparent, black 35%, black 65%, transparent),
                            linear-gradient(to bottom, transparent, black 35%, black 65%, transparent)
                        `;
                        l.overlay.style.webkitMaskComposite = 'source-in';
                    }
                }
            }
            
            l.el.style.transform = `translate(${l.x}px, ${l.y}px) scale(${l.s})`;
        }

        function updateGradientFromControls() {
            const l = layerData[activeLayerKey];
            l.angle = document.getElementById('gradAngleInp').value;
            l.c1 = document.getElementById('gradColor1').value;
            l.c2 = document.getElementById('gradColor2').value;

            document.getElementById('v-gradAngle').innerText = l.angle;

            const grad = `linear-gradient(${l.angle}deg, ${l.c1}, ${l.c2})`;
            l.base.style.backgroundImage = grad;
            l.overlay.style.backgroundImage = grad;
            
            clearTimeout(window.gradHistT);
            window.gradHistT = setTimeout(saveHistory, 300);
        }

        function handleUpload(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = e => {
                    const l = layerData[activeLayerKey];
                    const url = `url("${e.target.result}")`;
                    l.base.style.backgroundImage = url;
                    l.overlay.style.backgroundImage = url;
                    saveHistory();
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        function randomGradient() {
            const l = layerData[activeLayerKey];
            l.c1 = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
            l.c2 = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
            l.angle = Math.floor(Math.random()*360);

            document.getElementById('gradColor1').value = l.c1;
            document.getElementById('gradColor2').value = l.c2;
            document.getElementById('gradAngleInp').value = l.angle;
            document.getElementById('v-gradAngle').innerText = l.angle;

            const grad = `linear-gradient(${l.angle}deg, ${l.c1}, ${l.c2})`;
            l.base.style.backgroundImage = grad;
            l.overlay.style.backgroundImage = grad;
            saveHistory();
        }

        function clearLayer() {
            const l = layerData[activeLayerKey];
            l.base.style.backgroundImage = 'none';
            l.overlay.style.backgroundImage = 'none';
            updateLayerAttr('b', 0);
            saveHistory();
        }

        async function exportImage(scale) {
            const loader = document.getElementById('loading'); loader.style.display = 'flex';
            area.classList.remove('edit-mode'); window.scrollTo(0, 0);
            setTimeout(() => {
                html2canvas(area, { scale: scale, useCORS: true, backgroundColor: null, width: area.offsetWidth, height: area.offsetHeight, scrollX: 0, scrollY: 0, x: 0, y: 0 }).then(canvas => {
                    const link = document.createElement('a'); link.download = `Studio_${Date.now()}.webp`; link.href = canvas.toDataURL('image/webp', 0.95); link.click();
                    area.classList.add('edit-mode'); loader.style.display = 'none';
                });
            }, 600);
        }

        function toggleMainPanel() { document.body.classList.toggle('collapsed'); }
        
        function sync(id, shouldSave = true) {
            const inp = document.getElementById('inp-' + id); if(!inp) return;
            const blk = document.getElementById('blk-' + id);
            const val = inp.value;
            blk.querySelector('.text-content').innerText = val;
            blk.style.display = (val.trim() === "") ? "none" : "flex";
            if(shouldSave) {
                clearTimeout(window.hT); 
                window.hT = setTimeout(saveHistory, 300);
            }
        }

        function focusTarget(id) {
            activeEditId = id;
            document.querySelectorAll('.draggable-zone').forEach(el => el.classList.toggle('active-target', el.id === id));
            document.getElementById('targetSelect').value = id;
            
            const target = document.querySelector(`#${activeEditId} .text-content`);
            if (target) {
                const currentOpacity = target.style.opacity || '1';
                document.getElementById('opacityInp').value = currentOpacity;
                document.getElementById('v-opacity').innerText = currentOpacity;

                const currentFont = target.style.fontFamily;
                const fontSelect = document.getElementById('fontFamilySelect');
                if (currentFont) {
                    for (let opt of fontSelect.options) {
                        if (currentFont.includes(opt.value.split(',')[0].replace(/['"]/g, ''))) {
                            fontSelect.value = opt.value;
                            break;
                        }
                    }
                }
            }
        }

        function applyStyle(prop, val) { 
            const target = document.querySelector(`#${activeEditId} .text-content`); 
            if(target) { 
                target.style[prop] = val; 
                saveHistory(); 
            } 
        }

        function applyRotate(deg) { 
            const el = document.getElementById(activeEditId); 
            if(el) { 
                el.style.transform = `rotate(${deg}deg)`; 
                saveHistory(); 
            } 
        }

        function setWritingMode(mode) { 
            const target = document.querySelector(`#${activeEditId} .text-content`); 
            if (mode === 'vertical-rl') target.classList.add('v-mode'); 
            else target.classList.remove('v-mode'); 
            saveHistory(); 
        }
        
        function setActiveLayer(key) {
            activeLayerKey = key; 
            document.querySelectorAll('#panel-2 .tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`lTab-${key}`).classList.add('active');
            
            const l = layerData[key];
            document.getElementById('layerOpacSlider').value = l.o;
            document.getElementById('val-lOpac').innerText = l.o;
            document.getElementById('layerBlurSlider').value = l.b;
            document.getElementById('val-lBlur').innerText = l.b;
            document.getElementById('gradAngleInp').value = l.angle;
            document.getElementById('v-gradAngle').innerText = l.angle;
            document.getElementById('gradColor1').value = l.c1;
            document.getElementById('gradColor2').value = l.c2;
        }

        function initDraggables() {
            document.querySelectorAll('.draggable-zone').forEach(el => {
                let sx, sy, it, il;
                const start = e => { focusTarget(el.id); const t = e.touches ? e.touches[0] : e; sx = t.clientX; sy = t.clientY; it = el.offsetTop; il = el.offsetLeft; };
                const move = e => { if(!sx) return; const t = e.touches ? e.touches[0] : e; el.style.top = (it + t.clientY - sy) + 'px'; el.style.left = (il + t.clientX - sx) + 'px'; };
                el.onmousedown = start; window.onmousemove = move; window.onmouseup = () => { if(sx) saveHistory(); sx = null; };
                el.ontouchstart = start; el.ontouchmove = e => { if(sx) e.preventDefault(); move(e); }; el.ontouchend = () => { if(sx) saveHistory(); sx = null; };
            });
        }

        function initLayerInteraction() {
            let sx = 0, sy = 0, ix = 0, iy = 0, is = 1, initialDist = 0, isInteracting = false;
            
            const getTouchDistance = (touches) => {
                return Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY);
            };

            const start = e => {
                const l = layerData[activeLayerKey]; 
                const touches = e.touches ? e.touches : [e];
                
                isInteracting = true;
                if(touches.length === 1) { 
                    sx = touches[0].clientX; 
                    sy = touches[0].clientY; 
                    ix = l.x; 
                    iy = l.y; 
                } else if(touches.length === 2) { 
                    is = l.s; 
                    initialDist = getTouchDistance(touches); 
                }
            };

            const move = e => {
                if(!isInteracting) return; 
                const l = layerData[activeLayerKey]; 
                const touches = e.touches ? e.touches : [e];
                
                if(touches.length === 1) { 
                    l.x = ix + (touches[0].clientX - sx); 
                    l.y = iy + (touches[0].clientY - sy); 
                } else if(touches.length === 2 && initialDist > 0) { 
                    const currentDist = getTouchDistance(touches); 
                    l.s = Math.max(0.1, is * (currentDist / initialDist)); 
                }
                l.el.style.transform = `translate(${l.x}px, ${l.y}px) scale(${l.s})`;
            };

            const end = () => {
                if (isInteracting) {
                    isInteracting = false;
                    saveHistory();
                }
            };

            shield.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);

            shield.addEventListener('touchstart', start, { passive: false });
            shield.addEventListener('touchmove', e => { 
                if(isInteracting) e.preventDefault(); 
                move(e); 
            }, { passive: false });
            shield.addEventListener('touchend', end);
        }

        function layoutGrid() {
            const config = [
                { id: 'blk-title', left: '20px', top: '20px', size: '36px' }, 
                { id: 'blk-meta', left: '110px', top: '26px', size: '14px' }, 
                { id: 'blk-date', left: '20px', top: '70px', size: '12px' }, 
                { id: 'blk-subtitle', left: '20px', top: '100px', size: '24px' }, 
                { id: 'blk-content', left: '20px', top: '150px', size: '18px' },
                { id: 'blk-n1', left: '20px', top: '320px', size: '14px' }, 
                { id: 'blk-n2', left: '20px', top: '360px', size: '14px' }
            ];
            config.forEach(item => {
                const el = document.getElementById(item.id); if(!el) return;
                const txt = el.querySelector('.text-content');
                el.style.left = item.left; 
                el.style.top = item.top; 
                el.style.transform = 'none'; 
                txt.style.fontSize = item.size;
            });
        }

        function saveHistory() {
            const state = { 
                texts: {}, 
                layers: JSON.parse(JSON.stringify(layerData, (k,v) => (k==='el'||k==='base'||k==='overlay')?undefined:v)) 
            };
            document.querySelectorAll('.draggable-zone').forEach(z => {
                const id = z.id.replace('blk-',''); 
                const txt = z.querySelector('.text-content');
                state.texts[id] = { 
                    val: txt.innerText, 
                    style: txt.getAttribute('style'), 
                    pos: { t: z.style.top, l: z.style.left, r: z.style.transform }, 
                    cls: txt.className,
                    display: z.style.display 
                };
            });
            historyStack.push(JSON.stringify(state)); 
            if(historyStack.length > 30) historyStack.shift();
        }

        function undo() {
            if(historyStack.length <= 1) return; 
            historyStack.pop();
            const previousStateJSON = historyStack[historyStack.length - 1];
            const s = JSON.parse(previousStateJSON);
            
            Object.keys(s.texts).forEach(id => {
                const d = s.texts[id]; 
                const z = document.getElementById('blk-'+id); 
                if(!z) return;
                const txt = z.querySelector('.text-content');
                
                txt.innerText = d.val; 
                if(d.style) txt.setAttribute('style', d.style); 
                else txt.removeAttribute('style');
                
                txt.className = d.cls;
                z.style.top = d.pos.t; 
                z.style.left = d.pos.l; 
                z.style.transform = d.pos.r;
                z.style.display = d.display;

                const inp = document.getElementById('inp-' + id);
                if(inp && inp.value !== d.val) {
                    inp.value = d.val;
                }
            });

            if(s.layers) {
                Object.keys(s.layers).forEach(k => {
                    const lData = s.layers[k];
                    const targetL = layerData[k];
                    if(targetL) {
                        targetL.x = lData.x;
                        targetL.y = lData.y;
                        targetL.s = lData.s;
                        targetL.o = lData.o;
                        targetL.b = lData.b;
                        targetL.angle = lData.angle || 0;
                        targetL.c1 = lData.c1 || '#1abc9c';
                        targetL.c2 = lData.c2 || '#2ecc71';
                        
                        targetL.el.style.transform = `translate(${targetL.x}px, ${targetL.y}px) scale(${targetL.s})`;
                        targetL.el.style.opacity = targetL.o;
                    }
                });
                setActiveLayer(activeLayerKey);
            }
        }

        function switchTab(i) {
            document.querySelectorAll('.tab').forEach((t, idx) => { if(idx < 4) t.classList.toggle('active', i===idx); });
            document.querySelectorAll('.control-content').forEach((p, idx) => p.classList.toggle('active', i===idx));
            
            shield.classList.toggle('active', i === 2);
            
            if (i === 0) {
                area.classList.add('edit-mode');
                area.classList.remove('hide-boxes');
            } else {
                area.classList.remove('edit-mode');
                area.classList.add('hide-boxes');
            }
        }

        function saveToLocal() { alert("存檔成功"); }
        function loadFromLocal() { alert("載入成功"); }
        function newStart() { if(confirm("確定重置？")) location.reload(); }
    </script>
</body>
</html>
