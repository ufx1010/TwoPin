<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>詩境 - 隨機美學</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&family=ZCOOL+KuaiLe&family=Long+Cang&family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=Great+Vibes&family=Satisfy&family=Dancing+Script&family=Parisienne&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ui-bg: rgba(18, 15, 22, 0.98);
            --ui-accent: #9d50bb;
            --ui-btn-bg: rgba(255, 255, 255, 0.07);
            --base-size: 22px;
            --safe-bottom: env(safe-area-inset-bottom);
            --radius-mod: 8px; /* 新增：精確控制細部圓角 */
        }

        html, body { overscroll-behavior: none; height: 100vh; margin: 0; background: #000; color: #eee; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; width: 100vw; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        input, textarea, select { -webkit-user-select: text; user-select: text; outline: none; }

        /* 畫布顯示區 */
        .canvas-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
        #captureArea { 
            position: relative; 
            overflow: hidden; 
            background: #050505; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            border-radius: var(--radius-mod); /* 修改：主框圓角 */
        }
        
        /* 比例設定 */
        .ratio-9-18 { width: 100vw; height: 100vh; border-radius: 0 !important; } /* 全螢幕時不使用圓角 */
        .ratio-9-16 { width: 88vw; height: 156.4vw; max-height: 75vh; }
        .ratio-4-5  { width: 80vw; height: 100vw; }
        .ratio-1-1  { width: 90vw; height: 90vw; }
        .ratio-16-9 { width: 95vw; height: 53.4vw; }
        .ratio-21-9 { width: 98vw; height: 42vw; }

        /* 圖層系統 */
        .bg-layer { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-size: cover; 
            background-repeat: no-repeat; 
            background-position: center; 
            pointer-events: none; 
            transform-origin: center center; 
            will-change: transform; 
            border-radius: var(--radius-mod); /* 修改：載入的照片也具備圓角 */
        }
        
        #interactionShield { position: absolute; inset: 0; z-index: 100; display: none; touch-action: none; }
        #interactionShield.active { display: block; }
        
        /* 文字容器 */
        #pMasterContainer { position: absolute; inset: 0; z-index: 20; pointer-events: none; transition: opacity 0.3s; }

        /* 文字內容塊 */
        .draggable-zone { position: absolute; display: flex; touch-action: none; padding: 10px; color: white; border: 1.5px solid transparent; pointer-events: auto; }
        .edit-mode .draggable-zone { border: 1.5px dashed rgba(255,255,255,0.3); background: rgba(255,255,255,0.04); border-radius: var(--radius-mod); }

        #fixedHeader { top: 60px; right: 25px; align-items: center; gap: 10px; text-align: right; }
        #pTitle { font-weight: 700; font-size: calc(var(--base-size) * 1.8); }
        .p-meta-info { font-size: 0.65em; opacity: 0.85; border-left: 1.5px solid white; padding-left: 12px; text-align: left; line-height: 1.5; display: flex; flex-direction: column; }

        #pContentBlock { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; padding: 40px; }
        .poem-content { width: 100%; font-size: var(--base-size); line-height: 1.8; letter-spacing: 1.5px; white-space: pre-wrap; }
        .vertical-mode .poem-content { writing-mode: vertical-rl; }

        /* UI 控制面板 */
        #masterToggle { position: fixed; bottom: calc(var(--safe-bottom) + 20px); right: 20px; width: 55px; height: 55px; background: var(--ui-accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: none; }

        .toolbar-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: var(--ui-bg); backdrop-filter: blur(30px); padding: 15px 15px calc(var(--safe-bottom) + 10px); z-index: 1500; transition: bottom 0.4s; border-radius: 20px 20px 0 0; max-height: 85vh; overflow-y: auto; }
        .toolbar-sheet.open { bottom: 0; }
        
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
        .tab { text-align: center; padding: 12px 2px; font-size: 11px; border-radius: var(--radius-mod); color: #777; cursor: pointer; background: rgba(255,255,255,0.03); }
        .tab.active { background: var(--ui-accent); color: #fff; font-weight: bold; }

        .control-panel { display: none; flex-direction: column; gap: 15px; }
        .control-panel.active { display: flex; }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full-row { grid-column: span 2; }
        label { font-size: 10px; color: #888; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        
        select, input, textarea, .sub-btn { background: var(--ui-btn-bg); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: var(--radius-mod); font-size: 13px; width: 100%; transition: 0.2s; }

        /* 滑桿介面 */
        .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: var(--radius-mod); }
        input[type="range"] { 
            -webkit-appearance: none; 
            height: 2px; 
            background: #444; 
            border-radius: 10px; 
            outline: none; 
        }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            width: 14px; 
            height: 14px; 
            background: #fff; 
            border: 2px solid var(--ui-accent); 
            border-radius: 50%; 
            cursor: pointer; 
        }

        .action-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .menu-btn { background: var(--ui-btn-bg); color: white; padding: 14px; border-radius: var(--radius-mod); font-weight: bold; border: none; font-size: 12px; transition: 0.2s; text-align: center; }
        .menu-btn.primary { background: var(--ui-accent); }
        .menu-btn:active { transform: scale(0.95); opacity: 0.8; }

        #windowOverlay { position: fixed; inset: 0; background: #0a0a0f; z-index: 3000; display: none; flex-direction: column; }
        .win-header { padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; align-items: center; }
        #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--ui-accent); padding: 12px 30px; border-radius: 30px; display: none; z-index: 6000; font-weight: bold; }
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="toast"></div>
    <div id="loading">✨ 詩境匠心打造中...</div>

    <div class="canvas-viewport">
        <div id="captureArea" class="ratio-9-18 edit-mode">
            <div id="canvasBgLayer1" class="bg-layer" style="z-index: 1;"></div>
            <div id="canvasBgLayer2" class="bg-layer" style="z-index: 2;"></div>
            <div id="interactionShield"></div> 
            
            <!-- 文字總容器 -->
            <div id="pMasterContainer">
                <div class="draggable-zone" id="fixedHeader">
                    <div id="pTitle"></div>
                    <div class="p-meta-info" id="pMeta">
                        <span id="pAuthor"></span>
                        <span id="pDate"></span>
                    </div>
                </div>

                <div class="draggable-zone" id="pContentBlock">
                    <div class="poem-content" id="pContent"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="masterToggle" onclick="document.getElementById('toolbarSheet').classList.toggle('open')">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" /></svg>
    </button>

    <div class="toolbar-sheet" id="toolbarSheet">
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">內容</div>
            <div class="tab" onclick="switchTab(1)">排版</div>
            <div class="tab" onclick="switchTab(2)">圖層</div>
            <div class="tab" onclick="switchTab(3)">輸出</div>
        </div>

        <!-- 內容 -->
        <div class="control-panel active" id="panel-0">
            <div class="settings-grid">
                <div class="full-row"><label>詩文內容</label><textarea id="inpContent" rows="4" placeholder="在此輸入您的詩句..." oninput="syncAll()"></textarea></div>
                <div class="full-row"><label>題目標題</label><input type="text" id="inpTitle" oninput="syncAll()"></div>
                <div><label>作者姓名</label><input type="text" id="inpAuthor" value="江波" oninput="syncAll()"></div>
                <div><label>落款日期</label><input type="text" id="inpDate" oninput="syncAll()"></div>
                <div class="full-row"><button class="menu-btn" onclick="toggleVertical()">直排 &橫排</button></div>
            </div>
        </div>

        <!-- 排版 -->
        <div class="control-panel" id="panel-1">
            <div class="settings-grid">
                <div class="full-row">
                    <label>藝術字型</label>
                    <select onchange="applyStyle('fontFamily', this.value)">
                        <optgroup label="中文系列">
                            <option value="'Noto Serif TC', serif">經典宋體</option>
                            <option value="'Long Cang', cursive">流暢行書</option>
                            <option value="'Ma Shan Zheng', cursive">力動楷書</option>
                            <option value="'Liu Jian Mao Cao', cursive">狂草風格</option>
                            <option value="'ZCOOL XiaoWei', serif">藝術宋體</option>
                            <option value="'Zhi Mang Xing', cursive">芒星手寫</option>
                            <option value="'ZCOOL KuaiLe', cursive">質感黃油</option>
                        </optgroup>
                        <optgroup label="英文草寫系列">
                            <option value="'Great Vibes', cursive">Great Vibes</option>
                            <option value="'Satisfy', cursive">Satisfy Script</option>
                            <option value="'Dancing Script', cursive">Dancing Script</option>
                            <option value="'Parisienne', cursive">Parisienne</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <label>文字對齊</label>
                    <select onchange="applyStyle('textAlign', this.value)">
                        <option value="left">靠左 / 頂端</option>
                        <option value="center">置中對齊</option>
                        <option value="right">靠右 / 底端</option>
                        <option value="justify">分散對齊</option>
                    </select>
                </div>
                <div>
                    <label>畫面比例</label>
                    <select onchange="changeRatio(this.value)">
                        <option value="9-18">9:18 全螢幕</option>
                        <option value="9-16">9:16 直式</option>
                        <option value="4-5">4:5 社群</option>
                        <option value="1-1">1:1 正方</option>
                        <option value="16-9">16:9 橫式</option>
                        <option value="21-9">21:9 電影</option>
                    </select>
                </div>
                <div><label>文字顏色</label><input type="color" value="#FFFFFF" oninput="applyStyle('color', this.value)"></div>
                <div><label>文字透明度 </label><input type="range" min="0.1" max="1.0" step="0.01" value="1.0" oninput="updateTextOpacity(this.value)"></div>
            </div>
            <div class="slider-grid">
                <div><label>字體大小</label><input type="range" min="12" max="65" value="22" oninput="updateSize(this.value)"></div>
                <div><label>行距控制</label><input type="range" min="1" max="4" step="0.1" value="1.8" oninput="applyStyle('lineHeight', this.value)"></div>
                <div><label>字距間隔</label><input type="range" min="-1" max="25" step="0.5" value="1.5" oninput="updateSpacing(this.value)"></div>
                <div><label>內容邊距 (Padding)</label><input type="range" min="0" max="120" value="40" oninput="updatePadding(this.value)"></div>
            </div>
        </div>

        <!-- 圖層 -->
        <div class="control-panel" id="panel-2">
            <div class="tabs" style="margin-bottom:8px; grid-template-columns: 1fr 1fr;">
                <div class="tab active" id="lTab1" onclick="switchActiveLayer(1)">底層 (L1)</div>
                <div class="tab" id="lTab2" onclick="switchActiveLayer(2)">上層 (L2)</div>
            </div>
            <div class="settings-grid">
                <button class="sub-btn" onclick="document.getElementById('bgInput').click()">📸 載入圖片</button>
                <button class="sub-btn" onclick="randomGradient()">🎨 隨機漸層</button>
                <div class="slider-box" style="display:flex; flex-direction:column; justify-content:center;">
                    <label>圖層透明度</label>
                    <input type="range" min="0" max="1" step="0.05" value="1" id="opacSlider" oninput="updateLayerOpacity(this.value)">
                </div>
                <button class="sub-btn" style="background:#4b2c2c;" onclick="clearLayer()">🗑️ 清除圖層</button>
            </div>
            <input type="file" id="bgInput" hidden accept="image/*" onchange="handleUpload(this)">
        </div>

        <!-- 輸出 -->
        <div class="control-panel" id="panel-3">
            <div class="action-menu">
                <button class="menu-btn primary" onclick="exportWebP(2.5)">🖼️ 標準品質導出</button>
                <button class="menu-btn primary" style="background:#5c3a92;" onclick="exportWebP(4.5)">💎 超清印刷導出</button>
                <button class="menu-btn" onclick="saveToPortfolio()">💾 存入作品清單</button>
                <button class="menu-btn" onclick="openWindow('portfolio')">📂 管理作品集</button>
                <button class="menu-btn" onclick="takeSnapshot()">📸 建立快照底圖</button>
                <button class="menu-btn" onclick="openWindow('snapshot')">📷 快照底圖庫</button>
                <button class="menu-btn" onclick="exportJSON()">📤 備份 (JSON)</button>
                <button class="menu-btn" onclick="document.getElementById('importFile').click()">📥 還原 (JSON)</button>
            </div>
            <input type="file" id="importFile" hidden accept=".json" onchange="importJSON(this)">
        </div>
    </div>

    <!-- 視窗元件 -->
    <div id="windowOverlay">
        <div class="win-header">
            <button class="sub-btn" style="width:80px; padding:8px;" onclick="closeWindow()">↩ 返回</button>
            <b id="winTitle">標題</b>
            <div style="width:80px;"></div>
        </div>
        <div id="winContent" style="flex:1; overflow-y:auto; padding:20px;"></div>
    </div>

    <script>
        const area = document.getElementById('captureArea');
        const shield = document.getElementById('interactionShield');
        const pMaster = document.getElementById('pMasterContainer');
        const layers = {
            1: { el: document.getElementById('canvasBgLayer1'), x: 0, y: 0, s: 1, o: 1, bg: 'none' },
            2: { el: document.getElementById('canvasBgLayer2'), x: 0, y: 0, s: 0.6, o: 1, bg: 'none' }
        };
        
        let currentTab = 0, activeL = 1;

        window.onload = () => {
            document.getElementById('inpDate').value = new Date().toLocaleDateString('zh-TW').replace(/\//g,'.');
            syncAll();
            initDraggables();
            initLayerInteraction();
        };

        function switchTab(i) {
            currentTab = i;
            document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', i===idx));
            document.querySelectorAll('.control-panel').forEach((p, idx) => p.classList.toggle('active', i===idx));
            area.classList.toggle('edit-mode', i === 0);
            shield.classList.toggle('active', i === 2);
        }

        function switchActiveLayer(n) {
            activeL = n;
            document.getElementById('lTab1').classList.toggle('active', n===1);
            document.getElementById('lTab2').classList.toggle('active', n===2);
            document.getElementById('opacSlider').value = layers[n].o;
        }

        // --- 同步與樣式 ---
        function syncAll() {
            document.getElementById('pTitle').innerText = document.getElementById('inpTitle').value;
            document.getElementById('pAuthor').innerText = document.getElementById('inpAuthor').value;
            document.getElementById('pDate').innerText = document.getElementById('inpDate').value;
            document.getElementById('pContent').innerText = document.getElementById('inpContent').value;
        }
        function updateSize(v) { document.documentElement.style.setProperty('--base-size', v+'px'); }
        function applyStyle(p, v) { [document.getElementById('pTitle'),document.getElementById('pAuthor'),document.getElementById('pDate'),document.getElementById('pContent')].forEach(el => el.style[p] = v); }
        function updateSpacing(v) { applyStyle('letterSpacing', v+'px'); }
        function updateTextOpacity(v) { pMaster.style.opacity = v; }
        function updatePadding(v) { document.getElementById('pContentBlock').style.padding = v + 'px'; }
        function changeRatio(r) { area.className = 'ratio-' + r + (currentTab===0 ? ' edit-mode' : ''); }
        function toggleVertical() { area.classList.toggle('vertical-mode'); }

        // --- 移動引擎 ---
        function initDraggables() {
            document.querySelectorAll('.draggable-zone').forEach(el => {
                let sX, sY, iT, iL;
                el.addEventListener('touchstart', e => {
                    if (currentTab !== 0) return;
                    sX = e.touches[0].clientX; sY = e.touches[0].clientY;
                    iT = el.offsetTop; iL = el.offsetLeft;
                });
                el.addEventListener('touchmove', e => {
                    if (currentTab !== 0) return;
                    el.style.top = (iT + e.touches[0].clientY - sY) + 'px';
                    el.style.left = (iL + e.touches[0].clientX - sX) + 'px';
                    el.style.right = 'auto'; el.style.transform = 'none';
                });
            });
        }

        function initLayerInteraction() {
            let sX, sY, iX, iY, iS, iD, isAct = false;
            shield.addEventListener('touchstart', e => {
                if (currentTab !== 2) return;
                isAct = true;
                const l = layers[activeL];
                if (e.touches.length === 1) {
                    sX = e.touches[0].clientX; sY = e.touches[0].clientY;
                    iX = l.x; iY = l.y;
                } else if (e.touches.length === 2) {
                    iS = l.s;
                    iD = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
                }
            });
            shield.addEventListener('touchmove', e => {
                if (!isAct || currentTab !== 2) return;
                e.preventDefault();
                const l = layers[activeL];
                if (e.touches.length === 1) {
                    l.x = iX + (e.touches[0].clientX - sX);
                    l.y = iY + (e.touches[0].clientY - sY);
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
                    l.s = iS * (dist / iD);
                }
                updateLayerStyle(activeL);
            });
            shield.addEventListener('touchend', () => isAct = false);
        }

        function updateLayerStyle(n) {
            const l = layers[n];
            l.el.style.backgroundImage = l.bg;
            l.el.style.transform = `translate(${l.x}px, ${l.y}px) scale(${l.s})`;
            l.el.style.opacity = l.o;
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => { 
                    layers[activeL].bg = `url(${e.target.result})`; 
                    layers[activeL].x = 0; layers[activeL].y = 0; layers[activeL].s = 1; 
                    updateLayerStyle(activeL); 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function updateLayerOpacity(v) { layers[activeL].o = v; updateLayerStyle(activeL); }
        function clearLayer() { layers[activeL].bg = 'none'; updateLayerStyle(activeL); }
        function randomGradient() {
            const c1 = '#' + Math.floor(Math.random()*16777215).toString(16);
            const c2 = '#' + Math.floor(Math.random()*16777215).toString(16);
            layers[activeL].bg = `linear-gradient(${Math.random()*360}deg, ${c1}, ${c2})`;
            updateLayerStyle(activeL);
        }

        // --- 輸出功能 ---
        async function exportWebP(scale) {
            document.getElementById('toolbarSheet').classList.remove('open');
            document.getElementById('loading').style.display = 'flex';
            const prev = currentTab; switchTab(3);
            try {
                const canvas = await html2canvas(area, { scale: scale, useCORS: true });
                const link = document.createElement('a');
                link.download = (document.getElementById('inpTitle').value || '詩境') + '.webp';
                link.href = canvas.toDataURL('image/webp', 0.9); link.click();
                showToast("導出成功");
            } catch (e) { alert("導出失敗"); }
            document.getElementById('loading').style.display = 'none';
            switchTab(prev);
        }

        function saveToPortfolio() {
            let db = JSON.parse(localStorage.getItem('shijing_v10_db') || '[]');
            db.unshift({ id: Date.now(), title: document.getElementById('inpTitle').value, content: document.getElementById('inpContent').value, layers: JSON.parse(JSON.stringify(layers)), date: document.getElementById('inpDate').value });
            localStorage.setItem('shijing_v10_db', JSON.stringify(db));
            showToast("已存入作品清單");
        }

        /* 修改：快照前隱藏文字，達成純淨底圖 */
        function takeSnapshot() {
            const master = document.getElementById('pMasterContainer');
            master.style.display = 'none'; 
            html2canvas(area, { scale: 0.5 }).then(canvas => {
                let snaps = JSON.parse(localStorage.getItem('shijing_snaps_v10') || '[]');
                snaps.unshift(canvas.toDataURL('image/webp', 0.6));
                localStorage.setItem('shijing_snaps_v10', JSON.stringify(snaps));
                showToast("純淨快照已儲存");
                master.style.display = 'block';
            });
        }

        function openWindow(type) {
            const win = document.getElementById('windowOverlay');
            const cont = document.getElementById('winContent');
            win.style.display = 'flex'; cont.innerHTML = '';
            document.getElementById('winTitle').innerText = (type === 'portfolio' ? '我的作品集' : '快照底圖庫');
            if (type === 'portfolio') {
                let db = JSON.parse(localStorage.getItem('shijing_v10_db') || '[]');
                db.forEach((item, i) => {
                    let div = document.createElement('div');
                    div.className = 'sub-btn'; div.style.marginBottom = '12px'; div.style.display = 'flex'; div.style.justifyContent = 'space-between';
                    div.innerHTML = `<span>${item.title || '無題'}</span><button onclick="event.stopPropagation(); deleteItem(${i}, 'shijing_v10_db')">✕</button>`;
                    div.onclick = () => { loadProject(item); closeWindow(); };
                    cont.appendChild(div);
                });
            } else {
                let snaps = JSON.parse(localStorage.getItem('shijing_snaps_v10') || '[]');
                snaps.forEach(img => {
                    let el = document.createElement('img');
                    el.src = img; el.style.width = '30%'; el.style.margin = '1.5%'; el.style.borderRadius = '8px';
                    /* 修改：套用底圖時清空目前文字 */
                    el.onclick = () => { 
                        layers[activeL].bg = `url(${img})`; 
                        updateLayerStyle(activeL); 
                        document.getElementById('inpTitle').value = '';
                        document.getElementById('inpContent').value = '';
                        syncAll();
                        closeWindow(); 
                        showToast("已更換底圖並清空內容");
                    };
                    cont.appendChild(el);
                });
            }
        }

        function loadProject(item) {
            document.getElementById('inpTitle').value = item.title;
            document.getElementById('inpContent').value = item.content;
            Object.assign(layers[1], item.layers[1]); Object.assign(layers[2], item.layers[2]);
            updateLayerStyle(1); updateLayerStyle(2); syncAll();
        }

        function deleteItem(i, key) {
            let db = JSON.parse(localStorage.getItem(key)); db.splice(i, 1); localStorage.setItem(key, JSON.stringify(db));
            openWindow(key === 'shijing_v10_db' ? 'portfolio' : 'snapshot');
        }

        function exportJSON() {
            const data = { db: localStorage.getItem('shijing_v10_db'), snaps: localStorage.getItem('shijing_snaps_v10') };
            const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '詩境備份.json'; a.click();
        }

        function importJSON(input) {
            const reader = new FileReader();
            reader.onload = e => { const data = JSON.parse(e.target.result); localStorage.setItem('shijing_v10_db', data.db); localStorage.setItem('shijing_snaps_v10', data.snaps); showToast("還原成功"); };
            reader.readAsText(input.files[0]);
        }

        function closeWindow() { document.getElementById('windowOverlay').style.display = 'none'; }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }
    </script>
</body>
</html>
