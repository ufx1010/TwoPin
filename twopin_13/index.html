<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="詩境 ">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e152e">
    
    <title>詩境 - 隨機美學</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&family=ZCOOL+KuaiLe&family=Long+Cang&family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=Great+Vibes&family=Alex+Brush&family=Dancing+Script&family=Pinyon+Script&family=Satisfy&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #000;
            --ui-bg: rgba(30, 21, 46, 0.98);
            --ui-accent: #9d50bb;
            --ui-light: #dcd0ff;
            --poem-default-color: #FFFFFF;
            --base-size: 22px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        html, body { overscroll-behavior: none; height: 100vh; margin: 0; background: #000; color: #eee; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; width: 100vw; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        input, textarea, .poem-content { -webkit-user-select: text; user-select: text; }

        .canvas-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
        #captureArea { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: width 0.4s, height 0.4s; background: transparent; }
        
        #captureArea.ratio-9-18 { width: 100vw; height: 100vh; border-radius: 0; }
        #captureArea.ratio-9-16 { width: 88vw; height: 156.4vw; max-height: 80vh; border-radius: 6px; }
        #captureArea.ratio-16-9 { width: 95vw; height: 53.4vw; border-radius: 6px; }
        #captureArea.ratio-1-1 { width: 90vw; height: 90vw; border-radius: 6px; }
        #captureArea.ratio-4-5 { width: 82vw; height: 102.5vw; border-radius: 6px; }

        .bg-layer { 
            position: absolute; inset: 0; background: transparent; 
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            touch-action: none;
            will-change: background-position;
        }
        #canvasBgLayer1 { z-index: 1; }
        #canvasBgLayer2 { z-index: 2; }

        #brightnessOverlay { position: absolute; inset: 0; background: black; opacity: 0; z-index: 5; pointer-events: none; }

        .draggable-zone { position: absolute; z-index: 20; display: flex; touch-action: none; padding: 15px; cursor: default; color: var(--poem-default-color); }
        #fixedHeader { top: calc(var(--safe-top) + 60px); right: 25px; align-items: center; gap: 14px; }
        #pTitle { font-weight: 700; font-size: calc(var(--base-size) * 1.8); line-height: 1; white-space: nowrap; color: inherit; }
        
        .p-meta-info { 
            display: flex; flex-direction: column; gap: 4px;
            font-size: 0.65em; opacity: 0.85; border-left: 1.5px solid currentColor; 
            padding-left: 12px; line-height: 1.4; text-align: left;
        }

        #pContentBlock { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75%; }
        
        /* 詩文內容基礎設定：預設支援中文字距，並妥善處理英文單字 */
        .poem-content { 
            width: 100%; 
            font-size: var(--base-size); 
            line-height: 1.8; 
            letter-spacing: 1.2px; /* 預設中文字距 */
            word-spacing: normal; 
            white-space: pre-wrap; 
            outline: none; 
            min-height: 50px; 
            color: inherit; 
        }
        .vertical-mode .poem-content { writing-mode: vertical-rl; }

        #masterToggle {
            position: fixed; bottom: calc(var(--safe-bottom) + 20px); right: 20px; 
            width: 44px; height: 44px; background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(15px); border: none; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        #masterToggle svg { fill: white; width: 20px; }

        .toolbar-sheet {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: var(--ui-bg); backdrop-filter: blur(35px);
            padding: 15px 15px calc(var(--safe-bottom) + 15px) 15px;
            z-index: 1500; transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 25px 25px 0 0; max-height: 88vh; overflow-y: auto;
        }
        .toolbar-sheet.open { bottom: 0; }

        .tabs { display: flex; gap: 4px; margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 12px; overflow-x: auto; }
        .tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; border-radius: 9px; font-weight: bold; background: transparent; color: #888; cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--ui-accent); color: #fff; }

        .control-panel { display: none; flex-direction: column; gap: 12px; }
        .control-panel.active { display: flex; }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full-row { grid-column: span 2; }
        label { font-size: 10px; color: #777; margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        
        select, input, textarea, .sub-btn { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.12); padding: 10px; border-radius: 10px; font-size: 13px; width: 100%; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

        .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; }

        .bg-control-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .bg-control-row .sub-btn { 
            height: 48px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; 
        }
        .btn-hint { font-size: 7px; opacity: 0.6; margin-top: 2px; font-weight: normal; }

        #verticalBtn { background: rgba(255,255,255,0.08); transition: background 0.3s; }
        #verticalBtn.is-active { background: var(--ui-accent); border-color: var(--ui-light); }
        
        .layer-lock-btn { background: rgba(255,255,255,0.08); transition: background 0.3s; }
        .layer-lock-btn.is-locked { background: #b93d3d; border-color: #ff8080; }

        .action-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-btn { background: rgba(255,255,255,0.1); color: white; padding: 14px; border-radius: 12px; font-weight: bold; text-align: center; border: none; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .menu-btn.primary { background: var(--ui-accent); }
        .menu-btn.secondary { background: #2d8a6a; }
        .menu-btn.danger { background: #6b2c2c; }

        #portfolioWindow, #snapshotWindow { position: fixed; inset: 0; background: #0a0a0f; z-index: 3000; display: none; flex-direction: column; padding-top: var(--safe-top); }
        .win-header { padding: 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
        .poem-card { background: #161625; border-radius: 15px; padding: 18px; margin: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--ui-accent); }

        #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--ui-accent); padding: 12px 30px; border-radius: 30px; display: none; z-index: 6000; font-weight: bold; }
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="toast"></div>
    <div id="loading">✨ 正在捕捉藝術瞬間...</div>

    <div class="canvas-viewport">
        <div id="captureArea" class="ratio-9-18">
            <div id="canvasBgLayer1" class="bg-layer"></div>
            <div id="canvasBgLayer2" class="bg-layer"></div>
            <div id="brightnessOverlay"></div>
            
            <div class="draggable-zone" id="fixedHeader">
                <div id="pTitle"></div>
                <div class="p-meta-info" id="pMeta">
                    <span id="pAuthor">江波</span>
                    <span id="pDate">2024.05.20</span>
                </div>
            </div>

            <div class="draggable-zone" id="pContentBlock">
                <div class="poem-content" contenteditable="true" id="pContent" spellcheck="false" data-placeholder="在此輕點，開始創作..."></div>
            </div>
        </div>
    </div>

    <div id="masterToggle" onclick="document.getElementById('toolbarSheet').classList.toggle('open')">
        <svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" /></svg>
    </div>

    <div class="toolbar-sheet" id="toolbarSheet">
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">文字與落款</div>
            <div class="tab" onclick="switchTab(1)">版面設計</div>
            <div class="tab" onclick="switchTab(2)">圖層管理</div>
            <div class="tab" onclick="switchTab(3)">檔案管理</div>
        </div>

        <div class="control-panel active" id="panel-0">
            <div class="settings-grid">
                <div class="full-row">
                    <label>詩文內容文字輸入區</label>
                    <textarea id="inpContentText" placeholder="在此輸入或貼上您的詩文內容..." oninput="syncTextContent()"></textarea>
                </div>
                <div class="full-row"><label>詩題標題</label><input type="text" id="inpTitle" placeholder="標題" oninput="syncHeader()"></div>
                <div><label>作者</label><input type="text" id="inpAuthor" placeholder="作者" oninput="syncHeader()"></div>
                <div><label>日期</label><input type="text" id="inpDate" placeholder="日期" oninput="syncHeader()"></div>
            </div>
        </div>

        <div class="control-panel" id="panel-1">
            <div class="settings-grid">
                <div class="full-row"><label>藝術字型庫</label>
                    <select onchange="applyGlobalStyle('fontFamily', this.value)">
                        <optgroup label="中文藝術">
                            <option value="'Noto Serif TC', serif">經典宋體</option>
                            <option value="'Long Cang', cursive">流暢行書</option>
                            <option value="'Ma Shan Zheng', cursive">力動楷書</option>
                            <option value="'ZCOOL XiaoWei', serif">藝術宋體</option>
                            <option value="'ZCOOL QingKe HuangYou', cursive">質感黃油體</option>
                            <option value="'ZCOOL KuaiLe', cursive">快樂體</option>
                        </optgroup>
                        <optgroup label="英文浪漫">
                            <option value="'Great Vibes', cursive">Great Vibes</option>
                            <option value="'Satisfy', cursive">Satisfy</option>
                        </optgroup>
                    </select>
                </div>
                <div><label>文字顏色</label><input type="color" value="#FFFFFF" oninput="applyGlobalStyle('color', this.value)"></div>
                <div><label>內容內距</label><input type="range" min="10" max="120" value="40" oninput="updatePadding(this.value)"></div>
                <div><label>對齊方式</label>
                    <select onchange="updateAlignment(this.value)">
                        <option value="left">靠左 / 頂端</option>
                        <option value="center">置中對齊</option>
                        <option value="right">靠右 / 底端</option>
                        <option value="distributed">分散對齊</option>
                    </select>
                </div>
                <div><label>畫布比例</label>
                    <select onchange="changeRatio(this.value)">
                        <option value="9-18">9:18 全螢幕</option>
                        <option value="9-16">9:16 手機</option>
                        <option value="16:9">16:9 橫式</option>
                        <option value="1-1">1:1 正方</option>
                        <option value="4-5">4:5 肖像</option>
                    </select>
                </div>
            </div>

            <div class="slider-grid">
                <div><label>文字大小</label><input type="range" min="15" max="60" value="22" oninput="updateBaseSize(this.value)"></div>
                <div><label>背景亮度</label><input type="range" min="0" max="0.9" step="0.01" value="0" oninput="document.getElementById('brightnessOverlay').style.opacity = this.value;"></div>
                <div><label>行距控制</label><input type="range" min="1" max="4" step="0.1" value="1.8" oninput="applyGlobalStyle('lineHeight', this.value)"></div>
                <!-- 修正：同時完美支援中文全域字距與英文單字空白間距 -->
                <div><label>中文字距 / 英文單字距</label><input type="range" min="-2" max="30" value="1.2" step="0.5" oninput="updateSmartSpacing(this.value)"></div>
            </div>

            <div class="full-row"><label>版面快速控制</label>
                <div class="bg-control-row" style="grid-template-columns: repeat(2, 1fr);">
                    <button class="sub-btn" id="verticalBtn" onclick="toggleVertical()"><span>旋轉</span><span class="btn-hint" id="verticalHint">橫排</span></button>
                    <button class="sub-btn" style="background:#5d3a7c;" onclick="randomGradient()"><span>隨機漸層</span><span class="btn-hint">套用至底層</span></button>
                </div>
            </div>
        </div>

        <div class="control-panel" id="panel-2">
            <div class="tabs" style="margin-bottom: 10px;">
                <div class="tab active" id="layerTab1" onclick="switchActiveLayer(1)">底層 (Layer 1)</div>
                <div class="tab" id="layerTab2" onclick="switchActiveLayer(2)">頂層 (Layer 2)</div>
            </div>
            
            <div class="settings-grid">
                <div><label>當前操作圖層</label><input type="text" id="activeLayerLabel" value="底層 (Layer 1)" disabled style="text-align:center; font-weight:bold; color:var(--ui-light);"></div>
                <div><label>圖層透明度</label><input type="range" min="0" max="1" step="0.05" value="1" id="layerOpacityInput" oninput="updateLayerOpacity(this.value)"></div>
            </div>

            <div class="bg-control-row">
                <button class="sub-btn" id="layerLockBtn" onclick="toggleLayerLock()"><span>鎖定</span><span class="btn-hint" id="layerLockHint">未鎖定</span></button>
                <button class="sub-btn" onclick="triggerLayerUpload()"><span>相片</span><span class="btn-hint">載入圖片</span></button>
                <button class="sub-btn" style="background:#6b2c2c;" onclick="removeLayerBg()"><span>清除</span><span class="btn-hint">清除此層</span></button>
                <button class="sub-btn" style="background:#d35400;" onclick="undoBackground()"><span>復原</span><span class="btn-hint">上一步</span></button>
            </div>
            <input type="file" id="bgInput" hidden accept="image/*" onchange="uploadLayerBackground(this)">
            <div class="full-row" style="font-size:9px; color:var(--ui-accent); text-align:center; margin-top:5px;">💡 提示：在此可分別對「底層」或「頂層」上傳相片圖片、調整透明度、解鎖縮放或移動！</div>
        </div>

        <div class="control-panel" id="panel-3">
            <div class="action-menu">
                <button class="menu-btn primary" onclick="openPortfolioWindow()">📂 作品清單<span class="btn-hint">舊資料須重新載入</span></button>
                <button class="menu-btn secondary" onclick="saveToPortfolio()">💾 暫存網頁<span class="btn-hint">須下載才不會遺失</span></button>
                
                <button class="menu-btn" style="background:var(--ui-accent);" onclick="openResModal()">🖼️ 匯出圖片<span class="btn-hint">高品質 PNG</span></button>
                <button class="menu-btn danger" onclick="if(confirm('確定要重新開始並清除目前內容嗎？')) location.reload()">✨ 重新開始<span class="btn-hint">重置版面</span></button>
                
                <button class="menu-btn" style="background:#d35400;" onclick="takeSnapshot()">📸 建立快照<span class="btn-hint">轉為固定底圖庫</span></button>
                <button class="menu-btn" style="background:#34495e;" onclick="openSnapshotWindow()">📷 檢視快照<span class="btn-hint">載入快照底圖</span></button>
                
                <button class="menu-btn" style="background:#4b3a63;" onclick="exportJSON()">📤 備份資料<span class="btn-hint">匯出 JSON</span></button>
                <button class="menu-btn" style="background:#2d8a6a;" onclick="document.getElementById('importFile').click()">📥 匯入檔案<span class="btn-hint">讀取 JSON</span></button>
            </div>
            <input type="file" id="importFile" hidden accept=".json" onchange="importJSON(this)">
        </div>
    </div>

    <div id="portfolioWindow">
        <div class="win-header">
            <button onclick="closePortfolioWindow()" style="background:none; border:none; color:var(--ui-accent); font-weight:bold;">↩️返回</button>
            <div style="font-weight:bold;">作品清單</div>
            <div style="width:40px;"></div>
        </div>
        <div class="win-body" id="poemWinList"></div>
        <div class="win-footer" style="padding:15px; display:flex; justify-content:space-between; align-items:center;">
            <button class="sub-btn" style="width:100px" id="prevPage" onclick="changePage(-1)">上一頁</button>
            <span id="pageInfo" style="color:#aaa; font-size:14px;">1 / 1</span>
            <button class="sub-btn" style="width:100px" id="nextPage" onclick="changePage(1)">下一頁</button>
        </div>
    </div>

    <div id="snapshotWindow">
        <div class="win-header">
            <button onclick="closeSnapshotWindow()" style="background:none; border:none; color:var(--ui-accent); font-weight:bold;">↩️返回</button>
            <div style="font-weight:bold;">快照底圖庫</div>
            <div style="width:40px;"></div>
        </div>
        <div class="win-body" id="snapshotWinList" style="flex:1; overflow-y:auto; padding:10px;"></div>
    </div>

    <div class="modal-overlay" id="resModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:4000; display:none; align-items:center; justify-content:center;">
        <div style="background:#1e152e; width:85%; max-width:320px; padding:20px; border-radius:15px; border:1px solid var(--ui-accent);">
            <h3 style="margin:0 0 15px 0; font-size:16px; color:var(--ui-accent); text-align:center;">影像品質</h3>
            <button class="menu-btn" style="width:100%; margin-bottom:10px; background:var(--ui-accent); color:white; border:none; padding:12px; border-radius:10px;" onclick="processExport(2.5)">高清匯出 (標準 2.5x)</button>
            <button class="menu-btn" style="width:100%; margin-bottom:10px; background:var(--ui-accent); color:white; border:none; padding:12px; border-radius:10px;" onclick="processExport(4.5)">印刷級別 (極致 4.5x)</button>
            <button onclick="closeResModal()" style="width:100%; background:none; border:none; color:#777; margin-top:5px;">取消</button>
        </div>
    </div>

    <script>
        const area = document.getElementById('captureArea');
        const layer1 = document.getElementById('canvasBgLayer1');
        const layer2 = document.getElementById('canvasBgLayer2');
        const brightnessOverlay = document.getElementById('brightnessOverlay');
        const headerGrp = document.getElementById('fixedHeader');
        const contentGrp = document.getElementById('pContentBlock');
        const pT = document.getElementById('pTitle'), pA = document.getElementById('pAuthor'), pD = document.getElementById('pDate'), pC = document.getElementById('pContent');
        const inT = document.getElementById('inpTitle'), inA = document.getElementById('inpAuthor'), inD = document.getElementById('inpDate');
        const inpContentText = document.getElementById('inpContentText');
        const verticalBtn = document.getElementById('verticalBtn');
        const verticalHint = document.getElementById('verticalHint');
        const layerLockBtn = document.getElementById('layerLockBtn');
        const layerLockHint = document.getElementById('layerLockHint');
        const activeLayerLabel = document.getElementById('activeLayerLabel');
        const layerOpacityInput = document.getElementById('layerOpacityInput');

        let curPage = 1;
        const itemsPerPage = 10;
        
        let bgHistory = [];
        const maxHistorySteps = 10;

        let currentActiveLayerNum = 1; 
        const layers = {
            1: {
                el: layer1,
                posX: 50, posY: 50, scale: 100,
                isLocked: false,
                isSnapshot: false,
                opacity: 1.0,
                bgImage: 'none',
                bgColor: 'transparent'
            },
            2: {
                el: layer2,
                posX: 50, posY: 50, scale: 100,
                isLocked: false,
                isSnapshot: false,
                opacity: 1.0,
                bgImage: 'none',
                bgColor: 'transparent'
            }
        };

        function pushHistory() {
            const currentState = {
                l1: { ...layers[1] },
                l2: { ...layers[2] }
            };
            bgHistory.push(currentState);
            if (bgHistory.length > maxHistorySteps) bgHistory.shift();
        }

        function undoBackground() {
            if (bgHistory.length === 0) {
                showToast("已經是最初的狀態囉");
                return;
            }
            const previousState = bgHistory.pop();
            layers[1] = { ...previousState.l1, el: layer1 };
            layers[2] = { ...previousState.l2, el: layer2 };
            
            applyLayerState(1);
            applyLayerState(2);
            updateLayerUI();
            showToast("已退回上一步");
        }

        function applyLayerState(num) {
            const l = layers[num];
            l.el.style.backgroundImage = l.bgImage;
            l.el.style.backgroundColor = l.bgColor;
            l.el.style.backgroundPosition = `${l.posX}% ${l.posY}%`;
            l.el.style.backgroundSize = `${l.scale}%`;
            l.el.style.opacity = l.opacity;
        }

        window.onload = () => {
            inD.value = new Date().toLocaleDateString('zh-TW').replace(/\//g, '.');
            inA.value = '江波'; inT.value = '';
            syncHeader();
            applyGlobalStyle('color', '#FFFFFF');
            
            initSingleTouchMove(headerGrp);
            initSingleTouchMove(contentGrp);

            initLayerTouchInteraction(layer1, 1);
            initLayerTouchInteraction(layer2, 2);
            pushHistory();
            updateVerticalUI();
            updateLayerUI();

            pC.addEventListener('input', () => {
                inpContentText.value = pC.innerText;
            });
        };

        function syncTextContent() {
            pC.innerText = inpContentText.value;
        }

        function switchActiveLayer(num) {
            currentActiveLayerNum = num;
            document.getElementById('layerTab1').classList.toggle('active', num === 1);
            document.getElementById('layerTab2').classList.toggle('active', num === 2);
            activeLayerLabel.value = num === 1 ? '底層 (Layer 1)' : '頂層 (Layer 2)';
            updateLayerUI();
        }

        function updateLayerUI() {
            const l = layers[currentActiveLayerNum];
            layerOpacityInput.value = l.opacity;
            if (l.isLocked || l.isSnapshot) {
                layerLockBtn.classList.add('is-locked');
                layerLockHint.innerText = l.isSnapshot ? '快照固定' : '已鎖定';
            } else {
                layerLockBtn.classList.remove('is-locked');
                layerLockHint.innerText = '未鎖定';
            }
        }

        function updateLayerOpacity(val) {
            pushHistory();
            const l = layers[currentActiveLayerNum];
            l.opacity = parseFloat(val);
            l.el.style.opacity = l.opacity;
        }

        function toggleLayerLock() {
            const l = layers[currentActiveLayerNum];
            if (l.isSnapshot) {
                showToast("快照底圖為永久固定狀態");
                return;
            }
            l.isLocked = !l.isLocked;
            updateLayerUI();
            if (l.isLocked) {
                showToast(`${currentActiveLayerNum === 1 ? '底層' : '頂層'}已鎖定`);
            } else {
                showToast(`${currentActiveLayerNum === 1 ? '底層' : '頂層'}已解鎖`);
            }
        }

        function triggerLayerUpload() {
            document.getElementById('bgInput').click();
        }

        function randomGradient() {
            pushHistory();
            const l = layers[1]; 
            l.isSnapshot = false;
            const colors = [
                ['#FF0844', '#FFB199'], ['#F857A6', '#FF5858'], ['#7F00FF', '#E100FF'],
                ['#00C9FF', '#92FE9D'], ['#134E5E', '#F39C12'], ['#2C3E50', '#F1C40F'],
                ['#8E44AD', '#3498DB'], ['#D35400', '#2980B9'], ['#FF4E50', '#F9D423'],
                ['#000428', '#004e92', '#FDC830'], ['#1D2B64', '#F8CDDA'], ['#4CA1AF', '#C4E0E5']
            ];
            const pair = colors[Math.floor(Math.random() * colors.length)];
            const randomAngle = Math.floor(Math.random() * 360);
            
            if (pair.length === 3) {
                l.bgImage = `linear-gradient(${randomAngle}deg, ${pair[0]} 0%, ${pair[1]} 50%, ${pair[2]} 100%)`;
            } else {
                l.bgImage = `linear-gradient(${randomAngle}deg, ${pair[0]} 0%, ${pair[1]} 100%)`;
            }
            l.bgColor = 'transparent';
            l.scale = 100;
            l.posX = 50; l.posY = 50;
            applyLayerState(1);
            showToast("已在底層套用隨機漸層");
        }

        function initSingleTouchMove(el) {
            let startX = 0, startY = 0;
            let startTop = 0, startLeft = 0;
            let isMoving = false;

            el.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    isMoving = true;
                    startX = t.clientX;
                    startY = t.clientY;
                    startTop = el.offsetTop;
                    startLeft = el.offsetLeft;
                    el.style.transform = 'none';
                    el.style.transition = 'none';
                }
            }, { passive: true });

            el.addEventListener('touchmove', (e) => {
                if (!isMoving || e.touches.length !== 1) return;
                const t = e.touches[0];
                const currentX = t.clientX;
                const currentY = t.clientY;

                let newTop = startTop + (currentY - startY);
                let newLeft = startLeft + (currentX - startX);

                const areaRect = area.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                
                const minTop = -elRect.height + 40;
                const maxTop = areaRect.height - 40;
                const minLeft = -elRect.width + 40;
                const maxLeft = areaRect.width - 40;

                if (newTop < minTop) newTop = minTop;
                if (newTop > maxTop) newTop = maxTop;
                if (newLeft < minLeft) newLeft = minLeft;
                if (newLeft > maxLeft) newLeft = maxLeft;

                el.style.top = newTop + "px";
                el.style.left = newLeft + "px";
                el.style.right = 'auto';
            }, { passive: true });

            el.addEventListener('touchend', () => { isMoving = false; });
            el.addEventListener('touchcancel', () => { isMoving = false; });
        }

        function initLayerTouchInteraction(el, layerNum) {
            let startX = 0, startY = 0;
            let initialPosX = 50, initialPosY = 50;
            let initialDist = 0;
            let initialScale = 100;
            let isTouchingImage = false;
            const sensitivity = 2.2;
            let rafId = null;

            el.addEventListener('touchstart', (e) => {
                const l = layers[layerNum];
                if (l.isSnapshot || l.isLocked) return;
                
                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    isTouchingImage = true;
                    startX = t.clientX;
                    startY = t.clientY;
                    initialPosX = l.posX;
                    initialPosY = l.posY;
                } else if (e.touches.length === 2) {
                    const t1 = e.touches[0], t2 = e.touches[1];
                    isTouchingImage = true;
                    initialDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                    initialScale = l.scale;
                }
            }, { passive: false });

            el.addEventListener('touchmove', (e) => {
                const l = layers[layerNum];
                if (l.isSnapshot || l.isLocked || !isTouchingImage) return;
                
                if (e.touches.length === 1) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;
                    
                    l.posX = initialPosX + (dx / area.clientWidth) * 100 * sensitivity;
                    l.posY = initialPosY + (dy / area.clientHeight) * 100 * sensitivity;
                    
                    if (!rafId) {
                        rafId = requestAnimationFrame(() => {
                            el.style.backgroundPosition = `${l.posX}% ${l.posY}%`;
                            rafId = null;
                        });
                    }
                } else if (e.touches.length === 2 && isTouchingImage) {
                    e.preventDefault();
                    const t1 = e.touches[0], t2 = e.touches[1];
                    const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                    if (initialDist > 0) {
                        const scaleFactor = currentDist / initialDist;
                        l.scale = Math.max(20, Math.min(400, initialScale * scaleFactor));
                        if (!rafId) {
                            rafId = requestAnimationFrame(() => {
                                el.style.backgroundSize = `${l.scale}%`;
                                rafId = null;
                            });
                        }
                    }
                }
            }, { passive: false });

            el.addEventListener('touchend', () => { isTouchingImage = false; });
            el.addEventListener('touchcancel', () => { isTouchingImage = false; });
        }

        function syncHeader() { 
            pT.innerText = inT.value; pA.innerText = inA.value; pD.innerText = inD.value; 
        }

        function updateBaseSize(v) { document.documentElement.style.setProperty('--base-size', v + 'px'); }
        function applyGlobalStyle(p, v) { [pT, pA, pD, pC, headerGrp, contentGrp].forEach(el => { if(el) el.style[p] = v; }); }
        function updatePadding(v) { contentGrp.style.padding = `${v}px`; }
        function updateAlignment(v) { 
            if (v === 'distributed') { pC.style.textAlign = 'justify'; pC.style.textAlignLast = 'justify'; }
            else { pC.style.textAlign = v; pC.style.textAlignLast = 'auto'; }
        }

        // 關鍵修正：智慧型調整字距
        // 滑桿數值會同時控制中文字的 letter-spacing（讓中文可以自由拉開間距），
        // 同時微幅控制英文的 word-spacing，但限制英文單字內部的字母不被拉長變形。
        function updateSmartSpacing(val) {
            const letterVal = val + 'px'; // 中文字距跟隨滑桿數值
            const wordVal = (val * 1.5) + 'px'; // 英文單字空白間距依比例微調

            [pT, pA, pD, pC, headerGrp, contentGrp].forEach(el => { 
                if(el) {
                    el.style.letterSpacing = letterVal;
                    el.style.wordSpacing = wordVal;
                }
            });
        }

        function updateVerticalUI() {
            const isVert = area.classList.contains('vertical-mode');
            if (isVert) {
                verticalBtn.classList.add('is-active');
                verticalHint.innerText = '直排中';
            } else {
                verticalBtn.classList.remove('is-active');
                verticalHint.innerText = '橫排';
            }
        }

        function toggleVertical() { 
            area.classList.toggle('vertical-mode'); 
            updateVerticalUI();
        }

        function changeRatio(r) {
            area.className = ''; area.classList.add('ratio-' + r);
            if (verticalBtn.classList.contains('is-active')) {
                area.classList.add('vertical-mode');
            }
            headerGrp.style.top = '120px'; headerGrp.style.left = 'auto'; headerGrp.style.right = '30px';
            contentGrp.style.top = '50%'; contentGrp.style.left = '50%'; contentGrp.style.transform = 'translate(-50%, -50%)';
        }

        function uploadLayerBackground(i) {
            if (i.files && i.files[0]) {
                pushHistory();
                const r = new FileReader();
                r.onload = e => { 
                    const l = layers[currentActiveLayerNum];
                    l.bgImage = `url(${e.target.result})`;
                    l.bgColor = 'transparent';
                    l.scale = 100;
                    l.posX = 50; l.posY = 50;
                    l.isSnapshot = false;
                    l.isLocked = false;
                    applyLayerState(currentActiveLayerNum);
                    updateLayerUI();
                    showToast(`已載入圖片至${currentActiveLayerNum === 1 ? '底層' : '頂層'}`);
                };
                r.readAsDataURL(i.files[0]);
            }
        }

        function removeLayerBg() { 
            pushHistory();
            const l = layers[currentActiveLayerNum];
            l.bgImage = 'none';
            l.bgColor = 'transparent';
            l.scale = 100;
            l.posX = 50; l.posY = 50;
            l.isSnapshot = false;
            l.isLocked = false;
            applyLayerState(currentActiveLayerNum);
            updateLayerUI();
            showToast(`已清除${currentActiveLayerNum === 1 ? '底層' : '頂層'}背景`);
        }

        function saveToPortfolio() {
            let db = JSON.parse(localStorage.getItem('my_poetry_v23') || '[]');
            const poemData = {
                id: Date.now(), title: inT.value, author: inA.value, date: inD.value, content: pC.innerText,
                layersState: layers,
                style: {
                    isVert: area.classList.contains('vertical-mode'),
                    ratio: Array.from(area.classList).find(c => c.startsWith('ratio-')),
                    brightness: brightnessOverlay.style.opacity, font: pT.style.fontFamily,
                    color: headerGrp.style.color, align: pC.style.textAlign, padding: contentGrp.style.padding,
                    size: document.documentElement.style.getPropertyValue('--base-size'),
                    ls: pT.style.letterSpacing, ws: pT.style.wordSpacing, lh: pC.style.lineHeight,
                    hTop: headerGrp.style.top, hLeft: headerGrp.style.left,
                    cTop: contentGrp.style.top, cLeft: contentGrp.style.left
                }
            };
            db.unshift(poemData);
            localStorage.setItem('my_poetry_v23', JSON.stringify(db));
            showToast('已保存作品');
        }

        function compressImage(dataUrl, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = dataUrl;
            });
        }

        async function takeSnapshot() {
            document.getElementById('toolbarSheet').classList.remove('open');
            document.getElementById('loading').style.display = 'flex';
            try {
                await document.fonts.ready;
            } catch (e) {
                console.warn("字型載入等待超時");
            }
            try {
                document.getElementById('masterToggle').style.opacity = '0';
                const canvas = await html2canvas(area, { scale: 1.5, useCORS: true, backgroundColor: null });
                const rawDataUrl = canvas.toDataURL('image/png');
                
                const compressedDataUrl = await compressImage(rawDataUrl, 800, 0.75);

                document.getElementById('masterToggle').style.opacity = '1';

                let snapshots = JSON.parse(localStorage.getItem('my_poetry_snapshots_v1') || '[]');
                const snapData = {
                    id: Date.now(),
                    title: inT.value || '未命名快照',
                    image: compressedDataUrl
                };
                snapshots.unshift(snapData);
                
                try {
                    localStorage.setItem('my_poetry_snapshots_v1', JSON.stringify(snapshots));
                } catch (e) {
                    if (snapshots.length > 1) {
                        snapshots.pop();
                        localStorage.setItem('my_poetry_snapshots_v1', JSON.stringify(snapshots));
                    } else {
                        throw e;
                    }
                }
                
                clearAllContentAndLoadSnapshot(compressedDataUrl);

                showToast('📸 快照已建立，並已載入至底層！');
            } catch (err) {
                console.error("快照建立失敗：", err);
                alert('建立快照失敗！空間可能已滿或瀏覽器不支援。\n' + (err.message || err));
                document.getElementById('masterToggle').style.opacity = '1';
            }
            document.getElementById('loading').style.display = 'none';
        }

        function clearAllContentAndLoadSnapshot(imgDataUrl) {
            inT.value = '';
            pC.innerText = '';
            inpContentText.value = '';
            syncHeader();

            layers[1] = {
                el: layer1,
                posX: 50, posY: 50, scale: 100,
                isLocked: true,
                isSnapshot: true,
                opacity: 1.0,
                bgImage: `url(${imgDataUrl})`,
                bgColor: 'transparent'
            };
            layers[2] = {
                el: layer2,
                posX: 50, posY: 50, scale: 100,
                isLocked: false,
                isSnapshot: false,
                opacity: 1.0,
                bgImage: 'none',
                bgColor: 'transparent'
            };

            applyLayerState(1);
            applyLayerState(2);
            updateLayerUI();
            bgHistory = [];
            pushHistory();
        }

        function openSnapshotWindow() {
            renderSnapshots();
            document.getElementById('snapshotWindow').style.display = 'flex';
        }

        function closeSnapshotWindow() {
            document.getElementById('snapshotWindow').style.display = 'none';
        }

        function renderSnapshots() {
            const data = JSON.parse(localStorage.getItem('my_poetry_snapshots_v1') || '[]');
            const list = document.getElementById('snapshotWinList');
            list.innerHTML = data.length ? '' : '<div style="text-align:center; color:#555; padding-top:100px;">目前尚無快照底圖</div>';
            
            data.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                card.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px; flex:1; cursor:pointer;" onclick='loadSnapshotAsLayer("${p.image}")'>
                        <img src="${p.image}" style="width:40px; height:60px; object-fit:cover; border-radius:4px; border:1px solid #444;">
                        <div><strong>${p.title||'無題快照'}</strong><br><small style="color:#aaa;">點擊載入至當前選取圖層</small></div>
                    </div>
                    <button onclick="deleteSnapshot(event, ${idx})" style="background:none; border:none; color:#ff4d4d; font-size:18px;">✕</button>`;
                list.appendChild(card);
            });
        }

        function loadSnapshotAsLayer(imgDataUrl) {
            pushHistory();
            const l = layers[currentActiveLayerNum];
            l.bgImage = `url(${imgDataUrl})`;
            l.bgColor = 'transparent';
            l.scale = 100;
            l.posX = 50; l.posY = 50;
            l.isSnapshot = true;
            l.isLocked = true;
            applyLayerState(currentActiveLayerNum);
            updateLayerUI();

            closeSnapshotWindow();
            showToast(`✨ 已載入快照至${currentActiveLayerNum === 1 ? '底層' : '頂層'}（固定狀態）！`);
        }

        function deleteSnapshot(e, idx) {
            e.stopPropagation();
            if(confirm('確定要刪除此快照底圖嗎？')) {
                let data = JSON.parse(localStorage.getItem('my_poetry_snapshots_v1') || '[]');
                data.splice(idx, 1);
                localStorage.setItem('my_poetry_snapshots_v1', JSON.stringify(data));
                renderSnapshots();
                showToast('已刪除快照');
            }
        }

        function renderPortfolio() {
            const data = JSON.parse(localStorage.getItem('my_poetry_v23') || '[]');
            const list = document.getElementById('poemWinList');
            const totalPages = Math.ceil(data.length / itemsPerPage) || 1;
            list.innerHTML = data.length ? '' : '<div style="text-align:center; color:#555; padding-top:100px;">館內目前沒有作品</div>';
            const start = (curPage - 1) * itemsPerPage;
            data.slice(start, start + itemsPerPage).forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                card.innerHTML = `<div onclick='loadPoem(${JSON.stringify(p).replace(/'/g, "&apos;")})'><strong>${p.title||'無題'}</strong><br><small>${p.date}</small></div>
                <button onclick="deletePoem(event, ${start + idx})" style="background:none; border:none; color:#ff4d4d; font-size:18px;">✕</button>`;
                list.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `${curPage} / ${totalPages}`;
            document.getElementById('prevPage').disabled = curPage === 1;
            document.getElementById('nextPage').disabled = curPage === totalPages;
        }

        function loadPoem(p) {
            inT.value = p.title; inA.value = p.author; inD.value = p.date; 
            pC.innerText = p.content; 
            inpContentText.value = p.content;
            syncHeader();
            
            if (p.layersState) {
                layers[1] = { ...p.layersState[1], el: layer1 };
                layers[2] = { ...p.layersState[2], el: layer2 };
                applyLayerState(1);
                applyLayerState(2);
            }

            const s = p.style || {};
            area.classList.toggle('vertical-mode', !!s.isVert);
            updateVerticalUI();

            changeRatio(s.ratio ? s.ratio.replace('ratio-', '') : '9-18');
            brightnessOverlay.style.opacity = s.brightness;
            updateBaseSize(parseInt(s.size)); applyGlobalStyle('fontFamily', s.font); applyGlobalStyle('color', s.color);
            applyGlobalStyle('letterSpacing', s.ls); 
            if(s.ws) applyGlobalStyle('wordSpacing', s.ws);
            applyGlobalStyle('lineHeight', s.lh);
            headerGrp.style.top = s.hTop; headerGrp.style.left = s.hLeft;
            contentGrp.style.top = s.cTop; contentGrp.style.left = s.cLeft; contentGrp.style.transform = 'none';
            contentGrp.style.padding = s.padding; 
            
            updateLayerUI();
            closePortfolioWindow();
        }

        async function processExport(s) {
            closeResModal(); document.getElementById('toolbarSheet').classList.remove('open');
            document.getElementById('loading').style.display = 'flex';
            await document.fonts.ready;
            try {
                document.getElementById('masterToggle').style.opacity = '0';
                const canvas = await html2canvas(area, { scale: s, useCORS: true, backgroundColor: null });
                const l = document.createElement('a'); l.href = canvas.toDataURL('image/png', 1.0);
                
                const exportName = inT.value.trim() || '作品';
                l.download = `${exportName}.png`; 
                
                l.click();
                document.getElementById('masterToggle').style.opacity = '1';
                showToast("導出高品質影像完成");
            } catch (err) { alert("導出錯誤"); }
            document.getElementById('loading').style.display = 'none';
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === idx);
            });
            document.querySelectorAll('.control-panel').forEach((p, i) => {
                p.classList.toggle('active', i === idx);
            });
        }
        function changePage(s) { curPage += s; renderPortfolio(); }
        function deletePoem(e, idx) { e.stopPropagation(); if(confirm('刪除作品？')) { let db = JSON.parse(localStorage.getItem('my_poetry_v23')); db.splice(idx, 1); localStorage.setItem('my_poetry_v23', JSON.stringify(db)); renderPortfolio(); } }
        function openPortfolioWindow() { curPage = 1; renderPortfolio(); document.getElementById('portfolioWindow').style.display = 'flex'; }
        function closePortfolioWindow() { document.getElementById('portfolioWindow').style.display = 'none'; }
        function openResModal() { document.getElementById('resModal').style.display = 'flex'; }
        function closeResModal() { document.getElementById('resModal').style.display = 'none'; }
        
        function exportJSON() { 
            const b = new Blob([localStorage.getItem('my_poetry_v23')], {type: 'application/json'}); 
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(b); 
            const backupName = inT.value.trim() || '作品';
            a.download = `${backupName}備份.json`; 
            a.click(); 
        }

        function importJSON(i) { 
            const f = i.files[0]; if(!f) return; 
            const r = new FileReader(); 
            r.onload = e => { 
                localStorage.setItem('my_poetry_v23', e.target.result); 
                curPage = 1; renderPortfolio(); showToast('還原成功'); 
            }; 
            r.readAsText(f); 
        }

        function showToast(m) { 
            const t = document.getElementById('toast'); 
            t.innerText = m; t.style.display = 'block'; 
            setTimeout(() => t.style.display = 'none', 2000); 
        }
    </script>
