<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文打字練習</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .container {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 5px 0 10px 0;
            color: #333;
            font-size: 20px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        .grid-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px 6px;
            min-height: 70px;
        }
        .grid-item label {
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .grid-item select {
            width: 100%;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 13px;
            background-color: #fff;
            color: #333;
            cursor: pointer;
        }

        button {
            padding: 6px 12px;
            font-size: 13px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        button:hover { background-color: #0056b3; }
        button.secondary { background-color: #6c757d; }
        button.secondary:hover { background-color: #5a6268; }
        button.success { background-color: #28a745; }
        button.success:hover { background-color: #218838; }
        button.danger { background-color: #dc3545; }
        button.danger:hover { background-color: #c82333; }
        button.mute-btn { background-color: #28a745; }
        button.mute-btn.muted { background-color: #dc3545; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            text-align: left;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 18px;
            color: #333;
        }

        .batch-textarea {
            width: 100%;
            height: 280px;
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        .batch-tip {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            line-height: 1.5;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #007bff;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 10px;
        }
        .modal-buttons-right {
            display: flex;
            gap: 10px;
        }

        #importFile { display: none; }

        .comparison-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 5px 0;
            text-align: left;
        }
        .compare-row {
            background: #ffffff;
            border: 1px solid #007bff;
            padding: 15px;
            border-radius: 8px;
            position: relative;
        }
        .compare-en {
            font-size: 20px;
            font-family: Arial, sans-serif;
            margin-bottom: 5px;
            word-break: normal;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
            padding-right: 10px;
        }

        .word-item {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 4px;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .word-item.active-word {
            background-color: #cbd5e1;
        }

        #info-panel {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .info-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }
        .info-group {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .info-group:hover { background: #d0e1fd; }
        #translation-display {
            font-size: 22px;
            font-weight: bold;
            color: #007bff;
        }
        #ipa-display {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #b45309;
            font-weight: bold;
            background: #fffbeb;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid #fde68a;
        }
        #phonetic-display {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #d97706;
            font-weight: bold;
            background: #fffbeb;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid #fde68a;
        }

        .correct-char { color: #28a745 !important; }
        .incorrect-char { color: #dc3545 !important; background-color: #ffe6e6; }

        .fake-display-box {
            position: relative;
            width: 100%;
            min-height: 50px;
            border: 1px solid #007bff;
            border-radius: 6px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
            padding: 8px 12px;
            cursor: text;
            outline: none;
            font-size: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #000;
            word-break: break-all;
        }
        .fake-display-box:empty:before {
            content: attr(data-placeholder);
            color: #aaa;
            font-weight: normal;
            font-size: 16px;
        }

        #stats {
            margin-top: 5px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>中文輸入練習</h1>
    
    <div class="grid-menu">
        <div class="grid-item">
            <button onclick="openModal()">修改文章</button>
        </div>
        <div class="grid-item">
            <button class="success" onclick="exportArticle()">匯出文章</button>
        </div>
        <div class="grid-item">
            <button class="secondary" onclick="triggerImport()">匯入文章</button>
            <input type="file" id="importFile" accept=".txt,.json" onchange="importArticle(event)">
        </div>
        <div class="grid-item">
            <button class="secondary" onclick="restartPractice()">重新開始</button>
        </div>
        <div class="grid-item">
            <button id="muteBtn" class="mute-btn" onclick="toggleMute()">聲音: 開啟 🔊</button>
        </div>
        <div class="grid-item" style="justify-content: space-between;">
            <label>語速選擇</label>
            <select id="speedSelect" onchange="updateSpeed()">
                <option value="0.3">0.3x (極慢)</option>
                <option value="0.5">0.5x (慢)</option>
                <option value="0.8">0.8x (稍慢)</option>
                <option value="1.0" selected>1.0x (標準)</option>
                <option value="1.3">1.3x (快)</option>
                <option value="1.6">1.6x (超快)</option>
                <option value="2.0">2.0x (極速)</option>
                <option value="2.5">2.5x (飛快)</option>
                <option value="3.0">3.0x (極限)</option>
            </select>
        </div>
    </div>

    <div id="comparison-display" class="comparison-container"></div>

    <div id="info-panel">
        <div class="info-row">
            <div class="info-group" onclick="speakCurrentSentence()" title="點擊整句發音">
                英文: <span id="translation-display">(無)</span> 🔊
            </div>
            <div class="info-group" title="國際音標">
                國際音標: <span id="phonetic-display">/---/</span>
            </div>
        </div>
        <div class="info-row">
            <div class="info-group" title="漢語拼音">
                漢語拼音: <span id="ipa-display">---</span>
            </div>
        </div>
    </div>

    <div id="hiddenInput" class="fake-display-box" contenteditable="true" data-placeholder="請點擊此處並切換中文輸入法開始打字" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>

    <div id="stats">進度: <span id="progress">0 / 0</span> | 正確單字數: <span id="score">0</span></div>
</div>

<div id="articleModal" class="modal-overlay">
    <div class="modal-content">
        <h3>編輯中文練習文章</h3>
        <div style="font-size: 13px; color: #666; margin-bottom: 8px;">請輸入「英文單字 | 中文對應」（每行一句）：</div>
        <textarea id="batchTextarea" class="batch-textarea" placeholder="apple banana computer developer window success nation | 蘋果 香蕉 電腦 開發人員 視窗 成功 國家&#10;welcome learning practice bedroom sunflower | 歡迎 學習 練習 臥室 向日葵"></textarea>
        <div class="batch-tip">
            <b>操作提示：</b>
            <br>畫面上方顯示框全部顯示中文，請切換至中文輸入法打出對應中文，正確輸入後會發出對應的英文讀音。
        </div>

        <div class="modal-buttons">
            <button class="danger" onclick="clearModalText()" style="width: auto;">刪除全部</button>
            <div class="modal-buttons-right">
                <button class="secondary" onclick="closeModal()" style="width: auto;">取消</button>
                <button onclick="confirmCustomArticle()" style="width: auto;">確定套用</button>
            </div>
        </div>
    </div>
</div>

<script>
    let linesList = [];
    let totalWordsCount = 0;
    let currentLineIndex = 0;
    let currentWordIndexInLine = 0;
    let score = 0;
    let rawArticleText = "apple banana computer developer window success nation | 蘋果 香蕉 電腦 開發人員 視窗 成功 國家\nwelcome learning practice bedroom sunflower | 歡迎 學習 練習 臥室 向日葵";
    
    let currentTypedText = "";
    let isMuted = false;
    let currentSpeed = 1.0;
    let audioCtx = null;
    let isInputLocked = false;

    function toggleMute() {
        isMuted = !isMuted;
        const muteBtn = document.getElementById('muteBtn');
        if (isMuted) {
            muteBtn.textContent = "聲音: 靜音 🔇";
            muteBtn.className = "mute-btn muted";
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } else {
            muteBtn.textContent = "聲音: 開啟 🔊";
            muteBtn.className = "mute-btn";
        }
    }

    function updateSpeed() {
        currentSpeed = parseFloat(document.getElementById('speedSelect').value);
    }

    function openModal() {
        let textContent = linesList.map(line => {
            let enStr = line.words.map(w => w.clean).join(' ');
            let transStr = line.customFullTranslation || line.wordTranslations.join(' ');
            return `${enStr} | ${transStr}`;
        }).join('\n');

        document.getElementById('batchTextarea').value = textContent;
        document.getElementById('articleModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('articleModal').style.display = 'none';
    }

    function clearModalText() {
        if (confirm('確定要清空所有內容嗎？')) {
            document.getElementById('batchTextarea').value = '';
        }
    }

    async function confirmCustomArticle() {
        const text = document.getElementById('batchTextarea').value.trim();
        if (!text) {
            alert('請輸入有效的內容！');
            return;
        }
        closeModal();
        await loadCustomArticle(text);
    }

    function exportArticle() {
        let content = linesList.map(line => {
            let enStr = line.words.map(w => w.clean).join(' ');
            let transStr = line.customFullTranslation || line.wordTranslations.join(' ');
            return `${enStr} | ${transStr}`;
        }).join('\n');
        
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'chinese_practice.txt';
        a.click();
        URL.revokeObjectURL(url);
    }

    function triggerImport() {
        document.getElementById('importFile').click();
    }

    function importArticle(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            const content = e.target.result;
            if (content.trim()) {
                await loadCustomArticle(content.trim());
                alert('文章匯入成功！');
            } else {
                alert('匯入的檔案內容為空！');
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    const pinyinDatabase = {
        "apple": { pinyin: "ping guo", ipa: "/ˈæp.əl/", trans: "蘋果" },
        "banana": { pinyin: "xiang jiao", ipa: "/bəˈnæn.ə/", trans: "香蕉" },
        "computer": { pinyin: "dian nao", ipa: "/kəmˈpjuː.tər/", trans: "電腦" },
        "developer": { pinyin: "kai fa ren yuan", ipa: "/dɪˈvɛl.ə.pɚ/", trans: "開發人員" },
        "window": { pinyin: "shi chuang", ipa: "/ˈwɪn.doʊ/", trans: "視窗" },
        "success": { pinyin: "cheng gong", ipa: "/səkˈsɛs/", trans: "成功" },
        "nation": { pinyin: "guo jia", ipa: "/ˈneɪ.ʃən/", trans: "國家" },
        "welcome": { pinyin: "huan ying", ipa: "/ˈwɛl.kəm/", trans: "歡迎" },
        "learning": { pinyin: "xue xi", ipa: "/ˈlɝː.nɪŋ/", trans: "學習" },
        "practice": { pinyin: "lian xi", ipa: "/ˈpræk.tɪs/", trans: "練習" },
        "bedroom": { pinyin: "wo shi", ipa: "/ˈbɛd.ruːm/", trans: "臥室" },
        "sunflower": { pinyin: "xiang ri kui", ipa: "/ˈsʌnˌflaʊ.ɚ/", trans: "向日葵" }
    };

    function getPinyinMapping(word) {
        const lower = word.toLowerCase();
        let entry = pinyinDatabase[lower];
        if (entry) {
            return { pinyin: entry.pinyin, ipa: entry.ipa, trans: entry.trans };
        }
        return { pinyin: lower, ipa: "/" + lower + "/", trans: word };
    }

    function playErrorSound() {
        if (isMuted) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sawtooth';
        oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
    }

    function speakText(text) {
        if (isMuted || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = currentSpeed;
        window.speechSynthesis.speak(utterance);
    }

    function speakCurrentSentence() {
        const wordObj = getCurrentWordObj();
        if (!wordObj || isMuted) return;
        speakText(wordObj.clean);
    }

    function getCurrentWordObj() {
        if (linesList[currentLineIndex] && linesList[currentLineIndex].words[currentWordIndexInLine]) {
            return linesList[currentLineIndex].words[currentWordIndexInLine];
        }
        return null;
    }

    async function loadCustomArticle(text) {
        rawArticleText = text;
        const rawLines = text.split(/\r?\n/);
        
        linesList = [];
        totalWordsCount = 0;
        currentTypedText = "";
        const inputEl = document.getElementById('hiddenInput');
        inputEl.textContent = "";
        isInputLocked = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        document.getElementById('comparison-display').innerHTML = '<div style="padding: 10px; text-align: center;">正在載入練習內容...</div>';

        for (let i = 0; i < rawLines.length; i++) {
            let lineRaw = rawLines[i].trim();
            if (!lineRaw) continue;

            let enPart = lineRaw;
            let customTransPart = null;

            if (lineRaw.includes('|')) {
                let parts = lineRaw.split('|');
                enPart = parts[0].trim();
                customTransPart = parts.slice(1).join('|').trim();
            }

            const rawTokens = enPart.split(/\s+/);
            let wordsArr = [];
            let transParts = customTransPart ? customTransPart.split(/\s+/) : [];

            for (let j = 0; j < rawTokens.length; j++) {
                let token = rawTokens[j];
                let pureEnglish = token.replace(/[^a-zA-Z0-9]/g, '');
                if (!pureEnglish) continue;

                let info = getPinyinMapping(pureEnglish);
                let translation = transParts[j] || info.trans;

                wordsArr.push({
                    clean: pureEnglish,
                    pinyin: info.pinyin,
                    ipa: info.ipa,
                    translation: translation
                });
                totalWordsCount++;
            }

            if (wordsArr.length > 0) {
                linesList.push({ words: wordsArr, customFullTranslation: customTransPart });
            }
        }

        if (linesList.length === 0) {
            alert('格式錯誤！');
            return;
        }

        currentLineIndex = 0;
        currentWordIndexInLine = 0;
        score = 0;
        document.getElementById('score').textContent = score;
        document.getElementById('progress').textContent = `1 / ${totalWordsCount}`;
        
        renderComparisonView();
        updateInfoPanel();
    }

    function renderComparisonView() {
        if (currentLineIndex >= linesList.length) {
            document.getElementById('comparison-display').innerHTML = '<div style="padding: 20px; text-align: center; color: #28a745; font-weight: bold; font-size: 18px;">恭喜！練習全部完成！</div>';
            return;
        }

        const lineObj = linesList[currentLineIndex];
        let cnHtml = '';

        lineObj.words.forEach((wordObj, wIdx) => {
            const isCurrentWord = (wIdx === currentWordIndexInLine);
            const activeWordClass = isCurrentWord ? 'active-word' : '';
            
            let displayStr = wordObj.translation;
            if (isCurrentWord) {
                let charHtml = '';
                let targetWord = wordObj.translation;
                let targetIdx = 0;
                let typedIdx = 0;

                while (targetIdx < targetWord.length) {
                    const char = targetWord[targetIdx];
                    if (typedIdx < currentTypedText.length) {
                        const typedChar = currentTypedText[typedIdx];
                        if (typedChar === char) {
                            charHtml += `<span class="correct-char">${char}</span>`;
                        } else {
                            charHtml += `<span class="incorrect-char">${typedChar}</span>`;
                        }
                        typedIdx++;
                    } else {
                        charHtml += `<span>${char}</span>`;
                    }
                    targetIdx++;
                }
                cnHtml += `<span class="word-item ${activeWordClass}"><b>${charHtml}</b></span>`;
            } else {
                let style = wIdx < currentWordIndexInLine ? "color: #28a745;" : "color: #333;";
                cnHtml += `<span class="word-item" style="${style}"><b>${displayStr}</b></span>`;
            }
        });

        document.getElementById('comparison-display').innerHTML = `
            <div class="compare-row">
                <div class="compare-en">${cnHtml}</div>
            </div>
        `;
    }

    function updateInfoPanel() {
        const wordObj = getCurrentWordObj();
        if (!wordObj) {
            document.getElementById('translation-display').textContent = "(完成)";
            document.getElementById('phonetic-display').textContent = "/---/";
            document.getElementById('ipa-display').textContent = "---";
            document.getElementById('hiddenInput').textContent = "";
            return;
        }

        document.getElementById('translation-display').textContent = wordObj.clean;
        document.getElementById('phonetic-display').textContent = wordObj.ipa;
        document.getElementById('ipa-display').textContent = wordObj.pinyin;
        document.getElementById('hiddenInput').textContent = currentTypedText;
    }

    document.getElementById('hiddenInput').addEventListener('input', (e) => {
        if (currentLineIndex >= linesList.length || isInputLocked) return;
        
        const wordObj = getCurrentWordObj();
        if (!wordObj) return;

        const targetText = wordObj.translation;
        let fullVal = document.getElementById('hiddenInput').textContent.trim();

        if (fullVal.length > 0) {
            let hasError = false;
            for (let i = 0; i < fullVal.length; i++) {
                if (i < targetText.length) {
                    if (fullVal[i] !== targetText[i]) {
                        hasError = true;
                        break;
                    }
                } else {
                    hasError = true;
                    break;
                }
            }

            if (hasError) {
                playErrorSound();
                currentTypedText = "";
                document.getElementById('hiddenInput').textContent = "";
            } else {
                currentTypedText = fullVal;

                if (currentTypedText === targetText) {
                    isInputLocked = true;
                    score++;
                    document.getElementById('score').textContent = score;

                    speakText(wordObj.clean);

                    setTimeout(() => {
                        currentWordIndexInLine++;
                        currentTypedText = "";
                        document.getElementById('hiddenInput').textContent = "";
                        isInputLocked = false;
                        
                        if (currentWordIndexInLine >= linesList[currentLineIndex].words.length) {
                            currentLineIndex++;
                            currentWordIndexInLine = 0;
                        }

                        let completedCount = 0;
                        for(let i=0; i<currentLineIndex; i++) {
                            completedCount += linesList[i].words.length;
                        }
                        completedCount += currentWordIndexInLine;

                        if (currentLineIndex >= linesList.length) {
                            document.getElementById('comparison-display').innerHTML = '<div style="padding: 20px; text-align: center; color: #28a745; font-weight: bold; font-size: 18px;">恭喜！練習全部完成！</div>';
                            document.getElementById('translation-display').textContent = "(完成)";
                            document.getElementById('phonetic-display').textContent = "/---/";
                            document.getElementById('ipa-display').textContent = "---";
                            document.getElementById('hiddenInput').textContent = "";
                            document.getElementById('progress').textContent = `${totalWordsCount} / ${totalWordsCount}`;
                            return;
                        }

                        document.getElementById('progress').textContent = `${completedCount + 1} / ${totalWordsCount}`;
                        renderComparisonView();
                        updateInfoPanel();
                    }, 500);
                }
            }
        } else {
            currentTypedText = "";
        }

        renderComparisonView();
        updateInfoPanel();
    });

    function restartPractice() {
        loadCustomArticle(rawArticleText);
    }

    window.onload = async () => {
        await loadCustomArticle(rawArticleText);
    };
</script>

</body>
</html>
