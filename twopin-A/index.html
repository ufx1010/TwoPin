<head>

<style>:root{color-scheme:dark;--lyric-size:17px;--lyric-color:#ffffff}*{-webkit-tap-highlight-color:transparent}body{font-family:'Outfit',system-ui,-apple-system,sans-serif;overscroll-behavior:none}.serif{font-family:'Fraunces',Georgia,serif}.glass{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}#lyricMarqueeBox,#subtitleBox,#marqueeContent{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.subtitle-box{width:100%;overflow:visible;position:relative;min-height:64px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}.subtitle-inner{position:relative;width:100%;text-align:center;animation:subtitleUp .4s cubic-bezier(.2,.8,.2,1) forwards}@keyframes subtitleUp{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
body{box-shadow:inset 0 0 0 3px rgba(255,255,255,0.9);transition:box-shadow .3s ease}
#mediaContainer.media-fullscreen{position:fixed;inset:0;z-index:70;width:100vw;height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0;border:none}
#lyricMarqueeBox.marquee-floating{position:fixed;z-index:90;width:88vw;max-width:420px;touch-action:none}
#lyricMarqueeBox.marquee-floating.marquee-rotated{width:88vh;max-width:88vh;transform:rotate(90deg)}
#marqueeContent p,#marqueeContent span{text-shadow:0 1px 4px rgba(0,0,0,0.85),0 0 12px rgba(0,0,0,0.5)}
.wm-text::before{content:attr(data-t)}
body.is-fullscreen{box-shadow:inset 0 0 0 3px rgba(255,255,255,1)}
.editor-max{max-height:62vh !important;transition:max-height .2s ease}
textarea.editor-max{height:62vh !important;transition:height .2s ease}
#langBlock1,#langBlock2{transition:flex .2s ease}
.grid-cols-1.md\:grid-cols-2:has(.editor-max){display:flex;flex-direction:column}
</style>
</head>
<body class="bg-[#050508] text-zinc-100 antialiased selection:bg-violet-500/30 selection:text-violet-200">

<div class="flex items-center gap-1.5 shrink-0 z-10 ml-auto bg-black/40 p-1 rounded-xl border border-white/5">

</div>
</div>
</header>

</div>

</div>
<div class="flex items-center justify-between gap-3 px-1">

</div>
<div class="flex items-center justify-between gap-1.5 px-1">
<div class="grid grid-cols-2 gap-1">

</div>
<div class="flex items-center gap-2">
<button id="pPrev" class="w-9 h-9 grid place-items-center text-zinc-300 border border-white/10 rounded-full transition active:scale-90"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
<button id="pPlay" class="w-12 h-12 bg-zinc-800 border border-white/10 rounded-full grid place-items-center shadow-lg transition text-white active:scale-95"><svg id="pPlayIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
<button id="pNext" class="w-9 h-9 grid place-items-center text-zinc-300 border border-white/10 rounded-full transition active:scale-90"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
</div>
<div class="grid grid-cols-3 grid-rows-2 gap-1 shrink-0">
<button id="btnMediaFullscreen" title="媒體全螢幕，字幕可拖曳" class="w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-violet-600/40 border border-violet-500 text-white">⛶</button>
<button id="ttsSpeed" title="語速" class="w-8 h-8 grid place-items-center text-[11px] rounded-lg bg-violet-600/40 border border-violet-500 text-white font-semibold">1x</button>
<button id="btnLoopSong" title="單曲循環" class="w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-violet-600/40 border border-violet-500 text-white">🔁</button>
<button id="btnFullExport" title="依目前設定輸出整段影片" class="w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-violet-600/40 border border-violet-500 text-white"><span id="fullExportLabel">⬇️</span></button>
<button id="togglePracticeBtn" title="練習" class="w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-violet-600/40 border border-violet-500 text-white">🎤</button>
<button id="marqueeRotateBtn" title="旋轉字幕（變更寬度方向，適合較長文字）" class="w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-violet-600/40 border border-violet-500 text-white">🔄</button>
</div>
</div>
</div>
</div>
</div>
<div id="modal" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/80 backdrop-blur-xl" id="modalBg"></div><div class="relative z-10 max-w-[520px] mx-auto h-[100dvh] flex flex-col"><div class="p-4 flex items-center justify-between"><h3 class="serif text-[22px]">歌曲清單</h3><button id="closeModal" class="w-9 h-9 grid place-items-center rounded-xl bg-white/10"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="px-4 pb-4 flex gap-2"><button id="addSong" class="flex-1 h-11 rounded-xl bg-violet-600 font-medium text-[14px]">新增歌曲資料</button><div class="relative"><button id="sortSelectBtn" class="h-11 px-3 rounded-xl bg-white/10 text-[13px] text-white flex items-center gap-1.5 whitespace-nowrap"><span id="sortSelectLabel">手動排序</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button><div id="sortSelectMenu" class="hidden absolute right-0 top-[calc(100%+6px)] z-20 w-40 rounded-xl bg-[#17181c] border border-white/10 shadow-xl overflow-hidden"><button type="button" data-val="custom" class="sort-opt w-full text-left px-4 py-2.5 text-[13px] text-white hover:bg-white/10 transition">手動排序</button><button type="button" data-val="az" class="sort-opt w-full text-left px-4 py-2.5 text-[13px] text-white hover:bg-white/10 transition">A → Z</button><button type="button" data-val="za" class="sort-opt w-full text-left px-4 py-2.5 text-[13px] text-white hover:bg-white/10 transition">Z → A</button><button type="button" data-val="newest" class="sort-opt w-full text-left px-4 py-2.5 text-[13px] text-white hover:bg-white/10 transition">最新加入</button><button type="button" data-val="oldest" class="sort-opt w-full text-left px-4 py-2.5 text-[13px] text-white hover:bg-white/10 transition">最早加入</button></div></div></div><div class="px-4 pb-3"><button id="openTemplateTester" class="w-full h-10 rounded-xl bg-white/10 border border-white/10 text-[13px] text-zinc-300 hover:text-white transition active:scale-95">🌐 語言模板測試（英/中/日/韓/坦米爾文/台語...）</button></div><div class="px-4 pb-3"><button id="openFontSettings" class="w-full h-10 rounded-xl bg-white/10 border border-white/10 text-[13px] text-zinc-300 hover:text-white transition active:scale-95">🔤 原文字型設定（大小／顏色）</button><div id="fontSettingsPanel" class="hidden mt-2 p-3 rounded-xl bg-white/5 border border-white/10 space-y-3"><div><div class="flex items-center justify-between mb-1"><span class="text-[12px] text-zinc-400">文字大小</span><span id="fontSizeValue" class="text-[12px] text-violet-300 font-semibold">17px</span></div><input type="range" id="fontSizeSlider" min="12" max="32" value="17" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-violet-500"></div><div class="flex items-center gap-1.5 overflow-x-auto pb-0.5"><div class="flex items-center gap-1.5 shrink-0" id="fontColorSwatches"></div><input type="color" id="fontColorInput" value="#ffffff" class="w-7 h-7 rounded-md border border-white/20 bg-transparent cursor-pointer p-0 shrink-0"><button id="fontResetBtn" class="shrink-0 px-2.5 py-1.5 rounded-lg bg-white/10 text-[11px] text-zinc-300 active:scale-95 transition whitespace-nowrap">還原預設</button></div></div></div><div class="px-4 pb-3 flex gap-2"><button id="exportAllBtn" class="flex-1 h-10 rounded-xl bg-white/10 border border-white/10 text-[13px] text-zinc-300 hover:text-white transition active:scale-95">⬆️ 備份全部歌曲</button><button id="importAllBtn" class="flex-1 h-10 rounded-xl bg-white/10 border border-white/10 text-[13px] text-zinc-300 hover:text-white transition active:scale-95">⬇️ 還原全部歌曲</button><input id="importAllFile" type="file" accept="application/json,.json" class="hidden"></div><div id="songList" class="flex-1 overflow-y-auto px-4 pb-8 space-y-2.5"></div></div></div>
<div id="editModal" class="fixed inset-0 z-[60] hidden"><div class="absolute inset-0 bg-black/90 backdrop-blur-xl"></div><div class="relative z-10 w-full h-[100dvh] flex flex-col"><div class="p-4 flex items-center gap-3 border-b border-white/10 sticky top-0 z-20 bg-[#0a0a0f]/95 backdrop-blur-xl shrink-0">
<button id="cancelEdit" class="px-4 py-1.5 rounded-lg bg-zinc-800/90 border border-zinc-700/60 text-[13px] font-medium text-zinc-300 hover:text-white transition active:scale-95 shadow-sm">退出</button>
<h3 class="serif text-[20px] flex-1 text-center" id="editTitle">編輯影音資料</h3>

  function toLrcContent(title, lines){
    const body=lines.map(line=>{
      const raw=(line||'');
      const m3=raw.match(/^\[(\d{1,4}):(\d{2}):(\d{2})\]\s*(.*)$/); // 目前使用的 [分:秒:百分秒] 格式
      const m2=raw.match(/^\[(\d{1,4}):(\d{2})\]\s*(.*)$/); // 舊版 [分:秒] 格式，向下相容
      let mm, ss, hh, text;
      if(m3){ mm=m3[1].padStart(2,'0'); ss=m3[2]; hh=m3[3]; text=m3[4]; }
      else if(m2){ mm=m2[1].padStart(2,'0'); ss=m2[2]; hh='00'; text=m2[3]; }
      else return null;
      return `[${mm}:${ss}.${hh}]${text}`;
    }).filter(Boolean).join('\n');
    return `[ti:${title}]\n[by:我的歌詞本]\n${body}\n`;
  }

  }
  function setMarqueePos(visualX,visualY){
    const p=clampMarqueePos(visualX,visualY); const box=$('#lyricMarqueeBox');
    const {w,h,rotated}=getMarqueeBoxDims();
    if(rotated){
      // 旋轉是繞元素中心進行，寬高互換會讓中心點跟著偏移，
      // 這裡把「畫面上想要的左上角」換算回 CSS 原本（未旋轉）座標系下的 left/top。
      box.style.left=(p.x+(h-w)/2)+'px'; box.style.top=(p.y+(w-h)/2)+'px';
    } else {
      box.style.left=p.x+'px'; box.style.top=p.y+'px';
    }
    localStorage.setItem('linguabook:marqueePos', JSON.stringify(p));
  }
  function centerRotatedMarquee(){
    const {w,h}=getMarqueeBoxDims(); // 此時 class 已經套用 marquee-rotated，w/h 是旋轉後的 CSS 尺寸（寬變 88vh）
    setMarqueePos((window.innerWidth-h)/2, (window.innerHeight-w)/2);
  }
  function centerMarquee(){
    const box=$('#lyricMarqueeBox');
    if(box.classList.contains('marquee-rotated')){ centerRotatedMarquee(); return; }
    const {w,h}=getMarqueeBoxDims();
    setMarqueePos((window.innerWidth-w)/2, (window.innerHeight-h)/2);
  }
  $('#marqueeRotateBtn').onclick=()=>{
    const box=$('#lyricMarqueeBox'); box.classList.toggle('marquee-rotated');
    const isOn=box.classList.contains('marquee-rotated');
    localStorage.setItem('linguabook:marqueeRotated', isOn?'1':'0');
    $('#marqueeRotateBtn').className = isOn ? "w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-emerald-500 border border-emerald-400 text-white" : "w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-violet-600/40 border border-violet-500 text-white";
    // 不管切換到哪個方向，都直接置中，避免舊座標在切換後跑到螢幕外。
    centerMarquee();
  };
  // 字幕框現在永遠是可拖曳的浮動視窗（不論是不是全螢幕），開頁時就搬離原本的工具列位置，
  // 這樣 #bottomToolbar 的 backdrop-filter 也不會再讓它「定位失效消失」。
  (function initFloatingMarquee(){
    const box=$('#lyricMarqueeBox');
    document.body.appendChild(box);
    box.classList.add('marquee-floating');
    const wasRotated = localStorage.getItem('linguabook:marqueeRotated')==='1';
    if(wasRotated){ box.classList.add('marquee-rotated'); $('#marqueeRotateBtn').className="w-8 h-8 grid place-items-center text-[13px] rounded-lg bg-emerald-500 border border-emerald-400 text-white"; }
    if(wasRotated){
      centerRotatedMarquee();
    } else {
      let pos=null; try{ pos=JSON.parse(localStorage.getItem('linguabook:marqueePos')||'null'); }catch{}
      if(!pos) pos={ x:(window.innerWidth-Math.min(window.innerWidth*0.88,420))/2, y:window.innerHeight-220 };
      setMarqueePos(pos.x, pos.y);
    }
    // 字幕永遠浮在最上層，但切到歌曲清單／編輯／模板測試這些全螢幕面板、或打開練習面板時應該要消失，
    // 不然練習面板本身就會顯示同一句歌詞，字幕再疊在上面變成「雙字幕」，看起來很奇怪也重複。
    // 旋轉鍵現在是字幕框自己的子元素，字幕框一藏起來旋轉鍵也會跟著藏起來，不用額外處理。
    const watchedModalIds=['modal','editModal','templateModal'];
    window.updateMarqueeVisibility=function(){
      const anyModalOpen=watchedModalIds.some(id=>{ const el=document.getElementById(id); return el && !el.classList.contains('hidden'); });
      box.style.display = (anyModalOpen || practicePanelOpen) ? 'none' : '';
    };
    watchedModalIds.forEach(id=>{
      const el=document.getElementById(id); if(!el)return;
      new MutationObserver(window.updateMarqueeVisibility).observe(el,{attributes:true,attributeFilter:['class']});
    });
    window.updateMarqueeVisibility();
  })();
  function enableMediaFullscreen(){
    if(practicePanelOpen) setPracticeOpen(false);
    _mediaFullscreenOn=true;
    $('#mediaContainer').classList.add('media-fullscreen');
    $('header').classList.add('hidden');
    $('#bottomToolbar').classList.add('hidden');
    // 退出鍵預設不顯示，畫面上不常駐任何功能鍵；輕點畫面才會短暫跳出來。
    $('#btnExitMediaFullscreen').classList.add('hidden');
  }
  function disableMediaFullscreen(){
    _mediaFullscreenOn=false;
    $('#mediaContainer').classList.remove('media-fullscreen');
    $('header').classList.remove('hidden');
    $('#bottomToolbar').classList.remove('hidden');
    $('#btnExitMediaFullscreen').classList.add('hidden');
  }
  $('#btnMediaFullscreen').onclick=()=>{ if(_mediaFullscreenOn) disableMediaFullscreen(); else enableMediaFullscreen(); };
  $('#btnExitMediaFullscreen').onclick=()=>disableMediaFullscreen();
  window._marqueeWasDragged=false;
  (function(){
    const box=$('#lyricMarqueeBox');
    const start=(x,y)=>{ const rect=box.getBoundingClientRect(); _marqueeDrag={ offX:x-rect.left, offY:y-rect.top, startX:x, startY:y }; };
    const move=(x,y)=>{ if(!_marqueeDrag)return; if(Math.abs(x-_marqueeDrag.startX)>6 || Math.abs(y-_marqueeDrag.startY)>6) window._marqueeWasDragged=true; setMarqueePos(x-_marqueeDrag.offX, y-_marqueeDrag.offY); };
    const end=()=>{ _marqueeDrag=null; };
    box.addEventListener('touchstart',(e)=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
    box.addEventListener('touchmove',(e)=>{ if(!_marqueeDrag)return; e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:false});
    box.addEventListener('touchend', end);
    box.addEventListener('mousedown',(e)=>{ start(e.clientX,e.clientY); });
    window.addEventListener('mousemove',(e)=>move(e.clientX,e.clientY));
    window.addEventListener('mouseup', end);
  })();
  (async () => { renameLinguabookIdxKey(); await load(); await render(); restoreResumeState(); })();
})();
</script>
