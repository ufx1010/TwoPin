<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>書法裱框 v35 - 半螢幕50vh (已修復截圖失真)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Ma+Shan+Zheng&family=Liu+Jian+Mao+Cao&family=ZCOOL+XiaoWei&family=ZCOOL+KuaiLe&family=Long+Cang&family=Zhi+Mang+Xing&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@400;700&family=Song+Myung&family=Gowun+Batang&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0f0f12;--panel:#1c1c21;--accent:#c4a77d;--border:rgba(255,255,255,0.08);--frame-w:22px;--paper-scale:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#fff;font-family:'Noto Sans TC',sans-serif;overflow:hidden;height:100vh;height:100dvh}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.preview{flex:1;background:radial-gradient(circle at 50% 40%, #332e2b 0%, #1a1715 50%, #0a0908 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;padding:16px 16px 40px 16px;min-height:50vh}
#frame-scale-wrap{transform-origin:center center;transition:transform .2s ease;will-change:transform;filter:drop-shadow(0 18px 22px rgba(0,0,0,.7));transform:scale(1.15);overflow:visible}
#outer-wrap{position:relative;padding:12px;background:#2b1e14;border:2px solid #120c06;border-radius:4px;overflow:hidden}

/* 修復包角顏色失真與截圖不符 - 四角對稱一致黃銅材質 */
.corner-brass{position:absolute;width:46px;height:46px;z-index:100;pointer-events:none}
.corner-brass .arm{position:absolute;background:#d4b77a;border:1px solid #5a4a20}
.corner-brass .arm.h{height:12px;width:100%}
.corner-brass .arm.v{width:12px;height:100%}
.corner-brass .nail{position:absolute;width:7px;height:7px;background:#e8d596;border-radius:50%;border:1px solid #5a4a20}

.corner-brass.tl{top:0;left:0}
.corner-brass.tl .arm.h{top:0;left:0;border-top-left-radius:3px;background:linear-gradient(180deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.tl .arm.v{top:0;left:0;border-top-left-radius:3px;background:linear-gradient(90deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.tl .nail{top:14px;left:14px}

.corner-brass.tr{top:0;right:0}
.corner-brass.tr .arm.h{top:0;right:0;border-top-right-radius:3px;background:linear-gradient(180deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.tr .arm.v{top:0;right:0;border-top-right-radius:3px;background:linear-gradient(270deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.tr .nail{top:14px;right:14px}

.corner-brass.bl{bottom:0;left:0}
.corner-brass.bl .arm.h{bottom:0;left:0;border-bottom-left-radius:3px;background:linear-gradient(0deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.bl .arm.v{bottom:0;left:0;border-bottom-left-radius:3px;background:linear-gradient(90deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.bl .nail{bottom:14px;left:14px}

.corner-brass.br{bottom:0;right:0}
.corner-brass.br .arm.h{bottom:0;right:0;border-bottom-right-radius:3px;background:linear-gradient(0deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.br .arm.v{bottom:0;right:0;border-bottom-right-radius:3px;background:linear-gradient(270deg, #ffe9a0 0%, #d4b77a 50%, #8a6a30 100%)}
.corner-brass.br .nail{bottom:14px;right:14px}

/* 修復裱框特效失真 */
#frame-container{position:relative;padding:var(--frame-w);background-color:#4a1e1e;border-radius:2px;transition:all .2s ease;overflow:hidden}
#frame-container.woodRed{background-color:#4a1e1e}
#frame-container.goldArt{background-color:#d4b77a}
#frame-container.darkInk{background-color:#1c1c1f}
#frame-container.hollow{background-color:#d8c9a8}
#frame-container.relief{background-color:#c4b5a0}
#frame-container.stone{background-color:#a8a8a0}
#frame-container.metal{background-color:#a0a0a0}
#frame-container.jade{background-color:#a5d6a7}

#captureWrap{position:relative;transition:transform .25s ease;transform-origin:center center;transform:scale(var(--paper-scale));z-index:1;overflow:visible}
#captureArea{position:relative;width:270px;height:405px;overflow:hidden;isolation:isolate;transition:all .35s ease;background:#fcf8f2;z-index:1}
#paperBgWrap{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;display:none;background:#fcf8f2;border-radius:2px}
#paperBgWrap.hasImage{display:block;pointer-events:auto;z-index:0}
#paperBgImg{position:absolute;left:50%;top:50%;width:100%;height:auto;max-width:none;max-height:none;transform:translate(-50%,-50%) translate(0px,0px) scale(1) rotate(0deg);transform-origin:center center;cursor:move;user-select:none;-webkit-user-drag:none;z-index:0}
.draggable{position:absolute;cursor:move;z-index:20;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;border:1px dashed transparent;min-width:30px;min-height:30px}
.draggable.active{border-color:var(--accent);background:rgba(196,167,125,.14);box-shadow:0 0 0 1px var(--accent);z-index:30}
.draggable .text-content{white-space:pre-wrap;word-break:break-all;line-height:1.7;pointer-events:none;transition:all .25s ease;--effect-color:#1a1a1a;--grad-c1:#1a1a1a;--grad-c2:#444;--grad-c3:#666;--grad-angle:135deg}
.v-mode{writing-mode:vertical-rl;text-orientation:mixed}

/* 修復印章文字偏下與垂直置中問題 - 防溢出紅底 */
.seal-box{background:#b22222 !important;color:#fff !important;-webkit-text-fill-color:#fff !important;font-family:'Ma Shan Zheng',serif;padding:3px 8px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;line-height:1.2 !important;text-align:center;text-shadow:none !important;filter:none !important;box-shadow:none !important;overflow:hidden;box-sizing:border-box}

.text-content.effect-none{text-shadow:none;-webkit-text-stroke:0;filter:none;background:none !important;-webkit-background-clip:unset !important;background-clip:unset !important;-webkit-text-fill-color:unset !important}
.text-content.effect-feibai{-webkit-mask-image:repeating-linear-gradient(90deg, black 0 2px, transparent 2px 3.5px);mask-image:repeating-linear-gradient(90deg, black 0 2px, transparent 2px 3.5px);filter:contrast(1.1)}
.text-content.effect-yunran{filter:blur(0.8px) contrast(1.1);text-shadow:0 0 6px rgba(0,0,0,.25), 0 2px 12px rgba(0,0,0,.18)}
.text-content.effect-jiaomo{color:#080808 !important;-webkit-text-fill-color:#080808 !important;background:none !important;-webkit-text-stroke:0.6px #000 !important;text-shadow:0 0 1px #000, 0 1px 2px rgba(0,0,0,.8);filter:contrast(1.8) brightness(0.65)}
.text-content.effect-shuangou{color:transparent !important;-webkit-text-fill-color:transparent !important;-webkit-text-stroke:1.2px var(--effect-color) !important;text-shadow:none !important;filter:none !important;background:none !important}
.text-content.effect-shuimo{color:var(--effect-color) !important;-webkit-text-fill-color:var(--effect-color) !important;filter:blur(0.5px) contrast(0.95);opacity:0.85;text-shadow:0 0 10px rgba(0,0,0,.25), 0 1px 6px rgba(0,0,0,.15)}
.text-content.effect-yinbai{background:var(--effect-color) !important;color:#fff !important;-webkit-text-fill-color:#fff !important;-webkit-background-clip:unset !important;background-clip:unset !important;padding:2px 4px;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.25);filter:none !important;-webkit-text-stroke:0 !important;text-shadow:none !important}
.text-content.effect-liehen{color:var(--effect-color) !important;-webkit-text-fill-color:var(--effect-color) !important;background:none !important;position:relative;filter:contrast(1.15);text-shadow:0 0 0.5px rgba(0,0,0,.6), 0.8px 0.8px 0 rgba(0,0,0,.06)}
.text-content.effect-liehen::after{content:attr(data-text);position:absolute;left:0;top:0;right:0;bottom:0;color:transparent !important;background-image:linear-gradient(90deg, transparent 11px, rgba(0,0,0,0.22) 11px, rgba(0,0,0,0.22) 12px, transparent 12px), linear-gradient(0deg, transparent 17px, rgba(0,0,0,0.16) 17px, rgba(0,0,0,0.16) 18px, transparent 18px);background-size:24px 36px, 36px 24px;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;pointer-events:none;mix-blend-mode:multiply;opacity:0.95}
.text-content.effect-tuota{color:var(--effect-color) !important;-webkit-text-fill-color:var(--effect-color) !important;background:none !important;filter:contrast(1.7) brightness(0.9) sepia(0.12);text-shadow:0 0 1px rgba(0,0,0,.6);position:relative}
.text-content.effect-tuota::before{content:attr(data-text);position:absolute;left:0;top:0;right:0;bottom:0;color:var(--effect-color);opacity:0.42;filter:blur(0.6px) contrast(1.4);background-image:radial-gradient(ellipse at 20% 30%, transparent 35%, rgba(0,0,0,0.18) 36%, transparent 37%), radial-gradient(ellipse at 80% 60%, transparent 40%, rgba(0,0,0,0.14) 41%, transparent 42%), radial-gradient(ellipse at 50% 80%, transparent 30%, rgba(0,0,0,0.12) 31%, transparent 32%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;pointer-events:none;transform:translate(0.8px,0.8px)}
.text-content.effect-neon{color:var(--effect-color) !important;-webkit-text-fill-color:var(--effect-color) !important;background:none !important;text-shadow:0 0 4px var(--effect-color), 0 0 8px var(--effect-color), 0 0 16px var(--effect-color), 0 0 32px var(--effect-color);filter:brightness(1.2) contrast(1.1);-webkit-text-stroke:0 !important}
.text-content.effect-fire{background:linear-gradient(180deg, #ffff00 0%, #ffaa00 20%, #ff5500 45%, #ff0000 70%, #880000 100%) !important;-webkit-background-clip:text !important;background-clip:text !important;-webkit-text-fill-color:transparent !important;color:transparent !important;filter:drop-shadow(0 0 6px rgba(255,80,0,.8)) drop-shadow(0 2px 2px rgba(80,0,0,.6));-webkit-text-stroke:0 !important}
.text-content.effect-ice{color:#e0f8ff !important;-webkit-text-fill-color:#e0f8ff !important;background:none !important;text-shadow:0 0 2px #fff, 0 0 6px #00ccff, 0 0 12px #00aaff, 0 0 24px #0088ff, 1px 1px 0 rgba(255,255,255,.9);filter:brightness(1.15) contrast(1.05);-webkit-text-stroke:0.5px rgba(180,230,255,.6) !important}
.text-content.grad-on{background:linear-gradient(var(--grad-angle), var(--grad-c1), var(--grad-c2), var(--grad-c3)) !important;-webkit-background-clip:text !important;background-clip:text !important;-webkit-text-fill-color:transparent !important;color:transparent !important}
.text-content.grad-on.effect-yinbai{-webkit-text-fill-color:#fff !important;color:#fff !important;background:var(--effect-color) !important;-webkit-background-clip:unset !important;background-clip:unset !important}

.editor{height:56px;min-height:56px;max-height:50vh;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;z-index:50;transition:height .3s cubic-bezier(.4,0,.2,1);position:relative;flex-shrink:0}
.editor.expanded{height:50vh;max-height:50vh;min-height:50vh}
.editor .scroll,.editor .foot{display:none}
.editor.expanded .scroll,.editor.expanded .foot{display:flex}
.editor.expanded .scroll{display:block;max-height:calc(50vh - 84px);overflow-y:auto;padding-bottom:24px;overscroll-behavior:contain}
.drag-handle{position:absolute;top:0;left:0;right:0;height:18px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;z-index:60;background:linear-gradient(180deg, rgba(255,255,255,.06), transparent)}
.drag-handle::before{content:'';width:36px;height:4px;background:rgba(255,255,255,.18);border-radius:999px}
.toggle-btn{position:absolute;top:-34px;right:12px;background:var(--panel);border:1px solid var(--border);color:var(--accent);width:112px;height:30px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:12px;z-index:55;box-shadow:0 -4px 12px rgba(0,0,0,.35)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px;background:#0f0f12;margin-top:8px;flex-shrink:0}
.tab{text-align:center;padding:11px 0;font-size:12px;border-radius:6px;color:#aaa;background:#23232a;cursor:pointer;font-weight:600}
.tab.active{background:var(--accent);color:#111;font-weight:700}
.scroll{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:rgba(196,167,125,.35);border-radius:999px}
.panel{display:none;flex-direction:column;gap:10px}
.panel.active{display:flex}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.full{grid-column:span 2}
label{font-size:10px;color:#888;margin-bottom:3px;display:block}
input,select,button.sub,textarea{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--border);padding:9px;border-radius:8px;width:100%;font-size:13px;appearance:none}
textarea{resize:none;height:56px}
.sub{cursor:pointer;text-align:center;font-weight:600;background:#2a2a33;transition:.2s;font-size:12px;min-height:36px}
.sub.active{border-color:var(--accent);background:rgba(196,167,125,.22);color:var(--accent);box-shadow:0 0 8px rgba(196,167,125,.2)}
.sub.danger{background:rgba(180,40,40,.12);border-color:rgba(180,40,40,.25)}
.slider-row{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:5px 8px}
.slider-row .btn{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;background:#2a2a33;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.15);border-radius:999px}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #1c1c21}
.val{min-width:40px;text-align:center;font-size:10px;color:var(--accent);font-family:monospace;background:rgba(0,0,0,.3);padding:3px 6px;border-radius:6px}
.color-row{display:grid;grid-template-columns:1fr 1fr 1fr 64px;gap:5px;align-items:end}
.color-row input[type=color]{height:38px;padding:3px;cursor:pointer;border-radius:8px}
.color-row .sub{height:38px;padding:0;display:grid;place-items:center;font-size:11px}
.frame-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.frame-grid .sub{padding:8px 3px;font-size:10px}
.ratio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ratio-grid .sub{padding:8px 3px;font-size:10px;line-height:1.2}
.ratio-grid .sub small{display:block;font-size:8px;opacity:.6;margin-top:1px}
.effect-grid-4x3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.effect-grid-4x3 .sub{padding:10px 2px;font-size:9px;line-height:1.1;aspect-ratio:1.2/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px}
.effect-grid-4x3 .sub b{font-size:11px}
.effect-grid-4x3 .sub span{font-size:7px;opacity:.7}
.paper-upload{border:1px dashed var(--border);border-radius:10px;padding:8px;background:rgba(255,255,255,.02)}
.foot{padding:5px 10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.35);flex-shrink:0}
#loading{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:none;flex-direction:column;justify-content:center;align-items:center;color:var(--accent);backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div id="loading"><div style="width:48px;height:48px;border:2px solid rgba(196,167,125,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite"></div><div id="loadText" style="margin-top:12px;font-weight:700">渲染中...</div></div>
<div class="app">
  <div class="preview" id="previewArea">
    <button class="toggle-btn" id="toggleEditor">⬆️ 展開編輯 (50%)</button>
    <div id="frame-scale-wrap">
      <div id="outer-wrap">
        <div class="corner-brass tl"><div class="arm h"></div><div class="arm v"></div><div class="nail"></div></div>
        <div class="corner-brass tr"><div class="arm h"></div><div class="arm v"></div><div class="nail"></div></div>
        <div class="corner-brass bl"><div class="arm h"></div><div class="arm v"></div><div class="nail"></div></div>
        <div class="corner-brass br"><div class="arm h"></div><div class="arm v"></div><div class="nail"></div></div>
        <div id="frame-container" class="woodRed">
          <div id="captureWrap"><div id="captureArea">
            <div id="paperBgWrap"><img id="paperBgImg" src="" alt=""></div>
            <div id="blk-meta" class="draggable" style="top:14%;left:18%;z-index:20"><div class="text-content v-mode" style="font-family:'ZCOOL XiaoWei',serif;font-size:14px;letter-spacing:3px;--effect-color:#333;--grad-c1:#222;--grad-c2:#555;--grad-c3:#999;--grad-angle:135deg" data-text="江波">江波</div></div>
            <div id="blk-seal" class="draggable" style="top:68%;left:20%;z-index:20"><div class="text-content seal-box" style="font-size:16px;--effect-color:#b22222;--grad-c1:#b22222;--grad-c2:#ff4444;--grad-c3:#8a0000;--grad-angle:135deg" data-text="江波">江波</div></div>
          </div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="editor" id="editor">
    <div class="drag-handle" id="dragHandle"></div>
    <div class="tabs"><div class="tab active" data-i="0">內容</div><div class="tab" data-i="1">排版</div><div class="tab" data-i="2">裱框</div></div>
    <div class="scroll">
      <div class="panel active" id="p0">
        <div class="grid2">
          <div class="full"><label>主標題 (已清空)</label><input id="inp-title" value="" placeholder="輸入標題"></div>
          <div class="full"><label>正文 (已清空)</label><textarea id="inp-content" placeholder="輸入正文，支援換行"></textarea></div>
          <div><label>落款 作者</label><input id="inp-meta" value="江波"></div>
          <div><label>印章 保留</label><input id="inp-seal" value="江波"></div>
          <div class="full" style="margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="sub" id="btnAddText">➕ 新增文字</button><button class="sub danger" id="btnDelText">🗑️ 刪除選中</button></div>
          <div class="full"><label>選中文字編輯</label><input id="inp-custom" placeholder="選中後編輯"></div>
        </div>
      </div>
      <div class="panel" id="p1">
        <div class="grid2">
          <div class="full"><label>選擇對象</label><select id="targetSelect"><option value="blk-meta">落款 江波</option></select></div>
          <div class="full"><label>排版</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px"><button class="sub active" id="btnVMode">直排</button><button class="sub" id="btnHMode">橫排</button></div></div>
          <div class="full"><label>對齊</label><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><button class="sub" data-align="left">左</button><button class="sub active" data-align="center">中</button><button class="sub" data-align="right">右</button></div></div>
          <div class="full"><label>中文字型 12款</label><select id="fontSelect">
<option value="'Noto Serif TC',serif" selected>思源宋體</option>
<option value="'Noto Sans TC',sans-serif">思源黑體</option>
<option value="'Ma Shan Zheng',cursive">馬善政楷書</option>
<option value="'ZCOOL XiaoWei',serif">小薇體</option>
<option value="'ZCOOL KuaiLe',cursive">快樂體</option>
<option value="'Liu Jian Mao Cao',cursive">劉建毛草</option>
<option value="'Long Cang',cursive">龍藏體</option>
<option value="'Zhi Mang Xing',cursive">志莽行書</option>
<option value="'ZCOOL QingKe HuangYou',cursive">慶科黃油體</option>
<option value="'Noto Serif SC',serif">思源宋簡</option>
<option value="'Song Myung',serif">宋明體</option>
<option value="'Gowun Batang',serif">高雲明朝</option>
</select></div>
          <div class="full"><label>文字排版 4滑桿集中</label><div style="background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px">
            <div class="slider-row"><span style="font-size:9px;min-width:36px;color:#888">大小</span><button class="btn" data-action="fontSize" data-dir="-">−</button><input type="range" id="sizeRange" min="10" max="96" value="18"><button class="btn" data-action="fontSize" data-dir="+">+</button><div class="val" id="sizeVal">18px</div></div>

<script>
const frameContainer=document.getElementById('frame-container'),captureArea=document.getElementById('captureArea'),captureWrap=document.getElementById('captureWrap'),scaleWrap=document.getElementById('frame-scale-wrap'),outerWrap=document.getElementById('outer-wrap'),editor=document.getElementById('editor');
let activeId='blk-meta',zoom=115,customCount=0,isCollapsed=true;
let paperX=0,paperY=0,paperImgScale=1,paperRotate=0,paperOpacity=1,hasPaperImage=false;
let exportFormat='png',exportQuality=0.92,exportScale=3,paperSizeScale=100;
let txtGradOn=false;
const paperWrap=document.getElementById('paperBgWrap'),paperImg=document.getElementById('paperBgImg');

function applyTextGradient(){
  try{
    const el=document.getElementById(activeId);if(!el)return;const tc=el.querySelector('.text-content');if(!tc)return;
    const c1=document.getElementById('txtGradC1').value,c2=document.getElementById('txtGradC2').value,c3=document.getElementById('txtGradC3').value,ang=document.getElementById('txtGradAngle').value;
    tc.style.setProperty('--grad-c1',c1);tc.style.setProperty('--grad-c2',c2);tc.style.setProperty('--grad-c3',c3);tc.style.setProperty('--grad-angle',ang+'deg');
    tc.style.setProperty('--effect-color',c1);
    if(txtGradOn){
      tc.classList.add('grad-on');
      tc.style.background=`linear-gradient(${ang}deg, ${c1}, ${c2}, ${c3})`;
      document.getElementById('txtGradDebug').textContent=`漸層開啟: ${c1} → ${c2} → ${c3} ${ang}°`;
      document.getElementById('txtGradDebug').style.color='#2ecc71';
    }else{
      tc.classList.remove('grad-on');
      tc.style.background='none';
      tc.style.backgroundImage='none';
      tc.style.webkitTextFillColor='';
      tc.style.color=c1;
      tc.style.setProperty('--effect-color',c1);
      document.getElementById('txtGradDebug').textContent=`單色模式: ${c1}`;
      document.getElementById('txtGradDebug').style.color='#888';
    }
    document.getElementById('txtGradAngleVal').textContent=ang+'°';
  }catch(e){}
}
function setTxtGradMode(on){
  txtGradOn=on;
  document.querySelectorAll('[data-txtgrad]').forEach(b=>b.classList.toggle('active', (b.dataset.txtgrad==='on')===on));
  applyTextGradient();
}
function randomTxtGrad(){
  const pals=[['#1a1a1a','#555','#999'],['#8a0000','#ff3333','#ff9999'],['#8a6a30','#d4b77a','#fff8d0'],['#0a4a2a','#2ecc71','#a8f0c6'],['#1a1a2e','#4a4a8a','#8888cc'],['#000','#333','#666']];
  const p=pals[Math.floor(Math.random()*pals.length)];
  document.getElementById('txtGradC1').value=p[0];document.getElementById('txtGradC2').value=p[1];document.getElementById('txtGradC3').value=p[2];
  document.getElementById('txtGradAngle').value=Math.floor(Math.random()*360);
  applyTextGradient();
}

function sync(id){
  try{
    const blk=document.getElementById('blk-'+id);if(!blk){ 
      if(id==='title'||id==='content'){
        if(document.getElementById('inp-'+id).value.trim()!==''){
          addTextBlockWithId('blk-'+id, document.getElementById('inp-'+id).value);
        }
        return;
      }
      return;
    }
    const tc=blk.querySelector('.text-content');
    if(id==='content'){let v=document.getElementById('inp-'+id).value;tc.innerHTML=v.replace(/\n/g,'<br>');}else tc.innerHTML=document.getElementById('inp-'+id).value;
    blk.style.display=document.getElementById('inp-'+id).value.trim()===''? 'none':'flex';
    tc.setAttribute('data-text', tc.innerText);
  }catch(e){}
}
function addTextBlockWithId(id, text){
  const div=document.createElement('div');div.className='draggable active';div.id=id;div.style.left='30%';div.style.top='20%';
  div.innerHTML=`<div class="text-content v-mode" style="font-family:'Noto Serif TC',serif;font-size:18px;letter-spacing:2px;line-height:2;--effect-color:#222;--grad-c1:#222;--grad-c2:#555;--grad-c3:#999;--grad-angle:135deg" data-text="${text}">${text}</div>`;
  captureArea.appendChild(div);
  const sel=document.getElementById('targetSelect');const opt=document.createElement('option');opt.value=id;opt.textContent=id;sel.appendChild(opt);
  initDragForOne(div);focusTarget(id);
}
function focusTarget(id){try{if(id==='blk-seal')return;activeId=id;document.querySelectorAll('.draggable').forEach(el=>el.classList.toggle('active',el.id===id));const sel=document.getElementById('targetSelect');if(sel&&sel.querySelector(`option[value="${id}"]`))sel.value=id;const blk=document.getElementById(id);if(blk){const tc=blk.querySelector('.text-content');const ci=document.getElementById('inp-custom');if(ci&&tc)ci.value=tc.innerText||tc.textContent;const sz=parseInt(tc.style.fontSize)||18;document.getElementById('sizeVal').textContent=sz+'px';document.getElementById('sizeRange').value=sz;
    const g1=getComputedStyle(tc).getPropertyValue('--grad-c1').trim()||'#1a1a1a';
    const g2=getComputedStyle(tc).getPropertyValue('--grad-c2').trim()||'#555';
    const g3=getComputedStyle(tc).getPropertyValue('--grad-c3').trim()||'#999';
    const ga=parseInt(getComputedStyle(tc).getPropertyValue('--grad-angle'))||135;
    document.getElementById('txtGradC1').value=g1;document.getElementById('txtGradC2').value=g2;document.getElementById('txtGradC3').value=g3;document.getElementById('txtGradAngle').value=ga;document.getElementById('txtGradAngleVal').textContent=ga+'°';
    txtGradOn=tc.classList.contains('grad-on');
    document.querySelectorAll('[data-txtgrad]').forEach(b=>b.classList.toggle('active', (b.dataset.txtgrad==='on')===txtGradOn));
  }}catch(e){}}
function applyFont(){try{document.getElementById(activeId).querySelector('.text-content').style.fontFamily=document.getElementById('fontSelect').value;}catch(e){}}
function applySize(v){try{const tc=document.getElementById(activeId).querySelector('.text-content');tc.style.fontSize=v+'px';document.getElementById('sizeVal').textContent=v+'px';document.getElementById('sizeRange').value=v;}catch(e){}}
function applyLetterSpacing(v){try{const tc=document.getElementById(activeId).querySelector('.text-content');tc.style.letterSpacing=v+'px';document.getElementById('lsVal').textContent=v+'px';}catch(e){}}
function applyLineHeight(v){try{const tc=document.getElementById(activeId).querySelector('.text-content');tc.style.lineHeight=(v/10).toFixed(1);document.getElementById('lhVal').textContent=(v/10).toFixed(1);}catch(e){}}
function applyRotation(v){try{const blk=document.getElementById(activeId);blk.style.transform=`rotate(${v}deg)`;document.getElementById('rotVal').textContent=v+'°';}catch(e){}}
function setVMode(isV){try{const tc=document.getElementById(activeId).querySelector('.text-content');if(isV){tc.classList.add('v-mode');}else{tc.classList.remove('v-mode');}document.getElementById('btnVMode').classList.toggle('active',isV);document.getElementById('btnHMode').classList.toggle('active',!isV);}catch(e){}}
function applyEffect(eff){
  try{
    const blk=document.getElementById(activeId);const tc=blk.querySelector('.text-content');
    const isV = tc.classList.contains('v-mode');
    const isSeal = tc.classList.contains('seal-box') || blk.id.includes('seal');
    const gradOn = tc.classList.contains('grad-on');
    const g1=tc.style.getPropertyValue('--grad-c1')||getComputedStyle(tc).getPropertyValue('--grad-c1');
    const g2=tc.style.getPropertyValue('--grad-c2')||getComputedStyle(tc).getPropertyValue('--grad-c2');
    const g3=tc.style.getPropertyValue('--grad-c3')||getComputedStyle(tc).getPropertyValue('--grad-c3');
    const ga=tc.style.getPropertyValue('--grad-angle')||getComputedStyle(tc).getPropertyValue('--grad-angle');
    const currentColor = tc.style.getPropertyValue('--effect-color') || '#1a1a1a';
    const txt = tc.innerText;
    tc.className = '';
    tc.classList.add('text-content');
    if(isSeal) tc.classList.add('seal-box');
    if(isV) tc.classList.add('v-mode');
    if(gradOn) tc.classList.add('grad-on');
    if(eff!=='none') tc.classList.add('effect-'+eff);
    tc.style.setProperty('--effect-color', currentColor);
    tc.style.setProperty('--grad-c1', g1);tc.style.setProperty('--grad-c2', g2);tc.style.setProperty('--grad-c3', g3);tc.style.setProperty('--grad-angle', ga);
    tc.dataset.eff=eff;
    tc.setAttribute('data-text', txt);
    if(gradOn) applyTextGradient();
    document.querySelectorAll('[data-effect]').forEach(b=>b.classList.toggle('active',b.dataset.effect===eff));
  }catch(e){}
}
function setFrame(type){
  frameContainer.className=type;
  document.querySelectorAll('[data-frame]').forEach(b=>b.classList.toggle('active',b.dataset.frame===type));
  const fc1=document.getElementById('frameC1'),fc2=document.getElementById('frameC2'),fc3=document.getElementById('frameC3');
  if(type==='woodRed'){fc1.value='#b07070';fc2.value='#4a1e1e';fc3.value='#1a0606';}
  else if(type==='goldArt'){fc1.value='#ffe9a0';fc2.value='#d4b77a';fc3.value='#8a6a30';}
  else if(type==='darkInk'){fc1.value='#4a4a56';fc2.value='#1c1c1f';fc3.value='#020203';}
  else if(type==='hollow'){fc1.value='#f5f0e6';fc2.value='#d8c9a8';fc3.value='#8a7352';}
  else if(type==='relief'){fc1.value='#f5efe0';fc2.value='#c4b5a0';fc3.value='#8a7a6a';}
  else if(type==='stone'){fc1.value='#e8e8e4';fc2.value='#a8a8a0';fc3.value='#5a5a56';}
  else if(type==='metal'){fc1.value='#f0f0f0';fc2.value='#a0a0a0';fc3.value='#606060';}
  else if(type==='jade'){fc1.value='#e8f5e9';fc2.value='#a5d6a7';fc3.value='#5a8a5a';}
  applyFrameGradient();
}

function handlePaperFile(file){

      document.getElementById('paperDebug').textContent=`已載入 ${paperImg.naturalWidth}x${paperImg.naturalHeight} 已自動填滿`;document.getElementById('paperDebug').style.color='#2ecc71';

function initDragForOne(el){
  let sx,sy,il,it,drag=false;
  const down=e=>{ e.stopPropagation(); focusTarget(el.id); drag=true; const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; il=el.offsetLeft; it=el.offsetTop; el.style.zIndex=100; };
  const move=e=>{ if(!drag) return; const p=e.touches?e.touches[0]:e; const s=zoom/100 * paperSizeScale/100; let nl=il+(p.clientX-sx)/s; let nt=it+(p.clientY-sy)/s; el.style.left=nl+'px'; el.style.top=nt+'px'; };
  const up=()=>{ drag=false; el.style.zIndex=20; };
  el.addEventListener('pointerdown',down); el.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('pointermove',move); window.addEventListener('touchmove',e=>{ if(drag){ e.preventDefault(); move(e);} },{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('touchend',up);
}
function initDrag(){
  document.querySelectorAll('.draggable').forEach(el=>initDragForOne(el));

  const pMove=e=>{if(!pDragging) return;const p=e.touches?e.touches[0]:e;const s=zoom/100 * paperSizeScale/100;paperX=pInitX+(p.clientX-pStartX)/s;paperY=pInitY+(p.clientY-pStartY)/s;updatePaperTransform();};
  const pUp=()=>{pDragging=false;};
  paperWrap.addEventListener('pointerdown',pDown);paperWrap.addEventListener('touchstart',pDown,{passive:false});window.addEventListener('pointermove',pMove);window.addEventListener('touchmove',e=>{if(pDragging){e.preventDefault();pMove(e);}},{passive:false});window.addEventListener('pointerup',pUp);window.addEventListener('touchend',pUp);
}
