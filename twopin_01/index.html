<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高級翻譯與搜尋工具</title>
<style>
    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        margin: 0;
        padding: 12px;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        width: 100%;
        max-width: 500px;
        height: 100%;
        max-height: 96vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        padding: 20px;
        box-sizing: border-box;
    }
    
    textarea, #result { 
        width: 100%;
        flex: 1;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        font-size: 16px;
        box-sizing: border-box;
        resize: none;
        text-align: left;
        white-space: pre-wrap;
        word-wrap: break-word;
        background: rgba(15, 23, 42, 0.4);
        color: #f8fafc;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
    }
    
    textarea::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }
    
    textarea:focus {
        background: rgba(15, 23, 42, 0.55);
        border-color: rgba(99, 102, 241, 0.5);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.25), inset 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    #result {
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.15);
        color: #ecfdf5;
        overflow-y: auto;
    }

    /* Layout rows */
    .btn-row, .circle-btns {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 4px 0;
    }

    /* Style circular controls */
    button, .select-wrapper select {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        color: #ffffff;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        user-select: none;
    }

    button svg {
        display: block;
        transition: transform 0.2s;
    }

    /* Interactive states */
    button:hover, .select-wrapper select:hover {
        transform: translateY(-3px) scale(1.08);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
        filter: brightness(1.2);
    }

    button:active, .select-wrapper select:active {
        transform: translateY(1px) scale(0.95);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Dropdown wrapper to ensure standard rendering */
    .select-wrapper {
        position: relative;
        display: inline-block;
        width: 48px;
        height: 48px;
    }

    .select-wrapper select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        text-align: center;
        text-align-last: center;
        font-size: 24px;
        line-height: 46px;
    }

    /* Options style */
    select option {
        background-color: #1e1b4b;
        color: #ffffff;
        font-size: 18px;
    }

    /* Color Schemes */
    .btn-grey {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-lang select {
        background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
    }

    .btn-translate {
        background: linear-gradient(135deg, #10b981 0%, #047857 100%);
    }

    .btn-search {
        background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
    }

    .btn-mic {
        background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
    }

    .btn-clear {
        background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
    }

    .btn-copy {
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
    }

    .btn-speak {
        background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
    }

    /* Animations */
    @keyframes blink-red {
        0%, 100% { border-color: rgba(244, 63, 94, 0.3); box-shadow: 0 0 4px rgba(244, 63, 94, 0.1); }
        50% { border-color: rgba(244, 63, 94, 1); box-shadow: 0 0 16px rgba(244, 63, 94, 0.6); }
    }
    .recording {
        animation: blink-red 1.5s infinite;
        background: rgba(244, 63, 94, 0.08) !important;
    }

    @keyframes blink-green {
        0%, 100% { border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 0 4px rgba(16, 185, 129, 0.1); }
        50% { border-color: rgba(16, 185, 129, 1); box-shadow: 0 0 16px rgba(16, 185, 129, 0.6); }
    }
    .translating {
        animation: blink-green 1.5s infinite;
        background: rgba(16, 185, 129, 0.08) !important;
    }
</style>
</head>
<body>

<div class="container">
    <textarea id="input" placeholder="請輸入文字"></textarea>
    
    <div class="btn-row">
        <button class="btn-grey" onclick="adjustFontSize(-1)" title="縮小字型">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
        <div class="select-wrapper btn-lang">
            <select id="srcLang" onchange="saveLang('src', this.value)" title="來源語言">
                <option value="zh-TW">🇹🇼</option>
                <option value="ja">🇯🇵</option>
                <option value="ko">🇰🇷</option>
                <option value="en">🇺🇸</option>
                <option value="ta">🇮🇳</option>
            </select>
        </div>
        <button class="btn-translate" onclick="translateText()" title="翻譯">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3L21 7L17 11"></path>
                <path d="M3 7H21"></path>
                <path d="M7 21L3 17L7 13"></path>
                <path d="M21 17H3"></path>
            </svg>
        </button>
        <button class="btn-search" onclick="searchWeb()" title="Google 搜尋">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
        <div class="select-wrapper btn-lang">
            <select id="tgtLang" onchange="saveLang('tgt', this.value)" title="目標語言">
                <option value="en">🇺🇸</option>
                <option value="zh-TW">🇹🇼</option>
                <option value="ja">🇯🇵</option>
                <option value="ko">🇰🇷</option>
                <option value="ta">🇮🇳</option>
            </select>
        </div>
        <button class="btn-grey" onclick="adjustFontSize(1)" title="放大字型">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
    </div>

    <div class="circle-btns">
        <button class="btn-mic" onclick="startDictation()" title="語音輸入">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
        </button>
        <button class="btn-clear" onclick="clearInput()" title="清空">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>
        <button class="btn-copy" onclick="copyResult()" title="複製結果">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </button>
        <button class="btn-speak" onclick="speakText()" title="朗讀結果">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
        </button>
    </div>
    
    <div id="result">翻譯結果...</div>
</div>

<script>
    const inputArea = document.getElementById('input');
    const resultArea = document.getElementById('result');

    window.onload = () => {
        document.getElementById('srcLang').value = localStorage.getItem('srcLang') || 'zh-TW';
        document.getElementById('tgtLang').value = localStorage.getItem('tgtLang') || 'en';
    };

    function saveLang(type, val) { localStorage.setItem(type + 'Lang', val); }

    function searchWeb() {
        const text = inputArea.value.trim();
        if (!text) return;
        resultArea.textContent = `正在搜尋: ${text}...`;
        const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(text)}`;
        window.open(searchUrl, '_blank');
    }

    function startDictation() {
        const lang = document.getElementById('srcLang').value;
        const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        recognition.lang = lang;
        recognition.onstart = () => { inputArea.classList.add('recording'); };
        recognition.onend = () => { inputArea.classList.remove('recording'); };
        recognition.start();
        recognition.onresult = (e) => { inputArea.value += e.results[0][0].transcript; };
    }

    async function translateText() {
        const text = inputArea.value.trim();
        if (!text) return;
        
        const sl = document.getElementById('srcLang').value;
        const tl = document.getElementById('tgtLang').value;
        
        resultArea.classList.add('translating');
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            
            let fullTranslation = "";
            data[0].forEach(item => {
                if (item[0]) fullTranslation += item[0];
            });
            resultArea.textContent = fullTranslation;
            
        } catch(e) { 
            resultArea.textContent = "翻譯失敗"; 
        } finally {
            resultArea.classList.remove('translating');
        }
    }

    function clearInput() { inputArea.value = ''; resultArea.textContent = '翻譯結果...'; }
    
    function copyResult() { navigator.clipboard.writeText(resultArea.textContent); }

    function adjustFontSize(dir) {
        const newSize = Math.max(12, parseInt(window.getComputedStyle(inputArea).fontSize) + (dir * 2)) + 'px';
        inputArea.style.fontSize = newSize;
        resultArea.style.fontSize = newSize;
    }

    function speakText() { 
        const u = new SpeechSynthesisUtterance(resultArea.textContent);
        u.lang = document.getElementById('tgtLang').value;
        window.speechSynthesis.speak(u);
    }
</script>
</body>
</html>
