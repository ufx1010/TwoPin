<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字英文打字練習</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5vh;
        }
        h1 {
            color: #222;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .comparison-container {
            width: 100%;
            min-height: 30vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .compare-en {
            font-size: clamp(50px, 15vw, 150px);
            font-family: Arial, sans-serif;
            font-weight: bold;
            line-height: 1.1;
            text-align: center;
            color: #ffffff;
            letter-spacing: 2px;
            word-break: break-all;
        }
        .fake-display-box {
            position: relative;
            width: 300px;
            height: 60px;
            border-bottom: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        #hiddenInput {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 2;
            cursor: text;
        }
        .status-text-layer {
            font-size: 28px;
            font-family: monospace;
            font-weight: bold;
            color: #666;
            letter-spacing: 3px;
        }
        #info-panel {
            min-height: 50px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }
        #translation-display {
            font-size: 28px;
            color: #888;
            font-weight: bold;
        }
        #ipa-display {
            font-size: 22px;
            color: #555;
            font-family: Arial, sans-serif;
        }
        .menu-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }
        #mainMenuToggle {
            background: #111;
            border: 1px solid #333;
            color: #bbb;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            font-weight: bold;
        }
        .grid-menu {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #333;
            margin-top: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 15px 40px rgba(0,0,0,1);
        }
        .grid-menu.show {
            display: grid;
        }
        .grid-item button {
            padding: 15px 10px;
            font-size: 16px;
            font-weight: 500;
            color: #aaa;
            background: #151515;
            border: 1px solid #333;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .grid-item button:active { background: #333; transform: scale(0.98); }
        select {
            width: 100%;
            padding: 14px;
            background: #151515;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 10px;
            font-size: 16px;
        }
        #stats {
            padding: 15px;
            color: #444;
            font-size: 14px;
            border-top: 1px solid #111;
            width: 100%;
            text-align: center;
        }
        .char-hidden { visibility: hidden; }
        .vowel-a { color: #ff2a2a !important; }
        .vowel-e { color: #00ff66 !important; }
        .vowel-i { color: #00bfff !important; }
        .vowel-o { color: #ff8800 !important; }
        .vowel-u { color: #d136ff !important; }
        .normal-char { color: #ffffff !important; }
        .symbol-char { color: #333 !important; }
        /* 這裡優化了打對字母的顏色 */
        .correct-char { color: #2ecc71 !important; text-shadow: 0 0 10px rgba(46, 204, 113, 0.5); }
        .incorrect-char { color: #e74c3c !important; background-color: #331111; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #333;
        }
        .batch-textarea {
            width: 100%;
            height: 250px;
            background: #000;
            color: #ccc;
            border: 1px solid #222;
            padding: 10px;
            font-family: monospace;
            resize: none;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>TYPING PRACTICE</h1>

    <div id="comparison-display" class="comparison-container"></div>

    <div class="fake-display-box" onclick="focusHiddenInput()">
        <input type="search" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="status-text-layer" id="statusDisplay">READY</div>
    </div>

    <div id="info-panel">
        <span id="translation-display"></span>
        <span id="ipa-display"></span>
    </div>

    <div class="menu-wrapper">
        <button id="mainMenuToggle" onclick="toggleMenu()">🛠️ 設定與功能選單</button>
        <div id="gridMenu" class="grid-menu">
            <div class="grid-item"><button onclick="openModal()">📝 修改單字</button></div>
            <div class="grid-item"><button onclick="exportArticle()">📤 匯出檔案</button></div>
            <div class="grid-item">
                <button onclick="triggerImport()">📥 匯入檔案</button>
                <input type="file" id="importFile" accept=".txt,.json" onchange="importArticle(event)" style="display:none">
            </div>
            <div class="grid-item"><button onclick="openProgressModal()">⏸️ 暫停練習</button></div>
            <div class="grid-item"><button id="modeToggleBtn" onclick="togglePlayMode()">⬇️ 順序模式</button></div>
            <div class="grid-item"><button id="muteBtn" onclick="toggleMute()">🔊 語音開啟</button></div>
            <div class="grid-item"><button id="colorModeBtn" onclick="toggleColorMode()">🎨 彩色模式</button></div>
            <div class="grid-item"><button id="hideModeBtn" onclick="toggleHideMode()">👁️ 顯示模式</button></div>
            <div class="grid-item"><button onclick="toggleFullScreen()">💻 全螢幕</button></div>
            <div class="grid-item">
                <select id="speedSelect" onchange="updateSpeed()">
                    <option value="0.5">速度 0.5x</option>
                    <option value="0.8">速度 0.8x</option>
                    <option value="1.0" selected>速度 1.0x</option>
                    <option value="1.2">速度 1.2x</option>
                    <option value="1.5">速度 1.5x</option>
                </select>
            </div>
        </div>
    </div>

    <div id="stats">
        ⏱️ <span id="timerDisplay">00:00</span> | 
        進度 <span id="progress">0 / 0</span> | 
        ✅ <span id="score">0</span> | 
        ❌ <span id="errorCountDisplay">0</span>
    </div>
</div>

<div id="articleModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="color:#eee; margin-top:0">編輯內容</h3>
        <textarea id="batchTextarea" class="batch-textarea"></textarea>
        <div style="margin-top:15px; display:flex; justify-content: space-between;">
            <button onclick="clearModalText()" style="width:auto; color:#e74c3c; border:none; background:none; cursor:pointer">清空全部</button>
            <div>
                <button onclick="closeModal()" style="width:auto; margin-right:10px">取消</button>
                <button onclick="confirmCustomArticle()" style="width:auto; border-color:#2ecc71; color:#2ecc71">套用變更</button>
            </div>
        </div>
    </div>
</div>

<div id="progressModal" class="modal-overlay">
    <div class="modal-content" style="text-align:center; color:#eee">
        <h3>⏸️ 練習已暫停</h3>
        <p>累計時間: <span id="progTime" style="color:#3498db"></span></p>
        <p>已完成: <span id="progCompleted" style="color:#2ecc71"></span> | 剩餘: <span id="progRemaining" style="color:#f1c40f"></span></p>
        <button onclick="resumePractice()" style="margin-top:10px; border-color:#2ecc71; color:#2ecc71; padding:10px 30px; font-size: 18px; border-radius: 8px;">繼續練習</button>
    </div>
</div>

    let originalLinesList = [];
    let currentLineIndex = 0;
    let score = 0;
    let errorCount = 0;
    let isColorMode = true;
    let isRandomMode = false;
    let isHiddenMode = false;
    let currentTypedText = "";
    let isMuted = false;
    let currentSpeed = 1.0;
    let audioCtx = null;
    let isInputLocked = false;

nwood｜木頭｜wʊd\nwool｜羊毛｜wʊl\nword｜字｜wɜːrd\nwork｜工作｜wɜːrk\nwound｜傷口｜wuːnd\nwriting｜寫作｜ˈraɪtɪŋ\nyear｜年｜jɪr";

    function toggleMenu() {
        document.getElementById('gridMenu').classList.toggle('show');
    }

    function playAlertSound() {
        if (isMuted) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch(e) {}
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startTimer() {
        if (isTimerRunning) return;
        isTimerRunning = true;
        timerInterval = setInterval(() => {
            timerSeconds++;
            const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
        }, 1000);
    }

    function stopTimer() {
        isTimerRunning = false;
        clearInterval(timerInterval);
    }

    function focusHiddenInput() {
        document.getElementById('hiddenInput').focus();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('muteBtn').textContent = isMuted ? "🔇 語音關閉" : "🔊 語音開啟";
        if (isMuted) stopRepeatingAudio();
        else startLoopForCurrentWord();
    }

    function toggleColorMode() {
        isColorMode = !isColorMode;
        document.getElementById('colorModeBtn').textContent = isColorMode ? "🎨 彩色模式" : "⬛ 黑白模式";
        renderComparisonView();
    }

    function toggleHideMode() {
        isHiddenMode = !isHiddenMode;
        document.getElementById('hideModeBtn').textContent = isHiddenMode ? "🙈 隱藏模式" : "👁️ 顯示模式";
        renderComparisonView();
    }

    function togglePlayMode() {
        isRandomMode = !isRandomMode;
        document.getElementById('modeToggleBtn').textContent = isRandomMode ? "🔀 隨機模式" : "⬇️ 順序模式";
        applyModeAndRestart();
    }

    function applyModeAndRestart() {
        linesList = isRandomMode ? shuffleArray(originalLinesList) : [...originalLinesList];
        currentLineIndex = 0;
        currentTypedText = "";
        score = 0;
        errorCount = 0;
        timerSeconds = 0;
        stopTimer();
        stopRepeatingAudio();
        document.getElementById('score').textContent = "0";
        document.getElementById('errorCountDisplay').textContent = "0";
        document.getElementById('timerDisplay').textContent = "00:00";
        updateProgress();
        renderComparisonView();
        updateInfoPanel();
        startLoopForCurrentWord();
    }

    function loadDataFromCustomFormat(text) {
        rawArticleText = text;
        let parsedLines = [];
        text.split('\n').forEach(lineStr => {
            let parts = lineStr.split(/[|｜]/);
            if (parts.length >= 1) {
                let original = parts[0].trim();
                let clean = original.replace(/[^a-zA-Z0-9]/g, '');
                if (clean) {
                    parsedLines.push({ words: [{ original, clean, translation: parts[1]?.trim(), ipa: parts[2]?.trim() }] });
                }
            }
        });
        originalLinesList = parsedLines;
        applyModeAndRestart();
    }

    function speakOnce(text) {
        if (isMuted) return;
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = currentSpeed;
        window.speechSynthesis.speak(utterance);
    }

    function startLoopForCurrentWord() {
        stopRepeatingAudio();
        const wordObj = linesList[currentLineIndex]?.words[0];
        if (!wordObj || isMuted) return;
        speakOnce(wordObj.clean);
        repeatAudioTimer = setInterval(() => speakOnce(wordObj.clean), 4000);
    }

    function stopRepeatingAudio() {
        clearInterval(repeatAudioTimer);
        window.speechSynthesis.cancel();
    }

    function renderComparisonView() {
        if (currentLineIndex >= linesList.length) {
            document.getElementById('comparison-display').innerHTML = "<div class='compare-en' style='color:#2ecc71'>FINISH!</div>";
            showStats();
            return;
        }
        const wordObj = linesList[currentLineIndex].words[0];
        let html = "";
        let typedIdx = 0;
        [...wordObj.original].forEach(char => {
            if (/[^a-zA-Z0-9]/.test(char)) {
                html += `<span class="symbol-char">${char}</span>`;
            } else if (typedIdx < currentTypedText.length) {
                // 打對的字：始終顯示翡翠綠
                html += `<span class="correct-char">${char}</span>`;
                typedIdx++;
            } else {
                // 未打的字：根據模式顯示或隱藏
                const hiddenClass = isHiddenMode ? 'char-hidden' : '';
                let colorClass = 'normal-char';
                if (isColorMode && 'aeiou'.includes(char.toLowerCase())) colorClass = `vowel-${char.toLowerCase()}`;
                html += `<span class="${colorClass} ${hiddenClass}">${char}</span>`;
                typedIdx++;
            }
        });
        document.getElementById('comparison-display').innerHTML = `<div class="compare-en">${html}</div>`;
    }

    function updateInfoPanel() {
        const wordObj = linesList[currentLineIndex]?.words[0];
        document.getElementById('translation-display').textContent = wordObj?.translation || "";
        document.getElementById('ipa-display').textContent = wordObj?.ipa || "";
        document.getElementById('statusDisplay').textContent = currentTypedText || "READY";
    }

    function updateProgress() {
        document.getElementById('progress').textContent = `${currentLineIndex + 1} / ${linesList.length}`;
    }

    document.getElementById('hiddenInput').addEventListener('input', (e) => {
        if (isInputLocked || currentLineIndex >= linesList.length) return;
        startTimer();
        const wordObj = linesList[currentLineIndex].words[0];
        const target = wordObj.clean.toLowerCase();
        const input = e.target.value.toLowerCase();

        if (target.startsWith(input)) {
            currentTypedText = input;
            if (currentTypedText === target) {
                score++;
                document.getElementById('score').textContent = score;
                isInputLocked = true;
                stopRepeatingAudio();
                speakOnce(wordObj.clean);
                renderComparisonView();
                setTimeout(() => {
                    currentLineIndex++;
                    currentTypedText = "";
                    e.target.value = "";
                    isInputLocked = false;
                    updateProgress();
                    renderComparisonView();
                    updateInfoPanel();
                    startLoopForCurrentWord();
                }, 600);
            }
        } else {
            errorCount++;
            playAlertSound(); 
            document.getElementById('errorCountDisplay').textContent = errorCount;
            e.target.value = currentTypedText;
        }
        renderComparisonView();
        updateInfoPanel();
    });

    function showStats() {
        stopTimer();
        const panel = document.createElement('div');
        panel.className = 'stats-panel';
        panel.innerHTML = `
            <h2 style="color:white; font-size:40px">練習完成！</h2>
            <p style="color:#888; font-size:24px">答對: ${score} | 錯誤: ${errorCount} | 時間: ${document.getElementById('timerDisplay').textContent}</p>
            <button onclick="location.reload()" style="width:200px; height:50px; font-size:20px; border-color:#2ecc71; color:#2ecc71; background:none; border-radius:10px; cursor:pointer">重新開始</button>
        `;
        document.body.appendChild(panel);
    }

    function openModal() { document.getElementById('batchTextarea').value = rawArticleText; document.getElementById('articleModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('articleModal').style.display = 'none'; }
    function clearModalText() { document.getElementById('batchTextarea').value = ""; }
    function confirmCustomArticle() { loadDataFromCustomFormat(document.getElementById('batchTextarea').value); closeModal(); }
    function openProgressModal() { 
        stopTimer(); 
        document.getElementById('progTime').textContent = document.getElementById('timerDisplay').textContent;
        document.getElementById('progCompleted').textContent = score;
        document.getElementById('progRemaining').textContent = linesList.length - currentLineIndex;
        document.getElementById('progressModal').style.display = 'flex'; 
    }
    function resumePractice() { document.getElementById('progressModal').style.display = 'none'; startTimer(); focusHiddenInput(); }
    function triggerImport() { document.getElementById('importFile').click(); }
    function exportArticle() {
        const blob = new Blob([rawArticleText], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "vocab_list.txt";
        a.click();
    }
    function importArticle(e) {
        const reader = new FileReader();
        reader.onload = (event) => loadDataFromCustomFormat(event.target.result);
        reader.readAsText(e.target.files[0]);
    }
    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }
    function updateSpeed() { currentSpeed = parseFloat(document.getElementById('speedSelect').value); }

    window.onload = () => loadDataFromCustomFormat(rawArticleText);
</script>
