<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>畫中有詩篇</title>
    <!-- 引入 Google Fonts 藝術英文字型與中文字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Sacramento&family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; outline: none; }
        
        /* 頂級夜空黑與科技流光感 */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 50%, #111424 0%, #080a11 100%);
            color: #e5e9f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Noto Serif TC", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 磨砂玻璃 Header */
        header {
            background: rgba(18, 22, 38, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #39cccc;
            text-shadow: 0 0 10px rgba(57, 204, 204, 0.4);
            flex-shrink: 0;
        }
        
        .main-layout {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 40px);
        }
        @media (min-width: 900px) {
            .main-layout { flex-direction: row; }
        }
        
        /* 舞台 */
        .stage {
            flex: 1.4;
            background-color: #05060b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
            position: relative;
            touch-action: none;
            min-height: 0;
        }
        .canvas-box {
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 1px rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: #12131a;
            cursor: move;
            touch-action: none;
            border-radius: 4px;
        }

        /* 磨砂玻璃質感控制面板 */
        .toolbar {
            flex: 1.6;
            background: rgba(13, 16, 28, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            max-width: 100vw;
            flex-shrink: 0;
            box-shadow: -5px 0 25px rgba(0,0,0,0.4);
        }
        @media (min-width: 900px) {
            .toolbar {
                border-top: none;
                border-left: 1px solid rgba(255, 255, 255, 0.08);
                flex: 1;
                max-width: 460px;
            }
        }
        
        .toolbar-scroll-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 24px;
        }
        
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        
        /* 表單元素美化 */
        input[type="text"], select {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 0 10px;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            -webkit-user-select: text;
            user-select: text;
            height: 34px;
            line-height: 34px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type="text"]:focus, select:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #39cccc;
            box-shadow: 0 0 8px rgba(57, 204, 204, 0.3);
        }
        
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            -webkit-user-select: text;
            user-select: text;
            height: 34px;
            min-height: 34px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            resize: none;
        }
        textarea:focus {
            height: 10vh;
            border-color: #39cccc;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px rgba(57,204,204,0.4);
        }

        /* 數值微調控制項 */
        .size-ctrl {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
            height: 34px;
            transition: border-color 0.25s;
        }
        .size-ctrl:hover {
            border-color: rgba(255,255,255,0.25);
        }
        .size-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #e5e9f0;
            border: none;
            width: 32px;
            height: 100%;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .size-btn:hover {
            background: rgba(57, 204, 204, 0.2);
            color: #39cccc;
        }
        .size-btn:active {
            background: #39cccc;
            color: #111;
        }
        .size-val {
            flex: 1;
            text-align: center;
            font-size: 11px;
            font-family: monospace;
            color: #fff;
            white-space: nowrap;
            line-height: 34px;
        }

        .file-label {
            font-size: 11px;
            color: rgba(229, 233, 240, 0.7);
            margin-bottom: 2px;
            display: block;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }
        
        .btn-dl {
            background: linear-gradient(135deg, #39cccc 0%, #2bc0c0 100%);
            color: #0b0d16;
            border: none;
            padding: 0;
            border-radius: 6px;
            width: 100%;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            line-height: 36px;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(57, 204, 204, 0.2);
        }
        .btn-dl:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(57, 204, 204, 0.35);
        }
        .btn-dl:active {
            transform: translateY(1px);
        }

        /* 質感雙分組底層 */
        .top-triple-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            gap: 8px;
            width: 100%;
            align-items: stretch;
        }
        .custom-file-upload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 0 6px;
            text-align: center;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            height: 34px;
            line-height: 34px;
            transition: all 0.25s;
        }
        .custom-file-upload:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255,255,255,0.25);
        }

        /* 收合組件設計 */
        .collapse-container {
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
            margin-top: 2px;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .collapse-header {
            background: rgba(255, 255, 255, 0.04);
            color: #39cccc;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.25s;
        }
        .collapse-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .collapse-content {
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 8px;
            background: rgba(13, 16, 28, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .collapse-content.show {
            display: flex;
        }

        /* 自訂顏色控制點的流暢外觀 */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            cursor: pointer;
            background: transparent !important;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
        }

        /* 調整透明度滑桿範圍條的外觀 */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            width: 100%;
        }
        input[type="range"]:focus {
            outline: none;
        }
        /* 軌道樣式 */
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        /* 滑塊樣式 */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #39cccc;
            border: 2px solid #fff;
            margin-top: -4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type="range"]::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #39cccc;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <header>🏞️畫中有詩篇🗺️</header>

    <div class="main-layout">
        <div class="stage">
            <div class="canvas-box">
                <canvas id="pic-canvas"></canvas>
            </div>
        </div>

        <div class="toolbar" id="ctrl-panel">
            <div class="toolbar-scroll-area">
                <!-- 收合選單 -->
                <div class="collapse-container">
                    <div class="collapse-header" onclick="toggleCollapse()">
                        <span>⚙️ 進階排版設定</span>
                        <span id="collapse-icon">▼ 展開</span>
                    </div>
                    <div class="collapse-content" id="collapse-box">
                        <div class="row">
                            <div class="col" style="flex: 1.1;">
                                <span class="file-label">🀄字型</span>
                                <select id="font-family-select" onchange="shrinkInputs()">
                                    <option value="'Noto Serif TC', 'PMingLiU', 'MingLiU', serif" selected>思源宋體 (Noto Serif TC)</option>
                                    <option value="'Noto Sans TC', 'Microsoft JhengHei', sans-serif">思源黑體 (Noto Sans TC)</option>
                                    <option value="KaiTi, '標楷體', 'DFKai-SB', serif">標準標楷體</option>
                                    <option value="'Microsoft JhengHei', '微軟正黑體', sans-serif">微軟正黑體</option>
                                    <option value="'PingFang TC', '蘋方體', 'Heiti TC', sans-serif">蘋果蘋方 / 黑體</option>
                                    <option value="sans-serif">系統預設字體</option>
                                </select>
                            </div>
                            <div class="col" style="flex: 1.1;">
                                <span class="file-label">🆎字型</span>
                                <select id="english-font-select" onchange="shrinkInputs()">
                                    <option value="'Dancing Script', cursive" selected>優雅手寫</option>
                                    <option value="'Pacifico', cursive">圓潤藝術</option>
                                    <option value="'Great Vibes', cursive">歌德草書</option>
                                    <option value="'Sacramento', cursive">流暢細緻</option>
                                    <option value="'Cinzel', serif">古典羅馬</option>
                                    <option value="'Playfair Display', serif">時尚襯線</option>
                                    <option value="sans-serif">標準無襯線</option>
                                </select>
                            </div>
                            <div class="col" style="flex: 0.4;">
                                <span class="file-label">🎨 字色</span>
                                <input type="color" id="text-color" value="#ffffff" style="width:100%; height:34px; padding:0; cursor:pointer;">
                            </div>
                        </div>

                        <!-- 標題框與內文框底色及透明度設定 -->
                        <div class="row">
                            <div class="col" style="flex: 1.2;">
                                <span class="file-label">⬜ 標題框底色</span>
                                <input type="color" id="title-box-bg-color" value="#000000" style="width:100%; height:34px; padding:0; cursor:pointer;">
                            </div>
                            <div class="col" style="flex: 1.8;">
                                <span class="file-label">💧 標題框透明度 (<span id="val-title-opacity-text">0</span>%)</span>
                                <div style="display: flex; align-items: center; gap: 4px; height: 34px;">
                                    <input type="range" id="title-box-bg-opacity" min="0" max="100" value="0" step="5" style="flex: 1; height: 20px; cursor: pointer; accent-color: #39cccc;">
                                    <button class="size-btn" style="width: 28px; height: 28px; font-size: 11px; border-radius: 4px;" onclick="adjustOpacity('title-box-bg-opacity', -5)">-</button>
                                    <button class="size-btn" style="width: 28px; height: 28px; font-size: 11px; border-radius: 4px;" onclick="adjustOpacity('title-box-bg-opacity', 5)">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col" style="flex: 1.2;">
                                <span class="file-label">⬜ 內文框底色</span>
                                <input type="color" id="content-box-bg-color" value="#000000" style="width:100%; height:34px; padding:0; cursor:pointer;">
                            </div>
                            <div class="col" style="flex: 1.8;">
                                <span class="file-label">💧 內文框透明度 (<span id="val-content-opacity-text">0</span>%)</span>
                                <div style="display: flex; align-items: center; gap: 4px; height: 34px;">
                                    <input type="range" id="content-box-bg-opacity" min="0" max="100" value="0" step="5" style="flex: 1; height: 20px; cursor: pointer; accent-color: #39cccc;">
                                    <button class="size-btn" style="width: 28px; height: 28px; font-size: 11px; border-radius: 4px;" onclick="adjustOpacity('content-box-bg-opacity', -5)">-</button>
                                    <button class="size-btn" style="width: 28px; height: 28px; font-size: 11px; border-radius: 4px;" onclick="adjustOpacity('content-box-bg-opacity', 5)">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col" style="flex: 1;">
                                <span class="file-label">🔄 書寫方向</span>
                                <select id="text-dir" onchange="handleDirectionChange()">
                                    <option value="v-rl">直排：右➡️左</option>
                                    <option value="v-lr">直排：左⬅️右</option>
                                    <option value="h-lr" selected>橫排：左➡️右</option>
                                </select>
                            </div>
                            <div class="col" style="flex: 1;">
                                <span class="file-label">🎯 對齊方式</span>
                                <select id="text-align" onchange="shrinkInputs()">
                                    <option value="start">⬆️靠頂/⬅️置左</option>
                                    <option value="center" selected>🔘置中</option>
                                    <option value="end">⬇️靠底/置右➡️</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="top-triple-row">
                    <!-- 底圖與匯出圖框群組 -->
                    <div class="col" style="flex: 1.1;">
                        <span class="file-label" style="color:#39cccc;">🖼️ 底圖與圖框</span>
                        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                            <label class="custom-file-upload" style="border-color: #39cccc; color: #39cccc; flex: 1; height: 34px; line-height: 34px;">
                                選擇照片
                                <input type="file" id="choose-img" accept="image/*" style="display: none;">
                            </label>
                            <select id="aspect-ratio-select" onchange="handleAspectRatioChange()" style="border-color: #39cccc; color: #39cccc; flex: 1; height: 34px; font-size: 11px;">
                                <option value="original">原始比例 (不裁切)</option>
                                <option value="1:1" selected>1 : 1 正方形</option>
                                <option value="9:16">9 : 16 直式</option>
                                <option value="16:9">16 : 9 橫式</option>
                                <option value="4:3">4 : 3 標準</option>
                                <option value="3:4">3 : 4 直式</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 4px;">
                            <button onclick="clearCanvasData()" style="background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; color: #ff6b6b; border-radius: 6px; padding: 0 4px; font-size: 11px; font-weight: bold; cursor: pointer; height: 34px; flex: 1; transition: all 0.2s;">🗑️ 清除重設</button>
                            <label style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; cursor: pointer; height: 34px; white-space: nowrap; color: #e5e9f0; flex: 1; transition: all 0.2s;">
                                <input type="checkbox" id="lock-bg" style="cursor: pointer; accent-color: #39cccc;"> 🔒 鎖定
                            </label>
                        </div>
                    </div>

                    <!-- 印章群組 -->
                    <div class="col" style="flex: 1.3;">
                        <span class="file-label" style="color:#e67e22;">🎨 印章與圖層</span>
                        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                            <label class="custom-file-upload" style="border-color: #e67e22; color: #e67e22; flex: 1.2; height: 34px; line-height: 34px;">
                                選擇印章
                                <input type="file" id="choose-img2" accept="image/*" style="display: none;">
                            </label>
                            <button id="btn-img2-text-layer" onclick="toggleImg2TextLayer()" style="background: rgba(255,255,255,0.04); border: 1px solid #e67e22; color: #e67e22; border-radius: 6px; padding: 0 4px; font-size: 11px; font-weight: bold; cursor: pointer; height: 34px; white-space: nowrap; flex: 0.8; transition: all 0.2s;">中層</button>
                            <button id="btn-img2-bg-layer" onclick="toggleImg2BgLayer()" style="background: rgba(255,255,255,0.04); border: 1px solid #e67e22; color: #e67e22; border-radius: 6px; padding: 0 4px; font-size: 11px; font-weight: bold; cursor: pointer; height: 34px; white-space: nowrap; flex: 0.8; transition: all 0.2s;">上層</button>
                        </div>
                        <div style="display: flex; gap: 4px;">
                            <div class="size-ctrl" style="border-color:#e67e22; height:34px; flex: 1;">
                                <button class="size-btn" style="background:rgba(255,255,255,0.02); color:#e67e22; width:24px; height:100%;" onclick="changeImg2Scale(-0.05)">-</button>
                                <span class="size-val" id="val-img2-scale" style="color:#e67e22; font-size:10px; font-weight:bold; line-height:34px;">100%</span>
                                <button class="size-btn" style="background:rgba(255,255,255,0.02); color:#e67e22; width:24px; height:100%;" onclick="changeImg2Scale(0.05)">+</button>
                            </div>
                            <div class="size-ctrl" style="border-color:#e67e22; height:34px; flex: 1;">
                                <button class="size-btn" style="background:rgba(255,255,255,0.02); color:#e67e22; width:24px; height:100%;" onclick="changeImg2Angle(-5)">-</button>
                                <span class="size-val" id="val-img2-angle" style="color:#e67e22; font-size:10px; font-weight:bold; line-height:34px;">0°</span>
                                <button class="size-btn" style="background:rgba(255,255,255,0.02); color:#e67e22; width:24px; height:100%;" onclick="changeImg2Angle(5)">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row" style="align-items: flex-start;">
                    <div class="col" style="flex: 1.0;">
                        <span class="file-label">✍️ 標題</span>
                        <textarea id="input-title" placeholder="輸入標題"></textarea>
                    </div>
                    <div class="col" style="flex: 1.0;">
                        <span class="file-label">📐 大小 / 角度 / 微調</span>
                        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                            <div class="size-ctrl" style="flex: 1; height: 34px;">
                                <button class="size-btn" onclick="changeTitleScale(-2)">-</button>
                                <span class="size-val" id="val-title-scale">60</span>     
                                <button class="size-btn" onclick="changeTitleScale(2)">+</button>
                            </div>
                            <div class="size-ctrl" style="flex: 1; height: 34px;">
                                <button class="size-btn" onclick="changeTitleAngle(-5)">-</button>
                                <span class="size-val" id="val-title-angle">0°</span>     
                                <button class="size-btn" onclick="changeTitleAngle(5)">+</button>
                            </div>
                        </div>
                        <div style="display: flex; gap: 4px;">
                            <div class="size-ctrl" style="flex: 1; height: 34px;" title="上下微調">
                                <button class="size-btn" onclick="moveTitlePos(0, -5)">⬆️</button>
                                <span class="size-val" id="val-title-y">↕️上下</span>
                                <button class="size-btn" onclick="moveTitlePos(0, 5)">⬇️</button>
                            </div>
                            <div class="size-ctrl" style="flex: 1; height: 34px;" title="左右微調">
                                <button class="size-btn" onclick="moveTitlePos(-5, 0)">⬅️</button>
                                <span class="size-val" id="val-title-x">↔️左右</span>
                                <button class="size-btn" onclick="moveTitlePos(5, 0)">➡️</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row" style="align-items: flex-start;">
                    <div class="col" style="flex: 1.0;">
                        <span class="file-label">📝 內文 (單指移動/雙指縮放)</span>
                        <textarea id="text-content" placeholder="輸入內文"></textarea>
                    </div>
                    <div class="col" style="flex: 1.0;">
                        <span class="file-label">📐 大小 / 角度 / 微調</span>
                        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                            <div class="size-ctrl" style="flex: 1; height: 34px;">
                                <button class="size-btn" onclick="changeContentScale(-2)">-</button>
                                <span class="size-val" id="val-content-scale">60</span>     
                                <button class="size-btn" onclick="changeContentScale(2)">+</button>
                            </div>
                            <div class="size-ctrl" style="flex: 1; height: 34px;">
                                <button class="size-btn" onclick="changeContentAngle(-5)">-</button>
                                <span class="size-val" id="val-content-angle">0°</span>     
                                <button class="size-btn" onclick="changeContentAngle(5)">+</button>
                            </div>
                        </div>
                        <div style="display: flex; gap: 4px;">
                            <div class="size-ctrl" style="flex: 1; height: 34px;" title="上下微調">
                                <button class="size-btn" onclick="moveContentPos(0, -5)">⬆️</button>
                                <span class="size-val" id="val-content-y">↕️上下</span>
                                <button class="size-btn" onclick="moveContentPos(0, 5)">⬇️</button>
                            </div>
                            <div class="size-ctrl" style="flex: 1; height: 34px;" title="左右微調">
                                <button class="size-btn" onclick="moveContentPos(-5, 0)">⬅️</button>
                                <span class="size-val" id="val-content-x">↔️左右</span>
                                <button class="size-btn" onclick="moveContentPos(5, 0)">➡️</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 功能鍵列 -->
                <div class="row" style="padding-top: 8px; gap: 8px;">
                    <button class="btn-dl" id="save-step" onclick="saveAndContinue()" style="background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); flex: 1; color: #fff; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.25);">💾 儲存進度</button>
                    <button class="btn-dl" id="undo-step" onclick="undoAction()" style="background: linear-gradient(135deg, #7f8c8d 0%, #555 100%); flex: 1; color: #fff; box-shadow: 0 4px 15px rgba(127, 140, 141, 0.2);">↩️ 退回</button>
                    <button class="btn-dl" id="export-pic" onclick="customDownload()" style="background: linear-gradient(135deg, #39cccc 0%, #2bc0c0 100%); flex: 1; box-shadow: 0 4px 15px rgba(57, 204, 204, 0.25);">📷 匯出存檔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pic-canvas');
        const ctx = canvas.getContext('2d');

        let bgImg = new Image();
        let isBgLoaded = false;
        let img2 = new Image();
        let isImg2Loaded = false;
        let img2BehindText = false;   
        let img2BehindBg = false;     

        const bgConf = { x: 0, y: 0, scale: 1.0, angle: 0 };
        const titleObj = { centerX: 400, centerY: 250, width: 100, height: 50, scale: 60, angle: 0, userMoved: false };
        const contentObj = { centerX: 400, centerY: 450, width: 100, height: 100, scale: 60, angle: 0, userMoved: false };
        
        const conf = { gap: 12 };
        const img2Conf = { centerX: 200, centerY: 200, scale: 1.0, angle: 0 };

        let historyStack = [];

        canvas.width = 800; canvas.height = 800;
        window.onload = function() { render(); };

        window.toggleCollapse = function() {
            const box = document.getElementById('collapse-box');
            const icon = document.getElementById('collapse-icon');
            box.classList.toggle('show');
            if (box.classList.contains('show')) {
                icon.innerText = "▲ 收起";
                setTimeout(() => {
                    const scrollArea = document.querySelector('.toolbar-scroll-area');
                    scrollArea.scrollTop = 0; 
                }, 100);
            } else {
                icon.innerText = "▼ 展開";
            }
        };

        window.shrinkInputs = function() {
            document.getElementById('text-content').blur();
            document.getElementById('input-title').blur();
        };

        window.handleDirectionChange = function() {
            shrinkInputs();
            const dir = document.getElementById('text-dir').value;
            const alignSelect = document.getElementById('text-align');
            alignSelect.value = (dir === 'h-lr') ? 'center' : 'start';
            render();
        };

        window.toggleImg2TextLayer = function() {
            img2BehindText = !img2BehindText;
            const btn = document.getElementById('btn-img2-text-layer');
            if (img2BehindText) {
                btn.innerHTML = "上層";
                btn.style.color = "#fff";
                btn.style.background = "#e67e22";
            } else {
                btn.innerHTML = "中層";
                btn.style.color = "#e67e22";
                btn.style.background = "#2b2b2b";
            }
            render();
        };

        window.toggleImg2BgLayer = function() {
            img2BehindBg = !img2BehindBg;
            const btn = document.getElementById('btn-img2-bg-layer');
            if (img2BehindBg) {
                btn.innerHTML = "下層";
                btn.style.color = "#fff";
                btn.style.background = "#e67e22";
            } else {
                btn.innerHTML = "上層";
                btn.style.color = "#e67e22";
                btn.style.background = "#2b2b2b";
            }
            render();
        };

        window.adjustOpacity = function(elementId, amount) {
            const slider = document.getElementById(elementId);
            let val = parseInt(slider.value) + amount;
            val = Math.max(0, Math.min(100, val));
            slider.value = val;
            if (elementId === 'title-box-bg-opacity') {
                document.getElementById('val-title-opacity-text').innerText = val;
            } else {
                document.getElementById('val-content-opacity-text').innerText = val;
            }
            render();
        };

        document.getElementById('ctrl-panel').addEventListener('click', function(e) {
            if(e.target.id !== 'text-content' && e.target.id !== 'input-title') {
                shrinkInputs();
            }
        });

        window.clearCanvasData = function() {
            saveStateToHistory();
            isBgLoaded = false;
            bgImg = new Image();
            isImg2Loaded = false;
            img2 = new Image();
            document.getElementById('input-title').value = '';
            document.getElementById('text-content').value = '';
            document.getElementById('aspect-ratio-select').value = '1:1';
            
            document.getElementById('title-box-bg-opacity').value = '0';
            document.getElementById('val-title-opacity-text').innerText = '0';
            document.getElementById('content-box-bg-opacity').value = '0';
            document.getElementById('val-content-opacity-text').innerText = '0';

            canvas.width = 800;
            canvas.height = 800;
            bgConf.x = 0; bgConf.y = 0; bgConf.scale = 1.0; bgConf.angle = 0;
            titleObj.scale = 60; titleObj.angle = 0;
            contentObj.scale = 60; contentObj.angle = 0;
            
            document.getElementById('val-title-scale').innerText = "60";
            document.getElementById('val-title-angle').innerText = "0°";
            document.getElementById('val-content-scale').innerText = "60";
            document.getElementById('val-content-angle').innerText = "0°";
            render();
        };

        window.changeTitleScale = function(amt) {
            shrinkInputs();
            titleObj.scale = Math.max(4, Math.min(300, titleObj.scale + amt));
            document.getElementById('val-title-scale').innerText = Math.round(titleObj.scale);
            requestRender();
        };

        window.changeTitleAngle = function(amt) {
            shrinkInputs();
            titleObj.angle = (titleObj.angle + amt) % 360;
            document.getElementById('val-title-angle').innerText = titleObj.angle + '°';
            requestRender();
        };

        window.moveTitlePos = function(dx, dy) {
            shrinkInputs();
            saveStateToHistory();
            titleObj.centerX += dx;
            titleObj.centerY += dy;
            titleObj.userMoved = true;
            requestRender();
        };

        window.changeContentScale = function(amt) {
            shrinkInputs();
            contentObj.scale = Math.max(4, Math.min(300, contentObj.scale + amt));
            document.getElementById('val-content-scale').innerText = Math.round(contentObj.scale);
            requestRender();
        };

        window.changeContentAngle = function(amt) {
            shrinkInputs();
            contentObj.angle = (contentObj.angle + amt) % 360;
            document.getElementById('val-content-angle').innerText = contentObj.angle + '°';
            requestRender();
        };

        window.moveContentPos = function(dx, dy) {
            shrinkInputs();
            saveStateToHistory();
            contentObj.centerX += dx;
            contentObj.centerY += dy;
            contentObj.userMoved = true;
            requestRender();
        };

        window.changeImg2Scale = function(amt) {
            img2Conf.scale = Math.max(0.01, Math.min(15.0, img2Conf.scale + amt));
            document.getElementById('val-img2-scale').innerText = Math.round(img2Conf.scale * 100) + "%";
            if (isImg2Loaded) requestRender();
        };

        window.changeImg2Angle = function(amt) {
            img2Conf.angle = (img2Conf.angle + amt) % 360;
            document.getElementById('val-img2-angle').innerText = img2Conf.angle + '°';
            if (isImg2Loaded) requestRender();
        };

        function updateCanvasDimensionsByRatio() {
            const ratioVal = document.getElementById('aspect-ratio-select').value;
            let baseSize = 800;
            if (ratioVal === 'original' && isBgLoaded) {
                canvas.width = bgImg.naturalWidth;
                canvas.height = bgImg.naturalHeight;
                return;
            }
            
            let w = baseSize, h = baseSize;
            if (ratioVal === '1:1') { w = 800; h = 800; }
            else if (ratioVal === '9:16') { w = 720; h = 1280; }
            else if (ratioVal === '16:9') { w = 1280; h = 720; }
            else if (ratioVal === '4:3') { w = 1024; h = 768; }
            else if (ratioVal === '3:4') { w = 768; h = 1024; }
            else if (ratioVal === 'original') { w = 800; h = 800; }
            
            canvas.width = w;
            canvas.height = h;
        }

        function fitImageToCanvas() {
            if (!bgImg.naturalWidth) return;
            updateCanvasDimensionsByRatio();

            const cRatio = canvas.width / canvas.height;
            const imgRatio = bgImg.naturalWidth / bgImg.naturalHeight;

            if (imgRatio > cRatio) {
                bgConf.scale = canvas.height / bgImg.naturalHeight;
            } else {
                bgConf.scale = canvas.width / bgImg.naturalWidth;
            }
            bgConf.x = (canvas.width - bgImg.naturalWidth * bgConf.scale) / 2;
            bgConf.y = (canvas.height - bgImg.naturalHeight * bgConf.scale) / 2;
            bgConf.angle = 0;

            const dir = document.getElementById('text-dir').value;
            contentObj.centerX = (dir === 'v-rl') ? canvas.width * 0.75 : canvas.width * 0.25;
            contentObj.centerY = canvas.height * 0.5;
            titleObj.centerX = (dir === 'v-rl') ? canvas.width * 0.85 : canvas.width * 0.25;
            titleObj.centerY = canvas.height * 0.2;
            contentObj.userMoved = false;
            titleObj.userMoved = false;
        }

        window.handleAspectRatioChange = function() {
            saveStateToHistory();
            if (isBgLoaded) {
                fitImageToCanvas();
            } else {
                updateCanvasDimensionsByRatio();
                const dir = document.getElementById('text-dir').value;
                contentObj.centerX = (dir === 'v-rl') ? canvas.width * 0.75 : canvas.width * 0.25;
                contentObj.centerY = canvas.height * 0.5;
                titleObj.centerX = (dir === 'v-rl') ? canvas.width * 0.85 : canvas.width * 0.25;
                titleObj.centerY = canvas.height * 0.2;
            }
            render();
        };

        document.getElementById('choose-img').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            saveStateToHistory();
            const reader = new FileReader();
            reader.onload = function(evt) {
                bgImg = new Image();
                bgImg.onload = function() {
                    isBgLoaded = true;
                    fitImageToCanvas();
                    if(isImg2Loaded) { img2Conf.centerX = canvas.width / 2; img2Conf.centerY = canvas.height / 2; }
                    render();
                };
                bgImg.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('choose-img2').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            saveStateToHistory();
            const reader = new FileReader();
            reader.onload = function(evt) {
                img2 = new Image();
                img2.onload = function() {
                    isImg2Loaded = true;
                    img2Conf.centerX = canvas.width / 2;
                    img2Conf.centerY = canvas.height / 2;
                    img2Conf.scale = 1.0;
                    img2Conf.angle = 0;
                    document.getElementById('val-img2-scale').innerText = "100%";
                    document.getElementById('val-img2-angle').innerText = "0°";
                    render();
                };
                img2.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function getCanvasCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        let activeObj = null;
        let dragOffset = { x: 0, y: 0 };
        let initialPinchDist = null;
        let initialPinchAngle = 0;
        let initialPinchScale = 1.0;
        let initialBgAngle = 0;

        function dragStart(e) {
            shrinkInputs();
            activeObj = null;

            const isBgLocked = document.getElementById('lock-bg').checked;

            if (e.touches && e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialPinchAngle = Math.atan2(
                    e.touches[1].clientY - e.touches[0].clientY,
                    e.touches[1].clientX - e.touches[0].clientX
                ) * (180 / Math.PI);

                const pos = getCanvasCoord(e);
                const contentDist = Math.hypot(pos.x - contentObj.centerX, pos.y - contentObj.centerY);
                if (document.getElementById('text-content').value.trim() !== '' && contentDist < Math.max(contentObj.width, contentObj.height) / 1.0) {
                    saveStateToHistory();
                    activeObj = 'pinch-content';
                    initialPinchScale = contentObj.scale;
                    if (e.cancelable) e.preventDefault();
                    return;
                }

                const titleDist = Math.hypot(pos.x - titleObj.centerX, pos.y - titleObj.centerY);
                if (titleTextActive() && titleDist < Math.max(titleObj.width, titleObj.height) / 1.0) {
                    saveStateToHistory();
                    activeObj = 'pinch-title';
                    initialPinchScale = titleObj.scale;
                    if (e.cancelable) e.preventDefault();
                    return;
                }

                if (!isBgLocked && isBgLoaded) {
                    saveStateToHistory();
                    activeObj = 'pinch-bg';
                    initialPinchScale = bgConf.scale;
                    initialBgAngle = bgConf.angle;
                    if (e.cancelable) e.preventDefault();
                }
                return;
            }

            const pos = getCanvasCoord(e);

            if (isImg2Loaded) {
                const w = img2.naturalWidth * img2Conf.scale;
                const h = img2.naturalHeight * img2Conf.scale;
                const img2Dist = Math.hypot(pos.x - img2Conf.centerX, pos.y - img2Conf.centerY);
                if (img2Dist < Math.max(w, h) / 1.2) {
                    saveStateToHistory();
                    activeObj = 'img2';
                    dragOffset.x = pos.x - img2Conf.centerX;
                    dragOffset.y = pos.y - img2Conf.centerY;
                    if (e.cancelable) e.preventDefault();
                    return;
                }
            }

            const contentDist = Math.hypot(pos.x - contentObj.centerX, pos.y - contentObj.centerY);
            if (document.getElementById('text-content').value.trim() !== '' && contentDist < Math.max(contentObj.width, contentObj.height) / 1.4) {
                saveStateToHistory();
                activeObj = 'content';
                dragOffset.x = pos.x - contentObj.centerX;
                dragOffset.y = pos.y - contentObj.centerY;
                contentObj.userMoved = true;
                if (e.cancelable) e.preventDefault();
                return;
            }

            const titleDist = Math.hypot(pos.x - titleObj.centerX, pos.y - titleObj.centerY);
            if (titleTextActive() && titleDist < Math.max(titleObj.width, titleObj.height) / 1.2) {
                saveStateToHistory();
                activeObj = 'title';
                dragOffset.x = pos.x - titleObj.centerX;
                dragOffset.y = pos.y - titleObj.centerY;
                titleObj.userMoved = true;
                if (e.cancelable) e.preventDefault();
                return;
            }

            if (isBgLoaded && !isBgLocked) {
                saveStateToHistory();
                activeObj = 'bg';
                dragOffset.x = pos.x - bgConf.x;
                dragOffset.y = pos.y - bgConf.y;
                if (e.cancelable) e.preventDefault();
            }
        }

        function titleTextActive() {
            const rawTitle = document.getElementById('input-title').value;
            return (rawTitle.trim() !== '');
        }

        function dragMove(e) {
            if (!activeObj) return;

            if ((activeObj === 'pinch-bg' || activeObj === 'pinch-content' || activeObj === 'pinch-title') && e.touches && e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const currentAngle = Math.atan2(
                    e.touches[1].clientY - e.touches[0].clientY,
                    e.touches[1].clientX - e.touches[0].clientX
                ) * (180 / Math.PI);

                if (initialPinchDist) {
                    const scaleFactor = currentDist / initialPinchDist;
                    const angleDiff = currentAngle - initialPinchAngle;

                    if (activeObj === 'pinch-bg') {
                        bgConf.scale = Math.max(0.05, Math.min(10.0, initialPinchScale * scaleFactor));
                        bgConf.angle = (initialBgAngle + angleDiff) % 360;
                    } else if (activeObj === 'pinch-content') {
                        contentObj.scale = Math.max(4, Math.min(300, initialPinchScale * scaleFactor));
                        document.getElementById('val-content-scale').innerText = Math.round(contentObj.scale);
                    } else if (activeObj === 'pinch-title') {
                        titleObj.scale = Math.max(4, Math.min(300, initialPinchScale * scaleFactor));
                        document.getElementById('val-title-scale').innerText = Math.round(titleObj.scale);
                    }
                    requestRender();
                }
                if (e.cancelable) e.preventDefault();
                return;
            }

            const pos = getCanvasCoord(e);

            if (activeObj === 'content') {
                contentObj.centerX = pos.x - dragOffset.x;
                contentObj.centerY = pos.y - dragOffset.y;
            } else if (activeObj === 'title') {
                titleObj.centerX = pos.x - dragOffset.x;
                titleObj.centerY = pos.y - dragOffset.y;
            } else if (activeObj === 'img2') {
                img2Conf.centerX = pos.x - dragOffset.x;
                img2Conf.centerY = pos.y - dragOffset.y;
            } else if (activeObj === 'bg') {
                bgConf.x = pos.x - dragOffset.x;
                bgConf.y = pos.y - dragOffset.y;
            }
            if (e.cancelable) e.preventDefault();
            requestRender();
        }

        function dragEnd(e) { 
            activeObj = null; 
            initialPinchDist = null;
        }

        canvas.addEventListener('mousedown', dragStart);
        canvas.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('touchend', dragEnd);

        document.getElementById('title-box-bg-opacity').addEventListener('input', function() {
            document.getElementById('val-title-opacity-text').innerText = this.value;
            requestRender();
        });
        document.getElementById('content-box-bg-opacity').addEventListener('input', function() {
            document.getElementById('val-content-opacity-text').innerText = this.value;
            requestRender();
        });

        const elIds = ['input-title', 'text-content', 'font-family-select', 'english-font-select', 'text-color', 'title-box-bg-color', 'content-box-bg-color', 'text-align', 'aspect-ratio-select'];
        elIds.forEach(id => {
            document.getElementById(id).addEventListener('input', requestRender);
            document.getElementById(id).addEventListener('change', requestRender);
        });

        function saveStateToHistory() {
            const state = {
                title: document.getElementById('input-title').value,
                content: document.getElementById('text-content').value,
                bgSrc: isBgLoaded ? bgImg.src : null,
                canvasW: canvas.width,
                canvasH: canvas.height,
                bgConf: { ...bgConf },
                contentObj: { ...contentObj },
                titleObj: { ...titleObj },
                img2Conf: { ...img2Conf },
                isBgLoaded: isBgLoaded,
                isImg2Loaded: isImg2Loaded,
                titleBoxBgColor: document.getElementById('title-box-bg-color').value,
                titleBoxBgOpacity: document.getElementById('title-box-bg-opacity').value,
                contentBoxBgColor: document.getElementById('content-box-bg-color').value,
                contentBoxBgOpacity: document.getElementById('content-box-bg-opacity').value
            };
            historyStack.push(state);
            if (historyStack.length > 20) historyStack.shift();
        }

        window.undoAction = function() {
            if (historyStack.length === 0) {
                alert("沒有可以復原的操作記錄了。");
                return;
            }
            const prevState = historyStack.pop();
            document.getElementById('input-title').value = prevState.title;
            document.getElementById('text-content').value = prevState.content;
            
            document.getElementById('title-box-bg-color').value = prevState.titleBoxBgColor || '#000000';
            document.getElementById('title-box-bg-opacity').value = prevState.titleBoxBgOpacity || '0';
            document.getElementById('val-title-opacity-text').innerText = prevState.titleBoxBgOpacity || '0';

            document.getElementById('content-box-bg-color').value = prevState.contentBoxBgColor || '#000000';
            document.getElementById('content-box-bg-opacity').value = prevState.contentBoxBgOpacity || '0';
            document.getElementById('val-content-opacity-text').innerText = prevState.contentBoxBgOpacity || '0';

            canvas.width = prevState.canvasW;
            canvas.height = prevState.canvasH;
            Object.assign(bgConf, prevState.bgConf);
            Object.assign(contentObj, prevState.contentObj);
            Object.assign(titleObj, prevState.titleObj);
            Object.assign(img2Conf, prevState.img2Conf);
            isBgLoaded = prevState.isBgLoaded;
            isImg2Loaded = prevState.isImg2Loaded;

            document.getElementById('val-title-scale').innerText = Math.round(titleObj.scale);
            document.getElementById('val-title-angle').innerText = titleObj.angle + "°";
            document.getElementById('val-content-scale').innerText = Math.round(contentObj.scale);
            document.getElementById('val-content-angle').innerText = contentObj.angle + "°";
            document.getElementById('val-img2-scale').innerText = Math.round(img2Conf.scale * 100) + "%";
            document.getElementById('val-img2-angle').innerText = img2Conf.angle + "°";

            if (isBgLoaded) {
                let restoredImg = new Image();
                restoredImg.onload = function() {
                    bgImg = restoredImg;
                    render();
                };
                restoredImg.src = prevState.bgSrc;
            } else {
                render();
            }
        };

        function drawChar(char, x, y, size, font, isDirVertical, isAuthor) {
            let fontStyle = isAuthor ? `italic ${size}px ${font}` : `${size}px ${font}`;
            ctx.font = fontStyle;
            
            if (!isDirVertical) { ctx.fillText(char, x, y); return; }

            if ('，。、；：:！？'.indexOf(char) !== -1) {
                ctx.save(); ctx.translate(x + size * 0.25, y - size * 0.08); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(char, 0, 0); ctx.restore(); return;
            }
            if (char === '《' || char === '<' || char === '『' || char === '‘' || char === '“' || char === '「') { 
                ctx.save(); ctx.translate(x, y + size * 0.4); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = isAuthor ? `italic bold ${size}px ${font}` : `bold ${size}px ${font}`; 
                ctx.fillText('︽', 0, 0); ctx.restore(); return; 
            }
            if (char === '》' || char === '>' || char === '』' || char === '’' || char === '”' || char === '」') { 
                ctx.save(); ctx.translate(x, y + size * 0.4); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = isAuthor ? `italic bold ${size}px ${font}` : `bold ${size}px ${font}`; 
                ctx.fillText('︾', 0, 0); ctx.restore(); return; 
            }

            const isEmoji = /[\uD800-\uDBFF][\uDC00-\uDFFF]|\u261d|\u270c|\u2b50|\u2605|\u2606/g.test(char);
            if (isEmoji) {
                ctx.save(); ctx.translate(x, y + size * 0.45); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(char, 0, 0); ctx.restore(); return;
            }
            ctx.fillText(char, x, y);
        }

        function splitStringIntoChars(str) { return Array.from(str); }

        function drawBg() {
            if (isBgLoaded) {
                ctx.save();
                ctx.translate(bgConf.x, bgConf.y);
                ctx.translate((bgImg.naturalWidth * bgConf.scale) / 2, (bgImg.naturalHeight * bgConf.scale) / 2);
                ctx.rotate((bgConf.angle * Math.PI) / 180);
                ctx.drawImage(bgImg, -(bgImg.naturalWidth * bgConf.scale) / 2, -(bgImg.naturalHeight * bgConf.scale) / 2, bgImg.naturalWidth * bgConf.scale, bgImg.naturalHeight * bgConf.scale);
                ctx.restore();
            } else {
                ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function hexToRgba(hex, opacity) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            let num = parseInt(c, 16);
            let r = (num >> 16) & 255;
            let g = (num >> 8) & 255;
            let b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        function drawTextAndTitle() {
            const rawTitle = document.getElementById('input-title').value;
            const content = document.getElementById('text-content').value;
            const selectFont = document.getElementById('font-family-select').value;
            const englishFont = document.getElementById('english-font-select').value;
            const color = document.getElementById('text-color').value;
            
            const titleBoxBgHex = document.getElementById('title-box-bg-color').value;
            const titleOpacityVal = parseFloat(document.getElementById('title-box-bg-opacity').value) / 100;
            
            const contentBoxBgHex = document.getElementById('content-box-bg-color').value;
            const contentOpacityVal = parseFloat(document.getElementById('content-box-bg-opacity').value) / 100;

            const dir = document.getElementById('text-dir').value;
            const align = document.getElementById('text-align').value;

            function getCompositeFont(textStr, sizePx) {
                let fontToUse = /[a-zA-Z0-9]/.test(textStr) ? englishFont : selectFont;
                return `${sizePx}px ${fontToUse}`;
            }

            if (!contentObj.userMoved && isBgLoaded) {
                contentObj.centerX = (dir === 'v-rl') ? canvas.width * 0.75 : canvas.width * 0.25;
                contentObj.centerY = canvas.height * 0.5;
            }
            if (!titleObj.userMoved && isBgLoaded) {
                titleObj.centerX = (dir === 'v-rl') ? canvas.width * 0.85 : canvas.width * 0.25;
                titleObj.centerY = canvas.height * 0.2;
            }

            // 1. 繪製標題
            if (rawTitle.trim() !== '') {
                let titleLines = rawTitle.split('\n');
                ctx.save();
                ctx.translate(titleObj.centerX, titleObj.centerY);
                ctx.rotate((titleObj.angle * Math.PI) / 180);
                
                const scaledTitleSize = titleObj.scale;
                let titleW = 0, titleH = 0;

                if (dir === 'h-lr') {
                    titleH = titleLines.length * scaledTitleSize + (titleLines.length - 1) * conf.gap;
                    let maxW = 0;
                    titleLines.forEach((l) => {
                        ctx.font = getCompositeFont(l, scaledTitleSize);
                        let m = ctx.measureText(l).width;
                        if (m > maxW) maxW = m;
                    });
                    titleW = maxW;
                } else {
                    let cols = [];
                    titleLines.forEach(l => {
                        let charsObj = splitStringIntoChars(l).map(c => ({ char: c, size: scaledTitleSize }));
                        cols.push({ chars: charsObj, size: scaledTitleSize });
                    });
                    let maxH = 0;
                    cols.forEach(c => {
                        let colH = c.chars.length * scaledTitleSize;
                        if (colH > maxH) maxH = colH;
                    });
                    titleH = maxH;
                    titleW = cols.length * scaledTitleSize + (cols.length - 1) * conf.gap;
                }
                titleObj.width = titleW;
                titleObj.height = titleH;

                if (titleOpacityVal > 0) {
                    ctx.fillStyle = hexToRgba(titleBoxBgHex, titleOpacityVal);
                    let padding = 16;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(-titleW/2 - padding, -titleH/2 - padding, titleW + padding*2, titleH + padding*2, 8);
                    } else {
                        ctx.rect(-titleW/2 - padding, -titleH/2 - padding, titleW + padding*2, titleH + padding*2);
                    }
                    ctx.fill();
                }

                if (dir === 'h-lr') {
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = color;
                    ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = canvas.width * 0.006; ctx.shadowOffsetX = canvas.width * 0.002; ctx.shadowOffsetY = canvas.width * 0.002;

                    let startY = -titleH / 2 + scaledTitleSize / 2;
                    titleLines.forEach((l, idx) => {
                        ctx.font = getCompositeFont(l, scaledTitleSize);
                        let currentY = startY + idx * (scaledTitleSize + conf.gap);
                        ctx.fillText(l, 0, currentY);
                    });
                } else {
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                    let cols = [];
                    titleLines.forEach(l => {
                        let charsObj = splitStringIntoChars(l).map(c => ({ char: c, size: scaledTitleSize }));
                        cols.push({ chars: charsObj, size: scaledTitleSize });
                    });

                    ctx.fillStyle = color;
                    ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = canvas.width * 0.006; ctx.shadowOffsetX = canvas.width * 0.002; ctx.shadowOffsetY = canvas.width * 0.002;

                    let startX = (dir === 'v-rl' ? titleW / 2 : -titleW / 2);

                    cols.forEach(c => {
                        let colH = c.chars.length * scaledTitleSize;
                        let drawY = -titleH / 2;
                        let currentX = startX + (dir === 'v-rl' ? -scaledTitleSize/2 : scaledTitleSize/2);

                        c.chars.forEach((chObj, i) => {
                            let chosenFont = /[a-zA-Z0-9]/.test(chObj.char) ? englishFont : selectFont;
                            drawChar(chObj.char, currentX, drawY + (i * scaledTitleSize), scaledTitleSize, chosenFont, true, false);
                        });

                        if (dir === 'v-rl') startX -= (scaledTitleSize + conf.gap);
                        else startX += (scaledTitleSize + conf.gap);
                    });
                }
                ctx.restore();
            } else {
                titleObj.width = 0; titleObj.height = 0;
            }

            // 2. 繪製內文
            if (content.trim() !== '') {
                let lines = content.split('\n');
                ctx.save();
                ctx.translate(contentObj.centerX, contentObj.centerY);
                ctx.rotate((contentObj.angle * Math.PI) / 180);

                let contentW = 0, contentH = 0;
                const scaledContentSize = contentObj.scale;

                if (dir === 'h-lr') {
                    let blockLines = [];
                    lines.forEach((l, idx) => {
                        blockLines.push({ 
                            text: l, 
                            size: scaledContentSize,
                            isLastLine: (idx === lines.length - 1)
                        });
                    });

                    let estimatedH = 0;
                    blockLines.forEach((b, idx) => {
                        estimatedH += b.size;
                        if (idx < blockLines.length - 1) estimatedH += conf.gap;
                    });
                    contentH = estimatedH;

                    blockLines.forEach(b => {
                        ctx.font = getCompositeFont(b.text, scaledContentSize);
                        let m = ctx.measureText(b.text).width;
                        if(m > contentW) contentW = m;
                    });

                    if (contentOpacityVal > 0) {
                        ctx.fillStyle = hexToRgba(contentBoxBgHex, contentOpacityVal);
                        let padding = 16;
                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(-contentW/2 - padding, -contentH/2 - padding, contentW + padding*2, contentH + padding*2, 8);
                        } else {
                            ctx.rect(-contentW/2 - padding, -contentH/2 - padding, contentW + padding*2, contentH + padding*2);
                        }
                        ctx.fill();
                    }

                    ctx.fillStyle = color;
                    ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = canvas.width * 0.006; ctx.shadowOffsetX = canvas.width * 0.002; ctx.shadowOffsetY = canvas.width * 0.002;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                    let startY = -estimatedH / 2;
                    blockLines.forEach(b => {
                        ctx.font = getCompositeFont(b.text, b.size);
                        ctx.fillText(b.text, 0, startY + b.size/2);
                        startY += b.size + conf.gap;
                    });
                } else {
                    let cols = [];
                    lines.forEach((l) => {
                        let charsObj = splitStringIntoChars(l).map(c => ({ char: c, size: scaledContentSize, isAuthor: false }));
                        cols.push({ chars: charsObj, size: scaledContentSize });
                    });

                    let maxH = 0;
                    cols.forEach(c => {
                        let colH = 0;
                        c.chars.forEach(ch => { colH += ch.size * 1.0; });
                        if (colH > maxH) maxH = colH;
                    });
                    contentH = maxH;

                    let estimatedW = 0;
                    cols.forEach((c, idx) => {
                        estimatedW += c.size;
                        if (idx < cols.length - 1) estimatedW += conf.gap;
                    });
                    contentW = estimatedW;

                    if (contentOpacityVal > 0) {
                        ctx.fillStyle = hexToRgba(contentBoxBgHex, contentOpacityVal);
                        let padding = 16;
                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(-contentW/2 - padding, -contentH/2 - padding, contentW + padding*2, contentH + padding*2, 8);
                        } else {
                            ctx.rect(-contentW/2 - padding, -contentH/2 - padding, contentW + padding*2, contentH + padding*2);
                        }
                        ctx.fill();
                    }

                    ctx.fillStyle = color;
                    ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = canvas.width * 0.006; ctx.shadowOffsetX = canvas.width * 0.002; ctx.shadowOffsetY = canvas.width * 0.002;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top';

                    let startX = (dir === 'v-rl' ? estimatedW / 2 : -estimatedW / 2);

                    cols.forEach(c => {
                        let colH = 0;
                        c.chars.forEach(ch => { colH += ch.size * 1.0; });

                        let drawY = -contentH / 2;
                        if (align === 'center') {
                            drawY = -colH / 2;
                        } else if (align === 'end') {
                            drawY = (contentH / 2) - colH;
                        }

                        let currentX = startX + (dir === 'v-rl' ? -c.size/2 : c.size/2);

                        for (let i = 0; i < c.chars.length; i++) {
                            let chObj = c.chars[i];
                            let chosenFont = /[a-zA-Z0-9]/.test(chObj.char) ? englishFont : selectFont;
                            drawChar(chObj.char, currentX, drawY, chObj.size, chosenFont, true, chObj.isAuthor);
                            drawY += chObj.size * 1.0;
                        }
                        
                        if (dir === 'v-rl') startX -= (c.size + conf.gap);
                        else startX += (c.size + conf.gap);
                    });
                }
                contentObj.width = contentW; contentObj.height = contentH;
                ctx.restore();
            } else {
                contentObj.width = 0; contentObj.height = 0;
            }
        }

        function drawImg2() {
            if (!isImg2Loaded) return;
            ctx.save();
            ctx.translate(img2Conf.centerX, img2Conf.centerY);
            ctx.rotate((img2Conf.angle * Math.PI) / 180);
            const w = img2.naturalWidth * img2Conf.scale;
            const h = img2.naturalHeight * img2Conf.scale;
            ctx.drawImage(img2, -w/2, -h/2, w, h);
            ctx.restore();
        }

        let renderRequested = false;
        function requestRender() {
            if (!renderRequested) {
                renderRequested = true;
                requestAnimationFrame(() => {
                    renderRequested = false;
                    render();
                });
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (img2BehindBg) {
                drawImg2();
                drawBg();
            } else {
                drawBg();
            }

            if (img2BehindText) {
                if (!img2BehindBg) drawImg2();
                drawTextAndTitle();
            } else {
                drawTextAndTitle();
                if (!img2BehindBg) drawImg2();
            }
        }

        window.saveAndContinue = function() {
            const content = document.getElementById('text-content').value;
            const title = document.getElementById('input-title').value;
            
            if (!content && !title && !isImg2Loaded) {
                alert("目前沒有輸入文字、標題或印章，無需儲存。");
                return;
            }

            saveStateToHistory();

            const currentImgData = canvas.toDataURL("image/jpeg", 0.95);
            let newBgImg = new Image();
            newBgImg.onload = function() {
                bgImg = newBgImg;
                isBgLoaded = true;
                
                fitImageToCanvas();
                
                document.getElementById('input-title').value = '';
                document.getElementById('text-content').value = '';
                isImg2Loaded = false;
                img2 = new Image();
                
                render();
                alert("本段已成功儲存為新底圖！您可以繼續編輯。");
            };
            newBgImg.src = currentImgData;
        };
 
        function customDownload() {
            let fileName = prompt("儲存檔名（.jpg）：", "畫中有詩篇_000");
            if (fileName === null) return;

            const MAX_DIMENSION = 2000;
            let finalCanvas = canvas;
            if (canvas.width > MAX_DIMENSION || canvas.height > MAX_DIMENSION) {
                const scale = Math.min(MAX_DIMENSION / canvas.width, MAX_DIMENSION / canvas.height);
                const scaleCanvas = document.createElement('canvas');
                scaleCanvas.width = canvas.width * scale;
                scaleCanvas.height = canvas.height * scale;
                const scaleCtx = scaleCanvas.getContext('2d');
                scaleCtx.drawImage(canvas, 0, 0, scaleCanvas.width, scaleCanvas.height);
                finalCanvas = scaleCanvas;
            }

            const link = document.createElement('a');
            link.download = (fileName.trim() === "" ? "作品" : fileName) + ".jpg";
            link.href = finalCanvas.toDataURL("image/jpeg", 0.85);
            link.click();
        }
    </script>
