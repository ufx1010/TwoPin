<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noodp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>詩境 · 形狀漸層</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts 載入更多中文字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=Long+Cang&family=ZCOOL+KuaiLe&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+KuaiLe&family=Chen+Yulu+One&family=Liu+Jian+Mao+Cao&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Long+Cang&family=Qwigley&family=Shrikhand&display=swap" rel="stylesheet">
    <!-- 額外中文字型(分開載入,單一失敗不影響其他) -->
    <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ui-bg: #0a0a0c;
            --ui-panel: #111114;
            --ui-accent: #a162e8;
            --ui-accent-glow: rgba(161, 98, 232, 0.4);
            --ui-btn: rgba(255, 255, 255, 0.05);
            --radius-ui: 12px;
            --panel-width: 420px;
            --trans: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            --ui-active-border: #ff3333;
        }

        html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; height: 100vh; width: 100vw; overscroll-behavior: none; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .main-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        
        select:focus, input:focus, textarea:focus, .sub-btn:active, .tab.active, .step-btn:active {
            border: 2px solid var(--ui-active-border) !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.7) !important;
            outline: none;
        }

        .preview-section {
            flex: 1; background: #000; display: flex; align-items: center; justify-content: center;
            position: relative; padding: 20px; transition: var(--trans); touch-action: none;
            overflow: visible;
        }
        .preview-section.tall-mode { align-items: flex-start; padding-top: 50px; }

        #captureArea {
            position: relative; background: #050505; border-radius: 0px; overflow: hidden; 
            box-shadow: 0 20px 80px rgba(0,0,0,0.9); width: 450px; height: 450px; transition: width 0.4s, height 0.4s;
            display: block;
            line-height: 0;
            font-size: 0;
        }
        #captureArea.transparent-bg {
            background: transparent !important;
            box-shadow: none !important;
        }
        #captureArea.transparent-bg .layer {
            background-color: transparent !important;
        }
        #captureArea.transparent-bg #layer-kaleido {
            opacity: 0 !important;
        }
        #captureArea.transparent-bg #layer-bottom,
        #captureArea.transparent-bg #layer-mask,
        #captureArea.transparent-bg #layer-top {
            background-color: transparent !important;
        }
        #captureArea.transparent-bg canvas {
            background: transparent !important;
        }

        .layer { position: absolute; inset: 0; background-size: contain; background-repeat: no-repeat; background-position: center; pointer-events: none; transform-origin: center center; }
        
        #layer-kaleido { z-index: 5; opacity: 1; transform: scale(1.1); background-size: cover; }
        #layer-bottom { z-index: 10; }
        #layer-mask { z-index: 20; background-size: cover; }
        #layer-border { z-index: 25; border: 0px solid transparent; }
        #layer-top { z-index: 30; }
        #layer-px { z-index: 33; opacity: 0; }
        #layer-px canvas { display: block; }
        #layer-fx { z-index: 35; }
        #layer-fx canvas { display: block; }
        #layer-text { z-index: 40; pointer-events: none; width: 100%; height: 100%; overflow: visible; position: absolute; inset: 0; }

        .layer svg { width: 100%; height: 100%; display: block; overflow: visible; }

        #interactionShield { position: absolute; inset: 0; z-index: 100; display: none; touch-action: none; background: transparent; pointer-events: auto; }
        #interactionShield.active { display: block; }

        .draggable-zone { 
            position: absolute; padding: 10px; color: white; cursor: move; z-index: 50; 
            display: none; align-items: center; justify-content: center; transform-origin: center; 
            border: 2px solid transparent; background: transparent;
            line-height: normal;
            font-size: initial;
            overflow: visible;
            pointer-events: auto !important;
        }
        .edit-mode .draggable-zone.active-target { border: 2px solid var(--ui-accent); background: rgba(161, 98, 232, 0.1); border-radius: 4px; }
        .text-content { white-space: pre-wrap; word-break: break-all; display: block; line-height: 1.5; pointer-events: none; max-width: 350px; text-align: left; }
        .v-mode { writing-mode: vertical-rl; text-orientation: mixed; max-width: none; max-height: 350px; }
        .v-mode, .locked-v-mode { font-feature-settings: 'vert' 1, 'vrt2' 1; text-orientation: mixed; }
        .up { text-orientation: upright; }
        .pc { font-family: 'Noto Sans TC', 'Noto Sans CJK TC', 'Noto Serif TC', sans-serif !important; font-weight: 400; font-feature-settings: 'vert' 0, 'vrt2' 0, 'palt' 0, 'halt' 0; text-orientation: upright; }
        .vr { display: inline-block; position: relative; vertical-align: top; }
        .vr-in { position: absolute; left: 0; top: 0; display: inline-block; white-space: nowrap; writing-mode: horizontal-tb; transform-origin: 50% 50%; }
        .locked-v-mode { writing-mode: vertical-rl; text-orientation: mixed; max-width: none; max-height: 350px; white-space: pre-wrap; word-break: break-all; }

        #permanentToggle { 
            position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; 
            background: var(--ui-accent); border-radius: 50%; border: none; color: #fff; 
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 10px 30px var(--ui-accent-glow); z-index: 9999;
        }

        .editor-section { width: var(--panel-width); background: var(--ui-panel); display: flex; flex-direction: column; border-left: 1px solid #1f1f23; z-index: 5000; transition: var(--trans); }
        .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 12px; background: #08080a; }
        .tab { text-align: center; padding: 12px 2px; font-size: 11px; border-radius: 10px; color: #555; background: var(--ui-btn); cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .tab.active { background: var(--ui-accent); color: #fff; font-weight: bold; }

        .control-scroll-area { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 160px; }
        .control-content { display: none; flex-direction: column; gap: 20px; }
        .control-content.active { display: flex; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-row { grid-column: span 2; }
        label { font-size: 10px; color: #666; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        select, input, textarea, .sub-btn { background: var(--ui-btn); color: white; border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: var(--radius-ui); font-size: 13px; width: 100%; transition: 0.3s; }

        .slider-group { background: rgba(255,255,255,0.02); padding: 14px; border-radius: 10px; border: 1px solid transparent; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 10px; color: #888; }
        .slider-val { color: var(--ui-accent); font-weight: bold; }
        .slider-ui-row { display: flex; align-items: center; gap: 10px; }
        .step-btn { width: 32px; height: 32px; background: var(--ui-btn); border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        input[type="range"] { flex: 1; -webkit-appearance: none; height: 2px; background: #333; cursor: pointer; accent-color: var(--ui-accent); }

        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .editor-section { 
                position: fixed; left: 0; right: 0; bottom: 0; top: auto; 
                width: 100vw; height: 50vh; max-height: 50vh; 
                border-left: none; border-top: 1px solid #1f1f23;
                transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            }
            body:not(.collapsed) .editor-section { transform: translateY(0); margin-right: 0; }
            body.collapsed .editor-section { transform: translateY(100%); margin-right: 0; }
            .preview-section { height: 50vh; flex: none; }
        }
    </style>
</head>
<body>

    <div id="loading">🏮 萬象渲染中...</div>

    <button id="permanentToggle" onclick="toggleMainPanel()">
        <svg id="toggleIcon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
        </svg>
    </button>

    <div class="main-container">
        <div class="preview-section" id="pvSection">
            <div id="captureArea" class="edit-mode">
                <div id="layer-kaleido" class="layer"></div>
                <div id="layer-bottom" class="layer"></div>
                <div id="layer-mask" class="layer"></div>
                <div id="layer-border" class="layer"></div>
                <div id="layer-top" class="layer"></div>
                <div id="layer-px" class="layer"></div>
                <div id="layer-fx" class="layer"></div>
                <div id="layer-text" class="layer">
                    <div id="blk-title" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-subtitle" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-lefttitle" class="draggable-zone"><div class="text-content locked-v-mode"></div></div>
                    <div id="blk-righttitle" class="draggable-zone"><div class="text-content locked-v-mode"></div></div>
                    <div id="blk-content" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-meta" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-date" class="draggable-zone"><div class="text-content"></div></div>
                </div>
                <div id="interactionShield"></div>
            </div>
        </div>

        <div class="editor-section">
            <div class="tabs">
                <div class="tab active" onclick="switchTab(0)">文字內容</div>
                <div class="tab" onclick="switchTab(1)">細節調整</div>
                <div class="tab" onclick="switchTab(2)">圖層控制</div>
                <div class="tab" onclick="switchTab(3)">清除&/存檔</div>
                <div class="tab" onclick="switchTab(4)">鏡頭特效</div>
            </div>

            <div class="control-scroll-area">
                <div class="control-content active" id="panel-0">
                    <div class="settings-grid">
                        <div class="full-row"><label>大標題</label><input type="text" id="inp-title" value="" oninput="sync('title')"></div>
                        <div><label>左側標題</label><input type="text" id="inp-lefttitle" value="" oninput="sync('lefttitle')"></div>
                        <div><label>右側標題</label><input type="text" id="inp-righttitle" value="" oninput="sync('righttitle')"></div>
                        <div class="full-row"><label>正文內容</label><textarea id="inp-content" rows="4" oninput="sync('content')"></textarea></div>
                        <div class="full-row"><label>副標題</label><input type="text" id="inp-subtitle" oninput="sync('subtitle')"></div>
                        <div><label>作者</label><input type="text" id="inp-meta" value="" oninput="sync('meta')"></div>
                        <div><label>日期</label><input type="text" id="inp-date" value="" oninput="sync('date')"></div>
                    </div>
                </div>

                <div class="control-content" id="panel-1">
                    <div class="full-row active-selector"><label>📍 調整對象</label>
                        <select id="targetSelect" onchange="focusTarget(this.value)">
                            <option value="blk-title">大標題</option>
                            <option value="blk-subtitle">副標題</option>
                            <option value="blk-lefttitle">左側標題</option>
                            <option value="blk-righttitle">右側標題</option>
                            <option value="blk-content">本文內容</option>
                            <option value="blk-meta">作者</option>
                            <option value="blk-date">日期</option>
                        </select>
                    </div>
                    <div class="settings-grid">
                        <div class="full-row" id="writingModeControlRow"><label>🎋 排版方向</label>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
                                <button class="sub-btn" onclick="setWritingMode('vertical-rl')">↕️直排</button>
                                <button class="sub-btn" onclick="setWritingMode('horizontal-tb')">↔️橫排</button>
                            </div>
                        </div>
                        
                        <div class="full-row"><label>✍️ 字型選擇</label>
                            <select id="fontFamilySel" onchange="applyStyle('fontFamily', this.value)">
                                <optgroup label="黑體 / 無襯線">
                                    <option value="'Noto Sans TC', sans-serif">思源黑體 TC</option>
                                    <option value="'Noto Sans SC', sans-serif">思源黑體 SC</option>
                                    <option value="'Montserrat', sans-serif">時尚英文 Montserrat</option>
                                    <option value="'ZCOOL KuaiLe', cursive">站酷快樂體</option>
                                </optgroup>
                                <optgroup label="宋體 / 襯線">
                                    <option value="'Noto Serif TC', serif">思源宋體 TC</option>
                                    <option value="'Noto Serif SC', serif">思源宋體 SC</option>
                                    <option value="'Playfair Display', serif">歐式經典 Playfair</option>
                                    <option value="'Cinzel', serif">古典文藝 Cinzel</option>
                                    <option value="'Cormorant Garamond', serif">柯莫蘭 Garamond</option>
                                </optgroup>
                                <optgroup label="書法 / 手寫">
                                    <option value="'Ma Shan Zheng', cursive">馬善政毛筆行書</option>
                                    <option value="'ZCOOL XiaoWei', serif">站酷小薇體</option>
                                    <option value="'Liu Jian Mao Cao', cursive">劉建毛草體</option>
                                    <option value="'Zhi Mang Xing', cursive">芷芒行書</option>
                                    <option value="'Long Cang', cursive">龍藏體</option>
                                    <option value="'Chen Yulu One', cursive">陳玉露 One</option>
                                    <option value="'ZCOOL QingKe HuangYou', cursive">站酷青克黃油</option>
                                    <option value="'Qwigley', cursive">Qwigley 花體</option>
                                    <option value="'Shrikhand', cursive">Shrikhand 裝飾</option>
                                </optgroup>
                                <optgroup label="繁體中文字型">
                                    <option value="'LXGW WenKai TC', serif">霞鶩文楷 TC</option>
                                    <option value="'Cactus Classical Serif', serif">仙人掌古典宋</option>
                                    <option value="'Chocolate Classical Sans', sans-serif">巧克力古典黑</option>
                                    <option value="'Huninn', sans-serif">粉圓體 Huninn</option>
                                    <option value="'Iansui', cursive">芫荽體 Iansui</option>
                                    <option value="'Shippori Mincho', serif">しっぽり明朝</option>
                                    <option value="'Zen Old Mincho', serif">Zen 老明朝</option>
                                    <option value="'Yuji Syuku', serif">佑字 肅</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="full-row"><label>📐 對齊方式</label>
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
                                <button class="sub-btn" onclick="applyTextAlign('left')">靠左</button>
                                <button class="sub-btn" onclick="applyTextAlign('center')">置中</button>
                                <button class="sub-btn" onclick="applyTextAlign('right')">靠右</button>
                            </div>
                        </div>

                        <div class="full-row"><label>🎨 文字顏色</label><input type="color" id="textColInp" oninput="applyStyle('color', this.value)"></div>
                        
                        <div class="slider-group full-row">
                            <div class="slider-header">大小 <span class="slider-val" id="v-size">32</span>px</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSpecificSlider('sizeInp', -1, 8, 200)">-</button>
                                <input type="range" id="sizeInp" min="8" max="200" value="32" oninput="applyStyle('fontSize', this.value+'px'); document.getElementById('v-size').innerText=this.value">
                                <button class="step-btn" onclick="adjustSpecificSlider('sizeInp', 1, 8, 200)">+</button>
                            </div>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">旋轉 <span class="slider-val" id="v-rot">0</span>°</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSpecificSlider('rotInp', -5, -180, 180)">-</button>
                                <input type="range" id="rotInp" min="-180" max="180" value="0" oninput="applyRotate(this.value); document.getElementById('v-rot').innerText=this.value">
                                <button class="step-btn" onclick="adjustSpecificSlider('rotInp', 5, -180, 180)">+</button>
                            </div>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">行高 <span class="slider-val" id="v-lh">1.5</span></div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSpecificSlider('lhInp', -0.1, 0.8, 4, 1)">-</button>
                                <input type="range" id="lhInp" min="0.8" max="4" step="0.1" value="1.5" oninput="applyStyle('lineHeight', this.value); document.getElementById('v-lh').innerText=this.value">
                                <button class="step-btn" onclick="adjustSpecificSlider('lhInp', 0.1, 0.8, 4, 1)">+</button>
                            </div>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">字距 <span class="slider-val" id="v-ls">0</span>px</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSpecificSlider('lsInp', -1, -5, 30)">-</button>
                                <input type="range" id="lsInp" min="-5" max="30" step="1" value="0" oninput="applyStyle('letterSpacing', this.value+'px'); document.getElementById('v-ls').innerText=this.value">
                                <button class="step-btn" onclick="adjustSpecificSlider('lsInp', 1, -5, 30)">+</button>
                            </div>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">模糊度 <span class="slider-val" id="v-blur">0</span>px</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSpecificSlider('blurInp', -0.5, 0, 20, 1)">-</button>
                                <input type="range" id="blurInp" min="0" max="20" step="0.5" value="0" oninput="applyTextFilter('blur', this.value+'px'); document.getElementById('v-blur').innerText=this.value">
                                <button class="step-btn" onclick="adjustSpecificSlider('blurInp', 0.5, 0, 20, 1)">+</button>
                            </div>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">明暗度 (亮度) <span class="slider-val" id="v-bright">100</span>%</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSpecificSlider('brightInp', -5, 0, 200)">-</button>
                                <input type="range" id="brightInp" min="0" max="200" step="5" value="100" oninput="applyTextFilter('brightness', this.value+'%'); document.getElementById('v-bright').innerText=this.value">
                                <button class="step-btn" onclick="adjustSpecificSlider('brightInp', 5, 0, 200)">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="control-content" id="panel-2">
                    <div class="full-row"><label>📐 畫布比例</label>
                        <select id="ratioSel" onchange="changeRatio(this.value)">
                            <option value="1:1">1:1 正方形</option>
                            <option value="9:16">9:16 直式限動</option>
                            <option value="3:4">3:4 社群貼文</option>
                            <option value="4:3">4:3 經典橫式</option>
                            <option value="16:9">16:9 寬螢幕桌面</option>
                            <option value="3:2">3:2 攝影標準</option>
                            <option value="2:3">2:3 直式海報</option>
                            <option value="21:9">21:9 超寬螢幕</option>
                        </select>
                    </div>
                    <div class="tabs" style="grid-template-columns: repeat(5, 1fr); padding:0; background:transparent; margin:10px 0;">
                        <div class="tab active" id="lTab-kaleido" onclick="setActiveLayer('kaleido')">藝術</div>
                        <div class="tab" id="lTab-bottom" onclick="setActiveLayer('bottom')">底圖</div>
                        <div class="tab" id="lTab-mask" onclick="setActiveLayer('mask')">遮罩</div>
                        <div class="tab" id="lTab-top" onclick="setActiveLayer('top')">上層</div>
                        <div class="tab" id="lTab-border" onclick="setActiveLayer('border')">外框</div>
                    </div>

                    <div id="ctrl-global-shape" class="settings-grid" style="border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; margin-bottom: 10px;">
                        <div class="full-row" id="lock-row">
                            <label>🔒 圖層狀態</label>
                            <button id="lockBtn" class="sub-btn" style="background:#222;" onclick="toggleLayerLock()">🔓 未鎖定 (可移動縮放)</button>
                        </div>

        function drawKaleidoscope() {
            const b = layerData.kaleido; const w = area.clientWidth; const h = area.clientHeight;
            if(w === 0 || h === 0) return;

            let canvas = b.el.querySelector('canvas');
            if (!canvas) {
                canvas = document.createElement('canvas');
                b.el.innerHTML = '';
                b.el.appendChild(canvas);
            }
            const dpr = Math.max(2, window.devicePixelRatio || 1);
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            canvas.style.width = '100%';
            canvas.style.height = '100%';

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, w, h);

            if (!area.classList.contains('transparent-bg')) {
                const bgGrad = ctx.createLinearGradient(0, 0, w, h);
                bgGrad.addColorStop(0, b.artBg1 || '#050505');
                bgGrad.addColorStop(0.5, b.artBg2 || '#111118');
                bgGrad.addColorStop(1, b.artBg3 || '#050505');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);
            }

            const centerX = w/2, centerY = h/2;
            const holeVal = b.innerHole;

            if (b.seed.length === 0) {
                for(let i=0; i<2000; i++) {
                    b.seed.push({
                        x: Math.random(), y: Math.random(),
                        size: Math.random(),
                        type: ['arc', 'blob', 'dot', 'curve', 'flake'][Math.floor(Math.random()*5)],
                        rot: Math.random() * 360, curve: Math.random()
                    });
                }
            }

            let actualC1 = b.artC1, actualC2 = b.artC2, actualC3 = b.artC3;
            let actualBg1 = b.artBg1, actualBg2 = b.artBg2, actualBg3 = b.artBg3;
            if (isBlackAndWhite) {
                actualC1 = '#ffffff'; actualC2 = '#aaaaaa'; actualC3 = '#ffffff';
                actualBg1 = '#000000'; actualBg2 = '#222222'; actualBg3 = '#000000';
            }

            if (!area.classList.contains('transparent-bg')) {
                const bgGrad = ctx.createLinearGradient(0, 0, w, h);
                bgGrad.addColorStop(0, actualBg1 || '#050505');
                bgGrad.addColorStop(0.5, actualBg2 || '#111118');
                bgGrad.addColorStop(1, actualBg3 || '#050505');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);
            }

            if (b.patternType === 'kaleido') {
                const segments = 10;
                const maxRadius = Math.sqrt(w*w + h*h) / 2 * (b.spread/100);
                for(let i=0; i < b.density; i++) {
                    const s = b.seed[i]; if(!s) continue;
                    const size = b.size * (0.4 + s.size);
                    const radius = s.x * maxRadius; const angle = s.y * (Math.PI * 2 / segments);
                    for(let j=0; j < segments; j++) {
                        const currentAngle = angle + (j * Math.PI * 2 / segments);
                        const px = centerX + Math.cos(currentAngle) * radius;
                        const py = centerY + Math.sin(currentAngle) * radius;
                        
                        if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                        if(px < -50 || px > w+50 || py < -50 || py > h+50) continue;
                        
                        let col = getGradientColor(actualC1, actualC2, actualC3, s.x);
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate((s.rot + j*(360/segments)) * Math.PI / 180);

                        if(s.type === 'arc') {
                            ctx.beginPath();
                            ctx.ellipse(0, 0, Math.max(0.1, size), Math.max(0.1, size*s.curve), 0, Math.PI, 2 * Math.PI);
                            ctx.strokeStyle = col;
                            ctx.globalAlpha = 0.6;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        } else if(s.type === 'blob') {
                            ctx.beginPath();
                            ctx.moveTo(0, -size);
                            ctx.quadraticCurveTo(size*s.curve, 0, 0, size);
                            ctx.quadraticCurveTo(-size*s.curve, 0, 0, -size);
                            ctx.fillStyle = col;
                            ctx.globalAlpha = 0.4;
                            ctx.fill();
                        } else if(s.type === 'dot') {
                            ctx.beginPath();
                            ctx.arc(0, 0, Math.max(0.1, size/3), 0, Math.PI * 2);
                            ctx.fillStyle = col;
                            ctx.globalAlpha = 0.5;
                            ctx.fill();
                        } else {
                            ctx.beginPath();
                            ctx.rotate(45 * Math.PI / 180);
                            ctx.rect(-size/4, -size/4, size/2, size/2);
                            ctx.fillStyle = col;
                            ctx.globalAlpha = 0.4;
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                }
            } else if (b.patternType === 'grid') {
                const cols = Math.floor(Math.sqrt(b.density));
                const rows = cols;
                const stepX = w / cols; const stepY = h / rows;
                let count = 0;
                for(let r=0; r<rows; r++) {
                    for(let c=0; c<cols; c++) {
                        const s = b.seed[count % b.seed.length]; if(!s) continue;
                        const px = c * stepX + stepX/2 + (s.x-0.5)*10;
                        const py = r * stepY + stepY/2 + (s.y-0.5)*10;
                        if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                        const sz = b.size * (0.8 + s.size);
                        let col = getGradientColor(actualC1, actualC2, actualC3, s.x);
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate(s.rot * Math.PI / 180);

                        ctx.strokeStyle = col;
                        ctx.globalAlpha = 0.4;
                        ctx.lineWidth = 0.8;

                        ctx.beginPath();
                        ctx.moveTo(-sz, 0); ctx.lineTo(sz, 0);
                        ctx.moveTo(0, -sz); ctx.lineTo(0, sz);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(0, 0, Math.max(0.1, sz/2.5), 0, Math.PI*2);
                        ctx.lineWidth = 0.6;
                        ctx.stroke();

                        ctx.restore();
                        count++;
                    }
                }
            } else if (b.patternType === 'scatter') {
                for(let i=0; i < b.density; i++) {
                    const s = b.seed[i]; if(!s) continue;
                    const px = s.x * w; const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const sz = b.size * s.size;
                    let col = getGradientColor(actualC1, actualC2, actualC3, s.x);

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(px, py, Math.max(0.8, sz/2), 0, Math.PI * 2);
                    ctx.fillStyle = col;
                    ctx.globalAlpha = 0.2 + s.size*0.4;
                    ctx.fill();

                    if(i % 3 === 0) {
                        ctx.beginPath();
                        ctx.moveTo(px, py-sz*2);
                        ctx.lineTo(px+sz, py);
                        ctx.lineTo(px, py+sz*2);
                        ctx.lineTo(px-sz, py);
                        ctx.closePath();
                        ctx.globalAlpha = 0.2;
                        ctx.fill();
                    }
                    ctx.restore();
                }
            } else if (b.patternType === 'marsText') {
                const textUnits = (b.marsString || "火 星 文").split(/\s+/).filter(Boolean);
                const unitCount = textUnits.length > 0 ? textUnits.length : 1;
                
                for(let i=0; i < Math.min(b.density, 300); i++) {
                    const s = b.seed[i] || { x: Math.random(), y: Math.random(), size: Math.random(), rot: Math.random()*360 };
                    const px = s.x * w; const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const randomUnit = textUnits[Math.floor(Math.random() * unitCount)];
                    const fontSize = Math.max(12, b.size * 2.5 * (0.6 + s.size));
                    let col = getGradientColor(actualC1, actualC2, actualC3, s.x);

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(s.rot * Math.PI / 180);
                    ctx.font = `${fontSize}px sans-serif`;
                    ctx.fillStyle = col;
                    ctx.globalAlpha = 0.45;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(randomUnit, 0, 0);
                    ctx.restore();
                }
            } else if (b.patternType === 'line_straight_arc') {
                const numItems = Math.min(b.density, 150);
                for (let i = 0; i < numItems; i++) {
                    const s = b.seed[i % b.seed.length];
                    const px = s.x * w;
                    const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const col = getGradientColor(actualC1, actualC2, actualC3, s.x);
                    const radius = b.size * 3 * (0.5 + s.size);
                    const theta = s.rot * Math.PI / 180;
                    
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.strokeStyle = col;
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.5;

                    ctx.beginPath();
                    ctx.arc(0, 0, Math.max(0.1, radius), 0, Math.PI * 2);
                    ctx.stroke();

                    const x1 = -radius * 1.5 * Math.cos(theta);
                    const y1 = -radius * 1.5 * Math.sin(theta);
                    const x2 = radius * 1.5 * Math.cos(theta);
                    const y2 = radius * 1.5 * Math.sin(theta);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    ctx.restore();
                }
            } else if (b.patternType === 'line_isometric_poly') {
                const numItems = Math.min(b.density, 120);
                for (let i = 0; i < numItems; i++) {
                    const s = b.seed[i % b.seed.length];
                    const px = s.x * w;
                    const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const col = getGradientColor(actualC1, actualC2, actualC3, s.x);
                    const r = b.size * 2.5 * (0.5 + s.size);
                    const sides = (i % 2 === 0) ? 6 : 3;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.strokeStyle = col;
                    ctx.fillStyle = col;
                    ctx.lineWidth = 1.2;
                    ctx.globalAlpha = 0.55;

                    ctx.beginPath();
                    for (let a = 0; a < sides; a++) {
                        const angle = (a * 2 * Math.PI / sides) + (s.rot * Math.PI / 180);
                        const ptX = r * Math.cos(angle);
                        const ptY = r * Math.sin(angle);
                        if (a === 0) ctx.moveTo(ptX, ptY);
                        else ctx.lineTo(ptX, ptY);
                    }
                    ctx.closePath();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
                    ctx.globalAlpha = 0.6;
                    ctx.fill();

                    ctx.restore();
                }
            } else if (b.patternType === 'line_flowing_wave') {
                const numItems = Math.min(b.density, 80);
                for (let i = 0; i < numItems; i++) {
                    const s = b.seed[i % b.seed.length];
                    const px = s.x * w;
                    const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const col = getGradientColor(actualC1, actualC2, actualC3, s.x);

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.strokeStyle = col;
                    ctx.lineWidth = 1;
                    ctx.globalAlpha = 0.45;

                    ctx.beginPath();
                    const maxT = 4 * Math.PI;
                    for (let t = 0; t < maxT; t += 0.5) {
                        const scaleFactor = b.size * 0.5;
                        const x = t * Math.cos(t + s.rot) * scaleFactor;
                        const y = t * Math.sin(t + s.rot) * scaleFactor;
                        if (t === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            } else if (b.patternType === 'line_matrix_grid') {
                const cols = Math.floor(Math.sqrt(b.density));
                const rows = cols;
                const stepX = w / cols; 
                const stepY = h / rows;
                let count = 0;
                for(let r=0; r<rows; r++) {
                    for(let c=0; c<cols; c++) {
                        const s = b.seed[count % b.seed.length]; if(!s) continue;
                        const px = c * stepX + stepX/2;
                        const py = r * stepY + stepY/2;
                        if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                        const sz = b.size * 2;
                        let col = getGradientColor(actualC1, actualC2, actualC3, s.x);

                        ctx.save();
                        ctx.translate(px, py);
                        ctx.strokeStyle = col;
                        ctx.lineWidth = 1.2;
                        ctx.globalAlpha = 0.4;

                        ctx.strokeRect(-sz, -sz, sz * 2, sz * 2);
                        ctx.restore();
                        count++;
                    }
                }
            }

            b.el.style.filter = isBlackAndWhite ? 'grayscale(100%) contrast(120%)' : 'none';
        }

        const VERT_MAP = {
            '，':'\uFE10','、':'\uFE11','。':'\uFE12','：':'\uFE13','；':'\uFE14','！':'\uFE15','？':'\uFE16',
            '…':'\uFE19','⋯':'\uFE19','—':'\uFE31','–':'\uFE32','_':'\uFE33',
            '（':'\uFE35','）':'\uFE36','｛':'\uFE37','｝':'\uFE38','〔':'\uFE39','〕':'\uFE3A',
            '【':'\uFE3B','】':'\uFE3C','《':'\uFE3D','》':'\uFE3E','〈':'\uFE3F','〉':'\uFE40',
            '「':'\uFE41','」':'\uFE42','『':'\uFE43','』':'\uFE44'
        };
        function toVertical(str) { return Array.from(str).map(c => VERT_MAP[c] || c).join(''); }
        const PC_MAP = {'，':'，','。':'。','、':'、',',':'，','.':'。'};
        const RUN_RE = /[A-Za-z0-9]+(?:['.\-][A-Za-z0-9]+)*/g;
        const ASCII_V = {',':'︐','.':'︒','!':'︕','?':'︖',':':'︓',';':'︔','(':'︵',')':'︶','{':'︷','}':'︸','[':'﹇',']':'﹈'};
        function escH(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function segHTML(t) {
            return Array.from(t).map(c => {
                if (PC_MAP[c]) return '<span class="pc">' + PC_MAP[c] + '</span>';
                const v = VERT_MAP[c] || ASCII_V[c];
                if (v) return v;
                if (/[\x21-\x7E]/.test(c)) return '<span class="up">' + escH(c) + '</span>';
                return escH(c);
            }).join('');
        }
        function vertHTML(val) {
            let out = '', last = 0;
            val.replace(RUN_RE, (m, i) => {
                out += segHTML(val.slice(last, i));
                out += '<span class="vr"><span class="vr-in">' + escH(m) + '</span></span>';
                last = i + m.length;
                return m;
            });
            return out + segHTML(val.slice(last));
        }
        function renderText(id) {
            const val = document.getElementById('inp-' + id).value;
            const blk = document.getElementById('blk-' + id);
            const tc = blk.querySelector('.text-content');
            const isV = tc.classList.contains('v-mode') || tc.classList.contains('locked-v-mode');
            blk.style.display = val.trim() ? "flex" : "none";
            if (isV) {
                tc.innerHTML = vertHTML(val);
                fixVertRuns(tc);
                requestAnimationFrame(() => { fixVertRuns(tc); requestAnimationFrame(() => fixVertRuns(tc)); });
                if (document.fonts && document.fonts.load) {
                    const cs = getComputedStyle(tc);
                    document.fonts.load(cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily, val).then(() => fixVertRuns(tc)).catch(() => {});
                    document.fonts.load("400 " + cs.fontSize + " 'Noto Sans TC'", '，。、').then(() => fixVertRuns(tc)).catch(() => {});
                }
            } else {
                tc.innerText = val;
            }
        }
        function fixVertRuns(tc) {
            tc.querySelectorAll('.vr').forEach(vr => {
                const inn = vr.firstChild;
                inn.style.transform = 'none'; inn.style.left = '0px'; inn.style.top = '0px';
                const w = inn.offsetWidth, h = inn.offsetHeight;
                vr.style.width = h + 'px';
                vr.style.height = w + 'px';
                inn.style.left = ((h - w) / 2) + 'px'; inn.style.top = ((w - h) / 2) + 'px'; inn.style.transform = 'rotate(90deg)';
            });
        }
        function refixAllVert() {
            document.querySelectorAll('.text-content').forEach(tc => {
                if (tc.classList.contains('v-mode') || tc.classList.contains('locked-v-mode')) fixVertRuns(tc);
            });
        }
        if (document.fonts) {
            document.fonts.ready.then(refixAllVert);
            document.fonts.addEventListener('loadingdone', refixAllVert);
        }
        function sync(id) { renderText(id); }

        function focusTarget(id) {
            activeEditId = id;
            document.querySelectorAll('.draggable-zone').forEach(el => el.classList.toggle('active-target', el.id === id));
            document.getElementById('targetSelect').value = id;
            const isLockedVertical = (id === 'blk-lefttitle' || id === 'blk-righttitle');
            const writingModeRow = document.getElementById('writingModeControlRow');
            if(writingModeRow) { writingModeRow.style.display = isLockedVertical ? 'none' : 'block'; }
            const txt = document.querySelector(`#${activeEditId} .text-content`);
            if (txt) {
                const computed = window.getComputedStyle(txt);
                const fs = parseInt(computed.fontSize) || 32;
                document.getElementById('sizeInp').value = fs; document.getElementById('v-size').innerText = fs;
                const lh = computed.lineHeight !== 'normal' ? parseFloat(computed.lineHeight) / fs : 1.5;
                const lhVal = isNaN(lh) ? 1.5 : Math.round(lh * 10) / 10;
                document.getElementById('lhInp').value = lhVal; document.getElementById('v-lh').innerText = lhVal;
                const ls = parseInt(computed.letterSpacing) || 0;
                document.getElementById('lsInp').value = ls; document.getElementById('v-ls').innerText = ls;
                const rgbColor = computed.color;
                let hexColor = '#ffffff';
                if (rgbColor.startsWith('rgb')) {
                    const rgb = rgbColor.match(/\d+/g);
                    if (rgb && rgb.length >= 3) { hexColor = '#' + ((1 << 24) + (parseInt(rgb[0]) << 16) + (parseInt(rgb[1]) << 8) + parseInt(rgb[2])).toString(16).slice(1); }
                }
                const colorInp = document.getElementById('textColInp');
                if (colorInp) colorInp.value = hexColor;
                let currentBlur = 0, currentBright = 100;
                const filterStr = txt.style.filter || '';
                const blurMatch = filterStr.match(/blur\(([\d.]+)px\)/);
                if (blurMatch) currentBlur = parseFloat(blurMatch[1]);
                const brightMatch = filterStr.match(/brightness\(([\d.]+)%\)/);
                if (brightMatch) currentBright = parseFloat(brightMatch[1]);
                document.getElementById('blurInp').value = currentBlur; document.getElementById('v-blur').innerText = currentBlur;
                document.getElementById('brightInp').value = currentBright; document.getElementById('v-bright').innerText = currentBright;
            }

        function initDraggables() {
            document.querySelectorAll('.draggable-zone').forEach(el => {
                let startX, startY, initialLeft, initialTop, isDragging = false;

                const onDragStart = (e) => {
                    focusTarget(el.id);
                    isDragging = true;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    startX = clientX;
                    startY = clientY;
                    
                    if (!el.style.left) el.style.left = el.offsetLeft + 'px';
                    if (!el.style.top) el.style.top = el.offsetTop + 'px';
                    
                    initialLeft = parseFloat(el.style.left) || el.offsetLeft;
                    initialTop = parseFloat(el.style.top) || el.offsetTop;
                };

                const onDragMove = (e) => {
                    if (!isDragging) return;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    const dx = clientX - startX;
                    const dy = clientY - startY;

                    el.style.left = (initialLeft + dx) + 'px';
                    el.style.top = (initialTop + dy) + 'px';
                };

                const onDragEnd = () => {
                    if (isDragging) {
                        isDragging = false;
                        saveHistory();
                    }
                };

                el.addEventListener('mousedown', onDragStart);
                el.addEventListener('touchstart', onDragStart, { passive: true });
                window.addEventListener('mousemove', onDragMove);
                window.addEventListener('touchmove', onDragMove, { passive: true });
                window.addEventListener('mouseup', onDragEnd);
                window.addEventListener('touchend', onDragEnd);
            });
        }

        function initLayerInteraction() {
            let sx, sy, ix, iy, is, id, act = false;
            const start = e => {
                const l = layerData[activeLayerKey]; 
                if(!l.el || activeLayerKey==='border' || activeLayerKey==='kaleido' || l.locked) return; 
                const touches = e.touches || [e];
                if(touches.length === 1) { sx = touches[0].clientX; sy = touches[0].clientY; ix = l.x || 0; iy = l.y || 0; }
                else if(touches.length === 2) { is = l.s || 1; id = Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY); }
                act = true;
            };
            const moveFixed = e => {
                if(!act) return; 
                const l = layerData[activeLayerKey]; 
                const touches = e.touches || [e];
                if(touches.length === 1) { l.x = ix + (touches[0].clientX - sx); l.y = iy + (touches[0].clientY - sy); }
                else if(touches.length === 2) { const d = Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY); l.s = Math.max(0.1, Math.min(10, is * (d / id))); }
                applyLayerClipPath(l);
            };
            const end = () => { if(act) { act = false; saveHistory(); } };
            shield.onmousedown = start; window.onmousemove = moveFixed; window.onmouseup = end;
            shield.ontouchstart = start; shield.ontouchmove = e => { if(act) e.preventDefault(); moveFixed(e); };
            shield.ontouchend = end;
        }

        function saveHistory() {
            const state = { texts: {}, layers: {}, fx: JSON.parse(JSON.stringify(fxState)) };
            document.querySelectorAll('.draggable-zone').forEach(z => {
                const txt = z.querySelector('.text-content');
                state.texts[z.id] = { val: (document.getElementById(z.id.replace('blk-','inp-')) || {}).value ?? txt.innerText, vert: txt.classList.contains('v-mode'), style: txt.getAttribute('style'), pos: { t: z.style.top, l: z.style.left }, disp: z.style.display };
            });
            Object.keys(layerData).forEach(k => {
                const l = layerData[k];
                state.layers[k] = {
                    x: l.x, y: l.y, s: l.s, o: l.o, bg: l.bg, voidShape: l.voidShape, voidRotation: l.voidRotation, innerHole: l.innerHole,
                    borderWidth: l.el.style.borderWidth, inset: l.el.style.inset, borderRadius: l.el.style.borderRadius, borderColor: l.el.style.borderColor,
                    seed: l.seed ? JSON.parse(JSON.stringify(l.seed)) : [], patternType: l.patternType, marsString: l.marsString,
                    artC1: l.artC1, artC2: l.artC2, artC3: l.artC3, artBg1: l.artBg1, artBg2: l.artBg2, artBg3: l.artBg3
                };
            });
            historyStack.push(JSON.stringify(state)); 
            if(historyStack.length > 25) historyStack.shift();
            if (typeof pxCheck === 'function') pxCheck();
        }

        function undo() {
            if(historyStack.length <= 1) { alert("已經是最初狀態！"); return; } 
            historyStack.pop(); 
            const s = JSON.parse(historyStack[historyStack.length-1]); 
            Object.keys(s.texts).forEach(id => {
                const d = s.texts[id], z = document.getElementById(id), txt = z.querySelector('.text-content');
                if(z && txt) { txt.classList.toggle('v-mode', !!d.vert); txt.innerText = d.val; if(d.style) txt.setAttribute('style', d.style); else txt.removeAttribute('style'); z.style.top = d.pos.t; z.style.left = d.pos.l; z.style.display = d.disp; const inpEl = document.getElementById(id.replace('blk-', 'inp-')); if(inpEl) inpEl.value = d.val; renderText(id.replace('blk-','')); }
            });
            Object.keys(s.layers).forEach(k => {
                const ld = s.layers[k], l = layerData[k];
                if(l && l.el) {
                    l.x = ld.x || 0; l.y = ld.y || 0; l.s = ld.s || 1; l.o = ld.o; l.bg = ld.bg; l.voidShape = ld.voidShape; l.voidRotation = ld.voidRotation; l.innerHole = ld.innerHole;
                    if(ld.seed) l.seed = ld.seed; if(ld.patternType) l.patternType = ld.patternType; if(ld.marsString) l.marsString = ld.marsString;
                    if(ld.artC1) l.artC1 = ld.artC1; if(ld.artC2) l.artC2 = ld.artC2; if(ld.artC3) l.artC3 = ld.artC3;
                    if(ld.artBg1) l.artBg1 = ld.artBg1; if(ld.artBg2) l.artBg2 = ld.artBg2; if(ld.artBg3) l.artBg3 = ld.artBg3;
                    l.el.style.opacity = ld.o;
                    if(ld.borderWidth) l.el.style.borderWidth = ld.borderWidth; if(ld.inset) l.el.style.inset = ld.inset; if(ld.borderRadius) l.el.style.borderRadius = ld.borderRadius; if(ld.borderColor) l.el.style.borderColor = ld.borderColor;
                    if(k === 'kaleido') {

                        if(document.getElementById('art-c2')) document.getElementById('art-c2').value = l.artC2;
                        if(document.getElementById('art-c3')) document.getElementById('art-c3').value = l.artC3;
                        if(document.getElementById('art-bg1')) document.getElementById('art-bg1').value = l.artBg1;
                        if(document.getElementById('art-bg2')) document.getElementById('art-bg2').value = l.artBg2;
                        if(document.getElementById('art-bg3')) document.getElementById('art-bg3').value = l.artBg3;
                    }
                    else applyLayerClipPath(l);
                }
            });
            if (s.fx) { fxState = normalizeFx(s.fx); drawFx(); refreshFxUI(); }
            updateGlobalShapeUI(); setActiveLayer(activeLayerKey);
        }

        function resetAllApp() { if(confirm("確定要重新開始嗎？")) { localStorage.removeItem('shijing_v10_save'); location.reload(); } }

        async function exportImage() {
            const scale = 3;
            document.getElementById('loading').style.display = 'flex';
            if (typeof pxActive === 'function' && pxActive()) { try { await renderPx(3, true); } catch (e) {} }
            
            const isTransparent = exportFormat === 'png-transparent';
            const isPNG = exportFormat === 'png' || isTransparent;
            const isWebP = exportFormat === 'webp';
            
            const wasTransparent = area.classList.contains('transparent-bg');
            
            if (isTransparent && !wasTransparent) {
                area.classList.add('transparent-bg');
                drawKaleidoscope();
                await new Promise(resolve => requestAnimationFrame(resolve));
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            
            if (!isTransparent && wasTransparent) {
                area.classList.remove('transparent-bg');
                drawKaleidoscope();
                await new Promise(resolve => requestAnimationFrame(resolve));
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            
            area.style.display = 'block';
            area.style.lineHeight = '0';
            await new Promise(resolve => requestAnimationFrame(resolve));
            
            setTimeout(() => {
                const options = {
                    scale: scale,
                    useCORS: true,
                    allowTaint: false,
                    logging: false,
                    width: area.clientWidth,
                    height: area.clientHeight,
                };
                
                if (!isTransparent) {
                    options.backgroundColor = '#050505';
                } else {
                    options.backgroundColor = null;
                }
                
                html2canvas(area, options).then(canvas => {
                    const link = document.createElement('a');
                    const timestamp = Date.now();
                    let ext = 'webp';
                    let mimeType = 'image/webp';
                    let quality = 0.95;
                    
                    if (isPNG) {
                        ext = 'png';
                        mimeType = 'image/png';
                        quality = 1;
                    } else if (isWebP) {
                        ext = 'webp';
                        mimeType = 'image/webp';
                        quality = 0.95;
                    }
                    
                    link.download = `Poetry_${timestamp}.${ext}`;
                    link.href = canvas.toDataURL(mimeType, quality);
                    link.click();
                    if (pxActive()) setTimeout(() => renderPx(), 300);

                        area.classList.remove('transparent-bg');

                        area.classList.add('transparent-bg');
                        drawKaleidoscope();

                    document.getElementById('loading').style.display = 'none';

                        area.classList.remove('transparent-bg');
                        drawKaleidoscope();
                    }

                        area.classList.add('transparent-bg');

                    }

            const c3 = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
            
            let gradientStyle = '';

        function saveToLocal() { const d = { inputs: {}, layersData: {}, fx: fxState }; document.querySelectorAll('input[type="text"], textarea').forEach(i => d.inputs[i.id] = i.value); Object.keys(layerData).forEach(k => { const l = layerData[k]; d.layersData[k] = { x: l.x, y: l.y, s: l.s, o: l.o, bg: l.bg, voidShape: l.voidShape, voidRotation: l.voidRotation, innerHole: l.innerHole, borderWidth: l.el.style.borderWidth, inset: l.el.style.inset, borderRadius: l.el.style.borderRadius, borderColor: l.el.style.borderColor, seed: l.seed ? JSON.parse(JSON.stringify(l.seed)) : [], patternType: l.patternType, marsString: l.marsString, artC1: l.artC1, artC2: l.artC2, artC3: l.artC3, artBg1: l.artBg1, artBg2: l.artBg2, artBg3: l.artBg3 }; }); localStorage.setItem('shijing_v10_save', JSON.stringify(d)); alert("存檔成功！"); }
        function loadFromLocal() { const dStr = localStorage.getItem('shijing_v10_save'); if(!dStr) { alert("無存檔！"); return; } try { const d = JSON.parse(dStr); if(d.inputs) Object.keys(d.inputs).forEach(k => { const el = document.getElementById(k); if(el) { el.value = d.inputs[k]; sync(k.replace('inp-','')); } }); if(d.layersData) Object.keys(d.layersData).forEach(k => { const ld = d.layersData[k], l = layerData[k]; if(l && l.el) { l.x = ld.x||0; l.y = ld.y||0; l.s = ld.s||1; l.o = ld.o; l.bg = ld.bg; l.voidShape = ld.voidShape; l.voidRotation = ld.voidRotation; l.innerHole = ld.innerHole; if(ld.seed) l.seed = ld.seed; if(ld.patternType) l.patternType = ld.patternType; if(ld.marsString) l.marsString = ld.marsString; if(ld.artC1) l.artC1 = ld.artC1; if(ld.artC2) l.artC2 = ld.artC2; if(ld.artC3) l.artC3 = ld.artC3; if(ld.artBg1) l.artBg1 = ld.artBg1; if(ld.artBg2) l.artBg2 = ld.artBg2; if(ld.artBg3) l.artBg3 = ld.artBg3; l.el.style.opacity = ld.o; l.el.style.borderWidth = ld.borderWidth || '0px'; l.el.style.inset = ld.inset || '0px'; l.el.style.borderRadius = ld.borderRadius || '0px'; l.el.style.borderColor = ld.borderColor || ''; if(k === 'kaleido') { drawKaleidoscope(); if(document.getElementById('art-c1')) document.getElementById('art-c1').value = l.artC1; if(document.getElementById('art-c2')) document.getElementById('art-c2').value = l.artC2; if(document.getElementById('art-c3')) document.getElementById('art-c3').value = l.artC3; if(document.getElementById('art-bg1')) document.getElementById('art-bg1').value = l.artBg1; if(document.getElementById('art-bg2')) document.getElementById('art-bg2').value = l.artBg2; if(document.getElementById('art-bg3')) document.getElementById('art-bg3').value = l.artBg3; } else applyLayerClipPath(l); } }); if(d.fx){ fxState = normalizeFx(d.fx); drawFx(); refreshFxUI(); } updateGlobalShapeUI(); setActiveLayer(activeLayerKey); saveHistory(); alert("載入成功！"); } catch(e) { console.error(e); alert("載入失敗。"); } }
        function isInsideVoid(px, py, w, h, shape, threshold, rotationDeg) {
            if (shape === 'none' || threshold === 0) return false;
            const cx = w / 2, cy = h / 2;
            let dx = px - cx, dy = py - cy;
            const rad = -rotationDeg * Math.PI / 180;
            const x = dx * Math.cos(rad) - dy * Math.sin(rad);
            const y = dx * Math.sin(rad) + dy * Math.cos(rad);
            const minDim = Math.min(w, h);
            const limit = Math.abs(threshold) / 100;
            if (threshold > 0) {
                switch(shape) {
                    case 'circle': { const radius = (minDim / 2) * limit; return (x * x + y * y) < (radius * radius); }
                    case 'ellipse': { const rx = (w / 2) * limit; const ry = (h / 2) * limit; return (x * x) / (rx * rx) + (y * y) / (ry * ry) < 1; }
                    case 'rectangle': { const halfW = (w / 2) * limit; const halfH = (h / 2) * limit; return Math.abs(x) < halfW && Math.abs(y) < halfH; }
                    case 'square': { const halfS = (minDim / 2) * limit; return Math.abs(x) < halfS && Math.abs(y) < halfS; }
                    case 'triangle': { const halfW = (minDim / 2) * limit; return y > -halfW && y < halfW && Math.abs(x) < halfW; }
                    case 'star':
                    case 'heart':
                    case 'cross':
                    case 'line': { const halfW = (minDim / 2) * limit; return Math.abs(x) < halfW && Math.abs(y) < halfW; }
                    default: return false;
                }
            }
            return false;
        }
