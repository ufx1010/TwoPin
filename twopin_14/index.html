<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noodp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>詩境</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=Long+Cang&family=ZCOOL+KuaiLe&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ui-bg: #0a0a0c;
            --ui-panel: #111114;
            --ui-accent: #a162e8;
            --ui-accent-glow: rgba(161, 98, 232, 0.4);
            --ui-btn: rgba(255, 255, 255, 0.05);
            --radius-ui: 12px;
            --panel-width: 420px;
            --trans: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            --ui-active-border: #ff3333;
        }

        html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; height: 100vh; width: 100vw; overscroll-behavior: none; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .main-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        
        select:focus, input:focus, textarea:focus, .sub-btn:active, .tab.active, .step-btn:active {
            border: 2px solid var(--ui-active-border) !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.7) !important;
            outline: none;
        }

        .preview-section {
            flex: 1; background: #000; display: flex; align-items: center; justify-content: center;
            position: relative; padding: 20px; transition: var(--trans); touch-action: none;
        }
        .preview-section.tall-mode { align-items: flex-start; padding-top: 50px; }

        #captureArea {
            position: relative; background: #050505; border-radius: 4px; overflow: hidden; 
            box-shadow: 0 20px 80px rgba(0,0,0,0.9); width: 450px; height: 450px; transition: width 0.4s, height 0.4s;
        }

        .layer { position: absolute; inset: 0; background-size: contain; background-repeat: no-repeat; background-position: center; pointer-events: none; transform-origin: center center; }
        
        #layer-kaleido { z-index: 5; opacity: 1; transform: scale(1.1); background-size: cover; }
        #layer-bottom { z-index: 10; }
        #layer-mask { z-index: 20; background-size: cover; }
        #layer-border { z-index: 25; border: 0px solid transparent; }
        #layer-top { z-index: 30; }
        #layer-text { z-index: 200; pointer-events: auto; width: 100%; height: 100%; }

        #layer-kaleido svg { width: 100%; height: 100%; display: block; }
        #interactionShield { position: absolute; inset: 0; z-index: 100; display: none; touch-action: none; background: transparent; pointer-events: auto; }
        #interactionShield.active { display: block; }

        .draggable-zone { 
            position: absolute; padding: 10px; color: white; cursor: move; z-index: 50; 
            display: none; align-items: center; justify-content: center; transform-origin: center; 
            border: 2px solid transparent; background: transparent;
        }
        .edit-mode .draggable-zone.active-target { border: 2px solid var(--ui-accent); background: rgba(161, 98, 232, 0.1); border-radius: 4px; }
        .text-content { white-space: pre-wrap; word-break: break-all; display: block; line-height: 1.5; pointer-events: none; max-width: 350px; text-align: left; }
        .v-mode { writing-mode: vertical-rl; text-orientation: mixed; max-width: none; max-height: 350px; }
        .locked-v-mode { writing-mode: vertical-rl; text-orientation: mixed; max-width: none; max-height: 350px; white-space: pre-wrap; word-break: break-all; }

        #permanentToggle { 
            position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; 
            background: var(--ui-accent); border-radius: 50%; border: none; color: #fff; 
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 10px 30px var(--ui-accent-glow); z-index: 9999;
        }

        .editor-section { width: var(--panel-width); background: var(--ui-panel); display: flex; flex-direction: column; border-left: 1px solid #1f1f23; z-index: 5000; transition: var(--trans); }
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; background: #08080a; }
        .tab { text-align: center; padding: 12px 2px; font-size: 11px; border-radius: 10px; color: #555; background: var(--ui-btn); cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .tab.active { background: var(--ui-accent); color: #fff; font-weight: bold; }

        .control-scroll-area { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 160px; }
        .control-content { display: none; flex-direction: column; gap: 20px; }
        .control-content.active { display: flex; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-row { grid-column: span 2; }
        label { font-size: 10px; color: #666; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        select, input, textarea, .sub-btn { background: var(--ui-btn); color: white; border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: var(--radius-ui); font-size: 13px; width: 100%; transition: 0.3s; }

        .slider-group { background: rgba(255,255,255,0.02); padding: 14px; border-radius: 10px; border: 1px solid transparent; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 10px; color: #888; }
        .slider-val { color: var(--ui-accent); font-weight: bold; }
        .slider-ui-row { display: flex; align-items: center; gap: 10px; }
        .step-btn { width: 32px; height: 32px; background: var(--ui-btn); border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        input[type="range"] { flex: 1; -webkit-appearance: none; height: 2px; background: #333; cursor: pointer; accent-color: var(--ui-accent); }

        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .editor-section { 
                position: fixed; left: 0; right: 0; bottom: 0; top: auto; 
                width: 100vw; height: 50vh; max-height: 50vh; 
                border-left: none; border-top: 1px solid #1f1f23;
                transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            }
            body:not(.collapsed) .editor-section { transform: translateY(0); margin-right: 0; }
            body.collapsed .editor-section { transform: translateY(100%); margin-right: 0; }
            .preview-section { height: 50vh; flex: none; }
        }
    </style>
</head>
<body>

    <div id="loading">🏮 萬象渲染中...</div>

    <button id="permanentToggle" onclick="toggleMainPanel()">
        <svg id="toggleIcon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
        </svg>
    </button>

    <div class="main-container">
        <div class="preview-section" id="pvSection">
            <div id="captureArea" class="edit-mode">
                <div id="layer-kaleido" class="layer"></div>
                <div id="layer-bottom" class="layer"></div>
                <div id="layer-mask" class="layer"></div>
                <div id="layer-border" class="layer"></div>
                <div id="layer-top" class="layer"></div>
                <div id="layer-text" class="layer">
                    <div id="blk-title" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-subtitle" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-lefttitle" class="draggable-zone"><div class="text-content locked-v-mode"></div></div>
                    <div id="blk-righttitle" class="draggable-zone"><div class="text-content locked-v-mode"></div></div>
                    <div id="blk-content" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-meta" class="draggable-zone"><div class="text-content"></div></div>
                    <div id="blk-date" class="draggable-zone"><div class="text-content"></div></div>
                </div>
                <div id="interactionShield"></div>
            </div>
        </div>

        <div class="editor-section">
            <div class="tabs">
                <div class="tab active" onclick="switchTab(0)">文字內容</div>
                <div class="tab" onclick="switchTab(1)">細節調整</div>
                <div class="tab" onclick="switchTab(2)">圖層控制</div>
                <div class="tab" onclick="switchTab(3)">清除&/存檔</div>
            </div>

            <div class="control-scroll-area">
                <div class="control-content active" id="panel-0">
                    <div class="settings-grid">
                        <div class="full-row"><label>大標題</label><input type="text" id="inp-title" value="" oninput="sync('title')"></div>
                        <div><label>左側標題</label><input type="text" id="inp-lefttitle" value="" oninput="sync('lefttitle')"></div>
                        <div><label>右側標題</label><input type="text" id="inp-righttitle" value="" oninput="sync('righttitle')"></div>
                        <div class="full-row"><label>正文內容</label><textarea id="inp-content" rows="4" oninput="sync('content')"></textarea></div>
                        <div class="full-row"><label>副標題</label><input type="text" id="inp-subtitle" oninput="sync('subtitle')"></div>
                        <div><label>作者</label><input type="text" id="inp-meta" value="" oninput="sync('meta')"></div>
                        <div><label>日期</label><input type="text" id="inp-date" value="" oninput="sync('date')"></div>
                    </div>
                </div>

                <div class="control-content" id="panel-1">
                    <div class="full-row active-selector"><label>📍 調整對象</label>
                        <select id="targetSelect" onchange="focusTarget(this.value)">
                            <option value="blk-title">大標題</option>
                            <option value="blk-subtitle">副標題</option>
                            <option value="blk-lefttitle">左側標題</option>
                            <option value="blk-righttitle">右側標題</option>
                            <option value="blk-content">本文內容</option>
                            <option value="blk-meta">作者</option>
                            <option value="blk-date">日期</option>
                        </select>
                    </div>
                    <div class="settings-grid">
                        <div class="full-row" id="writingModeControlRow"><label>🎋 排版方向</label>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
                                <button class="sub-btn" onclick="setWritingMode('vertical-rl')">↕️直排</button>
                                <button class="sub-btn" onclick="setWritingMode('horizontal-tb')">↔️橫排</button>
                            </div>
                        </div>
                        
                        <div class="full-row"><label>✍️ 字型選擇</label>
                            <select id="fontFamilySel" onchange="applyStyle('fontFamily', this.value)">
                                <option value="'Noto Sans TC', sans-serif">思源黑體</option>
                                <option value="'Noto Serif TC', serif">思源宋體</option>
                                <option value="'Ma Shan Zheng', cursive">馬善政毛筆行書</option>
                                <option value="'ZCOOL XiaoWei', serif">站酷小薇體</option>
                                <option value="'Liu Jian Mao Cao', cursive">劉建毛草體</option>
                                <option value="'Zhi Mang Xing', cursive">芷芒行書</option>
                                <option value="'Long Cang', cursive">龍藏體</option>
                                <option value="'Playfair Display', serif">歐式經典</option>
                                <option value="'Cinzel', serif">古典文藝</option>
                                <option value="'Montserrat', sans-serif">時尚英文</option>
                            </select>
                        </div>

                        <div class="full-row"><label>📐 對齊方式</label>
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
                                <button class="sub-btn" onclick="applyTextAlign('left')">靠左</button>
                                <button class="sub-btn" onclick="applyTextAlign('center')">置中</button>
                                <button class="sub-btn" onclick="applyTextAlign('right')">靠右</button>
                            </div>
                        </div>

                        <div class="full-row"><label>🎨 文字顏色</label><input type="color" id="textColInp" oninput="applyStyle('color', this.value)"></div>
                        <div class="slider-group full-row"><div class="slider-header">大小 <span class="slider-val" id="v-size">32</span>px</div><div class="slider-ui-row"><input type="range" id="sizeInp" min="8" max="200" value="32" oninput="applyStyle('fontSize', this.value+'px'); document.getElementById('v-size').innerText=this.value"></div></div>
                        <div class="slider-group full-row"><div class="slider-header">旋轉 <span class="slider-val" id="v-rot">0</span>°</div><div class="slider-ui-row"><input type="range" id="rotInp" min="-180" max="180" value="0" oninput="applyRotate(this.value); document.getElementById('v-rot').innerText=this.value"></div></div>
                        <div class="slider-group full-row"><div class="slider-header">行高 <span class="slider-val" id="v-lh">1.5</span></div><div class="slider-ui-row"><input type="range" id="lhInp" min="0.8" max="4" step="0.1" value="1.5" oninput="applyStyle('lineHeight', this.value); document.getElementById('v-lh').innerText=this.value"></div></div>
                        <div class="slider-group full-row"><div class="slider-header">字距 <span class="slider-val" id="v-ls">0</span>px</div><div class="slider-ui-row"><input type="range" id="lsInp" min="-5" max="30" step="1" value="0" oninput="applyStyle('letterSpacing', this.value+'px'); document.getElementById('v-ls').innerText=this.value"></div></div>
                        <div class="slider-group full-row"><div class="slider-header">模糊度 <span class="slider-val" id="v-blur">0</span>px</div><div class="slider-ui-row"><input type="range" id="blurInp" min="0" max="20" step="0.5" value="0" oninput="applyTextFilter('blur', this.value+'px'); document.getElementById('v-blur').innerText=this.value"></div></div>
                        <div class="slider-group full-row"><div class="slider-header">明暗度 (亮度) <span class="slider-val" id="v-bright">100</span>%</div><div class="slider-ui-row"><input type="range" id="brightInp" min="0" max="200" step="5" value="100" oninput="applyTextFilter('brightness', this.value+'%'); document.getElementById('v-bright').innerText=this.value"></div></div>
                    </div>
                </div>

                <div class="control-content" id="panel-2">
                    <div class="full-row"><label>📐 畫布比例</label>
                        <select id="ratioSel" onchange="changeRatio(this.value)">
                            <option value="1:1">1:1 正方形</option>
                            <option value="9:16">9:16 直式限動</option>
                            <option value="3:4">3:4 社群貼文</option>
                            <option value="4:3">4:3 經典橫式</option>
                            <option value="16:9">16:9 寬螢幕桌面</option>
                            <option value="3:2">3:2 攝影標準</option>
                            <option value="2:3">2:3 直式海報</option>
                            <option value="21:9">21:9 超寬螢幕</option>
                        </select>
                    </div>
                    <div class="tabs" style="grid-template-columns: repeat(5, 1fr); padding:0; background:transparent; margin:10px 0;">
                        <div class="tab active" id="lTab-kaleido" onclick="setActiveLayer('kaleido')">藝術</div>
                        <div class="tab" id="lTab-bottom" onclick="setActiveLayer('bottom')">底圖</div>
                        <div class="tab" id="lTab-mask" onclick="setActiveLayer('mask')">遮罩</div>
                        <div class="tab" id="lTab-border" onclick="setActiveLayer('border')">外框</div>
                        <div class="tab" id="lTab-top" onclick="setActiveLayer('top')">上層</div>
                    </div>

                    <div id="ctrl-global-shape" class="settings-grid" style="border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; margin-bottom: 10px;">
                        <div class="full-row"><label>📐 圖層形狀 / 圖片外框修剪 (共用)</label>
                            <select id="globalVoidShapeSel" onchange="updateGlobalShape('voidShape', this.value)">
                                <option value="none">無 (全滿)</option>
                                <option value="circle">圓形 Circle</option>
                                <option value="ellipse">橢圓形 Ellipse</option>
                                <option value="rectangle">長方形 Rectangle</option>
                                <option value="star">星型 Star</option>
                                <option value="line">線形 Line</option>
                                <option value="heart">心形 Heart</option>
                                <option value="square">正方 Square</option>
                                <option value="triangle">三角 Triangle</option>
                                <option value="cross">十字 Cross</option>
                            </select>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">🔄 形狀旋轉 (±5°) <span class="slider-val" id="val-gVoidRot">0</span>°</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="updateGlobalShape('voidRotation', getActiveLayerData().voidRotation - 5)">-</button>
                                <input type="range" id="range-gVoidRot" min="0" max="360" step="5" value="0" oninput="updateGlobalShape('voidRotation', this.value)">
                                <button class="step-btn" onclick="updateGlobalShape('voidRotation', getActiveLayerData().voidRotation + 5)">+</button>
                            </div>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">🕳️ 留白/裁切範圍 (預設中心，依比例縮放) <span class="slider-val" id="val-gHole">0</span>%</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="updateGlobalShape('innerHole', getActiveLayerData().innerHole - 5)">-</button>
                                <input type="range" id="range-gHole" min="-99" max="99" value="0" oninput="updateGlobalShape('innerHole', this.value)">
                                <button class="step-btn" onclick="updateGlobalShape('innerHole', getActiveLayerData().innerHole + 5)">+</button>
                            </div>
                        </div>
                    </div>

                    <div id="ctrl-kaleido" class="settings-grid">
                        <div class="full-row"><label>🎨 詩文底圖風格</label>
                            <select id="artStyleSel" onchange="handleArtStyleChange(this.value)">
                                <option value="kaleido">經典萬花筒</option>
                                <option value="grid">幾何星芒</option>
                                <option value="scatter">落花流螢</option>
                                <option value="marsText">火星文散落</option>
                                <option value="line_straight_arc">極簡直線與圓弧</option>
                                <option value="line_isometric_poly">等距多邊形</option>
                                <option value="line_flowing_wave">流動波浪與螺旋</option>
                                <option value="line_matrix_grid">交錯矩陣方格</option>
                            </select>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">繁複度 <span class="slider-val" id="val-kDen">800</span></div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSlider('density', -50)">-</button>
                                <input type="range" id="range-kDen" min="100" max="2500" value="800" oninput="updateKaleido('density', this.value)">
                                <button class="step-btn" onclick="adjustSlider('density', 50)">+</button>
                            </div>
                        </div>

                        <div class="slider-group full-row">
                            <div class="slider-header">大小 <span class="slider-val" id="val-kSize">4</span>px</div>
                            <div class="slider-ui-row">
                                <button class="step-btn" onclick="adjustSlider('size', -1)">-</button>
                                <input type="range" id="range-kSize" min="1" max="25" value="4" oninput="updateKaleido('size', this.value)">
                                <button class="step-btn" onclick="adjustSlider('size', 1)">+</button>
                            </div>
                        </div>

                        <button class="sub-btn" style="background:#333;" onclick="toggleBlackAndWhite()">⚪ 黑白切換</button>
                        <button class="sub-btn" style="background:#442266;" onclick="randomKaleidoscope()">🎲 隨機生成詩境背景</button>
                    </div>

                    <div id="ctrl-border" style="display:none;" class="settings-grid">
                        <div class="slider-group"><div class="slider-header">粗細 <span class="slider-val" id="val-bW">0</span>px</div><div class="slider-ui-row"><input type="range" min="0" max="50" value="0" oninput="updateBorder('w', this.value)"></div></div>
                        <div class="slider-group"><div class="slider-header">內縮 <span class="slider-val" id="val-bP">0</span>px</div><div class="slider-ui-row"><input type="range" min="0" max="100" value="0" oninput="updateBorder('p', this.value)"></div></div>
                        <div class="slider-group full-row"><div class="slider-header">圓角 <span class="slider-val" id="val-bR">0</span>px</div><div class="slider-ui-row"><input type="range" min="0" max="200" value="0" oninput="updateBorder('r', this.value)"></div></div>
                        <div class="full-row"><label>顏色</label><input type="color" oninput="updateBorder('c', this.value)"></div>
                    </div>

                    <div id="ctrl-standard" style="display:none;" class="settings-grid">
                        <div class="full-row"><label>🔒 圖層狀態</label>
                            <button id="lockBtn" class="sub-btn" style="background:#222;" onclick="toggleLayerLock()">🔓 未鎖定 (可移動縮放)</button>
                        </div>

                        <div class="slider-group full-row"><div class="slider-header">不透明度 <span class="slider-val" id="val-lOpac">1.0</span></div><div class="slider-ui-row"><input type="range" id="layerOpacSlider" min="0" max="1" step="0.01" value="1" oninput="updateLayerAttr('o', this.value)"></div></div>
                        
                        <div id="mask-tools" style="display:none;" class="full-row">
                            <div class="settings-grid">
                                <div><label>顏色 A (中心)</label><input type="color" id="mask-c1" value="#000000" oninput="updateMaskGradient()"></div>
                                <div><label>顏色 B (中環)</label><input type="color" id="mask-c2" value="#444444" oninput="updateMaskGradient()"></div>
                                <div><label>顏色 C (外圍)</label><input type="color" id="mask-c3" value="#000000" oninput="updateMaskGradient()"></div>
                                <div><label>圓心 X 座標 (%)</label><input type="range" id="mask-startX" min="0" max="100" value="50" oninput="updateMaskGradient(); document.getElementById('val-mStartX').innerText=this.value"><span class="slider-val" id="val-mStartX">50</span>%</div>
                                <div><label>圓心 Y 座標 (%)</label><input type="range" id="mask-startY" min="0" max="100" value="50" oninput="updateMaskGradient(); document.getElementById('val-mStartY').innerText=this.value"><span class="slider-val" id="val-mStartY">50</span>%</div>
                            </div>
                        </div>

                        <button class="sub-btn" onclick="document.getElementById('bgInput').click()">📸 上傳底圖</button>
                        <button class="sub-btn" onclick="randomGradient()">🎨 隨機三色放射漸層</button>
                    </div>
                    <input type="file" id="bgInput" accept="image/*" hidden onchange="handleUpload(this)">

                    <button class="sub-btn full-row" style="background:#5a1e1e; margin-top: 10px;" onclick="clearCurrentLayer()">🗑️ 清除當前圖層內容</button>
                </div>

                <div class="control-content" id="panel-3">
                    <button class="sub-btn full-row" style="background:var(--ui-accent); height:60px; font-weight:bold;" onclick="exportImage(3)">📥 導出高清 WebP 作品</button>
                    <div class="settings-grid" style="margin-top:20px;">
                        <button class="sub-btn" onclick="undo()">↩️ 退回一步</button>
                        <button class="sub-btn" onclick="resetAllApp()" style="background:#422;">✨ 全新開始</button>
                        <button class="sub-btn" onclick="saveToLocal()">💾 儲存草稿</button>
                        <button class="sub-btn" onclick="loadFromLocal()">📂 載入草稿</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const area = document.getElementById('captureArea');
        const shield = document.getElementById('interactionShield');
        
        let layerData = {
            kaleido: { 
                el: document.getElementById('layer-kaleido'), 
                density: 800, 
                size: 4, 
                spread: 120, 
                o: 0, 
                seed: [], 
                patternType: 'kaleido', 
                marsString: '詩 境 萬 象 ✦',
                voidShape: 'none',
                voidRotation: 0,
                innerHole: 0,
                locked: false
            },
            bottom: { el: document.getElementById('layer-bottom'), x: 0, y: 0, s: 1, o: 1, voidShape: 'none', voidRotation: 0, innerHole: 0, locked: false },
            mask: { el: document.getElementById('layer-mask'), x: 0, y: 0, s: 1, o: 0, c1: '#000000', c2: '#444444', c3: '#000000', startX: 50, startY: 50, voidShape: 'none', voidRotation: 0, innerHole: 0, locked: false },
            border: { el: document.getElementById('layer-border'), w: 0, p: 0, r: 0, c: '#ffffff', o: 1, voidShape: 'none', voidRotation: 0, innerHole: 0, locked: false },
            top: { el: document.getElementById('layer-top'), x: 0, y: 0, s: 1, o: 1, voidShape: 'none', voidRotation: 0, innerHole: 0, locked: false }
        };

        let activeLayerKey = 'kaleido', activeEditId = 'blk-title', historyStack = [];
        let isBlackAndWhite = false;

        window.onload = () => {
            initDraggables(); initLayerInteraction(); changeRatio('1:1');
            ['title','content','meta','date','subtitle','lefttitle','righttitle'].forEach(k => sync(k));
            layerData.kaleido.seed = [];
            layerData.kaleido.el.style.opacity = 0;
            drawKaleidoscope(); 
            updateGlobalShapeUI();
            focusTarget('blk-title');
            saveHistory();
        };

        function toggleMainPanel() { document.body.classList.toggle('collapsed'); }

        function changeRatio(r) {
            const [w, h] = r.split(':').map(Number);
            const availW = document.getElementById('pvSection').clientWidth * 0.9, availH = document.getElementById('pvSection').clientHeight * 0.9;
            let tw = (w/h > availW/availH) ? availW : availH * (w/h);
            area.style.width = tw + 'px'; area.style.height = (tw / (w/h)) + 'px';
            setTimeout(() => { 
                drawKaleidoscope(); 
                Object.keys(layerData).forEach(k => {
                    if(k !== 'kaleido' && k !== 'border') applyLayerClipPath(layerData[k]);
                });
            }, 150);
        }

        function toggleLayerLock() {
            const l = layerData[activeLayerKey];
            l.locked = !l.locked;
            const btn = document.getElementById('lockBtn');
            if(l.locked) {
                btn.innerHTML = '🔒 已鎖定 (無法移動縮放)';
                btn.style.background = '#551111';
            } else {
                btn.innerHTML = '🔓 未鎖定 (可移動縮放)';
                btn.style.background = '#222';
            }
        }

        function getActiveLayerData() {
            return layerData[activeLayerKey];
        }

        function updateGlobalShapeUI() {
            const l = getActiveLayerData();
            document.getElementById('globalVoidShapeSel').value = l.voidShape || 'none';
            document.getElementById('range-gVoidRot').value = l.voidRotation || 0;
            document.getElementById('val-gVoidRot').innerText = l.voidRotation || 0;
            document.getElementById('range-gHole').value = l.innerHole || 0;
            document.getElementById('val-gHole').innerText = l.innerHole || 0;
        }

        function updateGlobalShape(prop, val) {
            const l = getActiveLayerData();
            if (prop === 'voidRotation') {
                val = (parseInt(val) + 360) % 360;
            }
            if (prop === 'innerHole') {
                val = Math.max(-99, Math.min(99, parseInt(val)));
            }
            
            l[prop] = isNaN(val) ? val : Number(val);

            // Auto-set innerHole to default 80% if innerHole is 0 when switching to a shape other than 'none'
            if (prop === 'voidShape' && val !== 'none' && (l.innerHole === 0 || l.innerHole === undefined)) {
                l.innerHole = 80;
            }

            if(prop === 'voidRotation') { document.getElementById('val-gVoidRot').innerText = l.voidRotation; document.getElementById('range-gVoidRot').value = l.voidRotation; }
            if(prop === 'innerHole' || prop === 'voidShape') { document.getElementById('val-gHole').innerText = l.innerHole; document.getElementById('range-gHole').value = l.innerHole; }
            
            if (activeLayerKey === 'kaleido') {
                drawKaleidoscope();
            } else {
                applyLayerClipPath(l);
            }
            saveHistory();
        }

        function applyLayerClipPath(l) {
            if (!l.el || activeLayerKey === 'border' || activeLayerKey === 'kaleido') return;

            const rot = l.voidRotation || 0;
            let transformStr = `translate(${l.x || 0}px, ${l.y || 0}px) scale(${l.s || 1})`;
            if (rot !== 0) {
                transformStr += ` rotate(${rot}deg)`;
            }
            l.el.style.transform = transformStr;

            const shape = l.voidShape || 'none';
            const hole = l.innerHole !== undefined ? l.innerHole : 0;
            const w = area.clientWidth, h = area.clientHeight;
            if (w === 0 || h === 0) return;

            // Preserve inner HTML / styles for foreignObject rendering if shape is applied
            const layerKey = Object.keys(layerData).find(k => layerData[k] === l) || 'layer';
            const clipId = `clip-${layerKey}`;

            if (shape === 'none') {
                if (l._renderedSvg) {
                    l.el.innerHTML = l._origContent || '';
                    l._renderedSvg = false;
                }
                l.el.style.clipPath = 'none';
                return;
            }

            if (!l._renderedSvg) {
                l._origContent = l.el.innerHTML;
            }

            const limit = hole === 0 ? 1 : Math.abs(hole) / 100;
            const minSide = Math.min(w, h);
            const cx = w / 2, cy = h / 2;

            let clipSvgElement = '';
            switch(shape) {
                case 'circle': {
                    const r = (minSide / 2) * limit;
                    clipSvgElement = `<circle cx="${cx}" cy="${cy}" r="${r}" />`;
                    break;
                }
                case 'ellipse': {
                    const rx = (w / 2) * limit;
                    const ry = (h / 2) * limit;
                    clipSvgElement = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" />`;
                    break;
                }
                case 'rectangle': {
                    const rw = w * limit;
                    const rh = h * limit;
                    clipSvgElement = `<rect x="${cx - rw/2}" y="${cy - rh/2}" width="${rw}" height="${rh}" />`;
                    break;
                }
                case 'square': {
                    const side = minSide * limit;
                    clipSvgElement = `<rect x="${cx - side/2}" y="${cy - side/2}" width="${side}" height="${side}" />`;
                    break;
                }
                case 'triangle': {
                    const s = minSide * limit;
                    const hTri = s * Math.sqrt(3) / 2;
                    const p1 = `${cx},${cy - (2/3)*hTri}`;
                    const p2 = `${cx + s/2},${cy + (1/3)*hTri}`;
                    const p3 = `${cx - s/2},${cy + (1/3)*hTri}`;
                    clipSvgElement = `<polygon points="${p1} ${p2} ${p3}" />`;
                    break;
                }
                case 'star': {
                    const outerR = (minSide / 2) * limit;
                    const innerR = outerR * 0.4;
                    const cyOffset = outerR * 0.05; // Visual centering offset for 5-point star
                    let pts = [];
                    for (let i = 0; i < 10; i++) {
                        const angle = (i * Math.PI / 5) - Math.PI / 2;
                        const r = i % 2 === 0 ? outerR : innerR;
                        pts.push(`${cx + r * Math.cos(angle)},${cy + cyOffset + r * Math.sin(angle)}`);
                    }
                    clipSvgElement = `<polygon points="${pts.join(' ')}" />`;
                    break;
                }
                case 'heart': {
                    const scale = (minSide / 100) * limit;
                    const d = `M ${cx},${cy - 18 * scale} C ${cx - 25 * scale},${cy - 44 * scale} ${cx - 50 * scale},${cy - 21 * scale} ${cx - 50 * scale},${cy - 1 * scale} C ${cx - 50 * scale},${cy + 19 * scale} ${cx - 25 * scale},${cy + 36 * scale} ${cx},${cy + 44 * scale} C ${cx + 25 * scale},${cy + 36 * scale} ${cx + 50 * scale},${cy + 19 * scale} ${cx + 50 * scale},${cy - 1 * scale} C ${cx + 50 * scale},${cy - 21 * scale} ${cx + 25 * scale},${cy - 44 * scale} ${cx},${cy - 18 * scale} Z`;
                    clipSvgElement = `<path d="${d}" />`;
                    break;
                }
                case 'cross': {
                    const tw = w * limit * 0.3;
                    const th = h * limit * 0.3;
                    const p = [
                        `${cx - tw/2},${0}`, `${cx + tw/2},${0}`, `${cx + tw/2},${cy - th/2}`,
                        `${w},${cy - th/2}`, `${w},${cy + th/2}`, `${cx + tw/2},${cy + th/2}`,
                        `${cx + tw/2},${h}`, `${cx - tw/2},${h}`, `${cx - tw/2},${cy + th/2}`,
                        `${0},${cy + th/2}`, `${0},${cy - th/2}`, `${cx - tw/2},${cy - th/2}`
                    ];
                    clipSvgElement = `<polygon points="${p.join(' ')}" />`;
                    break;
                }
                case 'line': {
                    const rh = h * limit * 0.1;
                    clipSvgElement = `<rect x="0" y="${cy - rh/2}" width="${w}" height="${rh}" />`;
                    break;
                }
                default:
                    clipSvgElement = `<rect x="0" y="0" width="${w}" height="${h}" />`;
            }

            const bgImg = l.el.style.backgroundImage;
            const bgCss = l.el.style.background;

            let contentSvg = '';
            if (bgImg && bgImg !== 'none') {
                const imgUrlMatch = bgImg.match(/url\(["']?(.*?)["']?\)/);
                if (imgUrlMatch) {
                    contentSvg = `<image href="${imgUrlMatch[1]}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet" />`;
                }
            }
            if (!contentSvg && bgCss && bgCss !== 'none') {
                contentSvg = `<foreignObject width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;background:${bgCss};"></div></foreignObject>`;
            }
            if (!contentSvg) {
                contentSvg = `<foreignObject width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;">${l._origContent || ''}</div></foreignObject>`;
            }

            l.el.innerHTML = `
                <svg width="${w}" height="${h}" style="display:block;width:100%;height:100%;">
                    <defs>
                        <clipPath id="${clipId}">
                            ${clipSvgElement}
                        </clipPath>
                    </defs>
                    <g clip-path="url(#${clipId})">
                        ${contentSvg}
                    </g>
                </svg>
            `;
            l._renderedSvg = true;
            l.el.style.clipPath = 'none';
        }

        function isInsideVoid(px, py, w, h, shape, threshold, rotationDeg) {
            if (shape === 'none' || threshold === 0) return false;
            const cx = w / 2, cy = h / 2;
            let dx = px - cx, dy = py - cy;
            const rad = -rotationDeg * Math.PI / 180;
            const x = dx * Math.cos(rad) - dy * Math.sin(rad);
            const y = dx * Math.sin(rad) + dy * Math.cos(rad);
            
            const minDim = Math.min(w, h);
            const limit = Math.abs(threshold) / 100;

            if (threshold > 0) {
                switch(shape) {
                    case 'circle': {
                        const radius = (minDim / 2) * limit;
                        return (x * x + y * y) < (radius * radius);
                    }
                    case 'ellipse': {
                        const rx = (w / 2) * limit;
                        const ry = (h / 2) * limit;
                        return (x * x) / (rx * rx) + (y * y) / (ry * ry) < 1;
                    }
                    case 'rectangle': {
                        const halfW = (w / 2) * limit;
                        const halfH = (h / 2) * limit;
                        return Math.abs(x) < halfW && Math.abs(y) < halfH;
                    }
                    case 'square': {
                        const halfS = (minDim / 2) * limit;
                        return Math.abs(x) < halfS && Math.abs(y) < halfS;
                    }
                    case 'star': {
                        const r = Math.sqrt(x * x + y * y);
                        const angle = Math.atan2(y, x);
                        const starScale = (minDim / 2) * limit;
                        const rBoundary = starScale * (1 + 0.4 * Math.cos(5 * angle));
                        return r < rBoundary;
                    }
                    case 'line': return Math.abs(y) < (minDim * 0.05 * limit) && Math.abs(x) < (w * 0.5 * limit);
                    case 'triangle': {
                        const s = (minDim / 2) * limit * 1.5;
                        const h_tri = s * Math.sqrt(3) / 2;
                        return (y < h_tri/3 && y > -2*h_tri/3 && Math.abs(x) < (h_tri/3 - y) * (1/Math.sqrt(3)) * 2);
                    }
                    case 'heart': {
                        const scale = (minDim / 2) * limit * 0.8;
                        const nx = x / scale, ny = -y / scale;
                        return Math.pow(nx*nx + ny*ny - 1, 3) - nx*nx*Math.pow(ny, 3) < 0;
                    }
                    case 'cross': {
                        const t = (minDim / 2) * limit * 0.3;
                        return Math.abs(x) < t || Math.abs(y) < t;
                    }
                    default: return false;
                }
            } else {
                const radius = (minDim / 2) * (1 + limit);
                return (x * x + y * y) > (radius * radius);
            }
        }

        function updateKaleido(prop, val) {
            layerData.kaleido[prop] = isNaN(val) ? val : Number(val);

            if(prop === 'density') { document.getElementById('val-kDen').innerText = val; document.getElementById('range-kDen').value = val; }
            if(prop === 'size') { document.getElementById('val-kSize').innerText = val; document.getElementById('range-kSize').value = val; }
            
            drawKaleidoscope();
            saveHistory();
        }

        function adjustSlider(prop, delta) {
            const current = layerData.kaleido[prop];
            const rangeEl = document.getElementById(prop === 'density' ? 'range-kDen' : 'range-kSize');
            const min = Number(rangeEl.min);
            const max = Number(rangeEl.max);
            let newVal = Math.max(min, Math.min(max, current + delta));
            updateKaleido(prop, newVal);
        }

        function toggleBlackAndWhite() {
            isBlackAndWhite = !isBlackAndWhite;
            drawKaleidoscope();
            saveHistory();
        }

        function randomKaleidoscope() {
            const b = layerData.kaleido; b.seed = [];
            const types = ['kaleido', 'grid', 'scatter', 'marsText', 'line_straight_arc', 'line_isometric_poly', 'line_flowing_wave', 'line_matrix_grid'];
            b.patternType = types[Math.floor(Math.random() * types.length)];
            document.getElementById('artStyleSel').value = b.patternType;

            for(let i=0; i<3000; i++) {
                b.seed.push({
                    x: Math.random(), y: Math.random(),
                    size: Math.random(),
                    type: ['arc', 'blob', 'dot', 'curve', 'flake'][Math.floor(Math.random()*5)],
                    color: `hsl(${Math.random()*360}, ${30+Math.random()*50}%, ${30+Math.random()*50}%)`,
                    rot: Math.random() * 360, curve: Math.random()
                });
            }
            b.o = 1;
            b.el.style.opacity = 1;
            document.getElementById('layerOpacSlider').value = 1;
            document.getElementById('val-lOpac').innerText = 1;
            drawKaleidoscope();
            saveHistory();
        }

        function handleArtStyleChange(val) {
            const b = layerData.kaleido;
            b.patternType = val;
            
            if (val === 'marsText') {
                let userText = prompt("請輸入要隨機打散的火星文/詞組（以空白區分詞組）：", b.marsString || "詩境 萬象 🚀 ֆც ✦");
                if (userText !== null && userText.trim() !== "") {
                    b.marsString = userText;
                }
            }
            drawKaleidoscope();
            saveHistory();
        }

        function drawKaleidoscope() {
            const b = layerData.kaleido; const w = area.clientWidth; const h = area.clientHeight;
            if(w === 0 || h === 0) return;

            let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
            const centerX = w/2, centerY = h/2;
            const holeVal = b.innerHole;

            if (b.seed.length === 0) {
                for(let i=0; i<2000; i++) {
                    b.seed.push({
                        x: Math.random(), y: Math.random(),
                        size: Math.random(),
                        type: ['arc', 'blob', 'dot', 'curve', 'flake'][Math.floor(Math.random()*5)],
                        color: `hsl(${Math.random()*360}, ${30+Math.random()*50}%, ${30+Math.random()*50}%)`,
                        rot: Math.random() * 360, curve: Math.random()
                    });
                }
            }

            if (b.patternType === 'kaleido') {
                const segments = 10;
                const maxRadius = Math.sqrt(w*w + h*h) / 2 * (b.spread/100);
                for(let i=0; i < b.density; i++) {
                    const s = b.seed[i]; if(!s) continue;
                    const size = b.size * (0.4 + s.size);
                    const radius = s.x * maxRadius; const angle = s.y * (Math.PI * 2 / segments);
                    for(let j=0; j < segments; j++) {
                        const currentAngle = angle + (j * Math.PI * 2 / segments);
                        const px = centerX + Math.cos(currentAngle) * radius;
                        const py = centerY + Math.sin(currentAngle) * radius;
                        
                        if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                        if(px < -50 || px > w+50 || py < -50 || py > h+50) continue;
                        
                        let shape = '';
                        let col = isBlackAndWhite ? '#ffffff' : s.color;
                        const g = `<g transform="translate(${px}, ${py}) rotate(${s.rot + j*(360/segments)})">`;
                        if(s.type === 'arc') shape = `<path d="M${-size},0 A${size},${size*s.curve} 0 0,1 ${size},0" fill="none" stroke="${col}" stroke-width="0.8" opacity="0.6"/>`;
                        else if(s.type === 'blob') shape = `<path d="M0,${-size} Q${size*s.curve},0 0,${size} T0,${-size}" fill="${col}" opacity="0.4"/>`;
                        else if(s.type === 'dot') shape = `<circle cx="0" cy="0" r="${size/3}" fill="${col}" opacity="0.5"/>`;
                        else shape = `<rect x="${-size/4}" y="${-size/4}" width="${size/2}" height="${size/2}" fill="${col}" opacity="0.4" transform="rotate(45)"/>`;
                        svg += g + shape + `</g>`;
                    }
                }
            } else if (b.patternType === 'grid') {
                const cols = Math.floor(Math.sqrt(b.density));
                const rows = cols;
                const stepX = w / cols; const stepY = h / rows;
                let count = 0;
                for(let r=0; r<rows; r++) {
                    for(let c=0; c<cols; c++) {
                        const s = b.seed[count % b.seed.length]; if(!s) continue;
                        const px = c * stepX + stepX/2 + (s.x-0.5)*10;
                        const py = r * stepY + stepY/2 + (s.y-0.5)*10;
                        if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                        const sz = b.size * (0.8 + s.size);
                        let col = isBlackAndWhite ? '#ffffff' : s.color;
                        svg += `<g transform="translate(${px}, ${py}) rotate(${s.rot})">`;
                        svg += `<line x1="${-sz}" y1="0" x2="${sz}" y2="0" stroke="${col}" stroke-width="0.8" opacity="0.4"/>`;
                        svg += `<line x1="0" y1="${-sz}" x2="0" y2="${sz}" stroke="${col}" stroke-width="0.8" opacity="0.4"/>`;
                        svg += `<circle cx="0" cy="0" r="${sz/2.5}" fill="none" stroke="${col}" stroke-width="0.6" opacity="0.4"/>`;
                        svg += `</g>`;
                        count++;
                    }
                }
            } else if (b.patternType === 'scatter') {
                for(let i=0; i < b.density; i++) {
                    const s = b.seed[i]; if(!s) continue;
                    const px = s.x * w; const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const sz = b.size * s.size;
                    let col = isBlackAndWhite ? '#ffffff' : s.color;
                    svg += `<circle cx="${px}" cy="${py}" r="${Math.max(0.8, sz/2)}" fill="${col}" opacity="${0.2 + s.size*0.4}"/>`;
                    if(i % 3 === 0) {
                        svg += `<path d="M${px},${py-sz*2} L${px+sz},${py} L${px},${py+sz*2} L${px-sz},${py} Z" fill="${col}" opacity="0.2"/>`;
                    }
                }
            } else if (b.patternType === 'marsText') {
                const textUnits = (b.marsString || "火 星 文").split(/\s+/).filter(Boolean);
                const unitCount = textUnits.length > 0 ? textUnits.length : 1;
                
                for(let i=0; i < Math.min(b.density, 300); i++) {
                    const s = b.seed[i] || { x: Math.random(), y: Math.random(), size: Math.random(), rot: Math.random()*360 };
                    const px = s.x * w; const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const randomUnit = textUnits[Math.floor(Math.random() * unitCount)];
                    const fontSize = Math.max(12, b.size * 2.5 * (0.6 + s.size));
                    let col = isBlackAndWhite ? '#ffffff' : (s.color || '#a162e8');
                    svg += `<text x="${px}" y="${py}" font-size="${fontSize}" fill="${col}" opacity="0.45" transform="rotate(${s.rot}, ${px}, ${py})" font-family="sans-serif">${randomUnit}</text>`;
                }
            } else if (b.patternType === 'line_straight_arc') {
                // 極簡直線與圓弧風格
                const numItems = Math.min(b.density, 150);
                for (let i = 0; i < numItems; i++) {
                    const s = b.seed[i % b.seed.length];
                    const px = s.x * w;
                    const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const col = isBlackAndWhite ? '#ffffff' : s.color;
                    const radius = b.size * 3 * (0.5 + s.size);
                    const theta = s.rot * Math.PI / 180;
                    
                    svg += `<g transform="translate(${px}, ${py})">`;
                    // 圓形
                    svg += `<circle cx="0" cy="0" r="${radius}" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.5"/>`;
                    // 直線
                    const x1 = -radius * 1.5 * Math.cos(theta);
                    const y1 = -radius * 1.5 * Math.sin(theta);
                    const x2 = radius * 1.5 * Math.cos(theta);
                    const y2 = radius * 1.5 * Math.sin(theta);
                    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.5" opacity="0.5"/>`;
                    svg += `</g>`;
                }
            } else if (b.patternType === 'line_isometric_poly') {
                // 等距多邊形風格
                const numItems = Math.min(b.density, 120);
                for (let i = 0; i < numItems; i++) {
                    const s = b.seed[i % b.seed.length];
                    const px = s.x * w;
                    const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const col = isBlackAndWhite ? '#ffffff' : s.color;
                    const r = b.size * 2.5 * (0.5 + s.size);
                    
                    // 正六邊形或三角形點陣
                    let points = "";
                    const sides = (i % 2 === 0) ? 6 : 3;
                    for (let a = 0; a < sides; a++) {
                        const angle = (a * 2 * Math.PI / sides) + (s.rot * Math.PI / 180);
                        const ptX = r * Math.cos(angle);
                        const ptY = r * Math.sin(angle);
                        points += `${ptX},${ptY} `;
                    }
                    svg += `<polygon points="${points.trim()}" fill="none" stroke="${col}" stroke-width="1.2" opacity="0.55"/>`;
                    svg += `<circle cx="${px}" cy="${py}" r="1.5" fill="${col}" opacity="0.6"/>`;
                }
            } else if (b.patternType === 'line_flowing_wave') {
                // 流動波浪與螺旋風格
                const numItems = Math.min(b.density, 80);
                for (let i = 0; i < numItems; i++) {
                    const s = b.seed[i % b.seed.length];
                    const px = s.x * w;
                    const py = s.y * h;
                    if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                    const col = isBlackAndWhite ? '#ffffff' : s.color;
                    
                    // 用 path 繪製螺旋或波浪線
                    let pathD = `M 0 0 `;
                    const maxT = 4 * Math.PI;
                    let prevX = 0, prevY = 0;
                    for (let t = 0; t < maxT; t += 0.5) {
                        const scaleFactor = b.size * 0.5;
                        const x = t * Math.cos(t + s.rot) * scaleFactor;
                        const y = t * Math.sin(t + s.rot) * scaleFactor;
                        if (t === 0) pathD += `M ${x} ${y} `;
                        else pathD += `L ${x} ${y} `;
                    }
                    svg += `<path d="${pathD}" fill="none" stroke="${col}" stroke-width="1" opacity="0.45" transform="translate(${px}, ${py})"/>`;
                }
            } else if (b.patternType === 'line_matrix_grid') {
                // 交錯矩陣方格風格
                const cols = Math.floor(Math.sqrt(b.density));
                const rows = cols;
                const stepX = w / cols; 
                const stepY = h / rows;
                let count = 0;
                for(let r=0; r<rows; r++) {
                    for(let c=0; c<cols; c++) {
                        const s = b.seed[count % b.seed.length]; if(!s) continue;
                        const px = c * stepX + stepX/2;
                        const py = r * stepY + stepY/2;
                        if(isInsideVoid(px, py, w, h, b.voidShape, holeVal, b.voidRotation)) continue;
                        const sz = b.size * 2;
                        let col = isBlackAndWhite ? '#ffffff' : s.color;
                        
                        svg += `<g transform="translate(${px}, ${py})">`;
                        // 繪製直角交織的單線方格
                        svg += `<line x1="${-sz}" y1="${-sz}" x2="${sz}" y2="${-sz}" stroke="${col}" stroke-width="1.2" opacity="0.4"/>`;
                        svg += `<line x1="${sz}" y1="${-sz}" x2="${sz}" y2="${sz}" stroke="${col}" stroke-width="1.2" opacity="0.4"/>`;
                        svg += `<line x1="${-sz}" y1="${sz}" x2="${sz}" y2="${sz}" stroke="${col}" stroke-width="1.2" opacity="0.4"/>`;
                        svg += `<line x1="${-sz}" y1="${-sz}" x2="${-sz}" y2="${sz}" stroke="${col}" stroke-width="1.2" opacity="0.4"/>`;
                        svg += `</g>`;
                        count++;
                    }
                }
            }

            if (isBlackAndWhite) {
                svg = `<filter id="bw"><feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/></filter>` + svg;
            }

            svg += `</svg>`; 
            b.el.innerHTML = svg;
            if (isBlackAndWhite) {
                b.el.style.filter = 'grayscale(100%) contrast(120%)';
            } else {
                b.el.style.filter = 'none';
            }
        }

        function focusTarget(id) {
            activeEditId = id;
            document.querySelectorAll('.draggable-zone').forEach(el => el.classList.toggle('active-target', el.id === id));
            document.getElementById('targetSelect').value = id;

            const isLockedVertical = (id === 'blk-lefttitle' || id === 'blk-righttitle');
            const writingModeRow = document.getElementById('writingModeControlRow');
            if(writingModeRow) {
                writingModeRow.style.display = isLockedVertical ? 'none' : 'block';
            }

            const txt = document.querySelector(`#${activeEditId} .text-content`);
            if (txt) {
                const computed = window.getComputedStyle(txt);
                
                const fs = parseInt(computed.fontSize) || 32;
                document.getElementById('sizeInp').value = fs;
                document.getElementById('v-size').innerText = fs;

                const lh = computed.lineHeight !== 'normal' ? parseFloat(computed.lineHeight) / fs : 1.5;
                const lhVal = isNaN(lh) ? 1.5 : Math.round(lh * 10) / 10;
                document.getElementById('lhInp').value = lhVal;
                document.getElementById('v-lh').innerText = lhVal;

                const ls = parseInt(computed.letterSpacing) || 0;
                document.getElementById('lsInp').value = ls;
                document.getElementById('v-ls').innerText = ls;

                const rgbColor = computed.color;
                let hexColor = '#ffffff';
                if (rgbColor.startsWith('rgb')) {
                    const rgb = rgbColor.match(/\d+/g);
                    if (rgb && rgb.length >= 3) {
                        hexColor = '#' + ((1 << 24) + (parseInt(rgb[0]) << 16) + (parseInt(rgb[1]) << 8) + parseInt(rgb[2])).toString(16).slice(1);
                    }
                }
                const colorInp = document.getElementById('textColInp');
                if (colorInp) colorInp.value = hexColor;

                let currentBlur = 0;
                let currentBright = 100;
                const filterStr = txt.style.filter || '';
                
                const blurMatch = filterStr.match(/blur\(([\d.]+)px\)/);
                if (blurMatch) currentBlur = parseFloat(blurMatch[1]);
                
                const brightMatch = filterStr.match(/brightness\(([\d.]+)%\)/);
                if (brightMatch) currentBright = parseFloat(brightMatch[1]);

                document.getElementById('blurInp').value = currentBlur;
                document.getElementById('v-blur').innerText = currentBlur;

                document.getElementById('brightInp').value = currentBright;
                document.getElementById('v-bright').innerText = currentBright;
            }
        }

        function initDraggables() {
            document.querySelectorAll('.draggable-zone').forEach(el => {
                let sx, sy, it, il;
                const start = e => { 
                    focusTarget(el.id); 
                    const t = e.touches ? e.touches[0] : e; 
                    sx = t.clientX; sy = t.clientY; 
                    it = el.offsetTop; il = el.offsetLeft; 
                };
                const move = e => { 
                    if(!sx) return; 
                    const t = e.touches ? e.touches[0] : e; 
                    let nx = il + t.clientX - sx;
                    let ny = it + t.clientY - sy;

                    nx = Math.max(0, Math.min(area.clientWidth - el.clientWidth, nx));
                    ny = Math.max(0, Math.min(area.clientHeight - el.clientHeight, ny));

                    el.style.left = nx + 'px'; 
                    el.style.top = ny + 'px'; 
                };
                el.onmousedown = start; window.onmousemove = move; window.onmouseup = () => { if(sx) { saveHistory(); sx = null; } };
                el.ontouchstart = start; el.ontouchmove = e => { if(sx) e.preventDefault(); move(e); };
                el.ontouchend = () => { if(sx) { saveHistory(); sx = null; } };
            });
        }

        function initLayerInteraction() {
            let sx, sy, ix, iy, is, id, act = false;
            const start = e => {
                const l = layerData[activeLayerKey]; 
                if(!l.el || activeLayerKey==='border' || activeLayerKey==='kaleido' || l.locked) return; 
                const touches = e.touches || [e];
                if(touches.length === 1) { 
                    sx = touches[0].clientX; 
                    sy = touches[0].clientY; 
                    ix = l.x || 0; 
                    iy = l.y || 0; 
                } else if(touches.length === 2) { 
                    is = l.s || 1; 
                    id = Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY); 
                }
                act = true;
            };
            const moveFixed = e => {
                if(!act) return; 
                const l = layerData[activeLayerKey]; 
                const touches = e.touches || [e];
                if(touches.length === 1) {
                    const sensitivity = 1.0;
                    l.x = ix + (touches[0].clientX - sx) * sensitivity; 
                    l.y = iy + (touches[0].clientY - sy) * sensitivity; 
                } else if(touches.length === 2) { 
                    const d = Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY); 
                    l.s = Math.max(0.1, Math.min(10, is * (d / id))); 
                }
                applyLayerClipPath(l);
            };
            const end = () => { if(act) { act = false; saveHistory(); } };

            shield.onmousedown = start; window.onmousemove = moveFixed; window.onmouseup = end;
            shield.ontouchstart = start; shield.ontouchmove = e => { if(act) e.preventDefault(); moveFixed(e); };
            shield.ontouchend = end;
        }

        function saveHistory() {
            const state = { texts: {}, layers: {} };
            document.querySelectorAll('.draggable-zone').forEach(z => {
                const txt = z.querySelector('.text-content');
                state.texts[z.id] = { val: txt.innerText, style: txt.getAttribute('style'), pos: { t: z.style.top, l: z.style.left }, disp: z.style.display };
            });
            Object.keys(layerData).forEach(k => {
                const l = layerData[k];
                state.layers[k] = {
                    x: l.x, y: l.y, s: l.s, o: l.o,
                    voidShape: l.voidShape, voidRotation: l.voidRotation, innerHole: l.innerHole,
                    bgImage: l.el.style.backgroundImage, bgCss: l.el.style.background,
                    clipPath: l.el.style.clipPath, transform: l.el.style.transform,
                    borderWidth: l.el.style.borderWidth, inset: l.el.style.inset, borderRadius: l.el.style.borderRadius, borderColor: l.el.style.borderColor,
                    seed: l.seed ? JSON.parse(JSON.stringify(l.seed)) : [],
                    patternType: l.patternType,
                    marsString: l.marsString
                };
            });
            historyStack.push(JSON.stringify(state)); 
            if(historyStack.length > 25) historyStack.shift();
        }

        function undo() {
            if(historyStack.length <= 1) {
                alert("已經是最初狀態，無法再退回！");
                return;
            } 
            historyStack.pop(); 
            const s = JSON.parse(historyStack[historyStack.length-1]); 
            
            Object.keys(s.texts).forEach(id => {
                const d = s.texts[id], z = document.getElementById(id), txt = z.querySelector('.text-content');
                if(z && txt) {
                    txt.innerText = d.val; 
                    if(d.style) txt.setAttribute('style', d.style); 
                    else txt.removeAttribute('style');
                    z.style.top = d.pos.t; 
                    z.style.left = d.pos.l; 
                    z.style.display = d.disp;
                    const inputKey = id.replace('blk-', 'inp-');
                    const inpEl = document.getElementById(inputKey);
                    if(inpEl) inpEl.value = d.val;
                }
            });

            Object.keys(s.layers).forEach(k => {
                const ld = s.layers[k];
                const l = layerData[k];
                if(l && l.el) {
                    l.x = ld.x !== undefined ? ld.x : 0; 
                    l.y = ld.y !== undefined ? ld.y : 0; 
                    l.s = ld.s !== undefined ? ld.s : 1;
                    l.o = ld.o;
                    l.voidShape = ld.voidShape; l.voidRotation = ld.voidRotation; l.innerHole = ld.innerHole;
                    if(ld.seed) l.seed = ld.seed;
                    if(ld.patternType) l.patternType = ld.patternType;
                    if(ld.marsString) l.marsString = ld.marsString;
                    
                    l.el.style.opacity = ld.o;
                    if(ld.bgImage) l.el.style.backgroundImage = ld.bgImage;
                    else l.el.style.backgroundImage = 'none';
                    
                    if(ld.bgCss) l.el.style.background = ld.bgCss;
                    if(ld.clipPath) l.el.style.clipPath = ld.clipPath;
                    l.el.style.transform = ld.transform || `translate(${l.x}px, ${l.y}px) scale(${l.s})`;
                    if(ld.borderWidth) l.el.style.borderWidth = ld.borderWidth;
                    if(ld.inset) l.el.style.inset = ld.inset;
                    if(ld.borderRadius) l.el.style.borderRadius = ld.borderRadius;
                    if(ld.borderColor) l.el.style.borderColor = ld.borderColor;
                    
                    if(k === 'kaleido') {
                        drawKaleidoscope();
                    }
                }
            });
            updateGlobalShapeUI();
            setActiveLayer(activeLayerKey);
        }

                    bgImage: l.el.style.backgroundImage, bgCss: l.el.style.background,
                    clipPath: l.el.style.clipPath, transform: l.el.style.transform,
                    borderWidth: l.el.style.borderWidth, inset: l.el.style.inset, borderRadius: l.el.style.borderRadius, borderColor: l.el.style.borderColor,
                    seed: l.seed ? JSON.parse(JSON.stringify(l.seed)) : [],
                    patternType: l.patternType,
                    marsString: l.marsString
                };
            });
            localStorage.setItem('shijing_v10_save', JSON.stringify(d)); 
            alert("草稿儲存成功！"); 
        }
        
        function loadFromLocal() { 
            const dStr = localStorage.getItem('shijing_v10_save'); 
            if(!dStr) {
                alert("找不到儲存的草稿！");
                return;
            }
            try {
                const d = JSON.parse(dStr); 
                if(d.inputs) {
                    Object.keys(d.inputs).forEach(k => { 
                        const el = document.getElementById(k);
                        if(el) { 
                            el.value = d.inputs[k]; 
                            const id = k.replace('inp-',''); 
                            sync(id); 
                        } 
                    });
                }
                if(d.layersData) {
                    Object.keys(d.layersData).forEach(k => {
                        const ld = d.layersData[k];
                        const l = layerData[k];
                        if(l && l.el) {
                            l.x = ld.x !== undefined ? ld.x : 0; 
                            l.y = ld.y !== undefined ? ld.y : 0; 
                            l.s = ld.s !== undefined ? ld.s : 1;
                            l.o = ld.o;
                            l.voidShape = ld.voidShape; l.voidRotation = ld.voidRotation; l.innerHole = ld.innerHole;
                            if(ld.seed) l.seed = ld.seed;
                            if(ld.patternType) l.patternType = ld.patternType;
                            if(ld.marsString) l.marsString = ld.marsString;
                            
                            l.el.style.opacity = ld.o;
                            if(ld.bgImage) l.el.style.backgroundImage = ld.bgImage;
                            else l.el.style.backgroundImage = 'none';
                            
                            if(ld.bgCss) l.el.style.background = ld.bgCss;
                            if(ld.clipPath) l.el.style.clipPath = ld.clipPath;
                            l.el.style.transform = ld.transform || `translate(${l.x}px, ${l.y}px) scale(${l.s})`;
                            if(ld.borderWidth) l.el.style.borderWidth = ld.borderWidth;
                            if(ld.inset) l.el.style.inset = ld.inset;
                            if(ld.borderRadius) l.el.style.borderRadius = ld.borderRadius;
                            if(ld.borderColor) l.el.style.borderColor = ld.borderColor;

                            if(k === 'kaleido') {
                                drawKaleidoscope();
                            }
                        }
                    });
                }
                updateGlobalShapeUI();
                setActiveLayer(activeLayerKey);
                saveHistory();
                alert("草稿載入成功！"); 
            } catch(e) {
                console.error(e);
                alert("載入失敗，格式可能已損毀。");
            }
        }
    </script>
</body>
