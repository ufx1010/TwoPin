<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>黑色系精緻文字編輯器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #090b10;
            --surface: #11141d;
            --surface-secondary: #161b26;
            --border: #1e2533;
            --border-focus: #3b82f6;
            --text: #e2e8f0;
            --text-secondary: #64748b;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --radius: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        body {
            height: 100vh;
            height: 100svh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            overflow: hidden;
            padding: 12px 12px calc(12px + var(--safe-bottom));
            touch-action: manipulation;
        }

        .app {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            overflow: hidden;
            min-height: 0;
        }

        /* 編輯器區域疊加層設計 */
        .editor-wrapper {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            min-height: 20px;
        }

        .line-numbers {
            background: #0d1017;
            color: var(--text-secondary);
            padding: 10px 0;
            text-align: right;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            border-right: 1px solid var(--border);
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
            z-index: 2;
        }

        .line-num-item {
            padding-right: 10px;
            text-align: right;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #4b5563;
            box-sizing: border-box;
            transition: color 0.15s ease;
        }

        .line-num-item.active-line {
            color: var(--accent);
            font-weight: bold;
        }

        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--surface);
        }

        #backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: transparent;
            pointer-events: none;
            overflow: hidden;
            tab-size: 2;
            -moz-tab-size: 2;
            box-sizing: border-box;
        }

        .backdrop-line {
            white-space: pre;
            word-wrap: normal;
            min-height: 21px;
            line-height: 1.5;
            box-sizing: border-box;
            width: 100%;
        }

        #backdrop.wrap-soft .backdrop-line {
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-all;
        }

        #backdrop mark {
            background-color: rgba(59, 130, 246, 0.35);
            color: transparent;
            border-bottom: 2px solid var(--accent);
            border-radius: 2px;
        }

        #editor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            overflow: auto;
            background: transparent;
            color: var(--text);
            tab-size: 2;
            -moz-tab-size: 2;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            z-index: 1;
            caret-color: var(--accent);
        }

        #editor.wrap-soft {
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-all;
        }

        /* 滾動條美化 */
        #editor::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        #editor::-webkit-scrollbar-track {
            background: transparent;
        }
        #editor::-webkit-scrollbar-thumb {
            background: #232a3d;
            border-radius: 4px;
        }
        #editor::-webkit-scrollbar-thumb:hover {
            background: #2d374f;
        }

        /* 狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #0d1017;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
            min-height: 32px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-left {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            overflow: hidden;
        }

        .status-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stat-item {
            background: #161b26;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .status-msg {
            font-size: 11px;
            color: var(--accent-hover);
            font-weight: 500;
        }
        .status-msg.error {
            color: #ef4444;
            font-weight: bold;
        }

        /* 工具列 */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: var(--surface-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .toolbar .row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .toolbar .row-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            width: 32px;
            flex-shrink: 0;
            text-align: center;
        }

        .editable-field {
            flex: 1 1 0;
            min-width: 60px;
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            outline: none;
            height: 32px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .editable-field:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .editable-field:empty:before {
            content: attr(data-placeholder);
            color: #4b5563;
        }

        .row-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .row-actions .btn {
            min-width: 42px;
            flex: 0 0 auto;
        }

        .btn {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            min-width: 42px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: #1e2533;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .btn:active {
            background: #12151e;
        }

        .btn-toggle {
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-toggle:hover {
            color: var(--text);
        }

        .btn-toggle.active {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-hover);
            border-color: var(--accent);
            font-weight: 600;
        }

        .bottom-actions {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 2px;
            scrollbar-width: none;
            justify-content: flex-start;
        }
        .bottom-actions::-webkit-scrollbar {
            display: none;
        }
        .bottom-actions .btn {
            flex-shrink: 0;
            background: var(--surface);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- 編輯器 -->
        <div class="editor-wrapper">
            <div id="lineNumbers" class="line-numbers"></div>
            <div class="editor-container">
                <div id="backdrop"></div>
                <textarea id="editor" wrap="off" spellcheck="false" placeholder="在此輸入或匯入您的文字..."></textarea>
            </div>
        </div>

        <!-- 狀態列 -->
        <div class="status-bar">
            <div class="status-left">
                <span class="stat-item" id="statLines">行 1</span>
                <span class="stat-item" id="statWords">字 0</span>
                <span class="stat-item" id="statChars">字元 0</span>
                <span class="stat-item" id="statCursor">1:1</span>
                <span id="statusMsg" class="status-msg"></span>
            </div>
            <div class="status-right">
                <span id="matchCountDisplay" class="stat-item">0</span>
                <span id="wrapIndicator" class="stat-item">整行</span>
            </div>
        </div>

        <!-- 工具列 -->
        <div class="toolbar">
            <!-- 搜尋列 -->
            <div class="row">
                <span class="row-label">搜尋</span>
                <div id="findStr" class="editable-field" contenteditable="true" data-placeholder="關鍵字…"></div>
                <div class="row-actions">
                    <button class="btn btn-toggle" id="caseBtn" title="區分大小寫">A/a</button>
                    <button class="btn" id="findNextBtn">下個</button>
                    <button class="btn" id="findPrevBtn">上個</button>
                </div>
            </div>

            <!-- 取代列 -->
            <div class="row">
                <span class="row-label">取代</span>
                <div id="replaceStr" class="editable-field" contenteditable="true" data-placeholder="取代為…"></div>
                <div class="row-actions">
                    <button class="btn btn-toggle" id="fullWidthBtn" title="全形/半形">全/半</button>
                    <button class="btn" id="replaceOneBtn">一個</button>
                    <button class="btn" id="replaceAllBtn">全部</button>
                </div>
            </div>

            <!-- 功能鍵列 -->
            <div class="bottom-actions">
                <button class="btn" id="importBtn">📂 匯入</button>
                <button class="btn" id="exportBtn">💾 匯出</button>
                <button class="btn" id="wrapToggleBtn">↩️ 換行</button>
                <button class="btn" id="clearBtn">🗑 清空</button>
                <button class="btn" id="undoBtn">⤴️ 復原</button>
                <button class="btn" id="redoBtn">⤵️ 重做</button>
                <button class="btn" id="copyBtn">📋 複製</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".txt,.md,.js,.html,.css,.json,.csv,.log,.xml,.yaml,.yml,.toml,.ini,.cfg,.conf,.sh,.py,.java,.c,.cpp,.h,.go,.rs,.ts,.jsx,.tsx,.vue,.svelte" />

    <script>
        (function() {
            'use strict';

            const editor = document.getElementById('editor');
            const backdrop = document.getElementById('backdrop');
            const lineNumbers = document.getElementById('lineNumbers');
            const statusMsg = document.getElementById('statusMsg');
            const findStrEl = document.getElementById('findStr');
            const replaceStrEl = document.getElementById('replaceStr');
            const matchCountDisplay = document.getElementById('matchCountDisplay');
            const statLines = document.getElementById('statLines');
            const statWords = document.getElementById('statWords');
            const statChars = document.getElementById('statChars');
            const statCursor = document.getElementById('statCursor');
            const wrapIndicator = document.getElementById('wrapIndicator');
            const fileInput = document.getElementById('fileInput');

            const caseBtn = document.getElementById('caseBtn');
            const fullWidthBtn = document.getElementById('fullWidthBtn');

            let wrapMode = 'hard';
            let currentFileName = 'untitled.txt';
            let history = [];
            let historyIndex = -1;
            const MAX_HISTORY = 50;
            let isUndoing = false;

            let isCaseSensitive = false;
            let isFullWidthAware = false;

            function setStatus(msg, isError = false) {
                if (msg) {
                    statusMsg.textContent = msg;
                    statusMsg.classList.toggle('error', isError);
                } else {
                    statusMsg.textContent = '';
                    statusMsg.classList.remove('error');
                }
            }

            function escapeRegex(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function toHalfWidth(str) {
                return str.replace(/[\uff01-\uff5e]/g, function(ch) {
                    return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
                }).replace(/\u3000/g, ' ');
            }

            function prepareSearchText(text, fullWidthMode) {
                if (!fullWidthMode) return text;
                return toHalfWidth(text);
            }

            function pushHistory() {
                if (isUndoing) return;
                const current = editor.value;
                if (history.length > 0 && history[historyIndex] === current) return;
                history = history.slice(0, historyIndex + 1);
                history.push(current);
                if (history.length > MAX_HISTORY) history.shift();
                historyIndex = history.length - 1;
            }

            function undo() {
                if (historyIndex <= 0) {
                    setStatus('已無動作可復原', true);
                    return;
                }
                isUndoing = true;
                historyIndex--;
                editor.value = history[historyIndex];
                updateAll();
                setStatus('已復原');
                setTimeout(() => setStatus(''), 2000);
                isUndoing = false;
            }

            function redo() {
                if (historyIndex >= history.length - 1) {
                    setStatus('已無動作可重做', true);
                    return;
                }
                isUndoing = true;
                historyIndex++;
                editor.value = history[historyIndex];
                updateAll();
                setStatus('已重做');
                setTimeout(() => setStatus(''), 2000);
                isUndoing = false;
            }

            function initHistory() {
                history = [editor.value];
                historyIndex = 0;
            }

            let cachedValue = '';
            let cachedWidth = -1;
            let cachedQuery = '';
            let cachedCase = false;
            let cachedFullWidth = false;
            let cachedActiveLine = -1;

            function updateLineNumbers(forceFull = false) {
                // Ensure lineNumbers is always visible
                lineNumbers.classList.remove('hidden');

                if (wrapMode === 'soft') {
                    backdrop.style.width = editor.clientWidth + 'px';
                } else {
                    backdrop.style.width = Math.max(editor.clientWidth, editor.scrollWidth) + 'px';
                }

                const text = editor.value;
                const currentWidth = editor.clientWidth;
                const query = getFindStr();

                // Get active line
                const pos = editor.selectionStart;
                const before = text.substring(0, pos);
                const activeLineIndex = before.split('\n').length - 1;

                const needsFullUpdate = forceFull ||
                                       (text !== cachedValue) ||
                                       (currentWidth !== cachedWidth) ||
                                       (query !== cachedQuery) ||
                                       (isCaseSensitive !== cachedCase) ||
                                       (isFullWidthAware !== cachedFullWidth);

                if (needsFullUpdate) {
                    cachedValue = text;
                    cachedWidth = currentWidth;
                    cachedQuery = query;
                    cachedCase = isCaseSensitive;
                    cachedFullWidth = isFullWidthAware;
                    cachedActiveLine = activeLineIndex;

                    // Re-render backdrop elements
                    updateBackdrop(false);

                    // Read line heights and populate line numbers with perfect alignment
                    const backdropLines = backdrop.querySelectorAll('.backdrop-line');
                    let numsHtml = '';

                    backdropLines.forEach((div, i) => {
                        const rect = div.getBoundingClientRect();
                        const height = rect.height;
                        const isActive = (i === activeLineIndex) ? ' active-line' : '';
                        numsHtml += `<div class="line-num-item${isActive}" style="height: ${height}px;" data-line="${i}">${i + 1}</div>`;
                    });

                    lineNumbers.innerHTML = numsHtml;

                    // Dynamically size line numbers panel
                    const lines = text.split('\n');
                    const maxLineDigits = String(lines.length).length;
                    const width = Math.max(45, maxLineDigits * 8 + 16);
                    lineNumbers.style.width = width + 'px';
                } else if (activeLineIndex !== cachedActiveLine) {
                    // Only update the active line highlight
                    const prevActive = lineNumbers.querySelector('.active-line');
                    if (prevActive) {
                        prevActive.classList.remove('active-line');
                    }
                    const newActive = lineNumbers.querySelector(`[data-line="${activeLineIndex}"]`);
                    if (newActive) {
                        newActive.classList.add('active-line');
                    }
                    cachedActiveLine = activeLineIndex;
                }

                syncScroll();
            }

            function syncScroll() {
                lineNumbers.scrollTop = editor.scrollTop;
                backdrop.scrollTop = editor.scrollTop;
                backdrop.scrollLeft = editor.scrollLeft;
            }

            function updateStats() {
                const text = editor.value;
                const lines = text.split('\n').length;
                const chars = text.length;
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                statLines.textContent = '行 ' + lines;
                statWords.textContent = '字 ' + words;
                statChars.textContent = '字元 ' + chars;

                const pos = editor.selectionStart;
                const before = text.substring(0, pos);
                const line = before.split('\n').length;
                const col = before.split('\n').pop().length + 1;
                statCursor.textContent = line + ':' + col;
            }

            function toggleWrap() {
                if (wrapMode === 'hard') {
                    editor.setAttribute('wrap', 'soft');
                    editor.classList.add('wrap-soft');
                    backdrop.classList.add('wrap-soft');
                    wrapMode = 'soft';
                    wrapIndicator.textContent = '換行';
                } else {
                    editor.setAttribute('wrap', 'off');
                    editor.classList.remove('wrap-soft');
                    backdrop.classList.remove('wrap-soft');
                    wrapMode = 'hard';
                    wrapIndicator.textContent = '整行';
                }
                updateLineNumbers();
            }

            function getFindStr() {
                return findStrEl.innerText.trim();
            }

            function getReplaceStr() {
                return replaceStrEl.innerText;
            }

            function buildRegex(query) {
                const processedQuery = prepareSearchText(query, isFullWidthAware);
                const flags = isCaseSensitive ? 'g' : 'gi';
                if (isFullWidthAware) {
                    const pattern = processedQuery.split('').map(ch => {
                        const code = ch.charCodeAt(0);
                        let altCh = ch;
                        if (code >= 33 && code <= 126) {
                            altCh = String.fromCharCode(code + 0xfee0);
                        } else if (code >= 65281 && code <= 65374) {
                            altCh = String.fromCharCode(code - 0xfee0);
                        }
                        if (ch === altCh) return escapeRegex(ch);
                        return `[${escapeRegex(ch)}${escapeRegex(altCh)}]`;
                    }).join('');
                    return new RegExp(pattern, flags);
                } else {
                    return new RegExp(escapeRegex(query), flags);
                }
            }

            function highlightLine(lineText, regex) {
                if (!regex) return escapeHtml(lineText);
                const searchTarget = prepareSearchText(lineText, isFullWidthAware);
                let lastIdx = 0;
                let highlightedHtml = '';
                const matches = [...searchTarget.matchAll(regex)];
                if (matches.length === 0) {
                    return escapeHtml(lineText);
                }
                matches.forEach(m => {
                    const start = m.index;
                    const end = start + m[0].length;
                    highlightedHtml += escapeHtml(lineText.substring(lastIdx, start));
                    highlightedHtml += `<mark>` + escapeHtml(lineText.substring(start, end)) + `</mark>`;
                    lastIdx = end;
                });
                highlightedHtml += escapeHtml(lineText.substring(lastIdx));
                return highlightedHtml;
            }

            function updateBackdrop(forceClear = false) {
                const text = editor.value;
                const lines = text.split('\n');
                const query = getFindStr();
                const regex = (forceClear || !query) ? null : buildRegex(query);

                if (query && !forceClear) {
                    const searchTargetAll = prepareSearchText(text, isFullWidthAware);
                    const matchesAll = [...searchTargetAll.matchAll(regex)];
                    matchCountDisplay.textContent = matchesAll.length;
                } else {
                    matchCountDisplay.textContent = '0';
                }

                let backdropHtml = '';
                lines.forEach(line => {
                    let highlighted = highlightLine(line, regex);
                    if (highlighted === '') {
                        highlighted = '<br>';
                    }
                    backdropHtml += `<div class="backdrop-line">${highlighted}</div>`;
                });
                backdrop.innerHTML = backdropHtml;
            }

            function findNext() {
                const query = getFindStr();
                if (!query) {
                    setStatus('請輸入搜尋內容', true);
                    updateBackdrop(true);
                    return;
                }
                const regex = buildRegex(query);
                const text = editor.value;
                const searchTarget = prepareSearchText(text, isFullWidthAware);
                let match = regex.exec(searchTarget);
                if (!match) {
                    setStatus('找不到 "' + query + '"', true);
                    updateBackdrop(true);
                    return;
                }
                const startPos = editor.selectionEnd || 0;
                regex.lastIndex = startPos;
                match = regex.exec(searchTarget);
                if (!match) {
                    regex.lastIndex = 0;
                    match = regex.exec(searchTarget);
                    if (!match) {
                        setStatus('找不到 "' + query + '"', true);
                        updateBackdrop(true);
                        return;
                    }
                }
                const pos = match.index;
                const len = match[0].length;
                editor.focus();
                editor.setSelectionRange(pos, pos + len);
                updateStats();
                updateLineNumbers();
                
                const allMatches = [...searchTarget.matchAll(buildRegex(query))];
                const currentIdx = allMatches.findIndex(m => m.index === pos);
                setStatus((currentIdx + 1) + '/' + allMatches.length);
                setTimeout(() => setStatus(''), 1500);
            }

            function findPrev() {
                const query = getFindStr();
                if (!query) {
                    setStatus('請輸入搜尋內容', true);
                    updateBackdrop(true);
                    return;
                }
                const text = editor.value;
                const searchTarget = prepareSearchText(text, isFullWidthAware);
                const matches = [...searchTarget.matchAll(buildRegex(query))];
                if (matches.length === 0) {
                    setStatus('找不到 "' + query + '"', true);
                    updateBackdrop(true);
                    return;
                }
                const currentPos = editor.selectionStart || 0;
                let idx = matches.length - 1;
                for (let i = matches.length - 1; i >= 0; i--) {
                    if (matches[i].index < currentPos) {
                        idx = i;
                        break;
                    }
                }
                const m = matches[idx];
                editor.focus();
                editor.setSelectionRange(m.index, m.index + m[0].length);
                updateStats();
                updateLineNumbers();
                setStatus((idx + 1) + '/' + matches.length);
                setTimeout(() => setStatus(''), 1500);
            }

            function replaceText(all) {
                const find = getFindStr();
                const replace = getReplaceStr();
                if (!find) {
                    setStatus('請輸入搜尋內容', true);
                    return;
                }
                const regex = buildRegex(find);
                const text = editor.value;
                const searchTarget = prepareSearchText(text, isFullWidthAware);

                if (all) {
                    const matches = [...searchTarget.matchAll(regex)];
                    if (matches.length === 0) {
                        setStatus('未找到', true);
                        return;
                    }
                    let newText = text;
                    for (let i = matches.length - 1; i >= 0; i--) {
                        const m = matches[i];
                        newText = newText.substring(0, m.index) + replace + newText.substring(m.index + m[0].length);
                    }
                    editor.value = newText;
                    pushHistory();
                    updateAll();
                    setStatus('已取代 ' + matches.length + ' 處');
                    setTimeout(() => setStatus(''), 2000);
                } else {
                    const startPos = editor.selectionStart || 0;
                    const after = searchTarget.substring(startPos);
                    let match = regex.exec(after);
                    let pos;
                    if (!match) {
                        regex.lastIndex = 0;
                        match = regex.exec(searchTarget);
                        if (!match) {
                            setStatus('未找到', true);
                            return;
                        }
                        pos = match.index;
                    } else {
                        pos = startPos + match.index;
                    }
                    const len = match[0].length;
                    editor.value = text.substring(0, pos) + replace + text.substring(pos + len);
                    pushHistory();
                    updateAll();
                    setStatus('已取代 1 處');
                    setTimeout(() => setStatus(''), 2000);
                }
                updateLineNumbers();
            }

            function importFile() {
                fileInput.click();
            }

            function handleFileUpload() {
                const file = fileInput.files[0];
                if (!file) return;
                currentFileName = file.name;
                const reader = new FileReader();
                reader.onload = (e) => {
                    editor.value = e.target.result;
                    pushHistory();
                    updateAll();
                    setStatus('已匯入');
                    setTimeout(() => setStatus(''), 2000);
                };
                reader.onerror = () => {
                    setStatus('讀取失敗', true);
                };
                reader.readAsText(file);
                fileInput.value = '';
            }

            function exportFile() {
                const name = prompt('請輸入檔名：', currentFileName);
                if (name === null) return;
                if (name.trim() === '') {
                    setStatus('檔名不可空白', true);
                    return;
                }
                currentFileName = name.trim();
                const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = currentFileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                setStatus('已匯出');
                setTimeout(() => setStatus(''), 2000);
            }

            function clearText() {
                if (editor.value === '') {
                    setStatus('已是空白');
                    return;
                }
                if (!confirm('確定要清空嗎？')) return;
                editor.value = '';
                pushHistory();
                updateAll();
                setStatus('已清空');
                setTimeout(() => setStatus(''), 2000);
            }

            function copyText() {
                if (!editor.value) {
                    setStatus('沒有內容', true);
                    return;
                }
                navigator.clipboard.writeText(editor.value).then(() => {
                    setStatus('已複製全部');
                    setTimeout(() => setStatus(''), 2000);
                }).catch(() => {
                    setStatus('複製失敗', true);
                });
            }

            function updateAll() {
                updateLineNumbers(true);
                updateStats();
            }

            caseBtn.addEventListener('click', () => {
                isCaseSensitive = !isCaseSensitive;
                caseBtn.classList.toggle('active', isCaseSensitive);
                updateLineNumbers();
            });

            fullWidthBtn.addEventListener('click', () => {
                isFullWidthAware = !isFullWidthAware;
                fullWidthBtn.classList.toggle('active', isFullWidthAware);
                updateLineNumbers();
            });

            editor.addEventListener('input', () => {
                pushHistory();
                updateAll();
            });
            editor.addEventListener('scroll', syncScroll);

            const handleCursorMove = () => {
                updateStats();
                updateLineNumbers();
            };
            editor.addEventListener('click', handleCursorMove);
            editor.addEventListener('keyup', handleCursorMove);
            editor.addEventListener('select', handleCursorMove);

            window.addEventListener('resize', () => {
                updateLineNumbers();
            });

            findStrEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    findNext();
                }
            });

            findStrEl.addEventListener('input', () => {
                updateLineNumbers();
            });

            document.getElementById('findNextBtn').addEventListener('click', findNext);
            document.getElementById('findPrevBtn').addEventListener('click', findPrev);
            document.getElementById('replaceOneBtn').addEventListener('click', () => replaceText(false));
            document.getElementById('replaceAllBtn').addEventListener('click', () => replaceText(true));
            document.getElementById('importBtn').addEventListener('click', importFile);
            document.getElementById('exportBtn').addEventListener('click', exportFile);
            document.getElementById('wrapToggleBtn').addEventListener('click', toggleWrap);
            document.getElementById('clearBtn').addEventListener('click', clearText);
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            document.getElementById('copyBtn').addEventListener('click', copyText);
            fileInput.addEventListener('change', handleFileUpload);

            initHistory();
            updateAll();
            setStatus('');
        })();
    </script>
</body>
</html>
