          h(OutBox, {
            title: '歌詞與標籤 Lyrics', badge: 'text-lime-400 bg-lime-500/10', value: lyricsText, rows: 10, state: copied.lyrics, onCopy: () => copy(lyricsText, 'lyrics'),
            top: tagBar, onChange: setLyricsText, onCaret: p => { caret.current = p; }, placeholder: '（在這裡輸入或貼上歌詞；展開標籤列可插入段落標籤）',
            foot: h('div', { className: 'mt-2 space-y-1 text-[10px] text-slate-500' },
              h('p', null, `${lyricsText.length} 字元`),
              h('p', null, '標籤會插在游標位置（沒點過文字區就加在最後）；獨立一行的標籤會列在上方，按 ✕ 刪除'))
          }),
          h(OutBox, { title: '提示詞中文解析', badge: 'text-fuchsia-400 bg-fuchsia-500/10', value: out.cn, rows: 8, state: copied.cn, onCopy: () => copy(out.cn, 'cn') })
        )
      )
    ),
    chipsBar
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

    </script>
</body>
</html>
